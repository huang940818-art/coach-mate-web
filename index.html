/* ════════════════════════════════════════════════
   6. 匯出／匯入
   檔案格式與 iOS 版的備份檔一致，兩邊可以互搬。
   ════════════════════════════════════════════════ */

function buildBackup() {
  const indexOf = new Map(S.students.map((s, i) => [s.id, i]));
  // 檢測掛的是名單而不是學生，另外編一組索引
  const leadIndexOf = new Map(S.leads.map((l, i) => [l.id, i]));
  // 認不出來的日期一律退回「現在」。原本是 `new Date(v).toISOString()`，
  // 遇到無法解析的字串會丟 "Invalid time value" —— 而這裡是匯出，
  // 整份備份會做不出來。備份是資料出了問題時的**逃生口**，
  // 不能因為某一筆的 createdAt 壞掉就整個堵住。
  const iso = (v) => {
    const d = v ? new Date(v) : null;
    return d && !isNaN(d.getTime()) ? d.toISOString() : new Date().toISOString();
  };

  return {
    version: 1,
    appVersion: "web-1.0",
    exportedAt: new Date().toISOString(),
    students: S.students.map((s) => ({
      name: s.name, phone: s.phone, email: s.email || "", rate: s.rate,
      totalPurchasedSessions: s.totalPurchased, remainingSessions: s.remaining,
      notes: s.notes, color: s.color,
      packageExpiryDate: s.expiry ? new Date(s.expiry + "T00:00:00").toISOString() : null,
      customFieldsJSON: JSON.stringify(s.custom || {}),
      renewalCount: s.renewalCount || 0, mayNotRenew: !!s.mayNotRenew,
      acquisitionRaw: s.acquisition, statusRaw: s.status,
      pausedUntil: null, archivedAt: s.status === "archived" ? iso(s.updatedAt) : null,
      createdAt: iso(s.createdAt), updatedAt: iso(s.updatedAt),
      // 顏色標籤，逗號分隔（iOS 的 Student.tagsCSV）
      tagsCSV: (s.tags || []).join(","),
      payments: s.payments.map((p) => ({
        amount: p.amount, date: p.date, methodRaw: p.method, notes: p.notes || "",
        createdAt: iso(p.createdAt),
        // 這筆收費對應第幾筆續約。跟這個格式其他地方一樣用陣列索引不用 id，
        // 沒有對應就是 null。iOS 讀到不認得的欄位會直接忽略，不會壞。
        renewalIndex: (() => {
          const i = s.renewals.findIndex((r) => r.id === p.renewalId);
          return i >= 0 ? i : null;
        })(),
      })),
      renewals: s.renewals.map((r) => ({
        date: r.date, sessionsPurchased: r.sessions, amount: r.amount,
        // 上一期結轉的堂數。iOS 還沒有這個欄位，讀到不認得的鍵會直接忽略。
        carryOverSessions: r.carryOver || 0,
        // 「這筆就是 0 元，我確認過了」。iOS 讀到不認得的鍵會忽略。
        amountConfirmed: !!r.amountOk,
        // 綁在主約底下的加購活動（4 堂、2 堂那種小方案）
        isAddOn: !!r.addOn,
        // 加購歸到主約之前原本記的日期（現在的 date 是跟著主約的）。
        // iOS 讀到不認得的鍵會忽略。
        ...(r.soldOn !== undefined ? { addOnSoldOn: r.soldOn } : {}),
        notes: r.notes || "", createdAt: iso(r.createdAt),
      })),
      inbody: [],
      exercises: [],
    })),
    lessons: S.lessons.map((l) => ({
      title: "", date: l.date, startTime: l.start, endTime: l.end,
      statusRaw: l.status, notes: l.notes || "", locationName: l.location || "",
      consumedSession: !!l.consumed, consumedPartnerSession: !!l.partnerConsumed,
      owedSession: !!l.owed, owedPartnerSession: !!l.partnerOwed,
      createdAt: iso(l.createdAt), updatedAt: iso(l.createdAt),
      studentIndex: indexOf.has(l.studentId) ? indexOf.get(l.studentId) : null,
      partnerIndex: indexOf.has(l.partnerId) ? indexOf.get(l.partnerId) : null,
      // 正課／檢測、成交結果、單堂顏色、檢測對象（iOS 也是這幾個鍵）
      kindRaw: kindOf(l),
      outcomeRaw: outcomeOf(l),
      colorTag: l.color || "",
      leadIndex: leadIndexOf.has(l.leadId) ? leadIndexOf.get(l.leadId) : null,
    })),
    leads: S.leads.map((l) => ({
      name: l.name, phone: l.phone, email: l.email || "",
      sourceRaw: l.source === "walkIn" ? "walk-in" : l.source,
      statusRaw: l.status, notes: l.notes || "",
      createdAt: iso(l.createdAt), updatedAt: iso(l.updatedAt),
    })),
    locations: [],
    settings: {
      employmentType: S.settings.employment,
      // 身份。iOS 用同一個鍵（一般教練／承攬教練），兩邊搬得過去。
      userRole: roleOf(),
      defaultLessonDurationMinutes: String(S.settings.defaultDuration),
      // iOS 還沒有這個設定。讀到不認得的鍵會直接忽略，不會壞。
      lowSessionsThreshold: String(Math.max(1, +S.settings.lowSessions || 3)),
      idleDaysThreshold: String(idleDaysSetting()),
      customFieldDefinitions: JSON.stringify(S.settings.customFields),
      // 型別與選項。iOS 只讀上面那個名稱陣列，多這一個鍵它會忽略。
      customFieldSpecs: JSON.stringify(S.settings.customFieldSpecs || {}),
      coachPackages: JSON.stringify(S.settings.packages.map((p) => ({
        id: p.id, name: p.name, sessions: p.sessions, price: p.price,
      }))),
      salaryRule: JSON.stringify(S.settings.salary),
      // iOS 的 TagStore 用 {id,name,colorHex}，網頁用 {id,name,color}，這裡轉一次
      studentTags: JSON.stringify(allTags().map((t) => ({
        id: t.id, name: t.name, colorHex: t.color,
      }))),
      colorTheme: "amber",
    },
  };
}

function exportData() {
  saveFile(`coach-mate-backup-${today()}.json`, JSON.stringify(buildBackup(), null, 2));
}

/**
 * 手機下載檔案常常卡住，所以留一條不靠下載的備份路徑：
 * 把備份整段複製走，貼到記事本、LINE 給自己或 Email，要還原時再貼回來。
 */
function copyBackupSheet() {
  const json = JSON.stringify(buildBackup());
  openSheet({
    title: "複製備份文字",
    closeLabel: "關閉",
    body: `
      <p class="row-sub" style="margin:0 0 12px">
        按下「全部複製」，再貼到記事本、傳給自己的 LINE 或 Email 存起來。
        要還原時用「貼上備份文字」貼回來就好。
      </p>
      <textarea id="backup-text" readonly style="min-height:150px;font-size:11px;font-family:var(--mono)">${esc(json)}</textarea>
      <p class="hint" style="margin-top:8px">共 ${json.length.toLocaleString("en-US")} 個字，包含 ${S.students.length} 位學生、${S.lessons.length} 堂課。</p>
      <p class="hint" data-copy-status style="font-weight:600"></p>`,
    extraFoot: `<button class="btn btn-sm btn-primary" type="button" data-action="do-copy">全部複製</button>`,
    onMount: (root) => {
      root.addEventListener("click", async (e) => {
        if (!e.target.closest('[data-action="do-copy"]')) return;
        const box = $("#backup-text", root);
        const status = $("[data-copy-status]", root);
        const say = (html, ok) => {
          if (!status) return;
          status.innerHTML = html;
          status.style.color = ok ? "var(--good)" : "var(--warn)";
        };
        try {
          await navigator.clipboard.writeText(json);
          // **複製完要驗一次**。iPhone 上這一步失敗過但畫面只飄過一則
          // toast，使用者以為複製好了，到 App 一貼才發現剪貼簿是空的
          // ——「又不行」的其中一種（2026-08-12）。讀回來比長度才算數。
          let copied = -1;
          try {
            const back = await navigator.clipboard.readText();
            copied = back.length;
          } catch (readErr) { copied = -1; }   // 有些瀏覽器不給讀，那就當它成功
          if (copied === -1 || copied === json.length) {
            say(`✓ 已複製 ${json.length.toLocaleString("en-US")} 個字。`
              + `現在打開「教練小幫手」App → 設定 → 貼上備份文字 → 按「貼上」。`, true);
            toast("已複製");
          } else {
            say(`⚠ 只複製到 ${copied.toLocaleString("en-US")} 個字（應該有 ${json.length.toLocaleString("en-US")} 個）。`
              + `請長按下面的文字 → 全選 → 複製。`, false);
          }
        } catch (err) {
          // iOS 的獨立視窗、舊版 Safari 都可能不給寫剪貼簿。
          // 退回選取整段讓使用者自己複製，而且把話講在畫面上（不是 toast）。
          box.focus();
          box.setSelectionRange(0, box.value.length);
          say("⚠ 這個瀏覽器不讓程式直接複製。文字已經全選起來了，"
            + "請長按畫面選「複製」。", false);
        }
      });
    },
  });
}

function pasteBackupSheet() {
  openSheet({
    title: "貼上備份文字",
    body: `
      <p class="row-sub" style="margin:0 0 12px">
        把之前複製的備份文字貼進來，或是用文字編輯器打開備份檔、整段複製貼過來。
      </p>
      <textarea id="paste-text" placeholder='{"version":1,...' style="min-height:150px;font-size:11px;font-family:var(--mono)"></textarea>`,
    confirmLabel: "讀取",
    onConfirm: (form) => {
      const text = $("#paste-text", form).value.trim();
      if (!text) { toast("請先貼上備份文字"); return false; }
      let parsed;
      try {
        parsed = parseBackup(JSON.parse(text));
      } catch (err) {
        toast(err && err.message ? err.message : "這段文字看起來不是備份資料");
        return false;
      }
      closeSheet();
      askImportMode(parsed);
      return false;   // 已經自己關掉並開下一個對話框
    },
  });
}

/** 把備份檔（iOS 或網頁版產生的）讀成網頁版的資料結構 */
function parseBackup(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.students)) {
    throw new Error("這不是教練小幫手的備份檔");
  }
  if (raw.version > 1) throw new Error(`這個備份是較新版本（v${raw.version}）建立的`);

  const dayOf = (isoStr) => {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    return isNaN(d) ? "" : dayStr(d);
  };
  const parseJSON = (s, fallback) => {
    try { return JSON.parse(s); } catch { return fallback; }
  };

  const students = raw.students.map((d, i) => ({
    id: uid(), _i: i,
    name: d.name || "", phone: d.phone || "", email: d.email || "",
    rate: d.rate || 0,
    totalPurchased: d.totalPurchasedSessions || 0,
    remaining: d.remainingSessions || 0,
    notes: d.notes || "",
    color: d.color || STUDENT_COLORS[i % STUDENT_COLORS.length],
    expiry: dayOf(d.packageExpiryDate),
    // 匯入這條路也要正規化，不然從 App 搬過來的「魔羯座」還是兩種寫法
    custom: normalizeCustom(parseJSON(d.customFieldsJSON, {}) || {}),
    renewalCount: d.renewalCount || 0,
    mayNotRenew: !!d.mayNotRenew,
    acquisition: ACQUISITION[d.acquisitionRaw] ? d.acquisitionRaw : "selfDeveloped",
    status: ["active", "paused", "awaiting", "archived"].includes(d.statusRaw) ? d.statusRaw : "active",
    ...(() => {
      // 續約要先有 id，收費才接得回去。舊備份沒有 renewalIndex，
      // 那就交給 linkLegacyPayments 用日期＋金額去配。
      const renewals = (d.renewals || []).map((r) => ({
        id: uid(), date: r.date || "", sessions: r.sessionsPurchased || 0,
        amount: r.amount || 0, carryOver: Math.max(0, +r.carryOverSessions || 0),
        amountOk: !!r.amountConfirmed, addOn: !!r.isAddOn,
        ...(r.addOnSoldOn !== undefined ? { soldOn: r.addOnSoldOn } : {}),
        notes: r.notes || "", createdAt: r.createdAt,
      }));
      const payments = (d.payments || []).map((p) => {
        const i = p.renewalIndex;
        const linked = Number.isInteger(i) && renewals[i] ? renewals[i].id : "";
        return {
          id: uid(), amount: p.amount || 0, date: p.date || "",
          method: p.methodRaw || "cash", notes: p.notes || "", createdAt: p.createdAt,
          ...(linked ? { renewalId: linked } : {}),
        };
      });
      return { renewals, payments: linkLegacyPayments(payments, renewals) };
    })(),
    // 顏色標籤：舊備份沒有這一欄
    tags: typeof d.tagsCSV === "string"
      ? d.tagsCSV.split(",").map((x) => x.trim()).filter(Boolean)
      : [],
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  // 名單要排在課程前面還原：檢測掛在名單上，順序反了就對不到人
  const leads = (raw.leads || []).map((d) => ({
    id: uid(), name: d.name || "", phone: d.phone || "", email: d.email || "",
    source: d.sourceRaw === "walk-in" ? "walkIn" : (LEAD_SOURCE[d.sourceRaw] ? d.sourceRaw : "other"),
    status: LEAD_STATUS[d.statusRaw] ? d.statusRaw : "pending",
    notes: d.notes || "",
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  const lessons = (raw.lessons || []).map((d) => ({
    id: uid(),
    date: d.date || "", start: d.startTime || "09:00", end: d.endTime || "10:00",
    status: LESSON_STATUS[d.statusRaw] ? d.statusRaw : "scheduled",
    notes: d.notes || "", location: d.locationName || "",
    studentId: students[d.studentIndex]?.id || "",
    partnerId: students[d.partnerIndex]?.id || "",
    consumed: !!d.consumedSession, partnerConsumed: !!d.consumedPartnerSession,
    owed: !!d.owedSession, partnerOwed: !!d.owedPartnerSession,
    // 正課／檢測。舊備份沒有這幾欄，一律當正課。
    kind: d.kindRaw === "assessment" ? "assessment" : "lesson",
    outcome: OUTCOME[d.outcomeRaw] ? d.outcomeRaw : "pending",
    color: typeof d.colorTag === "string" ? d.colorTag : "",
    leadId: leads[d.leadIndex]?.id || "",
    createdAt: d.createdAt || new Date().toISOString(),
  }));

  const rawSettings = raw.settings || {};
  const settings = clone(DEFAULT_SETTINGS);
  if (rawSettings.employmentType) settings.employment = rawSettings.employmentType;
  if (rawSettings.userRole) {
    settings.role = rawSettings.userRole === "contractor" ? "contractor" : "coach";
  }
  if (rawSettings.defaultLessonDurationMinutes) {
    settings.defaultDuration = clampDuration(+rawSettings.defaultLessonDurationMinutes);
  }
  if (rawSettings.lowSessionsThreshold) {
    settings.lowSessions = Math.max(1, Math.round(+rawSettings.lowSessionsThreshold) || 3);
  }
  if (rawSettings.idleDaysThreshold) {
    settings.idleDays = Math.max(1, Math.round(+rawSettings.idleDaysThreshold)
                                    || DEFAULT_SETTINGS.idleDays);
  }
  const fields = parseJSON(rawSettings.customFieldDefinitions, null);
  if (Array.isArray(fields)) settings.customFields = fields.filter((f) => typeof f === "string");
  const specs = parseJSON(rawSettings.customFieldSpecs, null);
  if (specs && typeof specs === "object") settings.customFieldSpecs = specs;
  const pkgs = parseJSON(rawSettings.coachPackages, null);
  if (Array.isArray(pkgs)) {
    settings.packages = pkgs.map((p) => ({
      id: p.id || uid(), name: p.name || "方案",
      sessions: p.sessions || 0, price: p.price || 0,
    }));
  }
  const salary = parseJSON(rawSettings.salaryRule, null);
  if (salary && typeof salary === "object") {
    settings.salary = {
      ...DEFAULT_SALARY, ...salary,
      tiers: Array.isArray(salary.tiers)
        ? salary.tiers.map((t) => ({ minSessions: t.minSessions || 0, percent: t.percent || 0 }))
        : DEFAULT_SALARY.tiers,
    };
  }
  // 顏色標籤。iOS 存的是 colorHex，網頁用 color。
  const tags = parseJSON(rawSettings.studentTags, null);
  if (Array.isArray(tags)) {
    settings.tags = tags
      .filter((t) => t && t.id && t.name)
      .map((t) => ({ id: t.id, name: t.name, color: t.colorHex || t.color || TAG_COLORS[0] }));
  }
  settings.theme = S.settings.theme;   // 外觀是這台裝置的偏好，不跟著備份走

  students.forEach((s) => delete s._i);
  return { students, lessons, leads, settings };
}

function importFile(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("讀不到這個檔案");
  reader.onload = () => {
    let parsed;
    try {
      parsed = parseBackup(JSON.parse(reader.result));
    } catch (e) {
      openSheet({
        title: "匯入失敗",
        body: `<p style="margin:0;color:var(--ink-2)">${esc(e.message || "檔案格式不對")}<br>
               請選擇從教練小幫手匯出的 JSON 備份檔。</p>`,
      });
      return;
    }
    askImportMode(parsed);
  };
  reader.readAsText(file);
}

/** 讀進來之後、真的寫進去之前，問一下要合併還是取代 */
function askImportMode(parsed) {
  const summary = `${parsed.students.length} 位學生・${parsed.lessons.length} 堂課・${parsed.leads.length} 筆名單`;
  openSheet({
    title: "要怎麼匯入？",
    body: `
      <div class="note-box" style="margin-bottom:14px">備份內容：${summary}</div>
      <p style="margin:0 0 6px;color:var(--ink-2)"><strong>合併</strong>：保留現在的資料，把備份加進來。同名同電話的學生視為同一人，不會重複建立。</p>
      <p style="margin:0;color:var(--ink-2)"><strong>取代</strong>：先清空現在的資料，整份換成備份的內容。</p>`,
    extraFoot: `<button class="btn btn-sm" type="button" data-action="do-merge">合併</button>`,
    confirmLabel: "取代全部",
    onConfirm: () => applyImport(parsed, "replace"),
    onMount: (root) => {
      root.addEventListener("click", (e) => {
        if (!e.target.closest('[data-action="do-merge"]')) return;
        applyImport(parsed, "merge");
        closeSheet();
      });
    },
  });
}

function applyImport(parsed, mode) {
  if (mode === "replace") {
    S = { students: parsed.students, lessons: parsed.lessons, leads: parsed.leads, settings: parsed.settings };
  } else {
    const keyOf = (s) => `${(s.name || "").trim()}|${(s.phone || "").trim()}`;
    const existing = new Map(S.students.map((s) => [keyOf(s), s]));
    const remap = new Map();
    for (const s of parsed.students) {
      const hit = existing.get(keyOf(s));
      if (hit && (s.name || s.phone)) {
        remap.set(s.id, hit.id);
      } else {
        S.students.push(s);
        existing.set(keyOf(s), s);
        remap.set(s.id, s.id);
      }
    }
    // 課也要比對「是不是同一堂」。學生早就有「同名同電話視為同一人」，
    // 課卻完全沒有 —— 重匯一次、或匯入一份跟這台有共同歷史的備份，
    // 那些課會整批再長一次（iOS 那邊 2026-08-11 修過同一條）。
    // 同一位、同一天、同一個開始時間就是同一堂：本來就擋掉時段重疊的課。
    const lessonKey = (l) => `${l.studentId || "-"}@${l.date} ${l.start}`;
    const seenLessons = new Set(S.lessons.map(lessonKey));
    for (const l of parsed.lessons) {
      l.studentId = remap.get(l.studentId) || "";
      l.partnerId = remap.get(l.partnerId) || "";
      const key = lessonKey(l);
      if (seenLessons.has(key)) continue;
      seenLessons.add(key);
      S.lessons.push(l);
    }
    S.leads.push(...parsed.leads);
    // 合併時只補上目前沒有的自訂欄位，其他設定維持這台裝置的
    for (const f of parsed.settings.customFields) {
      if (!S.settings.customFields.includes(f)) S.settings.customFields.push(f);
    }
  }
  save(); render();
  toast(mode === "replace" ? "已用備份取代原本的資料" : "已合併備份資料");
}

/* ── 示範資料 ───────────────────────────────── */

function seedDemo() {
  const names = DEMO_NAMES;
  const jobs = ["工程師", "護理師", "老師", "業務", "設計師", "工程師", "自由業", "護理師"];
  const genders = ["女", "男", "女", "男", "男", "女", "男", "女"];
  const births = ["1994-03-12", "1988-11-02", "1999-06-25", "1985-01-30", "1996-09-08", "1992-12-19", "1979-04-14", "2001-07-07"];

  const students = names.map((name, i) => {
    const total = [10, 20, 10, 30, 20, 10, 20, 10][i];
    const used = [7, 4, 9, 12, 18, 1, 6, 10][i];
    const rate = [1100, 1000, 1200, 950, 1000, 1300, 1000, 1150][i];
    const s = newStudent({
      name, phone: "09" + String(10000000 + i * 1111111).slice(0, 8),
      rate, totalPurchased: total, remaining: Math.max(0, total - used),
      color: STUDENT_COLORS[i % STUDENT_COLORS.length],
      acquisition: ["selfDeveloped", "referral", "companyLead"][i % 3],
      custom: { "性別": genders[i], "職業": jobs[i], "生日": births[i] },
      renewalCount: i % 3,
    });
    s.payments = [{ id: uid(), amount: rate * total, date: dayStr(addDays(new Date(), -20 - i * 9)),
                    method: i % 2 ? "transfer" : "cash", notes: `${total} 堂方案`, createdAt: new Date().toISOString() }];
    s.renewals = [{ id: uid(), date: dayStr(addDays(new Date(), -20 - i * 9)), sessions: total,
                    amount: rate * total, notes: "", createdAt: new Date().toISOString() }];
    return s;
  });

  const lessons = [];
  const slots = [["09:00", 90], ["11:00", 60], ["14:00", 90], ["19:00", 60], ["20:30", 90]];
  for (let d = -21; d <= 14; d++) {
    const date = dayStr(addDays(new Date(), d));
    const wd = (parseDay(date).getDay() + 6) % 7;
    if (wd >= 5) continue;
    const n = 2 + (Math.abs(d) % 2);
    for (let k = 0; k < n; k++) {
      const [start, mins] = slots[(Math.abs(d) + k) % slots.length];
      const st = students[(Math.abs(d) * 3 + k) % students.length];
      lessons.push({
        id: uid(), date, start, end: timeOf(minutesOf(start) + mins),
        status: d < 0 ? (Math.abs(d) % 11 === 0 ? "absent" : "attended") : "scheduled",
        notes: "", location: "", studentId: st.id, partnerId: "",
        consumed: d < 0 && Math.abs(d) % 11 !== 0, partnerConsumed: false, owed: false, partnerOwed: false,
        createdAt: new Date().toISOString(),
      });
    }
  }

  const leadNames = [["周子瑜", "referral", "converted"], ["何柏叡", "online", "contacted"],
                     ["蔡沐恩", "company", "pending"], ["鄭雅文", "walkIn", "converted"],
                     ["謝定澄", "online", "pending"], ["曾苡宸", "referral", "contacted"],
                     ["高子萱", "company", "converted"]];
  const leads = leadNames.map(([name, source, status], i) => ({
    id: uid(), name, phone: "", email: "", source, status,
    notes: status === "pending" ? "等對方回訊息" : "",
    createdAt: addDays(new Date(), -40 + i * 5).toISOString(),
    updatedAt: addDays(new Date(), -6 + i).toISOString(),
  }));

  S = {
    students, lessons, leads,
    settings: { ...clone(DEFAULT_SETTINGS), theme: S.settings.theme, employment: "company" },
  };
  save(); render();
  toast(`已載入示範資料：${students.length} 位學生・${lessons.length} 堂課`);
}

/* ════════════════════════════════════════════════
   7. 事件
   ════════════════════════════════════════════════ */

document.addEventListener("click", (e) => {
  const navBtn = e.target.closest("[data-tab]");
  if (navBtn) { tab = navBtn.dataset.tab; render(); return; }

  if (e.target.closest("#theme-btn")) {
    const order = ["auto", "light", "dark"];
    S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3];
    save(); render(); return;
  }

  const el = e.target.closest("[data-action]");
  if (!el || el.closest(".scrim")) return;
  const { action, value, id } = el.dataset;

  // 檢測名單。action 長成 "assess-list:closed" 或 "assess-list:source:company"，
  // 所以不能放進下面的 switch（那是完全比對）。
  if (action.startsWith("assess-list:")) {
    openAssessmentList(action.slice(12));
    return;
  }

  switch (action) {
    case "goto": tab = value; render(); break;
    case "open-guide": guideSheet(); break;
    case "dismiss-notice":
      try { localStorage.setItem(NOTICE_KEY, ANNOUNCEMENT.id); } catch (err) {}
      render();
      break;
    case "new-student": studentSheet(null); break;
    case "view-student": studentDetailSheet(studentById(id)); break;
    case "edit-student": studentSheet(studentById(id)); break;
    case "renew": renewSheet(studentById(id)); break;
    case "student-filter": studentFilter = value; render(); break;
    case "toggle-tag-filter":
      if (activeTagFilter.has(id)) activeTagFilter.delete(id); else activeTagFilter.add(id);
      render(); break;
    case "clear-tag-filter": activeTagFilter.clear(); render(); break;
    case "adjust-sessions": adjustSessionsSheet(studentById(id)); break;
    case "report-outcome": outcomeSheet(S.lessons.find((l) => l.id === id)); break;
    case "edit-tags": tagSettingsSheet(); break;
    case "report-issue": reportIssueSheet(); break;
    case "add-to-home": addToHomeSheet(); break;
    case "payment-range": paymentRange = value; render(); break;
    case "sales-period":
      salesPeriod = value;
      S.settings.salesPeriod = value; save();
      if (value === "custom" && !salesFrom) {
        const b = periodBounds("thisMonth");
        salesFrom = b.from; salesTo = b.to;
      }
      render(); break;
    case "rank-period":
      rankPeriod = value;
      S.settings.rankPeriod = value; save();
      if (value === "custom" && !rankFrom) {
        const b = periodBounds("thisMonth");
        rankFrom = b.from; rankTo = b.to;
      }
      render(); break;
    case "rank-limit":
      rankLimit = parseInt(value, 10) || 0;
      S.settings.rankLimit = rankLimit; save();
      render(); break;
    case "rank-metric":
      rankMetric = value;
      S.settings.rankMetric = value; save();
      render(); break;
    // 跳到分析頁的某一區。**不要 render()** —— 重畫會把捲動位置歸零，
    // 那正是這顆按鈕要解決的事。
    case "jump": {
      const target = document.getElementById(value);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      break;
    }
    case "set-base-mode":
      S.settings.salary.baseSalaryMode = value; save(); render(); break;

    case "new-lesson": lessonSheet(null); break;
    // 「太久沒上課」那一列的排課：直接帶著那位學生開表單
    case "schedule-for": lessonSheet(null, "lesson", id); break;
    // 檢測本來只藏在排課表單的「種類」下拉裡，畫面上完全看不到這個功能
    case "new-assessment": lessonSheet(null, "assessment"); break;
    case "edit-lesson": lessonSheet(S.lessons.find((l) => l.id === id)); break;
    case "pick-day": selectedDate = value; render(); break;
    case "week": {
      if (value === "0") { weekAnchor = today(); selectedDate = today(); }
      else weekAnchor = dayStr(addDays(parseDay(weekAnchor), +value * 7));
      render(); break;
    }
    case "cal-refresh":
    case "refresh-all": {
      const n = autoMarkPastLessons();
      save(); render();
      toast(n ? `已更新 ${n} 堂課的狀態` : "已是最新狀態");
      break;
    }

    case "new-payment": paymentSheet(); break;
    case "edit-payment": {
      const st = studentById(el.dataset.student);
      const p = st && (st.payments || []).find((x) => x.id === id);
      if (p) paymentSheet(st, p);
      break;
    }
    case "batch-contracts": batchContractSheet(); break;
    case "batch-contracts-all": batchContractSheet(true); break;
    case "fix-payment-dates": {
      const n = fixPaymentDatesFromRenewals();
      save(); render();
      toast(n ? `已修正 ${n} 筆收費的日期` : "沒有需要修正的收費");
      break;
    }
    case "review-duplicates": duplicateSheet(); break;
    case "fix-renewal-dates": {
      const n = fixRenewalDatesFromPayments();
      save(); render();
      toast(n ? `已用收費日期修正 ${n} 筆合約日期` : "沒有需要修正的日期");
      break;
    }
    case "fill-renewal-amounts": {
      const n = fillRenewalAmountsFromPayments();
      save(); render();
      toast(n ? `已補上 ${n} 筆合約金額` : "沒有可以補的合約");
      break;
    }
    case "delete-payment": {
      const st = studentById(el.dataset.student);
      if (!st) break;
      const p = (st.payments || []).find((x) => x.id === id);
      if (!p) break;
      // 跟收費表單裡那顆刪除講同一套話 —— 同一件事在兩個地方說法不同
      // 只會讓人以為是兩件事
      const r = renewalOfPayment(st, p);
      confirmSheet("刪除收費紀錄",
        `${esc(st.name || "")}　${esc(p.date || "")}　${money(p.amount || 0)}`
        + (r ? `<br>這筆錢掛在 ${esc(r.date || "")} 的續約底下。<strong>續約紀錄不會跟著刪</strong>，那筆課還是賣出去了。`
             : "<br>這筆沒有對應到任何續約，刪掉只影響收入統計。"),
        () => {
          st.payments = st.payments.filter((x) => x.id !== id);
          st.updatedAt = new Date().toISOString();
          save(); render(); toast("已刪除收費紀錄");
        }, "刪除");
      break;
    }

    case "new-lead": leadSheet(); break;
    case "delete-lead": {
      // 以前是按一下就直接刪，連問都不問；而且掛在他身上的檢測會變成斷頭：
      // leadId 指向不存在的人，回報「成交了」時 applyOutcome 會在
      // `if (!lead) return null` 靜靜跳出 —— **不會幫你轉成正式學生**，
      // 依來源的成交率也會少算那一場（總成交率卻還算著），兩個數字從此對不上。
      const lead = leadById(id);
      if (!lead) break;
      const tried = S.lessons.filter((l) => isAssessment(l) && l.leadId === id);
      confirmSheet("刪除名單",
        `${esc(lead.name || "這筆名單")}`
        + (tried.length
            ? `<br>他身上掛著 <strong>${tried.length} 堂檢測</strong>，會一起刪掉——檢測認不出是誰的話，
               回報成交時轉不了正式學生，成交率也會算錯。<br>
               只是想讓他離開追蹤名單的話，把狀態改成「流失」就好，紀錄會留著。`
            : "<br>無法復原。"),
        () => {
          const ids = new Set(tried.map((l) => l.id));
          S.lessons = S.lessons.filter((l) => !ids.has(l.id));
          S.leads = S.leads.filter((l) => l.id !== id);
          save(); render();
          toast(tried.length ? `已刪除名單與 ${tried.length} 堂檢測` : "已刪除名單");
        }, "刪除");
      break;
    }

    case "set-employment": S.settings.employment = value; save(); render(); break;
    case "set-role":
      S.settings.role = value === "contractor" ? "contractor" : "coach";
      save(); render();
      toast(value === "contractor" ? "排課時會出現上課地點" : "排課時不再問上課地點");
      break;
    case "set-theme": S.settings.theme = value; save(); render(); break;
    case "set-basis": S.settings.salary.payoutBasisRaw = value; save(); render(); break;
    case "edit-duration": durationSheet(); break;
    case "move-field":
      if (moveCustomField(value, el.dataset.dir)) { save(); render(); }
      break;
    // 這三個以前都是按一下就沒了。設定頁的刪除鈕排在一起，手機上很好誤觸，
    // 而自訂欄位一刪，所有學生填在那一格的內容就整批從畫面上消失。
    case "del-field": deleteFieldSheet(value); break;
    case "del-package": {
      const p = S.settings.packages.find((x) => x.id === id);
      confirmSheet("刪除方案", p ? `「${esc(p.name)}」以後不會出現在續約的選單裡。已經賣出去的續約紀錄不受影響。` : "",
        () => {
          S.settings.packages = S.settings.packages.filter((x) => x.id !== id);
          save(); render(); toast("已刪除方案");
        }, "刪除");
      break;
    }
    case "del-tier":
      confirmSheet("刪除抽成級距", `滿 ${esc(value)} 堂那一級會拿掉，薪資會改用剩下的級距重算。`, () => {
        S.settings.salary.tiers = S.settings.salary.tiers.filter((t) => String(t.minSessions) !== value);
        save(); render(); toast("已刪除級距");
      }, "刪除");
      break;

    case "export": exportData(); break;
    case "import": $("#import-file").click(); break;
    case "copy-backup": copyBackupSheet(); break;
    case "paste-backup": pasteBackupSheet(); break;
    case "seed":
      confirmSheet("載入示範資料", "會先清空目前的資料，再放入 8 位示範學生、約 60 堂課與 7 筆名單。",
        () => seedDemo(), "載入");
      break;
    case "wipe":
      confirmSheet("清除所有資料", "所有學生、課程、收費與名單都會被刪除，無法復原。建議先匯出備份。",
        () => { S = blankState(); save(); render(); toast("已清除所有資料"); }, "清除");
      break;
  }
});

/**
 * 學生搜尋：**就地把不符合的列藏起來，不重畫**。
 *
 * 原本每打一個字就 render()，輸入框會被整個換掉。焦點與游標可以補回來，
 * 但**中文輸入法的組字狀態補不回來** —— 用注音打「王」會在按下第一個鍵時
 * 就被打斷，等於中文名字完全搜不了（2026-08-12 回報）。
 * 現在輸入框從頭到尾是同一個元素，只有列在藏與現。
 */
function applyStudentSearch() {
  const rows = $$("[data-student-row]");
  if (!rows.length) return;
  const q = studentSearch.trim().toLowerCase();
  let shown = 0;
  for (const row of rows) {
    const hit = !q || (row.dataset.searchKey || "").includes(q);
    row.hidden = !hit;
    if (hit) shown++;
  }
  const note = $("[data-search-count]");
  if (note) {
    note.hidden = !q;
    note.textContent = q
      ? `找到 ${shown} 位${shown ? "" : "——換個關鍵字，或看看是不是在「封存」裡"}`
      : "";
  }
}

document.addEventListener("input", (e) => {
  if (!e.target.matches("[data-student-search]")) return;
  studentSearch = e.target.value;
  applyStudentSearch();
});

/* 下拉選單改狀態 */
document.addEventListener("change", (e) => {
  // 銷售統計的自訂起訖日
  if (e.target.matches("[data-sales-from]")) { salesFrom = e.target.value; render(); return; }
  if (e.target.matches("[data-sales-to]")) { salesTo = e.target.value; render(); return; }
  // 排行榜的自訂起訖日
  if (e.target.matches("[data-rank-from]")) { rankFrom = e.target.value; render(); return; }
  if (e.target.matches("[data-rank-to]")) { rankTo = e.target.value; render(); return; }

  const el = e.target.closest("[data-action]");
  if (el) {
    const { action, id, key } = el.dataset;
    if (action === "lesson-status") {
      const l = S.lessons.find((x) => x.id === id);
      if (l) { setLessonStatus(l, el.value); save(); render(); toast(`已改為「${LESSON_STATUS[el.value].label}」`); }
      return;
    }
    if (action === "lead-status") {
      const lead = S.leads.find((x) => x.id === id);
      if (!lead) return;
      const wasConverted = lead.status === "converted";
      lead.status = el.value;
      lead.updatedAt = new Date().toISOString();
      save();
      if (!wasConverted && el.value === "converted") {
        render();
        convertLead(lead);
        toast(`${lead.name} 轉成正式學生，確認一下資料`);
      } else { render(); }
      return;
    }
    if (action === "toggle-salary") {
      S.settings.salary[key] = el.checked;
      save(); render();
      return;
    }
    if (action === "salary-num") {
      const v = +el.value;
      const before = S.settings.salary[key];
      S.settings.salary[key] = Number.isFinite(v) ? v : 0;
      save();
      // 這裡**刻意不重畫** —— 重畫會讓輸入框失焦，數字打到一半被打斷。
      // 唯一的例外是底薪跨過 0：「底薪的給法」那一整段是 baseSalary > 0 才畫的，
      // 不重畫的話，剛填完底薪的人看不到那三顆按鈕（要切出去再切回來才長出來），
      // 而改回 0 之後那段又會賴在畫面上。跨過 0 才重畫，其他欄位維持不動。
      if (key === "baseSalary" && (before > 0) !== (S.settings.salary[key] > 0)) render();
      return;
    }
    if (action === "rename-field") {
      if (renameCustomField(el.dataset.value, el.value)) {
        save(); render(); toast(`欄位改名為「${el.value.trim()}」，已填的資料一起搬過去了`);
      } else { render(); }   // 沒改成功就把輸入框還原成原本的名字
      return;
    }
    if (action === "set-field-type") {
      const specs = S.settings.customFieldSpecs || (S.settings.customFieldSpecs = {});
      const name = el.dataset.value;
      specs[name] = { ...(specs[name] || {}), type: el.value };
      save(); render();
      return;
    }
    if (action === "set-field-options") {
      const specs = S.settings.customFieldSpecs || (S.settings.customFieldSpecs = {});
      const name = el.dataset.value;
      // 全形與半形逗號、頓號都當分隔符 —— 使用者不會記得該打哪一個
      specs[name] = { ...(specs[name] || {}),
        options: el.value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean) };
      save(); render();
      return;
    }
    if (action === "set-low-sessions") {
      // 至少 1 —— 設成 0 的話這個提醒等於關掉，但畫面上看不出來是關的
      const v = Math.max(1, Math.round(+el.value) || 1);
      S.settings.lowSessions = v;
      el.value = v;
      save(); render();
      return;
    }
    if (action === "set-idle-days") {
      // 同上：0 天等於「每個人都太久沒上課」，那份名單就沒有用了
      const v = Math.max(1, Math.round(+el.value) || DEFAULT_SETTINGS.idleDays);
      S.settings.idleDays = v;
      el.value = v;
      save(); render();
      return;
    }
  }

  if (e.target.id === "import-file" && e.target.files?.[0]) {
    importFile(e.target.files[0]);
    e.target.value = "";
  }
});

/* 設定頁的小表單：加入後清空，讓使用者直接填下一筆 */
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();

  if (form.dataset.form === "add-field") {
    const name = form.elements.field.value.trim();
    if (!name) return;
    if (S.settings.customFields.includes(name)) { toast("已經有同名欄位了"); return; }
    S.settings.customFields.push(name);
    save(); render(); toast(`已新增欄位「${name}」`);
    return;
  }

  if (form.dataset.form === "add-package") {
    const name = form.elements.name.value.trim();
    const sessions = +form.elements.sessions.value || 0;
    if (!name || sessions <= 0) { toast("方案要有名稱與堂數"); return; }
    // 方案存的一律是整包的總額：續約套用時直接帶入金額欄，
    // 而那一欄存進續約紀錄的也是總額（銷售統計與抽成都拿總額算）。
    const typed = Math.max(0, +form.elements.price.value || 0);
    const price = form.elements.priceMode.value === "unit" ? typed * sessions : typed;
    S.settings.packages.push({ id: uid(), name, sessions, price });
    save(); render();
    toast(`已加入方案「${name}」・${sessions} 堂 ${money(price)}`);
    return;
  }

  if (form.dataset.form === "add-tier") {
    const sessions = +form.elements.sessions.value || 0;
    const percent = +form.elements.percent.value || 0;
    if (sessions <= 0 || percent <= 0 || percent > 100) {
      toast("請填有效的堂數與百分比");
      return;
    }
    S.settings.salary.tiers = S.settings.salary.tiers.filter((t) => t.minSessions !== sessions);
    S.settings.salary.tiers.push({ minSessions: sessions, percent });
    save();
    render();
    // 重畫之後把焦點放回堂數欄，接著填下一級
    const next = $('[data-form="add-tier"] [name="sessions"]');
    if (next) next.focus();
    toast(`已加入：滿 ${sessions} 堂抽 ${percent}%`);
  }
});

/* ════════════════════════════════════════════════
   7.5 加到主畫面時把資料帶過去

   iOS 的「加入主畫面」會開一個獨立的儲存空間，跟 Safari 裡的
   localStorage **完全不互通**。教練在 Safari 建好一堆學生，加到主畫面
   打開卻是空的，看起來像資料不見了。這不是 bug，是 iOS 的行為，
   而且沒有任何 API 能直接共用。

   唯一能穿過去的通道是「網址」：加入主畫面時，iOS 會把當下完整的網址
   （含 # 後面的片段）存進那個圖示。所以做法是先把備份塞進 location.hash，
   再請使用者加到主畫面；桌面版第一次打開就從 hash 把資料撈回來。

   # 後面的內容不會送到伺服器，GitHub Pages 只會拿到 index.html。
   ════════════════════════════════════════════════ */

/** 現在是從主畫面圖示打開的嗎 */
function isStandalone() {
  // 這個判斷會被畫面用到，任何一個屬性取不到就整頁白掉，所以一路用 ?.
  return window.navigator?.standalone === true
      || window.matchMedia?.("(display-mode: standalone)")?.matches === true;
}

/** 網址太長 iOS 會存不住。超過這個長度就不要走 hash，改請人用複製貼上。 */
const HANDOFF_MAX = 60000;
const HANDOFF_KEY = "coach-mate-handoff-done";

const b64encode = (bytes) => {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  // 網址片段裡 + / = 會被各種東西誤解，換成 URL 安全的字元
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64decode = (str) => {
  const padded = str.replace(/-/g, "+").replace(/_/g, "/")
    + "=".repeat((4 - (str.length % 4)) % 4);
  const bin = atob(padded);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
};

/** 壓縮過的備份。CompressionStream 在舊瀏覽器沒有，就退回不壓縮。 */
async function encodeHandoff() {
  const json = JSON.stringify(buildBackup());
  const raw = new TextEncoder().encode(json);
  if (typeof CompressionStream === "undefined") return "r" + b64encode(raw);
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));
  const packed = new Uint8Array(await new Response(stream).arrayBuffer());
  return "z" + b64encode(packed);
}

async function decodeHandoff(payload) {
  const kind = payload[0];
  const bytes = b64decode(payload.slice(1));
  if (kind === "r") return JSON.parse(new TextDecoder().decode(bytes));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

/**
 * 啟動時檢查網址裡有沒有要帶進來的資料。
 * 圖示裡的網址不會變，所以同一份資料只認一次，否則每次打開都會蓋掉。
 */
async function consumeHandoff() {
  const match = /[#&]import=([^&]+)/.exec(location.hash || "");
  if (!match) return false;
  const payload = match[1];

  // 這份 payload 已經帶進來過了就跳過（每次開 App 都重蓋才是災難）
  const stamp = payload.length + ":" + payload.slice(0, 24);
  try {
    if (localStorage.getItem(HANDOFF_KEY) === stamp) return false;
  } catch (e) {}

  try {
    const backup = await decodeHandoff(payload);
    const parsed = parseBackup(backup);
    const hasData = S.students.length || S.lessons.length;
    // 這台已經有資料了就不要默默蓋掉，先問過
    if (hasData && !confirm(
      `這個連結帶著一份資料（${parsed.students.length} 位學生、${parsed.lessons.length} 堂課）。`
      + `要用它取代目前這台裝置上的 ${S.students.length} 位學生嗎？`)) {
      try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
      return false;
    }
    S = parsed;
    save();
    try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
    toast(`已帶進 ${S.students.length} 位學生`);
    return true;
  } catch (e) {
    console.warn("網址裡的資料讀不出來", e);
    toast("網址裡的資料讀不出來，請改用「貼上備份文字」");
    return false;
  }
}

/** 「加到主畫面」的引導 */
async function addToHomeSheet() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const hasData = S.students.length > 0 || S.lessons.length > 0;

  let payload = "";
  let tooBig = false;
  if (hasData) {
    try {
      payload = await encodeHandoff();
      tooBig = payload.length > HANDOFF_MAX;
    } catch (e) {
      tooBig = true;
    }
  }

  const steps = ios
    ? `<li>點畫面<strong>下方中間的分享圖示</strong>（往上的箭頭）</li>
       <li>往下捲，選<strong>「加入主畫面」</strong></li>
       <li>右上角按「新增」</li>`
    : `<li>點瀏覽器<strong>右上角的選單</strong></li>
       <li>選<strong>「加到主畫面」</strong>或「安裝應用程式」</li>`;

  openSheet({
    title: "加到主畫面",
    closeLabel: "關閉",
    confirmLabel: hasData && !tooBig ? "好，我要開始加" : "",
    body: `
      <p class="row-sub" style="margin:0 0 12px">
        加到主畫面之後開起來像 App，沒有網址列，系統也比較不會把資料清掉。
      </p>

      ${hasData ? `
        <div class="note-box" style="margin-bottom:12px">
          <strong>重要：主畫面的圖示跟現在這個瀏覽器，資料是分開的。</strong>
          你現在的 ${S.students.length} 位學生<u>不會</u>自動跑過去。
          ${tooBig
            ? `你的資料量比較大，沒辦法用網址帶過去。請改走這條：
               先按「複製備份文字」把資料複製起來 → 加到主畫面 → 打開桌面圖示 →
               設定 → 貼上備份文字 → 取代全部。`
            : `按下面的按鈕，我會把資料放進網址裡，你接著照步驟加到主畫面，
               第一次打開就會自動帶進去。`}
        </div>` : `
        <div class="note-box" style="margin-bottom:12px">
          你現在還沒有資料，<strong>這是最好的時機</strong>——先加到主畫面，
          之後都從桌面圖示開來輸入，就不會有資料分兩邊的問題。
        </div>`}

      <p style="font-weight:650;margin:0 0 6px">加入的步驟</p>
      <ol style="margin:0;padding-left:20px;line-height:2;font-size:14px">${steps}</ol>

      ${hasData && !tooBig ? `
        <p class="hint" style="margin-top:12px">
          按「好，我要開始加」之後，網址會變長（那是你的資料），這是正常的。
          接著再照上面的步驟操作。加完之後打開桌面圖示，資料就在裡面了。
        </p>` : ""}
      ${hasData && tooBig ? `
        <button class="btn btn-sm" type="button" data-action="copy-backup" style="margin-top:12px">
          複製備份文字
        </button>` : ""}`,
    onConfirm: () => {
      if (!hasData || tooBig) return;
      // 只改 hash 不會重新載入頁面，但網址列會更新，
      // 之後「加入主畫面」存下來的就是這一份帶著資料的網址
      location.hash = "import=" + payload;
      // 自己這一份已經有資料了，不用再帶一次
      try {
        localStorage.setItem(HANDOFF_KEY, payload.length + ":" + payload.slice(0, 24));
      } catch (e) {}
      toast("網址已經帶上你的資料，接著按分享 → 加入主畫面");
    },
  });
}

/**

/* ════════════════════════════════════════════════
   7.6 有新版本的時候

   加到主畫面的圖示沒有網址列，也就沒有重新整理按鈕、沒有下拉更新。
   GitHub Pages 的快取是十分鐘，所以教練「完全關掉 App 再打開」時
   會拿到新版——但只是切出去再切回來並不會，可能一直停在舊版好幾天，
   而且你完全不知道他們看到的是哪一版。

   做法：讀一個很小的 version.json（明確不用快取），跟自己內建的
   BUILD 比對，不一樣就跳一條橫幅讓人按一下更新。

   沒有用 service worker。它能做真正的離線快取，但也是「更新卡住」
   這類 bug 的頭號來源，而這裡要解的是更新通知，不是離線。
   ════════════════════════════════════════════════ */

/** 最近一次檢查的時間，避免切來切去就狂打 */
let lastUpdateCheck = 0;
const UPDATE_CHECK_INTERVAL = 5 * 60 * 1000;   // 5 分鐘
let updateBannerShown = false;

async function checkForUpdate({ force = false } = {}) {
  // 本機用檔案打開時沒有 version.json，不用檢查
  if (location.protocol === "file:") return;
  if (typeof fetch !== "function") return;
  if (navigator.onLine === false) return;
  if (updateBannerShown) return;

  const now = Date.now();
  if (!force && now - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
  lastUpdateCheck = now;

  try {
    // cache: no-store 是關鍵：不然連版本檔本身都可能拿到快取的舊值
    const res = await fetch("version.json", { cache: "no-store" });
    if (!res.ok) return;
    const { build } = await res.json();
    if (build && build !== BUILD) showUpdateBanner(build);
  } catch (e) {
    // 沒網路、擋掉了、檔案不在——都靜靜算了，不能影響離線使用
  }
}

function showUpdateBanner(newBuild) {
  if (updateBannerShown) return;
  updateBannerShown = true;

  const bar = document.createElement("div");
  bar.className = "update-bar";
  bar.innerHTML = `
    <span class="update-text">
      <strong>有新版本可以用了</strong>
      <span class="update-sub">目前 ${esc(BUILD)}　→　${esc(newBuild)}</span>
    </span>
    <button type="button" class="btn btn-primary btn-sm" data-update-now>立即更新</button>
    <button type="button" class="btn btn-sm btn-ghost" data-update-later aria-label="稍後再說">✕</button>`;
  document.body.appendChild(bar);

  bar.querySelector("[data-update-now]").addEventListener("click", applyUpdate);
  bar.querySelector("[data-update-later]").addEventListener("click", () => {
    bar.remove();
    // 關掉之後這次開啟就不再吵，下次重開再說
  });
}

async function applyUpdate() {
  // 資料在 localStorage，重載不會弄丟，但還是先確保寫進去了
  try { save(); } catch (e) {}

  // 沒有註冊 service worker，但如果哪天有了，這裡先清掉才不會又載到舊的
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) {}

  // 帶一個一次性參數繞過 HTTP 快取。單靠 location.reload() 不一定
  // 會重新跟伺服器要檔案。載入後會把這個參數拿掉，網址保持乾淨。
  const url = new URL(location.href);
  url.searchParams.set("_v", Date.now().toString(36));
  location.replace(url.toString());
}

/** 重載完把繞過快取用的參數清掉，不然它會一直留在網址上 */
function stripCacheBuster() {
  // 這是開機路徑上的程式碼，取不到東西就整頁白掉，所以一路防
  if (!(location.search || "").includes("_v=")) return;
  if (typeof URL !== "function" || !history?.replaceState) return;
  const url = new URL(location.href);
  url.searchParams.delete("_v");
  history.replaceState(null, "", url.pathname + url.search + url.hash);
}

/* ════════════════════════════════════════════════
   8. 啟動
   ════════════════════════════════════════════════ */

// 每個人打開都是自己的空白帳本，不預先塞示範資料——
// 這是要給不同教練各自試用的，別人的假學生混在裡面只會擋路。
// 想先看看長什麼樣子，總覽頁與設定頁都有「載入示範資料」。
const loaded = load();
if (loaded) {
  S = loaded;
  autoMarkPastLessons();
  if (S.settings.salesPeriod) salesPeriod = S.settings.salesPeriod;
  if (S.settings.rankPeriod) rankPeriod = S.settings.rankPeriod;
  if (Number.isFinite(S.settings.rankLimit)) rankLimit = S.settings.rankLimit;
  if (S.settings.rankMetric) rankMetric = S.settings.rankMetric;
  save();
} else {
  S = blankState();
}

render();

// 網址裡如果帶著資料（從瀏覽器加到主畫面時放進去的），把它撈出來。
// 放在 render() 之後：解壓縮是非同步的，不要為了它讓畫面空白著。
function runHandoff() {
  consumeHandoff().then((imported) => {
    if (imported) {
      autoMarkPastLessons();
      save();
      render();
    }
  });
}
runHandoff();

// 頁面已經開著的時候只換 hash 不會重新載入（例如把帶資料的連結
// 貼進網址列）。這時候什麼都不做會看起來像連結壞掉，所以也接一下。
window.addEventListener("hashchange", runHandoff);

// 有沒有新版本。開啟時查一次，之後每次從背景切回來也查
//（教練多半是把 App 留在背景，不會真的關掉再開）。
stripCacheBuster();
checkForUpdate({ force: true });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});
</script>

</html>
