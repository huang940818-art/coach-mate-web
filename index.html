                    style="--tag:${esc(t.color)}">
              <span class="tag-dot"></span>${esc(t.name)}
              <span class="muted" style="font-size:11px">${counts[t.id] || 0}</span>
            </button>`).join("")}
          ${activeTagFilter.size ? `<button type="button" class="btn btn-sm btn-ghost" data-action="clear-tag-filter">清除篩選</button>` : ""}
        </div>` : ""}

      <section class="card">
        ${list.length ? list.map((s) => {
          const used = consumedSessions(s);
          // 上掉的課值多少錢。公司教練的鐘點抽成就是拿這個去算的，
          // 所以「上了幾堂」旁邊直接把金額寫出來，不用自己乘。
          const usedValue = used.count * sessionPrice(s);
          return `
          <div class="row" data-student-row
               data-search-key="${esc(`${s.name || ""} ${s.phone || ""}`.toLowerCase())}">
            <span class="dot" style="background:${esc(s.color)}"></span>
            <div class="row-main">
              <div class="row-title">
                <button type="button" class="btn-plain" data-action="view-student" data-id="${s.id}"
                        style="font:inherit;color:inherit;cursor:pointer;text-align:left">${esc(s.name || "（未命名）")}</button>
                ${s.status === "archived" ? '<span class="pill pill-mute">封存</span>' : ""}
                ${s.status === "awaiting" ? '<span class="pill pill-warn">課程結束待續約</span>' : ""}
                ${s.mayNotRenew ? '<span class="pill pill-warn">可能不續約</span>' : ""}
                ${// 太久沒上課只用一個 pill，**不寫進下面那行**。
                  // 這一行 2026-08-17 才因為「看起來很亂」精簡過，每一列都掛
                  // 「上次上課 X（N 天前）」等於把它塞回去；真正要看名單的人
                  // 走總覽那一區，這裡只要看得出「這位放很久了」就夠。
                  (() => {
                    const hit = idle.get(s.id);
                    if (!hit) return "";
                    const at = idleDaysSetting();
                    return `<span class="pill ${hit.days >= at * 2 ? "pill-crit" : "pill-warn"}"
                             title="${hit.last ? `上次上課 ${esc(hit.last)}` : "還沒有上課紀錄"}">${hit.days} 天沒上課</span>`;
                  })()}
              </div>
              <!-- 這一行以前塞到三行：已上堂數＋課程價值＋續約次數＋累計收費＋電話
                   （2026-08-17 回報「看起來很亂」）。**累計收費與電話搬到詳情**：
                   電話在詳情表頭、累計收費在詳情的「統計」與「收費」分頁，都還看得到。
                   **搜尋仍然吃電話** —— 靠的是下面的 data-search-key，不是這一行。 -->
              <!-- 「（依剩餘推算，N 堂有紀錄）」拿掉了（2026-08-17：「沒必要」）。
                   數字本身不變，只是不再每一列都解釋它怎麼來的 ——
                   補歷史的人每一列都掛著那句話，整片看過去全是括號。 -->
              <div class="row-sub">已上 ${used.count} 堂${
                usedValue > 0 ? `・課程價值 ${money(usedValue)}` : ""}${
                s.renewalCount > 0 ? `・續約 ${s.renewalCount} 次` : ""}</div>
              ${tagsOf(s).length ? `<div class="tag-row">${tagsOf(s).map((t) =>
                `<span class="tag-chip tag-chip-sm" style="--tag:${esc(t.color)}"><span class="tag-dot"></span>${esc(t.name)}</span>`).join("")}</div>` : ""}
            </div>
            <div class="row-end">
              <!-- 這個數字一直都是可以按的（按了開「調整剩餘堂數」），但它長得跟
                   純文字一樣，於是使用者根本不知道能按（2026-08-17：「沒找到」）。
                   加上虛線底與鉛筆，讓它看起來像可以動的東西。 -->
              <button class="mono btn-plain tap-adjust" type="button" data-action="adjust-sessions" data-id="${s.id}"
                      title="點一下調整剩餘堂數" aria-label="${esc(s.name || "")} 剩餘 ${s.remaining} 堂，點一下調整"
                      style="font-weight:600">
                ${s.remaining}<span class="muted" style="font-size:12px"> / ${currentPackageTotal(s)} 堂</span>
                ${icon("pencil", 12)}
              </button>
              ${packageBreakdown(s) ? `<div class="muted" style="font-size:11px;text-align:right;margin-top:2px">${packageBreakdown(s)}</div>` : ""}
              <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:5px">
                <button class="btn btn-sm" type="button" data-action="renew" data-id="${s.id}">續約</button>
                <button class="btn btn-sm" type="button" data-action="edit-student" data-id="${s.id}">編輯</button>
              </div>
            </div>
          </div>`;
        }).join("") : `<p class="empty">還沒有學生。點右上角「新增學生」開始。</p>`}
      </section>
    </div>`;
}

/**
 * 學生詳情（對應 iOS 的 StudentDetailView）。
 *
 * 網頁版原本點學生沒反應，只能從「編輯」「續約」進去，想看某個人的
 * 課程與收費紀錄得自己去別的頁面翻，翻到了也認不出是誰的。
 *
 * 做成 sheet 而不是獨立頁面：這個 App 的子畫面全是 sheet
 * （lessonSheet / renewSheet / adjustSessionsSheet），為了一個唯讀畫面
 * 多加一條路由與網址狀態不划算。
 *
 * 唯讀。要改資料走上面那排按鈕，跟 iOS 一樣。
 */
function studentDetailSheet(student) {
  const ls = lessonsOf(student.id)
    .slice()
    .sort((a, b) => (b.date + b.start).localeCompare(a.date + a.start));

  // 跟 iOS 的出缺勤統計對齊：「已出席」只算 attended，
  // 但出席率把遲到當成有到（人有來，只是晚了）。
  const attended = ls.filter((l) => l.status === "attended").length;
  const absent = ls.filter((l) => l.status === "absent").length;
  const late = ls.filter((l) => l.status === "late").length;
  const counted = attended + absent + late;
  const rate = counted ? (attended + late) / counted : 0;

  const pays = (student.payments || []).slice()
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  // 沒接到任何續約的收費要看得出來 —— 這一頁是最常盯著看的地方，
  // 而「這筆錢是哪一次買的」看不出來時，續約與收費就會慢慢走鐘。
  // 這位學生根本沒有續約紀錄就不標，那是還沒開始補歷史，不是錯。
  const looseIds = new Set(
    renewalsOf(student).length ? unlinkedPayments(student).map((p) => p.id) : []);
  const paid = pays.reduce((a, p) => a + (p.amount || 0), 0);
  const fields = Object.entries(student.custom || {}).filter(([, v]) => v);

  const byMonth = {};
  for (const l of ls) {
    const m = (l.date || "").slice(0, 7) || "（無日期）";
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(l);
  }
  const months = Object.keys(byMonth).sort().reverse();

  const statCell = (value, label, color) => `
    <div style="flex:1;text-align:center">
      <div style="font-size:20px;font-weight:700;color:${color}">${value}</div>
      <div class="muted" style="font-size:11px">${label}</div>
    </div>`;

  openSheet({
    title: student.name || "（未命名）",
    closeLabel: "關閉",
    body: `
      <div class="row" style="padding-top:0">
        <span class="dot" style="background:${esc(student.color)}"></span>
        <div class="row-main">
          <div class="row-title">
            ${esc(student.name || "（未命名）")}
            ${student.status === "archived" ? '<span class="pill pill-mute">封存</span>' : ""}
            ${student.status === "paused" ? '<span class="pill pill-mute">暫停</span>' : ""}
            ${student.status === "awaiting" ? '<span class="pill pill-warn">課程結束待續約</span>' : ""}
            ${student.mayNotRenew ? '<span class="pill pill-warn">可能不續約</span>' : ""}
          </div>
          <div class="row-sub">
            ${student.phone ? esc(student.phone) + "　" : ""}${sessionPrice(student) ? `每堂 ${money(sessionPrice(student))}${student.rate > 0 ? "" : "（依合約換算）"}` : ""}
          </div>
          ${// 上次上課。排課前最想知道的一件事，寫在表頭比翻課程分頁快。
            (() => {
              const last = lastAttendedDate(student.id);
              if (!last) return "";
              const d = daysSince(last);
              return `<div class="row-sub">上次上課 ${esc(last)}（${daysAgoLabel(d)}）</div>`;
            })()}
        </div>
        <div class="row-end">
          <button class="mono btn-plain tap-adjust" type="button" data-detail-action="adjust"
                  title="點一下調整剩餘堂數" style="font-weight:600">${student.remaining}<span class="muted" style="font-size:12px"> / ${currentPackageTotal(student)} 堂</span>${icon("pencil", 12)}</button>
          ${packageBreakdown(student)
            ? `<div class="muted" style="font-size:11px">${packageBreakdown(student)}</div>`
            : ""}
          ${student.expiry ? `<div class="muted" style="font-size:12px">到期 ${esc(student.expiry)}</div>` : ""}
        </div>
      </div>
      ${tagsOf(student).length ? `<div class="tag-row" style="margin-bottom:10px">${tagsOf(student).map((t) =>
        `<span class="tag-chip tag-chip-sm" style="--tag:${esc(t.color)}"><span class="tag-dot"></span>${esc(t.name)}</span>`).join("")}</div>` : ""}

      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap">
        <button type="button" class="btn btn-sm btn-primary" data-detail-action="renew">續約</button>
        <button type="button" class="btn btn-sm" data-detail-action="adjust">調整堂數</button>
        <button type="button" class="btn btn-sm" data-detail-action="edit">編輯</button>
        <!-- 封存以前只藏在編輯表單下半部的「狀態」下拉裡 —— 想封存的時機是在
             名單上看到「這個人上完了、不續了」的當下，那時候不會有人想到要
             進編輯表單捲到底（2026-08-17 回報「沒辦法把課堂數用完的學生放進封存」）。
             封存是可逆的，所以不另外問一次。 -->
        <!-- 課程上完了但人還在（等他決定要不要續）跟「封存」是兩件事：
             封存＝不再往來、從名單上收起來；待續約＝還要追。
             兩顆並排，因為做這個判斷的時機是同一個（2026-08-17）。 -->
        <button type="button" class="btn btn-sm" data-detail-action="toggle-awaiting">${
          student.status === "awaiting" ? "取消待續約" : "課程結束待續約"}</button>
        <button type="button" class="btn btn-sm" data-detail-action="toggle-archive">${
          student.status === "archived" ? "取消封存" : "封存"}</button>
      </div>

      <div class="seg" style="margin-bottom:12px">
        ${[["lessons", "課程紀錄"], ["payments", "收費紀錄"], ["stats", "統計"]].map(([v, t], i) =>
          `<button type="button" data-detail-tab="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>

      <div data-panel="lessons">
        ${months.length ? months.map((m) => `
          <div class="row-title" style="font-size:13px;margin:10px 0 4px">${esc(m)}　<span class="muted" style="font-weight:400">${byMonth[m].length} 堂</span></div>
          ${byMonth[m].map((l) => {
            const meta = LESSON_STATUS[l.status] || LESSON_STATUS.scheduled;
            const isPartner = l.partnerId === student.id;
            return `
            <div class="row" style="padding:6px 0">
              <div class="row-main">
                <div class="row-title" style="font-size:14px">
                  ${esc(l.date)} <span class="pill ${meta.pill}">${meta.label}</span>
                  ${isPartner ? '<span class="pill pill-mute">雙人課</span>' : ""}
                  
                </div>
                <div class="row-sub mono">${esc(l.start)}–${esc(l.end)}　${durationLabel(durationOf(l))}${l.location ? "　" + esc(l.location) : ""}</div>
              </div>
            </div>`;
          }).join("")}`).join("") : `<p class="empty">還沒有課程紀錄。</p>`}
      </div>

      <div data-panel="payments" hidden>
        ${pays.length ? `
          <p class="hint" style="margin:0 0 8px">共 ${pays.length} 筆・累計 ${money(paid)}</p>
          ${pays.map((p) => `
            <div class="row" style="padding:6px 0">
              <div class="row-main">
                <div class="row-title" style="font-size:14px">${esc(p.date)}
                  ${looseIds.has(p.id) ? '<span class="pill pill-warn">未對應</span>' : ""}
                </div>
                ${paymentLabel(student, p) ? `<div class="row-sub">${esc(paymentLabel(student, p))}</div>` : ""}
              </div>
              <div class="row-end" style="display:flex;align-items:center;gap:8px">
                <div style="text-align:right">
                  <div class="mono" style="font-weight:600">${money(p.amount)}</div>
                  <div class="muted" style="font-size:12px">${({ cash: "現金", transfer: "轉帳", other: "其他" })[p.method] || "其他"}</div>
                </div>
                <button type="button" class="btn btn-sm" data-detail-action="edit-payment"
                        data-id="${p.id}">編輯</button>
              </div>
            </div>`).join("")}` : `<p class="empty">還沒有收費紀錄。</p>`}
      </div>

      <div data-panel="stats" hidden>
        <div class="row-title" style="font-size:13px;margin-bottom:6px">出缺勤統計</div>
        <div style="display:flex;margin-bottom:10px">
          ${statCell(ls.length, "總課程", "var(--info)")}
          ${statCell(attended, "已出席", "var(--good)")}
          ${statCell(absent, "缺席", "var(--crit)")}
          ${statCell(late, "遲到", "var(--warn)")}
        </div>
        ${counted ? `
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span class="muted">出席率</span>
            <strong style="color:${rate >= 0.8 ? "var(--good)" : "var(--warn)"}">${(rate * 100).toFixed(0)}%</strong>
          </div>
          <span class="bar-track" style="display:block;margin-bottom:14px"><span class="bar-fill" style="width:${(rate * 100).toFixed(1)}%"></span></span>`
        : `<p class="hint">${(() => {
            const u = consumedSessions(student);
            return u.estimated
              ? `這位學生還沒有課程紀錄，所以算不出出席率。<strong>依「已購 ${student.totalPurchased || 0} 堂 − 剩餘 ${student.remaining || 0} 堂」推算已經上掉 ${u.count} 堂</strong>${sessionPrice(student) ? `，約 ${money(u.count * sessionPrice(student))}` : ""}。往後把課排進「課表」並標記出席，這裡就會換成實算的數字。`
              : "還沒有上過課，算不出出席率。";
          })()}</p>`}

        ${fields.length ? `
          <div class="row-title" style="font-size:13px;margin-bottom:6px">學生資訊</div>
          ${fields.map(([k, v]) => `
            <div class="row" style="padding:5px 0">
              <div class="row-main"><span class="muted" style="font-size:13px">${esc(k)}</span></div>
              <div class="row-end" style="font-size:14px">${esc(v)}</div>
            </div>`).join("")}` : ""}

        <div class="row-title" style="font-size:13px;margin:12px 0 6px">累計數據</div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">續約次數</span></div>
          <div class="row-end mono" style="font-weight:600">${student.renewalCount || 0}</div>
        </div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">累計已購</span></div>
          <div class="row-end mono" style="font-weight:600">${student.totalPurchased || 0} 堂</div>
        </div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">累計收費</span></div>
          <div class="row-end mono" style="font-weight:600">${money(paid)}</div>
        </div>
        <p class="hint">缺席與遲到都是從課程紀錄實算的，不是另外一組計數，所以跟上面那排一定對得起來。續約的每一筆明細在「編輯」裡。</p>
      </div>`,
    onMount: (root) => {
      root.addEventListener("click", (e) => {
        const t = e.target.closest("[data-detail-tab]");
        if (t) {
          e.preventDefault();
          const v = t.dataset.detailTab;
          root.querySelectorAll("[data-detail-tab]").forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.detailTab === v)));
          root.querySelectorAll("[data-panel]").forEach((p) => {
            p.hidden = p.dataset.panel !== v;
          });
          return;
        }
        // 這些按鈕在 .scrim 裡面，全域的 data-action 分派會跳過它們
        // （那是為了不讓表單裡的按鈕誤觸發頁面動作），所以自己接。
        const act = e.target.closest("[data-detail-action]");
        if (!act) return;
        e.preventDefault();
        const a = act.dataset.detailAction;
        // 收費那一列的編輯要先認出是哪一筆，closeSheet 之後 DOM 就沒了
        const payment = a === "edit-payment"
          ? (student.payments || []).find((p) => p.id === act.dataset.id)
          : null;
        if (a === "toggle-awaiting") {
          const marking = student.status !== "awaiting";
          student.status = marking ? "awaiting" : "active";
          student.updatedAt = new Date().toISOString();
          save(); render();
          closeSheet();
          studentDetailSheet(student);
          toast(marking
            ? `已標記 ${student.name} 課程結束待續約`
            : `${student.name} 回到一般在檔`);
          return;
        }
        // 封存就地做完並重開，不用跳出去再找回來
        if (a === "toggle-archive") {
          const archiving = student.status !== "archived";
          student.status = archiving ? "archived" : "active";
          student.updatedAt = new Date().toISOString();
          save(); render();
          closeSheet();
          studentDetailSheet(student);
          toast(archiving
            ? `已封存 ${student.name}・在「封存」那一頁找得到`
            : `${student.name} 已回到在檔名單`);
          return;
        }
        closeSheet();
        if (a === "renew") renewSheet(student);
        else if (a === "edit") studentSheet(student);
        else if (a === "adjust") adjustSessionsSheet(student);
        else if (a === "edit-payment" && payment) paymentSheet(student, payment);
      });
    },
  });
}

/**
 * 編輯學生頁面裡的續約紀錄（對應 iOS 的 RenewalHistorySectionView）。
 *
 * 抽成函式是因為刪掉一筆之後要就地重畫這一塊 —— 不能整張表單重開，
 * 那會把使用者其他還沒存的修改一起吃掉。
 */
/** 目前正在就地編輯的那筆續約紀錄 id（null＝沒有在編輯） */
let editingRenewalId = null;
/** editingRenewalId 等於這個值時，展開的是「新增一筆」的空白列 */
const NEW_RENEWAL = "new";
/**
 * 正在確認要不要刪的那筆續約 id。
 *
 * 刻意**不用 confirmSheet**：那會 openSheet，而 openSheet 會先關掉現在這張
 * 編輯學生表單，把其他還沒存的修改一起吃掉。所以確認就地長在那一列上。
 */
let confirmingDeleteId = null;

/**
 * 剛剛那筆續約「有加堂數、但沒加剩餘堂數」時要講的話。
 *
 * 2026-08-17 回報：「明明加了一堂，但是上面只顯示 15 堂」。
 * 補登（新增一筆預設就是補登）與改堂數都**刻意不動剩餘** —— 補的是歷史，
 * 三個月前買的課早就上完了，加回剩餘等於憑空多出課。規則是對的，
 * **但存完只說「已補上紀錄」，沒講剩餘沒變**，使用者當然覺得數字壞了。
 * 現在把話講出來，並且給一顆「他手上真的多了」的一鍵。
 * `{ sessions, remaining }`，null＝沒有話要說。
 */
let renewalRemainingNote = null;

/**
 * 改一筆續約紀錄的內容。
 *
 * 已購是所有續約堂數的累計，改了堂數就要補上差額。
 * 次數不變 —— 還是同一筆，只是內容改了。
 * 剩餘堂數與收費紀錄都不動：看不出這筆當初是不是補登的（補登本來就沒加過
 * 剩餘），收費也是各自獨立的一筆。
 *
 * 抽成函式是為了測得到 —— 原本這幾行埋在 DOM 事件處理器裡，
 * 而算錯就是已購堂數與業績一起歪掉。
 */
function applyRenewalEdit(student, record, patch) {
  const newSessions = Math.max(0, +patch.sessions || 0);
  student.totalPurchased = Math.max(0,
    (student.totalPurchased || 0) - (record.sessions || 0) + newSessions);
  // 同步收費日期時要比對「改之前的合約日」，所以先留一份
  const prevDate = record.date || "";
  record.date = patch.date || record.date;
  record.sessions = newSessions;
  // 這裡也吃得下單價 —— 存進去的一律是總額，理由跟 renewSheet 一樣：
  // 銷售統計的均價是「總額 ÷ 堂數」除出來的，業績抽成也是直接乘總額。
  const typed = Math.max(0, +patch.amount || 0);
  record.amount = patch.priceMode === "unit" ? typed * newSessions : typed;
  record.notes = patch.notes ?? record.notes;
  // 結轉只是說明「這一期有幾堂是上次留下來的」，不動剩餘堂數也不動累計已購
  if (patch.carryOver !== undefined) record.carryOver = Math.max(0, +patch.carryOver || 0);
  if (patch.addOn !== undefined) setRenewalAddOn(student, record, patch.addOn);
  applyRenewalExpiry(student, record, patch.expiry);
  applyPaymentLink(student, record, patch, prevDate);
  // 加購的日期與到期日綁在主約上：改加購那一列不作數（表單裡那格也是唯讀的），
  // 改主約則要把底下的加購一起帶走。
  if (record.addOn) {
    const main = mainContractOf(student, record);
    if (main) syncAddOnToMain(student, record, main);
  } else {
    syncAddOnsOfMain(student, record);
  }
  student.updatedAt = new Date().toISOString();
  return record;
}

/**
 * 收費那一頭：接上一筆現成的、或補一筆新的，然後看要不要同步金額與日期。
 *
 * 為什麼要能在這裡接：「同時更新收費紀錄」以前只有在**已經**掛著收費時
 * 才畫得出來，於是分開記的那筆錢永遠接不上 —— 使用者改了續約金額按儲存，
 * 收費不動、畫面上也沒有任何開關可以按（2026-08-11 回報的「編輯後收費紀錄
 * 沒有更新」就是這個）。要接得先去收費那一頁找到那筆錢再繞回來，
 * 而那是最不會被想到的一條路。
 *
 * 同步是**選擇性**的：接起來多半只是要把兩筆對上，金額本來就可能不同
 * （分期、訂金），無條件蓋掉會把真的收到多少改壞。
 */
/**
 * 把一筆續約紀錄改成加購（或改回主約）。
 *
 * 續約次數要跟著調 —— 那個數字的意思是「續約過幾次」，加購不是新的一期。
 * 堂數、金額、收費都不動：加購本來就是真的賣出去的堂數與收到的錢，
 * 只是它歸在主約底下，不另外算一期。
 *
 * 回傳有沒有真的變動過（沒變就不用跳提示）。
 */
function setRenewalAddOn(student, record, on) {
  if (!!on === !!record.addOn) return false;
  student.renewalCount = Math.max(0, (student.renewalCount || 0) + (on ? -1 : 1));
  record.addOn = !!on;
  if (on) {
    const main = mainContractOf(student, record);
    if (main) {
      // 原本記的日期留著，改回主約時要還得回去
      if (record.soldOn === undefined && (record.date || "") !== (main.date || "")) {
        record.soldOn = record.date || "";
      }
      record.mainId = main.id;
      syncAddOnToMain(student, record, main);
    }
  } else {
    // 改回獨立的一期：把當初記的日期還回去
    if (record.soldOn !== undefined) {
      const pinned = record.date || "";
      record.date = record.soldOn;
      for (const p of paymentsOfRenewal(student, record.id)) {
        if ((p.date || "") === pinned) p.date = record.date;
      }
    }
    delete record.soldOn;
    delete record.mainId;
  }
  student.updatedAt = new Date().toISOString();
  return true;
}

/**
 * 這筆加購綁在哪一份主約底下。
 *
 * 用 `mainId` 記住是哪一份，找不到才退回「排序上比它舊的第一份主約」
 * （舊資料沒有這個欄位）。**不能只靠排序**：加購的日期改成跟主約同一天之後，
 * 兩筆的先後只剩 createdAt 決定，先建主約還是先建加購會排出不同結果。
 */
function mainContractOf(student, record) {
  if (!record || !record.addOn) return null;
  const rs = renewalsOf(student);
  if (record.mainId) {
    const byId = rs.find((r) => r.id === record.mainId && !r.addOn);
    if (byId) return byId;
  }
  const i = rs.indexOf(record);
  if (i < 0) return null;
  // 匯入備份時 id 會重新產生，mainId 接不回去；日期又已經跟主約一樣，
  // 兩筆的先後只剩 createdAt。所以往舊的方向找不到就退回「最新的那份主約」。
  return rs.slice(i + 1).find((r) => !r.addOn) || rs.find((r) => !r.addOn) || null;
}

/** 掛在這份主約底下的加購 */
function addOnsOf(student, main) {
  if (!main || main.addOn) return [];
  return renewalsOf(student).filter((r) => r.addOn && mainContractOf(student, r) === main);
}

/**
 * 加購的合約日期與到期日**一律跟著主約**（2026-08-17 小春：「加購的合約日期
 * 什麼的都要綁在那個原本的約上面」）。
 *
 * 加購是主約底下加賣的小活動，不是新的一期 —— 它自己有一個日期的話，
 * 銷售統計會把它算到別的月份，到期日也會各講各的。
 * 掛在這筆加購底下、**日期本來跟它同一天**的收費要跟著搬（跟 v37 同一條規則：
 * 刻意分開填過的不要拉回去）。
 */
function syncAddOnToMain(student, record, main) {
  if (!record || !main) return false;
  let changed = false;
  const prevDate = record.date || "";
  if ((main.date || "") !== prevDate) {
    record.date = main.date || "";
    for (const p of paymentsOfRenewal(student, record.id)) {
      if ((p.date || "") === prevDate) p.date = record.date;
    }
    changed = true;
  }
  if ((main.expiry || "") !== (record.expiry || "")) {
    record.expiry = main.expiry || "";
    changed = true;
  }
  return changed;
}

/** 主約的日期或到期日改了，底下的加購要跟著走 */
function syncAddOnsOfMain(student, main) {
  let moved = 0;
  for (const r of addOnsOf(student, main)) {
    if (syncAddOnToMain(student, r, main)) moved++;
  }
  return moved;
}

/**
 * 這筆能不能歸到主約底下？
 *
 * 加購是「掛在某一份主約下面」的，所以底下一定要先有一份主約。
 * 最早的那筆（首購）底下沒有東西可掛，第一筆就是主約本身。
 */
function canBeAddOn(student, record) {
  const rs = renewalsOf(student);                 // 新的排前面
  const i = rs.indexOf(record);
  return i >= 0 && rs.slice(i + 1).some((r) => !r.addOn);
}

/**
 * 到期日記在那筆合約上；如果那是**最新的一筆**，學生現在的方案到期日也跟著改。
 *
 * 「方案到期日」是學生層級的（只有一個，代表他現在那份方案），但補歷史時每一份
 * 舊合約都有自己的到期日 —— 記在合約上才不會互相蓋掉。補一筆很舊的約不該把
 * 他現在的到期日改掉。
 */
function applyRenewalExpiry(student, record, expiry) {
  if (expiry === undefined || expiry === null || expiry === "") return;
  record.expiry = expiry;
  if (renewalsOf(student)[0] === record) student.expiry = expiry;
}

function applyPaymentLink(student, record, patch, prevDate = record.date || "") {
  if (patch.linkPaymentId) {
    // 只從「還沒對應的」裡面找 —— 已經掛在別筆續約底下的不搶，
    // 那會讓另一筆續約的收費憑空消失。
    const p = unlinkedPayments(student).find((x) => x.id === patch.linkPaymentId);
    if (p) p.renewalId = record.id;
  }
  if (patch.addPayment) {
    student.payments = student.payments || [];
    student.payments.push({
      id: uid(), renewalId: record.id, amount: record.amount || 0,
      date: record.date || today(), method: "cash", notes: "",
      createdAt: new Date().toISOString(),
    });
  }
  // 勾了才同步，而且只動掛在這筆續約底下的收費。堂數不用同步 ——
  // 收費那一列的堂數是即時從續約讀出來的，本來就會跟著變。
  if (patch.syncPayment) {
    for (const p of paymentsOfRenewal(student, record.id)) {
      p.amount = record.amount;
      // **收費日期只有本來就跟合約同一天時才跟著改。**
      // 這兩個日期是**故意**分開的：這個月簽約、下個月才轉帳很常見，
      // 業績留在簽約那個月、收入記在收到錢那個月。原本這裡無條件蓋成合約日，
      // 於是只是回頭改個金額，7/03 收到的錢就跳回 6/15，整筆收入換了一個月
      // （2026-08-11 回報「時間的紀錄會跳掉」）。
      // 判斷方式是比對**改之前**的合約日：本來同一天代表它們是一組的，
      // 本來就不同天代表使用者刻意分開過，不能自作主張拉回去。
      if ((p.date || "") === prevDate) p.date = record.date;
    }
  }
}

/**
 * 在續約紀錄那一塊直接補一筆。
 *
 * 為什麼需要：那一區以前只能改和刪。要補一筆漏掉的續約只有「續約」按鈕
 * 一條路，而使用者在紀錄清單裡找不到「新增」時，會去改舊的那一筆 ——
 * 改是同一筆，次數當然不會加，看起來就是「我增加了但還是續約一次」
 * （2026-08-11 回報）。
 *
 * 預設是**補登**（不加剩餘堂數）：會在這裡補資料的多半是在補歷史，
 * 那些課早就上完了，加回剩餘等於憑空多出堂數。真的是新成交的一筆，
 * 走「續約」按鈕比較順（那邊有方案、到期日與付款方式）。
 *
 * 次數只有在「本來就有紀錄」時才 +1：第一筆是首購，首購不算續約，
 * 跟 isFirstPurchase 的判斷（最早的那筆是首購）保持同一套說法。
 */
function addRenewalRecord(student, patch) {
  const sessions = Math.max(0, +patch.sessions || 0);
  const typed = Math.max(0, +patch.amount || 0);
  const hadAny = (student.renewals || []).length > 0;
  const record = {
    id: uid(), date: patch.date || today(), sessions,
    amount: patch.priceMode === "unit" ? typed * sessions : typed,
    // 上一期沒上完、結轉到這一期的堂數。只影響顯示，不加進 remaining。
    carryOver: Math.max(0, +patch.carryOver || 0),
    addOn: !!patch.addOn,
    notes: patch.notes || "", createdAt: new Date().toISOString(),
  };
  student.renewals = student.renewals || [];
  student.renewals.push(record);
  // 加購不算又續一次約
  if (hadAny && !patch.addOn) student.renewalCount = (student.renewalCount || 0) + 1;
  student.totalPurchased = Math.max(0, (student.totalPurchased || 0) + sessions);
  // 補登只補歷史，不動現況。理由同 renewSheet：三個月前買的 10 堂早就上完了。
  if (!patch.backfill) student.remaining = Math.max(0, (student.remaining || 0) + sessions);
  applyRenewalExpiry(student, record, patch.expiry);
  applyPaymentLink(student, record, patch);
  student.updatedAt = new Date().toISOString();
  return record;
}

/**
 * 套用「還開著的續約編輯列」，回傳被改的那筆續約（沒有開著就回 null）。
 *
 * 為什麼要抽出來：編輯列有自己的「儲存這筆」，但整張表單底下還有一顆「儲存」。
 * 使用者在編輯列填完金額之後按的往往是後者 —— 那是表單裡最顯眼、也最像
 * 「我改完了」的按鈕。原本那顆完全不看編輯列，於是輸入靜靜被丟掉、表單照樣
 * 關閉，看起來就是「改了金額但畫面跟收費都沒反應」（2026-08-09 回報）。
 *
 * 同一時間只會有一列展開，所以不必用 id 去找。
 */
function applyOpenRenewalRow(student, scope) {
  const row = scope.querySelector("[data-renewal-row]");
  if (!row) return null;
  const adding = row.dataset.renewalRow === NEW_RENEWAL;
  const rec = adding ? null
    : (student.renewals || []).find((x) => x.id === row.dataset.renewalRow);
  if (!adding && !rec) return null;
  const val = (n) => row.querySelector(`[name="${n}"]`)?.value ?? "";
  const on = (n) => {
    const box = row.querySelector(`[name="${n}"]`);
    return !!(box && box.checked);
  };
  const patch = {
    date: val("r_date"), sessions: val("r_sessions"),
    amount: val("r_amount"), notes: val("r_notes"),
    priceMode: val("r_priceMode"),
    // 欄位不在就整個不傳 —— 傳空字串會被當成 0，把既有的結轉抹掉
    ...(row.querySelector('[name="r_carryOver"]') ? { carryOver: val("r_carryOver") } : {}),
    ...(row.querySelector('[name="r_expiry"]') ? { expiry: val("r_expiry") } : {}),
    ...(row.querySelector('[name="r_addOn"]') ? { addOn: on("r_addOn") } : {}),
    syncPayment: on("r_syncPayment"),
    addPayment: on("r_addPayment"),
    linkPaymentId: val("r_linkPayment"),
  };
  // 空白列什麼都沒填就當作沒開過 —— 按外層「儲存」不該憑空長出一筆 0 堂的續約
  if (adding && !(+patch.sessions || 0) && !(+patch.amount || 0)) {
    editingRenewalId = null;
    return null;
  }
  // 日期沒填就不要存。預設今天是上一版的做法，結果整批補登的合約全掛在同一天。
  if (adding && !patch.date) {
    toast("請填合約日期——那筆是什麼時候的");
    return null;
  }
  const saved = adding
    ? addRenewalRecord(student, { ...patch, backfill: on("r_backfill") })
    : applyRenewalEdit(student, rec, patch);
  editingRenewalId = null;
  return saved;
}

/** 掛在這筆續約底下的收費紀錄（分期的話會有好幾筆） */
function paymentsOfRenewal(student, renewalId) {
  return (student.payments || []).filter((p) => p.renewalId && p.renewalId === renewalId);
}

/**
 * 還沒對應到任何續約的收費 —— 「把哪一筆收費接上來」那個下拉的來源。
 *
 * 指向已經被刪掉的續約的那種也算，那是**斷頭**不是已對應：留著那個 id
 * 收費列印不出堂數，卻又不會被當成可以接的對象，等於永遠接不回來。
 */
function unlinkedPayments(student) {
  const ids = new Set((student.renewals || []).map((r) => r.id));
  return (student.payments || []).filter((p) => !p.renewalId || !ids.has(p.renewalId));
}

/**
 * 改續約時，那筆收費要不要跟著改？
 *
 * 不能無條件同步：收費金額不一定等於續約金額 —— 分期或部分收款時
 * 一筆 $46,800 的續約底下可能掛著三筆 $1,300，硬同步會把它們全部
 * 改成 $46,800，資料反而爛掉。
 *
 * 所以只在「本來就對得起來」時預設打勾：剛好一筆收費、且金額與續約
 * 相同，代表它就是續約當下自動產生的那筆，跟著改才是使用者要的。
 */
function shouldSyncPaymentByDefault(student, record) {
  const hits = paymentsOfRenewal(student, record.id);
  return hits.length === 1 && (hits[0].amount || 0) === (record.amount || 0);
}

/**
 * 更新續約編輯列底下的換算提示，兩個數字同時看得到。
 * 「我剛剛填的是一堂還是全部」不該在按下儲存之後才想起來。
 */
function refreshRenewalHint(box) {
  const hint = box.querySelector("[data-r-price-hint]");
  if (!hint) return;
  const num = (n) => Math.max(0, +(box.querySelector(`[name="${n}"]`)?.value || 0));
  const n = num("r_sessions");
  const v = num("r_amount");
  const unit = (box.querySelector('[name="r_priceMode"]')?.value || "total") === "unit";
  if (!n || !v) { hint.textContent = "存進去的一律是總額。"; return; }
  hint.textContent = unit
    ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
    : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`;
}

/**
 * 刪掉一筆續約紀錄。次數與已購跟著回去，剩餘堂數不動（理由同上）。
 */
function removeRenewalRecord(student, record, { withPayments = false } = {}) {
  // 掛在底下的收費預設**留著**：錢收到就是收到，刪紀錄不等於沒收過。
  // 但那個 renewalId 一定要解掉，不能留著指向一筆已經不存在的續約 ——
  // 斷頭的收費印不出堂數，也不會被當成「還沒對應的收費」，於是永遠接不回去。
  //
  // 打錯字重記的情況要的是兩筆一起消失，所以也給「連收費一起刪」——
  // 不然畫面上會靜靜多出一筆孤兒收費（2026-08-11 就是這樣來的）。
  const orphans = paymentsOfRenewal(student, record.id);
  if (withPayments) {
    const ids = new Set(orphans.map((p) => p.id));
    student.payments = (student.payments || []).filter((p) => !ids.has(p.id));
  } else {
    for (const p of orphans) delete p.renewalId;
  }
  student.renewals = (student.renewals || []).filter((x) => x.id !== record.id);
  student.renewalCount = Math.max(0, (student.renewalCount || 0) - 1);
  student.totalPurchased = Math.max(0, (student.totalPurchased || 0) - (record.sessions || 0));
  student.updatedAt = new Date().toISOString();
  return orphans.length;
}

/**
 * 這位學生的續約與收費對不對得起來。
 *
 * 三種對不上，回傳的是「要講給人聽的東西」而不是布林值 —— 光說「有問題」
 * 沒有用，要說是哪幾筆、差多少、按哪裡修。
 *
 * 為什麼需要：補歷史的時候兩張清單很容易走鐘（刪掉續約、錢分開記、
 * 手動更正過次數），而畫面上原本什麼都不講，使用者只能自己數
 * （2026-08-11 回報「紀錄又對不上了」）。
 */
function renewalIssues(student) {
  const rs = renewalsOf(student);
  const issues = [];
  // 1. 次數 vs 筆數。第一筆是首購不算續約，所以正解是「筆數 − 1」。
  //    對不上的來源：手動更正過、或刪掉續約時次數沒跟著回去的舊資料。
  const expected = Math.max(0, rs.length - 1);
  const count = student.renewalCount || 0;
  if (rs.length && count !== expected) {
    issues.push({ kind: "count", expected, count,
      text: `續約次數寫 ${count} 次，但這裡有 ${rs.length} 筆紀錄（第一筆是首購，應該是 ${expected} 次）` });
  }
  // 2. 收費沒有對應的續約。錢在、但不知道是哪一次買的 ——
  //    續約金額改了它不會跟著動，對帳時也看不出這筆是什麼。
  const loose = unlinkedPayments(student);
  if (rs.length && loose.length) {
    issues.push({ kind: "payments", payments: loose,
      text: `${loose.length} 筆收費沒有對應的續約（合計 ${money(loose.reduce((a, p) => a + (p.amount || 0), 0))}）` });
  }
  // 3. 續約沒有收費。可能是還沒收到錢，也可能是刪掉重記時漏了。
  const unpaid = rs.filter((r) => !paymentsOfRenewal(student, r.id).length);
  if (unpaid.length) {
    issues.push({ kind: "renewals", renewals: unpaid,
      text: `${unpaid.length} 筆續約底下沒有收費紀錄（${unpaid.map((r) => r.date || "無日期").join("、")}）` });
  }
  return issues;
}

/** 對不上的地方就寫出來，能一鍵修的給按鈕 */
function renewalMismatchNotes(student) {
  const issues = renewalIssues(student);
  if (!issues.length) return "";
  return `
    <div class="note-box" style="margin:8px 0">
      <div style="font-weight:600;font-size:12.5px;margin-bottom:3px">紀錄有對不上的地方</div>
      <ul style="margin:0;padding-left:17px;font-size:12px;line-height:1.65">
        ${issues.map((i) => `<li>${esc(i.text)}${
          i.kind === "count"
            ? `　<button type="button" class="btn btn-sm" data-fix-count="${i.expected}">改成 ${i.expected} 次</button>`
            : ""}${
          i.kind === "payments" ? "，可以在「新增一筆」或那一筆的「編輯」裡接上來" : ""}</li>`).join("")}
      </ul>
    </div>`;
}

/**
 * 「已完成」與「進行中」各是多少，寫在續約紀錄的表頭底下。
 *
 * 試用者的原話：填了堂數與金額之後，「他會歸類成續約的部分是已經全部完成的堂數
 * 再加上這個合約的」；把進行中那筆刪掉，「已完成的課程數字和金額會正確，但是
 * 總購買金額還有堂數會少當前這個進行中合約」（2026-08-15）。
 * 兩個數本來就都要有 —— 缺的是把它們分開講，而不是逼人刪資料。
 */
function renewalSplitLine(student, rs) {
  const current = currentPackageRenewalIds(student);
  if (!rs.length || !current.size) return "";
  const inProgress = isPackageInProgress(student);
  const sum = (list) => ({
    count: list.length,
    sessions: list.reduce((a, r) => a + (r.sessions || 0), 0),
    amount: list.reduce((a, r) => a + (r.amount || 0), 0),
  });
  const now = sum(rs.filter((r) => current.has(r.id)));
  const done = sum(rs.filter((r) => !current.has(r.id)));
  // 只有一份合約時沒什麼好拆的
  if (!done.count) return "";
  const part = (label, v) => `${label} ${v.count} 筆・${v.sessions} 堂・${money(v.amount)}`;
  return `<p class="hint" style="margin:2px 0 8px">
    ${part("已上完的合約", done)}<br>
    ${part(inProgress ? "這一期（進行中）" : "這一期", now)}${
      inProgress ? `・剩 ${student.remaining} 堂` : ""}
  </p>`;
}

function renewalHistoryBlock(student) {
  const rs = renewalsOf(student);
  const sessions = rs.reduce((a, r) => a + (r.sessions || 0), 0);
  const amount = rs.reduce((a, r) => a + (r.amount || 0), 0);
  // 哪幾筆屬於還在上的這一期 —— 混在一起列的話，看不出「已完成」是多少
  const currentPackage = currentPackageRenewalIds(student);
  const isInProgress = isPackageInProgress(student);

  // 編輯狀態的那一列。就地換成輸入框，不另外開 sheet ——
  // openSheet 會先關掉現有的那張，等於把使用者在編輯學生表單裡
  // 其他還沒存的修改一起吃掉。
  const editRow = (r, adding = false) => `
    <div class="row" style="padding:8px 0;display:block" data-renewal-row="${adding ? NEW_RENEWAL : r.id}">
      ${adding ? `<div class="row-title" style="font-size:14px;margin-bottom:6px">新增一筆續約紀錄</div>` : ""}
      <div class="field-row">
        ${// 加購的日期跟著主約走，改這一格不會生效 —— 與其讓人填了才發現沒用，
          // 不如直接鎖起來並說清楚為什麼。
          (!adding && r.addOn && mainContractOf(student, r))
            ? fieldText("r_date", "日期（跟著主約）", r.date || "",
                { type: "date", disabled: true,
                  hint: `這是加購，日期與到期日都跟主約 ${mainContractOf(student, r).date || "（無日期）"} 一致。要改請改主約那一筆。` })
            : fieldText("r_date", adding ? "合約日期（必填）" : "日期", r.date || "",
                { type: "date", required: adding })}
        ${fieldText("r_sessions", "堂數", r.sessions || 0, { type: "number" })}
      </div>
      <div class="field-row">
        ${fieldText("r_carryOver", "上一期剩下的堂數", r.carryOver || 0, { type: "number",
          hint: "這一期有幾堂是上次結轉的。只影響顯示，不加到剩餘堂數。" })}
        ${// 補登舊合約時也要記得下那份合約的到期日 ——「續約」按鈕那張表一直都有
          // 「新的到期日」，這裡卻沒有，補登的人等於少了一格（2026-08-12 回報）。
          fieldText("r_expiry", "到期日", r.expiry || (adding ? "" : (student.expiry || "")),
            { type: "date", hint: adding ? "留白就不改學生目前的到期日" : "" })}
      </div>
      <div class="seg" style="max-width:260px;margin-bottom:8px">
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-r-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="r_priceMode" value="total">
      <div class="field-row">
        ${fieldText("r_amount", "總額", r.amount || 0, { type: "number" })}
        ${fieldText("r_notes", "備註", r.notes || "")}
      </div>
      <p class="hint">到期日在上面的「方案到期日」——那是整個方案的，不屬於某一筆續約。</p>
      <p class="hint" data-r-price-hint>${
        r.sessions ? `${money(r.amount || 0)} ÷ ${r.sessions} 堂 ＝ 每堂 ${money(Math.round((r.amount || 0) / r.sessions))}` : "存進去的一律是總額。"
      }</p>
      <div class="switch">
        <label for="f-r_addOn">這是加購活動（綁在主約底下）</label>
        <input id="f-r_addOn" name="r_addOn" type="checkbox" ${r.addOn ? "checked" : ""}>
      </div>
      ${adding ? `
        <div class="switch">
          <label for="f-r_backfill">補登以前的續約（不加剩餘堂數）</label>
          <input id="f-r_backfill" name="r_backfill" type="checkbox" checked>
        </div>
        <p class="hint">補歷史的課早就上完了。剛成交、堂數要真的加給學生就取消勾選。</p>
        <p class="hint"><strong>日期要填當初簽約的那一天</strong>——不填的話這筆業績會算到今天，
          銷售的月份就整個不準了。</p>` : ""}
      ${(() => {
        const linked = adding ? [] : paymentsOfRenewal(student, r.id);
        // 沒有掛任何收費時以前只印一句「去別頁自己接」，於是分開記的那筆錢
        // 永遠接不上：改了金額按儲存，收費不動、也沒有開關可以按。
        // 現在直接在這裡接得起來（沒有現成的就補一筆）。
        if (!linked.length) {
          const free = unlinkedPayments(student);
          return `
            ${free.length ? `
              ${fieldSelect("r_linkPayment", "把哪一筆收費接上來",
                  [["", "（先不接）"], ...free
                    .slice()
                    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
                    .map((p) => [p.id, `${p.date || "（無日期）"}・${money(p.amount || 0)}`])],
                  "", "接起來之後，那一列就會顯示這筆續約的堂數。")}
              <div class="switch">
                <label for="f-r_syncPayment">金額也一起改成上面填的</label>
                <input id="f-r_syncPayment" name="r_syncPayment" type="checkbox">
              </div>
              <p class="hint">預設不勾：分期或訂金時收到的金額本來就跟續約不同。</p>`
            : `<p class="hint">底下沒有掛收費，也沒有還沒對應的收費可以接。</p>`}
            <div class="switch">
              <label for="f-r_addPayment">同時新增一筆收費紀錄</label>
              <input id="f-r_addPayment" name="r_addPayment" type="checkbox">
            </div>
            <p class="hint">錢還沒記的話勾這個，用上面填的金額與日期建一筆（現金）。</p>`;
        }
        const on = shouldSyncPaymentByDefault(student, r);
        const sum = linked.reduce((a, p) => a + (p.amount || 0), 0);
        return `
        <div class="switch">
          <label for="f-r_syncPayment">同時更新收費紀錄</label>
          <input id="f-r_syncPayment" name="r_syncPayment" type="checkbox" ${on ? "checked" : ""}>
        </div>
        <p class="hint">${linked.length === 1
          ? (on
              ? `底下那筆 ${money(sum)} 的收費會跟著改金額。`
              : `底下那筆 ${money(sum)} 跟這裡的金額<strong>本來就不一樣</strong>（分期、訂金），所以沒預設勾。`)
          : `底下有 ${linked.length} 筆、合計 ${money(sum)}（像是分期）。勾了每一筆都會變成上面的金額，通常不是你要的。`}
          日期只有本來就跟合約同一天才會跟著動。</p>`;
      })()}
      <div style="display:flex;gap:6px;justify-content:flex-end">
        <button type="button" class="btn btn-sm" data-cancel-renewal="1">取消</button>
        <button type="button" class="btn btn-sm btn-primary"
                data-save-renewal="${adding ? NEW_RENEWAL : r.id}">${adding ? "新增這筆" : "儲存這筆"}</button>
      </div>
    </div>`;

  // 空白列：**日期不預設今天**。
  // 那個預設值正是「補完歷史之後整批合約掛在同一天」的來源（實例：37 位教練的
  // 資料裡有 23 筆全部落在補登當天，銷售的月份整個失真）。補紀錄的人本來就
  // 應該講出那筆是什麼時候的，留白逼他填，比事後一筆一筆修回來便宜太多。
  const blankRenewal = () => ({ id: NEW_RENEWAL, date: "", sessions: "", amount: "", notes: "" });

  // 刪除的就地確認。底下有收費時要問清楚錢怎麼辦 —— 只解除對應會留下
  // 一筆看不出來歷的孤兒收費，打錯重記的人要的其實是兩筆一起消失。
  const deleteRow = (r) => {
    const linked = paymentsOfRenewal(student, r.id);
    const sum = linked.reduce((a, p) => a + (p.amount || 0), 0);
    return `
    <div class="row" style="padding:8px 0;display:block" data-renewal-delete="${r.id}">
      <div class="row-title" style="font-size:14px">
        要刪掉 ${esc(r.date || "（無日期）")} 這筆嗎？<span class="muted" style="font-weight:400">${r.sessions || 0} 堂・${money(r.amount || 0)}</span>
      </div>
      <p class="hint" style="margin:4px 0 8px">次數與累計已購會跟著回去，<strong>剩餘堂數不動</strong>——看不出這筆當初是不是補登的，猜錯就是吃掉學生手上的課。${
        linked.length
          ? `底下掛著 ${linked.length} 筆收費、合計 ${money(sum)}。`
          : "底下沒有掛收費。"}</p>
      <div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">
        <button type="button" class="btn btn-sm" data-cancel-del="1">取消</button>
        <button type="button" class="btn btn-sm btn-danger" data-do-del-renewal="${r.id}">${
          linked.length ? "只刪續約，錢留著" : "刪除"}</button>
        ${linked.length
          ? `<button type="button" class="btn btn-sm btn-danger" data-do-del-renewal="${r.id}" data-with-payments="1">連 ${linked.length} 筆收費一起刪</button>`
          : ""}
      </div>
    </div>`;
  };

  const showRow = (r) => `
    <div class="row renewal-row" style="padding:8px 0">
      <div class="row-main">
        <div class="row-title"><span class="r-date">${esc(r.date || "（無日期）")}</span>
          ${currentPackage.has(r.id)
            ? `<span class="pill ${isInProgress ? "pill-good" : "pill-mute"}">${isInProgress ? "這一期・進行中" : "這一期"}</span>`
            : ""}
          ${r.addOn ? '<span class="pill pill-info">加購・跟著主約</span>' : ""}
          ${isFirstPurchase(student, r) ? '<span class="pill pill-mute">首購</span>' : ""}
          ${paymentsOfRenewal(student, r.id).length === 0 ? '<span class="pill pill-warn">沒有收費紀錄</span>' : ""}
        </div>
        ${r.soldOn && r.soldOn !== r.date
          ? `<div class="row-sub">原本記 ${esc(r.soldOn)}，歸到主約後跟著主約的日期</div>` : ""}
        ${r.notes ? `<div class="row-sub">${esc(r.notes)}</div>` : ""}
      </div>
      <div class="r-figs">
        <div class="mono r-sessions">${r.sessions || 0} 堂</div>
        ${// 結轉自己一行。跟堂數擠在一起時，「2 堂＋結轉 20 ＝ 22」會折行疊到金額上。
          (r.carryOver || 0) > 0
            ? `<div class="r-carry">＋結轉 ${r.carryOver} ＝ ${(r.sessions || 0) + r.carryOver} 堂</div>`
            : ""}
        <div class="r-amount">${money(r.amount || 0)}</div>
      </div>
      <div class="r-acts">
        ${r.addOn
          ? `<button type="button" class="btn btn-sm" data-set-addon="${r.id}" data-on="0"
                     title="改回獨立的一期合約，續約次數 +1">改回主約</button>`
          : canBeAddOn(student, r)
          ? `<button type="button" class="btn btn-sm" data-set-addon="${r.id}" data-on="1"
                     title="這筆其實是綁在下面那份主約的小活動，堂數併進同一期算，續約次數 −1">歸到主約</button>`
          : ""}
        <button type="button" class="btn btn-sm" data-edit-renewal="${r.id}"
                title="修改這筆續約紀錄">編輯</button>
        <button type="button" class="btn btn-sm btn-danger" data-del-renewal="${r.id}"
                title="刪除這筆續約紀錄">刪除</button>
      </div>
    </div>`;

  const adding = editingRenewalId === NEW_RENEWAL;

  return `
    <div class="row-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span>續約紀錄</span>
      ${rs.length ? (() => {
        const linked = rs.filter((r) => paymentsOfRenewal(student, r.id).length).length;
        // 這裡以前寫「${rs.length} 次」，但那是**筆數**：第一筆是首購，不算續約。
        // 列表上的「續約 N 次」少一，同一個「次」字在兩個地方是兩個數，
        // 使用者當然覺得對不上（2026-08-11 回報）。筆數與次數分開講。
        return `<span class="muted" style="font-size:12px;font-weight:400">共 ${rs.length} 筆・續約 ${student.renewalCount || 0} 次・${sessions} 堂・累計 ${money(amount)}${
          linked < rs.length ? `・<strong style="color:var(--warn)">${rs.length - linked} 筆沒有收費</strong>` : ""}</span>`;
      })() : ""}
      ${adding ? "" : `<button type="button" class="btn btn-sm" data-add-renewal="1">新增一筆</button>`}
    </div>
    ${renewalSplitLine(student, rs)}
    ${renewalRemainingNote ? `
      <div class="note-box" style="margin:4px 0 10px">
        這筆多了 <strong>${renewalRemainingNote.sessions} 堂</strong>，但
        <strong>剩餘堂數沒有變</strong>（還是 ${renewalRemainingNote.remaining} 堂）——
        補登補的是歷史，那些課多半早就上完了，加回剩餘會憑空多出課。
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
          <button type="button" class="btn btn-sm btn-primary"
                  data-add-remaining="${renewalRemainingNote.sessions}">
            他手上真的多了 ${renewalRemainingNote.sessions} 堂，加進去</button>
          <button type="button" class="btn btn-sm" data-dismiss-remaining="1">知道了</button>
        </div>
      </div>` : ""}
    ${adding ? editRow(blankRenewal(), true) : ""}
    ${rs.length ? rs.map((r) => (r.id === confirmingDeleteId ? deleteRow(r)
                                : r.id === editingRenewalId ? editRow(r) : showRow(r))).join("")
                : (adding ? "" : `<p class="empty" style="padding:16px 0">尚無續約紀錄。剛成交的按上面的「續約」，補以前漏掉的按「新增一筆」。</p>`)}
    ${renewalMismatchNotes(student)}
    <details class="help">
      <summary>續約紀錄怎麼算</summary>
      <p class="hint">
        <strong>新增一筆</strong>＝補漏掉的續約：次數 +1（第一筆是首購，不加），堂數進累計已購與銷售統計。<br>
        <strong>編輯</strong>＝改同一筆，次數不動。改堂數連動累計已購，改金額連動銷售統計。<br>
        <strong>剩餘堂數兩邊都不會動</strong>——看不出這筆當初是不是補登的，猜錯就是吃掉學生手上的課，要改請用「調整剩餘堂數」。
      </p>
    </details>`;
}

function studentSheet(existing) {
  const s = existing || newStudent();
  const fields = S.settings.customFields;
  // 上次關掉時可能停在某筆的編輯或刪除確認狀態，重開要回到乾淨的樣子
  editingRenewalId = null;
  confirmingDeleteId = null;
  renewalRemainingNote = null;
  openSheet({
    title: existing ? "編輯學生" : "新增學生",
    body: `
      ${fieldText("name", "姓名", s.name, { required: true, placeholder: "王小明" })}
      <div class="field-row">
        ${fieldText("phone", "電話", s.phone, { type: "tel" })}
        ${fieldText("rate", "每堂費用", s.rate || "", { type: "number", hint: "算收入與抽成用" })}
      </div>
      <div class="field-row">
        <input type="hidden" name="currentSessionsInitial" value="${currentPackageSessions(s)}">
        ${fieldText("currentSessions", "本期購買堂數", currentPackageSessions(s), {
          type: "number",
          hint: renewalsOf(s).length
            ? `累計已購 ${s.totalPurchased || 0} 堂。改這格等於改最近一筆續約紀錄，累計會自動跟著調。`
            : `還沒有續約紀錄，這格就是他目前的合約。`,
        })}
        ${fieldText("remaining", "剩餘堂數", s.remaining || 0, { type: "number" })}
      </div>
      ${existing ? "" : `
        ${fieldText("purchaseDate", "購買日期", today(), { type: "date" })}
        <p class="hint" data-purchase-hint></p>`}
      <div class="field-row">
        ${fieldText("expiry", "方案到期日", s.expiry, { type: "date" })}
        ${fieldSelect("acquisition", "客戶來源", Object.entries(ACQUISITION), s.acquisition)}
      </div>
      <div class="field-row">
        ${fieldSelect("status", "狀態",
            [["active", "在檔"], ["paused", "暫停"], ["awaiting", "課程結束待續約"], ["archived", "封存"]],
            s.status)}
        ${fieldText("renewalCount", "續約次數", s.renewalCount || 0,
            { type: "number", hint: "按「續約」會自動加一，這裡只用來更正" })}
      </div>
      <div class="switch">
        <label for="f-mayNotRenew">標記為可能不續約</label>
        <input id="f-mayNotRenew" name="mayNotRenew" type="checkbox" ${s.mayNotRenew ? "checked" : ""}>
      </div>
      <div class="divider"></div>
      <label class="field-label">代表色</label>
      <div class="swatches" data-color-picker>
        ${STUDENT_COLORS.map((c) => `
          <button type="button" class="swatch ${s.color === c ? "on" : ""}"
                  data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
      </div>
      <input type="hidden" name="color" value="${esc(s.color || STUDENT_COLORS[0])}">

      ${allTags().length ? `
        <label class="field-label" style="margin-top:12px">標籤</label>
        <div class="tag-filter" data-tag-picker>
          ${allTags().map((t) => `
            <button type="button" class="tag-chip ${(s.tags || []).includes(t.id) ? "on" : ""}"
                    data-tag="${t.id}" style="--tag:${esc(t.color)}">
              <span class="tag-dot"></span>${esc(t.name)}
            </button>`).join("")}
        </div>
        <input type="hidden" name="tags" value="${esc((s.tags || []).join(","))}">
        <p class="hint">到「設定 → 顏色標籤」可以新增、改名或換顏色。</p>` : ""}

      <div class="divider"></div>
      <p class="hint" style="margin:0 0 10px">自訂欄位（填了才會出現在客群分析）</p>
      ${fields.map((f) => {
          const spec = fieldSpec(f);
          const v = s.custom?.[f] || "";
          if (spec.type === "select" && spec.options.length) {
            // 選項裡沒有的舊值要留著，不然改選項會把已經填好的值吃掉
            const opts = spec.options.includes(v) || !v
              ? spec.options : [...spec.options, v];
            return fieldSelect("cf_" + f, f, [["", "（未選擇）"], ...opts.map((o) => [o, o])], v);
          }
          return fieldText("cf_" + f, f, v, { type: spec.type === "select" ? "text" : spec.type });
        }).join("")}
      ${fields.length ? "" : `<p class="hint">還沒有自訂欄位，可以到「設定」新增。</p>`}
      <div class="field">
        <label for="f-notes">備註</label>
        <textarea id="f-notes" name="notes">${esc(s.notes)}</textarea>
      </div>
      ${existing ? `
        <div class="divider"></div>
        <div data-renewal-history>${renewalHistoryBlock(s)}</div>`
      : `
        <div class="divider"></div>
        <div class="switch">
          <label for="f-firstPayment">同時建立首次收費紀錄</label>
          <input id="f-firstPayment" name="firstPayment" type="checkbox" checked>
        </div>
        <p class="hint">金額用「每堂費用 × 購買堂數」算。這筆錢如果已經在別的地方記過了就取消勾選。<br>
        首購一定會留下一筆續約紀錄（不算進「續約次數」）——不然這筆生意不會出現在銷售統計與業績抽成裡。</p>`}`,
    extraFoot: existing ? `<button class="btn btn-danger btn-sm" type="button" data-action="delete-student" data-id="${s.id}">刪除</button>` : "",
    onConfirm: (form) => {
      const name = form.elements.name.value.trim();
      if (!name) { toast("請填學生姓名"); return false; }

      // 續約紀錄的編輯列還開著就先幫他存 —— 他填了數字又按了整張表單的
      // 「儲存」，意圖很清楚。原本這些輸入會靜靜被丟掉。
      // **一定要在下面「本期購買堂數」那段之前做**：那段是拿
      // currentSessionsInitial 比差額的，套用完不更新的話會用開啟表單當下的
      // 舊值再算一次，等於把剛剛存進去的改回去。
      const remainingBefore = s.remaining || 0;
      const countBefore = s.renewalCount || 0;
      const savedRenewal = applyOpenRenewalRow(s, form);
      // 新增一筆「不是補登」的續約會加剩餘堂數，而下面那行是拿表單裡的
      // 「剩餘堂數」直接覆蓋 —— 那一格還停在開啟表單當下的值，會把剛加的
      // 堂數靜靜寫回去。所以記下差額，等一下加回來（使用者同時手改那一格
      // 也還是對的：他填的數字 ＋ 這次續約加的堂數）。
      const remainingDelta = (s.remaining || 0) - remainingBefore;
      // 「續約次數」那一格同理：它是可以手動更正的欄位，值停在開啟表單當下的
      // 數字，直接覆蓋會把新增的那一筆加的次數靜靜抹掉（症狀就是使用者說的
      // 「我增加了但還是顯示續約一次」）。
      const countDelta = (s.renewalCount || 0) - countBefore;
      if (savedRenewal) {
        if (form.elements.currentSessions) {
          form.elements.currentSessions.value = currentPackageSessions(s);
        }
        if (form.elements.currentSessionsInitial) {
          form.elements.currentSessionsInitial.value = currentPackageSessions(s);
        }
      }

      s.name = name;
      s.phone = form.elements.phone.value.trim();
      s.rate = +form.elements.rate.value || 0;
      s.remaining = Math.max(0, (+form.elements.remaining.value || 0) + remainingDelta);
      // 「本期購買堂數」改的是最近一筆續約的堂數，累計自動跟著調差額。
      // 不能直接蓋掉 totalPurchased —— 那是所有續約的總和，
      // 銷售統計與客群分析都在用，蓋掉就整組錯。
      const typedCurrent = Math.max(0, +form.elements.currentSessions.value || 0);
      // 跟「開啟表單時的值」比，不是跟續約紀錄現在的值比。
      // 使用者可能在下面的續約紀錄那邊改過同一筆，這格若沒被動過就不該
      // 插手 —— 拿開啟當下的舊值再算一次差額，等於把那個修改打回去。
      const initialCurrent = Math.max(0, +form.elements.currentSessionsInitial.value || 0);
      const latestRenewal = renewalsOf(s)[0];
      if (latestRenewal) {
        if (typedCurrent !== initialCurrent && typedCurrent !== (latestRenewal.sessions || 0)) {
          applyRenewalEdit(s, latestRenewal, {
            date: latestRenewal.date, sessions: typedCurrent,
            amount: latestRenewal.amount, notes: latestRenewal.notes,
          });
        }
      } else if (typedCurrent !== initialCurrent) {
        // 還沒有續約紀錄的人，那筆購買本身就是他現在的合約
        s.totalPurchased = typedCurrent;
      }

      // 新學生的首購也要留一筆續約紀錄，否則這筆生意不會出現在銷售統計與
      // 業績抽成裡（那兩個的資料來源都是 renewals）。iOS 的 StudentFormView
      // 本來就會建，網頁版一直沒有，等於第一筆永遠漏算。
      //
      // 刻意不動 renewalCount：那個數字的意思是「續約過幾次」，
      // 第一次買不算續約。兩邊一致。
      if (!existing && typedCurrent > 0) {
        const firstAmount = Math.max(0, (s.rate || 0) * typedCurrent);
        const rid = uid();
        const stamp = new Date().toISOString();
        // **購買日期要看得到、改得動。**
        // 這一筆首購合約以前是拿 today() 偷偷建的，於是把舊學生一位一位建進來
        // 的人，所有合約都掛在建檔那天 —— 銷售的月份整個失真，而畫面上從頭到尾
        // 沒出現過任何日期（2026-08-12 實際 key 一遍才發現，那才是真正的來源）。
        const bought = (form.elements.purchaseDate && form.elements.purchaseDate.value) || today();
        // 備註留空：「首次購買」是由誰最早推導出來的，不寫死。
        // 之後補了更早的續約，那筆才是首購。
        s.renewals.push({ id: rid, date: bought, sessions: typedCurrent,
                          amount: firstAmount, carryOver: 0, notes: "", createdAt: stamp });
        if (form.elements.firstPayment.checked) {
          s.payments.push({ id: uid(), renewalId: rid, amount: firstAmount,
                            date: bought, method: "cash", notes: "",
                            createdAt: stamp });
        }
      }
      s.expiry = form.elements.expiry.value;
      s.acquisition = form.elements.acquisition.value;
      s.status = form.elements.status.value;
      // 只改次數，不碰 s.renewals。那個陣列是銷售統計的資料來源，
      // 在這裡補一筆假的續約紀錄會讓業績憑空多出一筆金額。
      // 所以這格是「更正數字」，真的成交要走「續約」按鈕。
      s.renewalCount = Math.max(0, (+form.elements.renewalCount.value || 0) + countDelta);
      s.mayNotRenew = form.elements.mayNotRenew.checked;
      s.notes = form.elements.notes.value;
      s.color = form.elements.color.value || s.color;
      // 設定裡已經刪掉的標籤不要再寫回去
      s.tags = form.elements.tags
        ? form.elements.tags.value.split(",").filter((id) => id && tagById(id))
        : (s.tags || []);
      s.custom = { ...s.custom };
      for (const f of fields) {
        const v = form.elements["cf_" + f].value.trim();
        if (v) s.custom[f] = v; else delete s.custom[f];
      }
      s.updatedAt = new Date().toISOString();
      if (!existing) S.students.push(s);
      save(); render();
      // 連編輯列一起存了要講出來，不然使用者不知道那一列也生效了
      toast(savedRenewal
            ? `已更新學生資料，含 ${savedRenewal.date} 的續約紀錄`
            : (existing ? "已更新學生資料" : `已新增 ${s.name}`));
    },
    onMount: (root) => {
      // 剩餘比購買少，代表他早就上過課了 —— 那筆合約一定不是今天買的。
      // 一位一位把舊學生建進來的人最容易在這裡把日期留成今天，
      // 而那一筆會直接變成「這個月的業績」。
      const purchaseHint = root.querySelector("[data-purchase-hint]");
      const boughtEl = root.querySelector('[name="currentSessions"]');
      const remainEl = root.querySelector('[name="remaining"]');
      const dateEl = root.querySelector('[name="purchaseDate"]');
      const refreshPurchase = () => {
        if (!purchaseHint || !boughtEl || !remainEl || !dateEl) return;
        const bought = +boughtEl.value || 0, left = +remainEl.value || 0;
        const used = bought - left;
        purchaseHint.innerHTML = used > 0 && dateEl.value === today()
          ? `<strong style="color:var(--warn)">他已經上掉 ${used} 堂了，這份合約應該不是今天買的。</strong>`
            + `日期留成今天的話，這筆業績會算進這個月。`
          : "當初買這份合約的日期。銷售統計與業績都照這個日期分月。";
      };
      root.addEventListener("input", refreshPurchase);
      root.addEventListener("change", refreshPurchase);
      refreshPurchase();

      // 代表色
      const picker = root.querySelector("[data-color-picker]");
      const colorInput = root.querySelector('[name="color"]');
      if (picker && colorInput) {
        picker.addEventListener("click", (e) => {
          const btn = e.target.closest(".swatch");
          if (!btn) return;
          e.preventDefault();
          colorInput.value = btn.dataset.color;
          picker.querySelectorAll(".swatch").forEach((x) => x.classList.remove("on"));
          btn.classList.add("on");
        });
      }

      // 標籤（可複選）
      const tagPicker = root.querySelector("[data-tag-picker]");
      const tagInput = root.querySelector('[name="tags"]');
      if (tagPicker && tagInput) {
        tagPicker.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-tag]");
          if (!btn) return;
          e.preventDefault();
          btn.classList.toggle("on");
          tagInput.value = [...tagPicker.querySelectorAll(".tag-chip.on")]
            .map((x) => x.dataset.tag).join(",");
        });
      }

      // 刪除單筆續約紀錄。跟 iOS 一樣是立即生效的動作，不等整張表單按儲存，
      // 所以只重畫這一塊，其他欄位還沒存的修改要留著。
      const histBox = root.querySelector("[data-renewal-history]");
      if (histBox) {
        const redraw = () => { histBox.innerHTML = renewalHistoryBlock(s); };

        // 在下面改動續約紀錄之後，上面那格「本期購買堂數」要跟著更新。
        // 不然它會停在開啟表單當下的舊值，按儲存時再用那個舊值算一次差額，
        // 等於把剛剛在下面做的修改整個打回去。
        const syncCurrentField = () => {
          const el = root.querySelector('[name="currentSessions"]');
          const init = root.querySelector('[name="currentSessionsInitial"]');
          if (el) el.value = currentPackageSessions(s);
          if (init) init.value = currentPackageSessions(s);
          const box = el && el.closest(".field");
          const hint = box && box.querySelector(".hint");
          if (hint) {
            hint.textContent = renewalsOf(s).length
              ? `累計已購 ${s.totalPurchased || 0} 堂。改這格等於改最近一筆續約紀錄，累計會自動跟著調。`
              : "還沒有續約紀錄，這格就是他目前的合約。";
          }
        };

        // 編輯列是 redraw 出來的，沒辦法在掛載時綁 input，所以用委派。
        histBox.addEventListener("input", (e) => {
          const box = e.target.closest("[data-renewal-row]");
          if (box) refreshRenewalHint(box);
        });

        histBox.addEventListener("click", (e) => {
          // 「改成 N 次」：以紀錄為準把次數修回去。順手把表單那一格也改掉，
          // 不然按下表單的「儲存」時舊值又會蓋回來。
          const fix = e.target.closest("[data-fix-count]");
          if (fix) {
            e.preventDefault();
            s.renewalCount = Math.max(0, +fix.dataset.fixCount || 0);
            const cnt = root.querySelector('[name="renewalCount"]');
            if (cnt) cnt.value = s.renewalCount;
            s.updatedAt = new Date().toISOString();
            save(); render(); redraw();
            toast(`續約次數改成 ${s.renewalCount} 次`);
            return;
          }

          // 一鍵把分開建的那筆改成加購（或改回來）。以前只能進編輯列勾開關，
          // 而要對付的正是「以前每個小活動都另外建一筆」的舊資料，一筆一筆
          // 進編輯列太慢了。
          const mark = e.target.closest("[data-set-addon]");
          if (mark) {
            e.preventDefault();
            const r = (s.renewals || []).find((x) => x.id === mark.dataset.setAddon);
            if (!r || !setRenewalAddOn(s, r, mark.dataset.on === "1")) return;
            const cnt = root.querySelector('[name="renewalCount"]');
            if (cnt) cnt.value = s.renewalCount || 0;
            save(); render(); redraw(); syncCurrentField();
            toast(r.addOn
              ? `${r.date} 的 ${r.sessions || 0} 堂已歸到主約底下（續約 ${s.renewalCount || 0} 次）`
              : `${r.date} 的 ${r.sessions || 0} 堂改回獨立一期（續約 ${s.renewalCount || 0} 次）`);
            return;
          }

          // 補一筆漏掉的續約。展開的是同一種編輯列，只是還沒有對應的紀錄。
          // 「他手上真的多了 N 堂」：把剛剛補的堂數也加到剩餘
          const addRem = e.target.closest("[data-add-remaining]");
          if (addRem) {
            e.preventDefault();
            const n = Math.max(0, +addRem.dataset.addRemaining || 0);
            s.remaining = Math.max(0, (s.remaining || 0) + n);
            // 表單那一格也要跟上，不然按表單底下的「儲存」會用舊值蓋回去
            const rem = root.querySelector('[name="remaining"]');
            if (rem) rem.value = s.remaining;
            renewalRemainingNote = null;
            save(); render(); redraw();
            toast(`剩餘堂數改成 ${s.remaining} 堂`);
            return;
          }
          if (e.target.closest("[data-dismiss-remaining]")) {
            e.preventDefault();
            renewalRemainingNote = null;
            redraw();
            return;
          }
          if (e.target.closest("[data-add-renewal]")) {
            e.preventDefault();
            editingRenewalId = NEW_RENEWAL;
            redraw();
            return;
          }

          // 進入編輯：只換那一列的樣子，其他欄位的未存修改不受影響
          const edit = e.target.closest("[data-edit-renewal]");
          if (edit) {
            e.preventDefault();
            editingRenewalId = edit.dataset.editRenewal;
            redraw();
            return;
          }

          if (e.target.closest("[data-cancel-renewal]")) {
            e.preventDefault();
            editingRenewalId = null;
            redraw();
            return;
          }

          // 總額／單價切換。刻意「不」換算欄位裡已經填的數字 ——
          // 使用者可能是先打了數字才發現模式選錯，幫他乘除反而會把
          // 原本正確的輸入改壞。下面的提示會同時顯示兩個數字，
          // 按下儲存之前就看得出來對不對。
          const pm = e.target.closest("[data-r-price-mode]");
          if (pm) {
            e.preventDefault();
            const box = pm.closest("[data-renewal-row]");
            if (!box) return;
            const mode = pm.dataset.rPriceMode;
            box.querySelector('[name="r_priceMode"]').value = mode;
            box.querySelectorAll("[data-r-price-mode]").forEach((b) =>
              b.setAttribute("aria-pressed", String(b.dataset.rPriceMode === mode)));
            const lab = box.querySelector('label[for="f-r_amount"]');
            if (lab) lab.textContent = mode === "unit" ? "每堂單價" : "總額";
            refreshRenewalHint(box);
            return;
          }

          const saveBtn = e.target.closest("[data-save-renewal]");
          if (saveBtn) {
            e.preventDefault();
            const adding = saveBtn.dataset.saveRenewal === NEW_RENEWAL;
            const before = s.remaining || 0;
            const purchasedBefore = s.totalPurchased || 0;
            const countBefore = s.renewalCount || 0;
            const rec = applyOpenRenewalRow(s, histBox);
            if (!rec) {
              if (adding) { toast("堂數或金額至少要填一個"); }
              return;
            }
            // 剩餘堂數與續約次數真的變了，就把表單那兩格也帶上去 —— 不然
            // 使用者接著按表單底下的「儲存」，那兩格的舊值會把剛剛加的
            // 堂數與次數寫回去（表單那一格是可以手動更正的欄位）。
            if ((s.remaining || 0) !== before) {
              const rem = root.querySelector('[name="remaining"]');
              if (rem) rem.value = s.remaining || 0;
            }
            if ((s.renewalCount || 0) !== countBefore) {
              const cnt = root.querySelector('[name="renewalCount"]');
              if (cnt) cnt.value = s.renewalCount || 0;
            }
            // 堂數多了、剩餘卻沒動時要講出來（補登與改堂數都刻意不動剩餘）
            const added = (s.totalPurchased || 0) - purchasedBefore;
            renewalRemainingNote = (added > 0 && (s.remaining || 0) === before)
              ? { sessions: added, remaining: s.remaining || 0 }
              : null;
            save(); render(); redraw(); syncCurrentField();
            const what = adding ? `已補上 ${rec.date} 的續約紀錄` : `已更新 ${rec.date} 的續約紀錄`;
            toast(renewalRemainingNote
              ? `${what}・剩餘堂數不變（仍 ${s.remaining || 0} 堂）`
              : ((s.remaining || 0) !== before
                  ? `${what}・剩餘堂數改成 ${s.remaining || 0} 堂`
                  : what));
            return;
          }

          // 按「刪除」先就地問一次（不開 sheet，開了會吃掉表單其他未存的修改）
          const btn = e.target.closest("[data-del-renewal]");
          if (btn) {
            e.preventDefault();
            confirmingDeleteId = btn.dataset.delRenewal;
            editingRenewalId = null;
            redraw();
            return;
          }

          if (e.target.closest("[data-cancel-del]")) {
            e.preventDefault();
            confirmingDeleteId = null;
            redraw();
            return;
          }

          const doDel = e.target.closest("[data-do-del-renewal]");
          if (!doDel) return;
          e.preventDefault();
          const r = (s.renewals || []).find((x) => x.id === doDel.dataset.doDelRenewal);
          if (!r) return;
          const withPayments = doDel.dataset.withPayments === "1";
          const freed = removeRenewalRecord(s, r, { withPayments });
          confirmingDeleteId = null;
          editingRenewalId = null;
          const cnt = root.querySelector('[name="renewalCount"]');
          if (cnt) cnt.value = s.renewalCount || 0;
          save(); render(); redraw(); syncCurrentField();
          // 錢怎麼處理的要講出來 —— 不然對帳時會以為收費也一起沒了（或還在）
          toast(!freed ? `已刪除 ${r.date} 的續約紀錄`
            : withPayments ? `已刪除 ${r.date} 的續約紀錄與底下 ${freed} 筆收費`
            : `已刪除 ${r.date} 的續約紀錄，底下 ${freed} 筆收費留著（已解除對應）`);
        });
      }

      root.addEventListener("click", (e) => {
        const del = e.target.closest('[data-action="delete-student"]');
        if (!del) return;
        closeSheet();
        // 先數清楚會動到什麼，講出來再刪 —— 共同課會影響到別人
        const own = S.lessons.filter((l) => l.studentId === s.id).length;
        const shared = S.lessons.filter((l) => l.partnerId === s.id && l.studentId !== s.id).length;
        confirmSheet("刪除學生",
          `會一併刪掉 ${esc(s.name)} 的收費與續約紀錄${own ? `，以及他的 ${own} 堂課` : ""}。無法復原。`
          + (shared ? `<br>另外有 ${shared} 堂是<strong>別人的共同課</strong>，那幾堂會留著，只把他從課上拿掉。` : ""),
          () => {
            const { removed, detached, refunded } = removeStudentEverywhere(s);
            save(); render();
            toast(`已刪除${removed ? `，含 ${removed} 堂課` : ""}`
              + (detached ? `，${detached} 堂共同課留給對方` : "")
              + (refunded ? `，退還對方 ${refunded} 堂` : ""));
          }, "刪除");
      });
    },
  });
}

/**
 * 手動調整剩餘堂數。
 * 系統算錯、線下補課、送一堂，這些都得手動調。
 * 刻意「不」動已購堂數：已購是賣出去的量，銷售統計要用，
 * 不能因為送人一堂就讓業績跟著變多。
 */
function adjustSessionsSheet(student) {
  const before = student.remaining || 0;
  openSheet({
    title: "調整剩餘堂數",
    confirmLabel: "儲存",
    body: `
      <p style="font-weight:650;margin-bottom:2px">${esc(student.name)}</p>
      <p class="hint" style="margin-bottom:12px">目前剩 ${before} 堂．已購 ${student.totalPurchased || 0} 堂</p>
      ${fieldText("remaining", "改成", before, { type: "number" })}
      <div class="quick-steps">
        ${[-1, 1, 5, 10].map((n) => `
          <button type="button" class="btn btn-sm" data-step="${n}">${n > 0 ? "+" + n : n}</button>`).join("")}
      </div>
      ${fieldText("reason", "原因（選填）", "", { placeholder: "例如：線下補一堂、系統算錯" })}
      <p class="hint">只改剩餘堂數，已購 ${student.totalPurchased || 0} 堂不變，銷售統計不受影響。要記錄新買的堂數請用「續約」。</p>`,
    onConfirm: (form) => {
      const target = Math.max(0, +form.elements.remaining.value || 0);
      if (target === before) { toast("沒有變動"); return false; }
      student.remaining = target;

      const reason = form.elements.reason.value.trim();
      const stamp = `［${today()}］剩餘堂數 ${before} → ${target}` + (reason ? `：${reason}` : "");
      student.notes = student.notes ? `${student.notes}\n${stamp}` : stamp;
      student.updatedAt = new Date().toISOString();

      save(); render();
      toast(`已改為剩 ${target} 堂`);
    },
    onMount: (root) => {
      const input = root.querySelector('[name="remaining"]');
      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-step]");
        if (!btn || !input) return;
        e.preventDefault();
        input.value = Math.max(0, (+input.value || 0) + (+btn.dataset.step));
      });
    },
  });
}

/**
 * 回報問題。
 * 教練能講的通常只有「它壞了」，真正要查的是版本、瀏覽器、資料量，
 * 所以那些自動附上。送出方式是開啟郵件草稿，不需要後端也不用藏金鑰
 * （這份原始碼是公開的）。
 */
const ISSUE_KINDS = {
  bug: "怪怪的／算錯",
  broken: "打不開或卡住",
  feature: "希望多一個功能",
  other: "其他",
};

function reportIssueSheet() {
  const info = [
    `版本：${BUILD}`,
    `瀏覽器：${navigator.userAgent}`,
    `畫面：${window.innerWidth}×${window.innerHeight}`,
    `資料量：學生 ${S.students.length}．課程 ${S.lessons.length}．名單 ${S.leads.length}`,
  ].join("\n");

  openSheet({
    title: "回報問題",
    confirmLabel: "寫成郵件",
    body: `
      ${fieldSelect("kind", "這是哪一種問題", Object.entries(ISSUE_KINDS), "bug")}
      <div class="field">
        <label for="f-detail">發生了什麼事</label>
        <textarea id="f-detail" name="detail" rows="5"
          placeholder="哪一頁、你按了什麼、預期看到什麼、實際看到什麼。&#10;例如：某位學生續約 10 堂之後，剩餘堂數只加了 8 堂。"></textarea>
      </div>
      ${fieldText("contact", "怎麼聯絡你（選填）", "", { placeholder: "LINE 或電話" })}
      <details style="margin-top:10px">
        <summary class="hint" style="cursor:pointer">會一起附上的資訊</summary>
        <pre class="mono" style="font-size:11px;white-space:pre-wrap;color:var(--muted);margin-top:6px">${esc(info)}</pre>
      </details>
      <p class="hint">沒有學生姓名、電話或任何個人資料，只有版本與瀏覽器，還有總筆數。會開啟郵件草稿，<strong>記得按下寄出</strong>才會送出去。</p>`,
    onConfirm: (form) => {
      const detail = form.elements.detail.value.trim();
      if (!detail) { toast("請描述一下發生了什麼事"); return false; }
      const contact = form.elements.contact.value.trim();
      const kind = ISSUE_KINDS[form.elements.kind.value] || "其他";

      const subject = `教練小幫手回報：${kind}`;
      const body = [detail, contact ? `聯絡方式：${contact}` : "", "――――――――――\n" + info]
        .filter(Boolean).join("\n\n");
      const url = `mailto:${DEVELOPER_EMAIL}?subject=${encodeURIComponent(subject)}`
                + `&body=${encodeURIComponent(body)}`;

      // 有些瀏覽器沒有預設郵件程式，開不起來就退成複製到剪貼簿
      try {
        window.location.href = url;
        toast("已開啟郵件草稿，記得按寄出");
      } catch (err) {
        navigator.clipboard?.writeText(`${DEVELOPER_EMAIL}\n\n${subject}\n\n${body}`);
        toast(`開不了郵件程式，內容已複製，請傳給 ${DEVELOPER_EMAIL}`);
      }
    },
  });
}

/** 顏色標籤的設定 */
function tagSettingsSheet() {
  const counts = tagCounts();
  const draft = clone(allTags());

  openSheet({
    title: "顏色標籤",
    confirmLabel: "完成",
    body: `
      <div data-tag-list>
        ${draft.length
          ? draft.map((t) => tagEditorRow(t, counts[t.id] || 0)).join("")
          : `<p class="hint">還沒有標籤。在下面加一個，之後就能在學生名單上照標籤篩選。</p>`}
      </div>
      <div class="divider"></div>
      <p class="hint" style="margin:0 0 8px">新增標籤</p>
      ${fieldText("newName", "名稱", "", { placeholder: "減脂、產後、備賽…" })}
      <div class="swatches" data-new-color-picker>
        ${TAG_COLORS.map((c, i) => `
          <button type="button" class="swatch ${i === 0 ? "on" : ""}"
                  data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
      </div>
      <input type="hidden" name="newColor" value="${TAG_COLORS[0]}">
      <button type="button" class="btn btn-sm" data-action="add-tag" style="margin-top:8px">加入</button>
      <p class="hint">改名字或顏色，所有貼過這個標籤的學生會一起變。</p>`,
    onConfirm: () => {
      // 名字被清空的標籤存下去只會變成一個看不見的膠囊，直接濾掉
      S.settings.tags = draft.filter((t) => (t.name || "").trim());
      save(); render();
      toast("已更新標籤");
    },
    onMount: (root) => {
      const list = root.querySelector("[data-tag-list]");

      const redraw = () => {
        const c = tagCounts();
        list.innerHTML = draft.length
          ? draft.map((t) => tagEditorRow(t, c[t.id] || 0)).join("")
          : `<p class="hint">還沒有標籤。</p>`;
      };

      // 新標籤的顏色
      const newPicker = root.querySelector("[data-new-color-picker]");
      const newColor = root.querySelector('[name="newColor"]');
      newPicker.addEventListener("click", (e) => {
        const btn = e.target.closest(".swatch");
        if (!btn) return;
        e.preventDefault();
        newColor.value = btn.dataset.color;
        newPicker.querySelectorAll(".swatch").forEach((x) => x.classList.remove("on"));
        btn.classList.add("on");
      });

      root.addEventListener("click", (e) => {
        const add = e.target.closest('[data-action="add-tag"]');
        if (add) {
          e.preventDefault();
          const input = root.querySelector('[name="newName"]');
          const name = input.value.trim();
          if (!name) { toast("請填標籤名稱"); return; }
          draft.push({ id: uid(), name, color: newColor.value });
          input.value = "";
          redraw();
          return;
        }

        const del = e.target.closest("[data-del-tag]");
        if (del) {
          e.preventDefault();
          const id = del.dataset.delTag;
          const used = (tagCounts()[id] || 0);
          if (used > 0 && !confirm(`這個標籤目前貼在 ${used} 位學生身上，刪掉之後他們身上的這個標籤也會一起拿掉。學生資料本身不受影響。`)) return;
          // 立刻從學生身上拔掉，不然按「完成」之前名單上還看得到
          removeTagEverywhere(id);
          const i = draft.findIndex((t) => t.id === id);
          if (i >= 0) draft.splice(i, 1);
          save();
          redraw();
          return;
        }

        const swatch = e.target.closest("[data-tag-color]");
        if (swatch) {
          e.preventDefault();
          const tag = draft.find((t) => t.id === swatch.dataset.tagColor);
          if (tag) { tag.color = swatch.dataset.color; redraw(); }
        }
      });

      list.addEventListener("input", (e) => {
        const field = e.target.closest("[data-tag-name]");
        if (!field) return;
        const tag = draft.find((t) => t.id === field.dataset.tagName);
        if (tag) tag.name = field.value;
      });
    },
  });
}
