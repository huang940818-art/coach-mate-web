      </div>
    </div>

    <div class="stack">
      ${(() => {
        const stuck = paymentsStuckOnEntryDay();
        if (!stuck.length) return "";
        const sum = stuck.reduce((a, r) => a + (r.payment.amount || 0), 0);
        return `
          <div class="note-box">
            <strong>有 ${stuck.length} 筆收費的日期停在補登那天</strong>（合計 ${money(sum)}），
            所以那些錢全算進了這個月。它們對應的合約已經是別的日期了——
            按一下就把收費日期改成跟合約同一天。
            <div style="margin-top:9px">
              <button class="btn btn-sm btn-primary" type="button" data-action="fix-payment-dates">
                用合約日期修正</button>
            </div>
          </div>`;
      })()}
      <div class="tiles">
        ${tile({ value: money(collectedThisMonth), label: "本月收到", iconName: "money", color: "var(--good)",
                 note: upcomingThisMonth
                   ? `${monthRows.length} 筆・另有預收 ${money(upcomingThisMonth)}`
                   : `${monthRows.length} 筆` })}
        ${tile({ value: money(rows.reduce((a, p) => a + p.amount, 0)), label: "累計收入", iconName: "money",
                 color: "var(--gold)", note: `${rows.length} 筆` })}
        ${isCompany
          ? tile({ value: money(sal.total), label: "本月實拿", iconName: "target", color: "var(--info)",
                   note: `底薪 ${money(sal.baseSalary || S.settings.salary.baseSalary)}` })
          : tile({ value: money(S.students.reduce((a, s) => a + s.remaining * sessionPrice(s), 0)),
                   label: "未上課的預收", iconName: "clock", color: "var(--info)", note: "剩餘堂數 × 鐘點" })}
      </div>

      ${isCompany ? `
      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">本月薪資試算</h2>
          <span class="sec-sub">依「設定 → 薪資規則」計算</span>
        </div>
        <div class="row"><div class="row-main">上課堂數</div><div class="row-end mono">${sal.sessions} 堂</div></div>
        <div class="row"><div class="row-main">課程收入</div><div class="row-end mono">${money(sal.lessonRevenue)}</div></div>
        <div class="row"><div class="row-main">適用抽成</div><div class="row-end mono">${sal.pct}%</div></div>
        <div class="row"><div class="row-main">鐘點抽成</div><div class="row-end mono">${money(sal.lessonPay)}</div></div>
        ${sal.salesBonus ? `<div class="row"><div class="row-main">業績獎金</div><div class="row-end mono">${money(sal.salesBonus)}</div></div>` : ""}
        <div class="row"><div class="row-main">底薪</div><div class="row-end mono">${money(S.settings.salary.baseSalary)}</div></div>
        <div class="row"><div class="row-main" style="font-weight:650">實拿合計</div>
          <div class="row-end mono" style="font-weight:700;color:var(--gold)">${money(sal.total)}</div></div>
      </section>` : ""}

      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">收費紀錄</h2>
          <span class="sec-sub">${rows.length} 筆</span>
        </div>
        ${rows.length ? rows.map((p) => {
          const st = studentById(p.studentId);
          const method = { cash: "現金", transfer: "轉帳", other: "其他" }[p.method] || "其他";
          return `
          <div class="row">
            <span class="dot" style="background:${esc(st?.color || "var(--muted)")}"></span>
            <div class="row-main">
              <div class="row-title">${esc(st?.name || "（已刪除的學生）")}</div>
              <div class="row-sub mono">${esc(p.date)}　${method}${st && paymentLabel(st, p) ? "　" + esc(paymentLabel(st, p)) : ""}</div>
            </div>
            <div class="row-end">
              <span class="mono" style="font-weight:600">${money(p.amount)}</span>
              <div style="margin-top:5px;display:flex;gap:4px;justify-content:flex-end">
                <button class="btn btn-sm" type="button" data-action="edit-payment"
                        data-id="${p.id}" data-student="${p.studentId}">編輯</button>
                <button class="btn btn-sm btn-ghost" type="button" data-action="delete-payment"
                        data-id="${p.id}" data-student="${p.studentId}">刪除</button>
              </div>
            </div>
          </div>`;
        }).join("") : `<p class="empty">還沒有收費紀錄。</p>`}
      </section>
    </div>`;
}

/**
 * 「這筆錢是哪一次續約收的」的選項。
 *
 * 手動新增的收費以前永遠沒有 renewalId，接不回任何一筆續約，於是
 * 續約編輯列的「同時更新收費紀錄」開關根本不會出現 —— 改了續約金額，
 * 收費就是不會跟上，而且畫面上完全沒有說明為什麼。
 * 所以關聯要能用手指定，不能只靠日期＋金額去猜。
 */
function renewalOptions(student) {
  return [["", "不對應（單獨的一筆）"],
    ...renewalsOf(student).map((r) =>
      [r.id, `${r.date || "（無日期）"}・${r.sessions || 0} 堂・${money(r.amount || 0)}`])];
}

/** 收費表單裡「對應的續約」那一格。學生換了要整格重畫，選項不一樣。 */
function renewalPickField(student, value) {
  if (!student) return "";
  const rs = renewalsOf(student);
  if (!rs.length) {
    return `<p class="hint">${esc(student.name || "這位學生")}還沒有續約紀錄，這筆收費沒有可以對應的對象。</p>`;
  }
  return fieldSelect("renewalId", "對應的續約", renewalOptions(student), value || "",
    "對應起來之後，這一列會即時顯示那筆續約的堂數；改續約金額時也才有「同時更新收費紀錄」可以勾。");
}

/**
 * 「每堂單價 × 堂數」要乘的那個堂數，以及它是哪裡來的。
 *
 * 收費紀錄本身沒有堂數（一筆錢就是一筆錢），所以要向外找：
 * 　1. 有選「對應的續約」→ 用那筆買的堂數
 * 　2. 沒選（或這位學生根本沒有續約紀錄）→ 退回「本期購買堂數」
 *
 * 第 2 條是後來補的。原本只認續約，於是**還沒有任何續約紀錄的學生完全沒有
 * 單價選項**（實際踩到：一位剩 3 堂、本期 30 堂的學生，想填「每堂 1300」，
 * 但那一格只收總額，1300 就被當成整包的錢存進去）。
 * 搬家進來的學生大多是這樣：堂數是手填的，續約紀錄還沒補。
 */
function unitPriceBasis(student, renewalId) {
  if (!student) return { sessions: 0, from: "" };
  const r = renewalId ? (student.renewals || []).find((x) => x.id === renewalId) : null;
  if (r) return { sessions: r.sessions || 0, from: "對應的續約" };
  const cur = currentPackageSessions(student);
  return cur > 0 ? { sessions: cur, from: "本期購買堂數" } : { sessions: 0, from: "" };
}

/** 只要堂數的舊介面（測試與 onConfirm 在用） */
function sessionsOfRenewalId(student, renewalId) {
  return unitPriceBasis(student, renewalId).sessions;
}

/**
 * 新增或編輯一筆收費。
 *
 * 以前只能新增與刪除：金額打錯只能刪掉重建，而重建會失去 renewalId，
 * 於是「改續約金額，收費跟不上」變成沒有出口的死路。
 */
function paymentSheet(student = null, payment = null) {
  if (!activeStudents().length) { toast("請先新增至少一位學生"); return; }
  const editing = !!(student && payment);
  const owner = editing ? student : null;

  openSheet({
    title: editing ? "編輯收費" : "新增收費",
    body: `
      ${editing
        ? `<div class="row" style="padding-top:0">
             <span class="dot" style="background:${esc(student.color || "var(--muted)")}"></span>
             <div class="row-main"><div class="row-title">${esc(student.name || "（未命名）")}</div>
               <div class="row-sub">要換人請刪掉這筆，重新記一次</div></div>
           </div>`
        : fieldSelect("studentId", "學生", studentOptions(false), activeStudents()[0].id)}
      <div data-renewal-pick>${renewalPickField(owner || activeStudents()[0], editing ? payment.renewalId : "")}</div>
      <p class="hint" data-link-warn hidden></p>
      <div class="seg" style="max-width:260px;margin-bottom:8px" data-price-toggle hidden>
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-pay-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="payPriceMode" value="total">
      <div class="field-row">
        ${fieldText("amount", "金額", editing ? (payment.amount || 0) : "", { type: "number", required: true })}
        ${fieldText("date", "日期", editing ? (payment.date || today()) : today(), { type: "date" })}
      </div>
      <p class="hint" data-pay-price-hint></p>
      ${fieldSelect("method", "付款方式", [["cash", "現金"], ["transfer", "轉帳"], ["other", "其他"]],
                    editing ? (payment.method || "cash") : "cash")}
      ${fieldText("notes", "備註", editing ? (payment.notes || "") : "")}`,
    // 刪除以前只有「收費」那一頁的列上有，從學生詳情點進來的那條路完全刪不掉
    // （2026-08-11 回報）。放在表單裡，哪一條路進來都刪得到。
    extraFoot: editing
      ? `<button class="btn btn-danger btn-sm" type="button" data-del-payment="1">刪除</button>`
      : "",
    onMount: (root) => {
      // 這顆在 .scrim 裡面，全域的 data-action 分派會跳過它，自己接。
      root.addEventListener("click", (e) => {
        if (!e.target.closest("[data-del-payment]")) return;
        e.preventDefault();
        const r = renewalOfPayment(student, payment);
        closeSheet();
        confirmSheet("刪除收費紀錄",
          `${esc(student.name || "這位學生")}　${esc(payment.date || "")}　${money(payment.amount || 0)}` +
          (r ? `<br>這筆錢掛在 ${esc(r.date || "")} 的續約底下。<strong>續約紀錄不會跟著刪</strong>，那筆課還是賣出去了；要連續約一起拿掉請到「編輯學生 → 續約紀錄」刪那一筆。`
             : "<br>這筆沒有對應到任何續約，刪掉只影響收入統計。"),
          () => {
            student.payments = (student.payments || []).filter((p) => p.id !== payment.id);
            student.updatedAt = new Date().toISOString();
            save(); render(); toast("已刪除收費紀錄");
          }, "刪除");
      });

      const studentSel = root.querySelector('[name="studentId"]');
      const modeInput = root.querySelector('[name="payPriceMode"]');
      const toggle = root.querySelector("[data-price-toggle]");
      const amountInput = root.querySelector('[name="amount"]');
      const amountLabel = root.querySelector('label[for="f-amount"]');
      const hint = root.querySelector("[data-pay-price-hint]");

      const currentStudent = () =>
        editing ? student : studentById(studentSel ? studentSel.value : "");

      /**
       * 單價模式的堂數來自對應的續約，所以沒有對應就不能給單價選項 ——
       * 堂數是 0，乘下去金額直接變成 0。
       */
      const basis = () => {
        const sel = root.querySelector('[name="renewalId"]');
        return unitPriceBasis(currentStudent(), sel ? sel.value : "");
      };

      const setMode = (mode) => {
        modeInput.value = mode;
        root.querySelectorAll("[data-pay-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.payPriceMode === mode)));
      };

      // 不管用哪一種輸入，兩個數字都同時顯示 ——
      // 「我剛剛填的是一堂還是全部」不該在按下儲存之後才想起來。
      const refresh = () => {
        // 有續約紀錄卻沒接：這筆錢會單獨存在，之後改續約金額不會問你要不要同步，
        // 對帳時也看不出是哪一次買的。不擋（有些錢真的不屬於任何一次續約），但要講。
        const warn = root.querySelector("[data-link-warn]");
        if (warn) {
          const st = currentStudent();
          const sel = root.querySelector('[name="renewalId"]');
          const loose = !!(st && renewalsOf(st).length && !(sel && sel.value));
          warn.hidden = !loose;
          if (loose) {
            warn.innerHTML = "<strong>還沒選「對應的續約」。</strong>這筆錢會單獨存在——"
              + "收費那一列不會顯示堂數，之後改續約金額也不會問你要不要一起改。"
              + "它屬於某一次續約就選起來。";
          }
        }
        const { sessions: n, from } = basis();
        // 連本期堂數都是 0 才真的沒有堂數可以換算，選項收起來並強制回總額
        if (!n) {
          if (modeInput.value === "unit") setMode("total");
          toggle.hidden = true;
        } else {
          toggle.hidden = false;
        }
        const unit = modeInput.value === "unit";
        const v = Math.max(0, +amountInput.value || 0);
        if (amountLabel) amountLabel.textContent = unit ? "每堂單價" : "金額";
        if (!hint) return;
        if (!n) {
          hint.textContent = "這位學生還沒有堂數可以換算，這一格填實收的金額。";
        } else if (!v) {
          hint.textContent = `堂數用「${from}」的 ${n} 堂。存進去的一律是總額。`;
        } else {
          hint.textContent = (unit
            ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
            : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`)
            + `（堂數取自${from}）`;
        }
      };

      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-pay-price-mode]");
        if (!btn) return;
        e.preventDefault();
        setMode(btn.dataset.payPriceMode);
        refresh();
      });
      amountInput.addEventListener("input", refresh);
      // 續約的下拉是重畫出來的（換學生時），所以用委派接 change
      root.addEventListener("change", (e) => {
        if (e.target.name === "renewalId") refresh();
      });

      if (studentSel) {
        studentSel.addEventListener("change", () => {
          const box = root.querySelector("[data-renewal-pick]");
          if (box) box.innerHTML = renewalPickField(studentById(studentSel.value), "");
          setMode("total");   // 換人之後堂數的來源也換了，別停在單價
          refresh();
        });
      }
      refresh();
    },
    onConfirm: (form) => {
      const st = editing ? student : studentById(form.elements.studentId.value);
      if (!st) return false;
      // 選項是從這位學生的續約長出來的，但表單值仍要驗一次 ——
      // 換過學生之後留在 DOM 裡的舊值不能直接信。
      const picked = form.elements.renewalId ? form.elements.renewalId.value : "";
      const renewalId = (st.renewals || []).some((r) => r.id === picked) ? picked : "";

      // 存進去的一律是總額，理由跟續約一樣：收入統計與業績抽成都是拿總額去算的。
      // 單價模式沒有堂數時當成總額 —— 乘 0 會把金額直接吃掉。
      const typed = Math.max(0, +form.elements.amount.value || 0);
      const n = sessionsOfRenewalId(st, renewalId);
      const unit = form.elements.payPriceMode
                && form.elements.payPriceMode.value === "unit" && n > 0;
      const amount = unit ? typed * n : typed;
      // **$0 是合法的**：贈課、補課、抵用、還沒收到錢，都是真的會發生的紀錄，
      // 而且擋掉它只會逼人隨便填一個數字，那才真的把帳弄髒（2026-08-12）。
      // 續約當下自動產生的收費本來就允許 0，這裡不該有第二套規矩。

      const fields = {
        amount, date: form.elements.date.value || today(),
        method: form.elements.method.value, notes: form.elements.notes.value,
        ...(renewalId ? { renewalId } : {}),
      };

      if (editing) {
        Object.assign(payment, fields);
        // 取消對應時要真的把欄位拿掉，留著空字串會讓 paymentsOfRenewal 之類
        // 的判斷變成「有 renewalId 但指向不存在的續約」。
        if (!renewalId) delete payment.renewalId;
        st.updatedAt = new Date().toISOString();
      } else {
        st.payments.push({ id: uid(), ...fields, createdAt: new Date().toISOString() });
      }
      save(); render();
      // 有沒有接上要講出來，不然「為什麼收費那列沒有堂數」永遠是個謎
      const loose = !renewalId && renewalsOf(st).length ? "（沒有對應到續約）" : "";
      toast((editing ? `已更新為 ${money(amount)}` : `已記錄 ${money(amount)}`) + loose);
    },
  });
}

/* ── 分析 ───────────────────────────────────── */

/**
 * 銷售統計：「這段期間總共賣了幾堂」。
 * 跟收費不同——收費看錢什麼時候進來（含預收），銷售看課什麼時候賣掉。
 */
/**
 * 沒填金額、但底下掛著收費的續約。
 *
 * 補歷史時很常見：續約紀錄只填了堂數與日期，錢另外記在收費那一頁。
 * 但**銷售統計的資料來源是續約紀錄**，於是「銷售金額」只算得到有填金額的那幾筆
 * ——實際收了 $190,800 卻只顯示 $43,200，每堂均價也跟著垮掉
 * （2026-08-11 回報「銷售金額有問題」）。
 *
 * 這些是補得回來的：底下掛著的收費加起來就是這筆合約的金額。
 * 沒有掛收費的那種猜不出來，不動它。
 */
/**
 * 長條圖上的月份標籤。
 *
 * 原本寫 `month.slice(5) + "月"`，出來是「08月」——多一個 0 很醜，
 * 而且跨年的區間看不出是哪一年（2025-08 與 2026-08 都印成「08月」）。
 */
function monthLabel(month, all) {
  const spansYears = new Set(all.map((m) => m.month.slice(0, 4))).size > 1;
  const [y, mm] = month.split("-");
  return spansYears ? `${y.slice(2)}/${+mm} 月` : `${+mm} 月`;
}

function renewalsMissingAmount() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      if ((r.amount || 0) > 0) continue;
      const paid = paymentsOfRenewal(s, r.id).reduce((a, p) => a + (p.amount || 0), 0);
      if (paid > 0) rows.push({ student: s, renewal: r, paid });
    }
  }
  return rows;
}

/**
 * 合約日期還停在「補登那天」的續約。
 *
 * 補歷史時「新增一筆」的日期預設是今天，沒改到的話那筆合約就掛在今天 ——
 * 於是兩年的業績全堆進這個月，銷售的月份完全失真
 * （2026-08-11 回報「銷售金額的時間也不對」）。
 *
 * 認定條件抓得很緊，避免把正常的今日成交也搬走：
 *   1. 合約日期**剛好等於建立那一天**（沒動過預設值）
 *   2. 底下掛著的收費是**更早的日期**
 * 今天簽約、下個月才收錢的那種收費日在後面，不會被動到。
 */
function renewalsWithDefaultDate() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      if (!r.createdAt || !r.date) continue;
      const created = new Date(r.createdAt);
      if (isNaN(created.getTime()) || r.date !== dayStr(created)) continue;
      const dates = paymentsOfRenewal(s, r.id).map((p) => p.date).filter(Boolean).sort();
      const earliest = dates[0];
      if (!earliest || earliest >= r.date) continue;   // 只往前搬，不往後
      rows.push({ student: s, renewal: r, to: earliest });
    }
  }
  return rows;
}

/** 把合約日期改成底下收費的日期 */
function fixRenewalDatesFromPayments() {
  const rows = renewalsWithDefaultDate();
  for (const { student, renewal, to } of rows) {
    renewal.date = to;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

/**
 * 需要人看一眼的合約：日期停在補登那天、或金額還沒填。
 *
 * 為什麼不能自動修：真正的簽約日期在資料裡沒有第二個來源。補歷史時收費日期
 * 往往也跟著填成同一天（實測 37 位教練資料：23 筆合約與它們的收費全部
 * 落在補登當天），所以「用收費日期推回去」在真實資料上一筆都救不到。
 * 能做的是**把要改的攤在同一張表上一次改完**，而不是叫人一筆一筆點進去。
 */
/**
 * 一天之內有這麼多位不同學生的合約，就不是真的同一天簽的，是補登。
 *
 * 門檻本來是 5，結果實際資料裡 8/09 那批只有 4 位 —— 整批被漏掉，
 * 使用者看到的是「工具只列出 13 筆，但明明有 20 筆要修」（2026-08-12）。
 * 一天連三位不同學生同時簽約本來就不常見，3 已經夠保守。
 */
const BULK_ENTRY_MIN = 3;

/** 所有合約，給「顯示全部」用 */
function allContractRows() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      rows.push({ student: s, renewal: r, sameDay: false, noAmount: !(r.amount > 0) });
    }
  }
  return rows.sort((a, b) => (b.renewal.date || "").localeCompare(a.renewal.date || ""));
}

function contractsNeedingReview() {
  // 「日期等於建立那天」不能單獨當證據 —— 當天簽約當天輸入本來就是這樣，
  // 那是最正常的一筆。真正的特徵是**一整批擠在同一天**：
  // 正常一天不會有五位不同的學生同時簽約，那是補歷史時日期沒改。
  const sameDayByDate = new Map();
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      const created = r.createdAt ? new Date(r.createdAt) : null;
      if (!created || isNaN(created.getTime()) || r.date !== dayStr(created)) continue;
      if (!sameDayByDate.has(r.date)) sameDayByDate.set(r.date, new Set());
      sameDayByDate.get(r.date).add(s.id);
    }
  }
  const bulkDates = new Set([...sameDayByDate.entries()]
    .filter(([, ids]) => ids.size >= BULK_ENTRY_MIN).map(([d]) => d));

  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      const created = r.createdAt ? new Date(r.createdAt) : null;
      const bulkDay = !!(created && !isNaN(created.getTime()) && r.date === dayStr(created)
                         && bulkDates.has(r.date));
      // 未來的日期幾乎一定是打錯或選錯的（實例：首購掛在 2027-01-26）。
      // 這種不必等到湊成一批，單獨一筆就要問。
      const future = !!(r.date && r.date > today());
      // 「今天買的 36 堂，但他手上只剩 7 堂」—— 今天買的不可能已經上掉 29 堂。
      // 這是最後一種漏網的：日期被改成今天（不等於建檔那天）、也還沒到未來，
      // 但一看堂數就知道那份合約不是今天的。
      const latest = renewalsOf(s)[0];
      const usedAlready = !!(latest === r && r.date >= today() && (r.sessions || 0) > 0
                             && (s.remaining || 0) < (r.sessions || 0));
      const sameDay = bulkDay || future || usedAlready;
      // $0 本身是合法的（贈課、補課）。只有「還沒確認過」的才提出來問一次，
      // 在批次表按過套用就記 amountOk，不再一直標記同一筆。
      const noAmount = !(r.amount > 0) && !r.amountOk;
      if (sameDay || noAmount) rows.push({ student: s, renewal: r, sameDay, noAmount });
    }
  }
  return rows.sort((a, b) => (a.student.name || "").localeCompare(b.student.name || "", "zh-Hant"));
}

/** 用底下收費的金額補上合約金額 */
function fillRenewalAmountsFromPayments() {
  const rows = renewalsMissingAmount();
  for (const { student, renewal, paid } of rows) {
    renewal.amount = paid;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

/**
 * 看起來重複的紀錄。
 *
 * 補歷史的時候很容易同一筆記兩次（改了一半重來、匯入過兩次、批次表補了一筆
 * 但錢其實早就記過）。判斷抓得很緊：**同一位學生、同一天、金額與堂數都一樣**
 * 才算同一筆。
 *
 * 刻意**不自動刪** —— 分期付款真的會出現同一天兩筆同額的收費。列出來讓人看過
 * 再決定，比自作主張刪掉安全得多。
 */
function duplicateRecords() {
  const groups = [];
  for (const s of S.students) {
    const seen = new Map();
    for (const r of s.renewals || []) {
      const key = `${r.date || ""}|${r.sessions || 0}|${r.amount || 0}`;
      if (!seen.has(key)) seen.set(key, []);
      seen.get(key).push(r);
    }
    for (const [, list] of seen) {
      if (list.length > 1) groups.push({ kind: "renewal", student: s, list });
    }

    const pseen = new Map();
    for (const p of s.payments || []) {
      const key = `${p.date || ""}|${p.amount || 0}`;
      if (!pseen.has(key)) pseen.set(key, []);
      pseen.get(key).push(p);
    }
    for (const [, list] of pseen) {
      if (list.length > 1) groups.push({ kind: "payment", student: s, list });
    }
  }
  return groups;
}

/**
 * 每一組留一筆、其餘刪掉。
 *
 * 留哪一筆有講究：**留底下掛著收費的那筆續約**（刪掉有關聯的那筆會讓收費變孤兒），
 * 收費則留已經接上續約的那筆（孤兒收費才是後來多出來的那個）。
 */
function removeDuplicates(groups) {
  let removed = 0;
  for (const g of groups) {
    if (g.kind === "renewal") {
      const keep = g.list.find((r) => paymentsOfRenewal(g.student, r.id).length) || g.list[0];
      for (const r of g.list) {
        if (r === keep) continue;
        removeRenewalRecord(g.student, r);
        removed++;
      }
    } else {
      const keep = g.list.find((p) => p.renewalId) || g.list[0];
      const drop = new Set(g.list.filter((p) => p !== keep).map((p) => p.id));
      g.student.payments = g.student.payments.filter((p) => !drop.has(p.id));
      removed += drop.size;
    }
    g.student.updatedAt = new Date().toISOString();
  }
  return removed;
}

function duplicateSheet() {
  const groups = duplicateRecords();
  if (!groups.length) { toast("沒有看起來重複的紀錄"); return; }
  const extra = groups.reduce((a, g) => a + g.list.length - 1, 0);

  openSheet({
    title: `看起來重複的紀錄（${extra} 筆多的）`,
    confirmLabel: `刪掉多的 ${extra} 筆`,
    body: `
      <p class="hint" style="margin-top:0">
        同一位學生、同一天、金額（與堂數）都一樣的紀錄。<strong>每一組會留下一筆</strong>——
        續約留底下有掛收費的那筆，收費留已經接上續約的那筆。<br>
        分期付款真的可能同一天收兩筆一樣的錢，<strong>不是你的情況就先關掉這張表</strong>，
        不會自動刪。
      </p>
      ${groups.map((g) => `
        <div class="row" style="display:block;padding:8px 0">
          <div class="row-title" style="font-size:14px">
            ${esc(g.student.name || "（未命名）")}
            <span class="pill pill-mute">${g.kind === "renewal" ? "續約" : "收費"}</span>
            <span class="muted" style="font-weight:400;font-size:12px">　${g.list.length} 筆一模一樣</span>
          </div>
          <div class="row-sub">
            ${esc(g.list[0].date || "（無日期）")}
            ${g.kind === "renewal" ? `・${g.list[0].sessions || 0} 堂` : ""}
            ・${money(g.list[0].amount || 0)}
          </div>
        </div>`).join("")}`,
    onConfirm: () => {
      const n = removeDuplicates(duplicateRecords());
      save(); render();
      toast(n ? `已刪掉 ${n} 筆重複的紀錄` : "沒有刪掉任何東西");
    },
  });
}

/**
 * 一次改完所有要修的合約。
 *
 * 一筆一筆點進去改 23 筆不現實 —— 補完歷史的人正是需要這張表。
 * 只改日期與金額：堂數改了會連動累計已購，那要走續約紀錄那邊的編輯。
 */
/**
 * 日期卡在「補登那天」的收費。
 *
 * 合約日期修好了，收費卻還留在補登那天 —— 而「本月收到」與月營收看的是**收費
 * 日期**，所以修完合約畫面上完全沒變（2026-08-12 實例：本月收到 $1,062,540，
 * 而一輩子的累計才 $3,262,460）。
 *
 * 一樣用批次補登的特徵，而且抓得很緊：
 *   1. 這筆收費**掛在某一筆續約**底下，而且日期跟那筆合約不同天
 *   2. 收費日期落在「同一天有 5 位以上不同學生」的那種日子
 *   3. 合約日期比它**早** —— 只往前搬，不動「這個月簽約、下個月才收錢」
 */
function paymentsStuckOnEntryDay() {
  const byDate = new Map();
  for (const s of S.students) {
    for (const p of s.payments || []) {
      if (!p.date) continue;
      if (!byDate.has(p.date)) byDate.set(p.date, new Set());
      byDate.get(p.date).add(s.id);
    }
  }
  const bulk = new Set([...byDate.entries()]
    .filter(([, ids]) => ids.size >= BULK_ENTRY_MIN).map(([d]) => d));

  const rows = [];
  for (const s of S.students) {
    for (const p of s.payments || []) {
      if (!p.renewalId || !bulk.has(p.date)) continue;
      const r = renewalOfPayment(s, p);
      if (!r || !r.date || r.date >= p.date) continue;
      rows.push({ student: s, payment: p, to: r.date });
    }
  }
  return rows;
}

/** 把那些收費的日期改成對應合約的日期 */
function fixPaymentDatesFromRenewals() {
  const rows = paymentsStuckOnEntryDay();
  for (const { student, payment, to } of rows) {
    payment.date = to;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

function batchContractSheet(showAll = false) {
  // 我的判斷再怎麼修都會有漏網的（實際資料就漏過兩批），所以留一條退路：
  // 「顯示全部合約」讓人自己看、自己改，不必跟我的啟發式規則吵架。
  const rows = showAll ? allContractRows() : contractsNeedingReview();
  if (!rows.length) { toast("沒有需要修正的合約"); return; }
  const dateStuck = rows.filter((r) => r.sameDay).length;
  const noAmount = rows.filter((r) => r.noAmount).length;

  openSheet({
    title: showAll ? `所有合約（${rows.length} 筆）` : `批次修正合約（${rows.length} 筆）`,
    confirmLabel: "全部套用",
    body: `
      <p class="hint" style="margin-top:0">
        ${dateStuck ? `<strong>${dateStuck} 筆的日期停在補登那天</strong>，業績會全算到那個月。
          <strong style="color:var(--warn)">這幾筆的日期 App 猜不出來，要你自己填</strong>——
          底下每一列都附了那位學生的到期日與最早上課日，照著回想。` : ""}
        ${noAmount ? `<strong>${noAmount} 筆還沒填金額</strong>，銷售金額會少算。` : ""}
        改成實際簽約的日期與金額，沒動到的那幾列不會被存。
        <strong>金額留 0 也可以</strong>（贈課、補課），套用之後就不會再問同一筆。
      </p>
      ${showAll ? "" : `<p class="hint" style="margin-top:0">
        少列到的話按這裡 →
        <button class="btn btn-sm" type="button" data-action="batch-contracts-all">顯示全部合約</button>
      </p>`}
      <div class="switch">
        <label for="f-makePayments">沒有收費紀錄的，照這裡的金額與日期補一筆</label>
        <input id="f-makePayments" name="makePayments" type="checkbox" checked>
      </div>
      <p class="hint">以這張表為準把收費紀錄補齊——已經有收費的那幾筆不會被動到
        （要讓它們跟著改，到那一筆續約的「編輯」裡勾「同時更新收費紀錄」）。</p>
      ${rows.map(({ student, renewal, sameDay, noAmount }) => {
        // 給一點線索幫忙回想：這位學生的方案到期日、以及最早的一堂課
        const dates = lessonsOf(student.id).map((l) => l.date).filter(Boolean).sort();
        const clues = [student.expiry ? `到期 ${student.expiry}` : "",
                       dates[0] ? `最早上課 ${dates[0]}` : ""].filter(Boolean).join("・");
        return `
        <div class="row" style="display:block;padding:9px 0">
          <div class="row-title" style="font-size:14px">
            ${esc(student.name || "（未命名）")}
            <span class="muted" style="font-weight:400;font-size:12px">　${renewal.sessions || 0} 堂</span>
            ${sameDay ? '<span class="pill pill-warn">日期</span>' : ""}
            ${noAmount ? '<span class="pill pill-warn">金額</span>' : ""}
          </div>
          ${(sameDay || clues) ? `<div class="muted" style="font-size:11.5px">${
            [sameDay ? `現在是 ${esc(renewal.date || "")}（補登那天）` : "", esc(clues)]
              .filter(Boolean).join("・")}</div>` : ""}
          <div class="field-row" style="margin-top:5px">
            ${// 日期停在補登那天的那幾列**留空**。預填成現在那個（錯的）日期，
              // 看起來就像已經填好了、沒事要做 —— 使用者按了「全部套用」什麼都
              // 沒發生，還被回一句「已處理 N 筆」（2026-08-12 回報）。
              fieldText(`d_${renewal.id}`, sameDay ? "合約日期（要填）" : "合約日期",
                        sameDay ? "" : (renewal.date || ""), { type: "date" })}
            ${fieldText(`a_${renewal.id}`, "金額", renewal.amount || "", { type: "number" })}
          </div>
        </div>`;
      }).join("")}`,
    onConfirm: (form) => {
      const makePayments = !!(form.elements.makePayments && form.elements.makePayments.checked);
      let changed = 0, made = 0, linked = 0, realEdits = 0;
      for (const { student, renewal } of rows) {
        const d = form.elements[`d_${renewal.id}`];
        const a = form.elements[`a_${renewal.id}`];
        const newDate = d ? d.value : renewal.date;
        const newAmount = a ? Math.max(0, +a.value || 0) : (renewal.amount || 0);
        let touched = false;
        if (newDate && newDate !== renewal.date) {
          // 掛在底下、而且**本來就跟合約同一天**的收費要跟著搬。
          // 不搬的話「本月收到」與月營收全部留在補登那個月，改了合約日期
          // 也看不出差別（2026-08-12 回報「本月收到那邊也是都沒有改過來」）。
          // 刻意分開填過的收費日期不動 —— 那是「這個月簽約、下個月才轉帳」。
          const wasDate = renewal.date;
          for (const p of paymentsOfRenewal(student, renewal.id)) {
            if ((p.date || "") === wasDate) p.date = newDate;
          }
          renewal.date = newDate;
          touched = true;
        }
        if (newAmount !== (renewal.amount || 0)) { renewal.amount = newAmount; touched = true; }
        if (touched) realEdits++;
        // 看過了就是看過了 —— 留 0 是他的決定，不要下次再問一次
        if (!renewal.amountOk) { renewal.amountOk = true; touched = true; }

        // 以這張表為準把收費補齊。已經掛著收費的不動：那可能是分期或訂金，
        // 硬塞第二筆會讓累計收費憑空多一份。
        if (makePayments && !paymentsOfRenewal(student, renewal.id).length) {
          // **先找找看錢是不是早就記過了，只是沒接上**。
          // 不找就直接補，同一筆錢會變成兩筆（實測：五位各有一筆孤兒收費，
          // 補完之後累計收費從 6 萬變 12 萬）。金額一樣就當同一筆，
          // 日期一樣的優先。
          const loose = unlinkedPayments(student)
            .filter((p) => (p.amount || 0) === (renewal.amount || 0));
          const hit = loose.find((p) => p.date === renewal.date) || loose[0];
          if (hit) {
            hit.renewalId = renewal.id;
            linked++;
          } else {
            student.payments = student.payments || [];
            student.payments.push({
              id: uid(), renewalId: renewal.id, amount: renewal.amount || 0,
              date: renewal.date || today(), method: "cash", notes: "",
              createdAt: new Date().toISOString(),
            });
            made++;
          }
          touched = true;
        }
        if (!touched) continue;
        changed++;
        student.updatedAt = new Date().toISOString();
      }
      // 合約日期改完，還卡在補登那天的收費一起收乾淨 —— 不然「本月收到」
      // 完全沒變，使用者會以為整件事沒發生（2026-08-12 回報）。
      const movedPayments = fixPaymentDatesFromRenewals();
      save(); render();
      // 只有「確認過 0 元」不算真的改了什麼 —— 回一句「已處理」會讓人以為
      // 日期也修好了，然後回頭發現提示還在
      toast(realEdits
        ? `已修正 ${realEdits} 筆`
          + (movedPayments ? `，${movedPayments} 筆收費日期跟著搬` : "")
          + (linked ? `，接回 ${linked} 筆已經記過的收費` : "")
          + (made ? `，補上 ${made} 筆收費` : "")
        : "日期還沒填，所以沒有東西被改 —— 那幾格要你自己輸入");
    },
  });
}

        </div>` : ""}

      <!-- 金額是這一區的主角，給它一整行；三個一樣大的方塊擠在手機上

      <div class="sales-hero">

          <div class="sales-hero-label">銷售金額</div>
          <div class="sales-hero-value">${money(sum.amount)}</div>
        </div>

        </div>
      </div>

      <div class="sales-stats">
        <div><span class="sales-stat-value">${sum.sessions}</span><span class="sales-stat-unit"> 堂</span>

        <div><span class="sales-stat-value">${sum.unitPrice === null ? "—" : money(sum.unitPrice)}</span>

      </div>

      ${(() => {
        // 同一筆記兩次在補歷史時很常見，而且錢會直接翻倍
        const dups = duplicateRecords();
        if (!dups.length) return "";
        const extra = dups.reduce((a, g) => a + g.list.length - 1, 0);
        return `
          <div class="note-box" style="margin-top:12px">
            <strong>有 ${extra} 筆看起來是重複的</strong>（同一位學生、同一天、金額一樣）。

                看一下</button>
            </div>
          </div>`;
      })()}

      ${(() => {
        // 日期比金額更根本：日期錯了，連「這個月賣多少」都是假的。
        // 真正的簽約日在資料裡沒有第二個來源（補歷史時收費日期往往也填成同一天），
        // 所以不自動改，改成把要修的攤在同一張表上一次改完。
        const rows = contractsNeedingReview();
        if (!rows.length) return "";
        const dateStuck = rows.filter((r) => r.sameDay).length;
        const noAmount = rows.filter((r) => r.noAmount).length;
        return `
          <div class="note-box" style="margin-top:12px">
            <strong>有 ${rows.length} 筆合約需要看一下</strong>：
            ${[dateStuck ? `${dateStuck} 筆的日期停在補登那天（業績會全算到那個月）` : "",
               noAmount ? `${noAmount} 筆沒填金額（銷售金額會少算）` : ""]

        const missing = renewalsMissingAmount();

        const total = missing.reduce((a, r) => a + r.paid, 0);
        return `

/** 用實際數字解釋底薪的給法，比抽象敘述好懂 */
function baseModeHint(rule) {
  const base = rule.baseSalary || 0;
  const threshold = rule.baseSalaryThreshold || 40;
  switch (rule.baseSalaryMode || "always") {
    case "belowThreshold":
      return `不滿 ${threshold} 堂時領 ${money(base)} 底薪加抽成；滿 ${threshold} 堂之後底薪歸零，只算抽成。`;
    case "higherOf":
      return `底薪 ${money(base)} 與抽成比大小，領高的那個，不相加。抽成算出 ${money(base / 2)} 就領 ${money(base)}；算出 ${money(base * 2)} 就領 ${money(base * 2)}。`;
    default:
      return `底薪 ${money(base)} 固定給，抽成另外加上去。`;
  }
}

/**
 * 全部學生的「續約與收費對不對得起來」。
 *
 * 為什麼要有一個總表：補歷史是一位一位在補的，走鐘也是一位一位走鐘 ——
 * 一筆錢沒接到續約、一筆續約刪掉留下孤兒收費，畫面上都不會主動講，
 * 要一位一位點進去才看得到（2026-08-11「紀錄又對不上了」）。
 * 這裡一次把有問題的列出來，點進去就是修得到的那張表單。
 *
 * 封存的學生也一起檢查：業績與銷售統計本來就會算到他們。
 */

/**
 * 事後才補、卻扣了堂數的課。
 *
 * v42 那一版把「時段已經過了」的新課直接記成已上課**並扣一堂**，但補以前的課
 * 不該扣 —— 那些課早就上完了，剩餘堂數已經反映過（2026-08-11 回報：
 * 「課後才補紀錄，幫我把我的補回來」）。這裡把被吃掉的找出來還回去。
 *
 * 判斷方式是 **建立時間晚於課程結束時間** ＝ 事後補的紀錄。
 * 事先排好、時間到了才被自動標記的課不算（那種本來就該扣，
 * 它的 createdAt 在上課之前）。
 */
function backfilledConsumedLessons() {
  return S.lessons.filter((l) => {
    if (kindOf(l) !== "lesson") return false;              // 檢測本來就不扣
    // 扣掉了、或**因為沒堂數可扣而被記成欠課**，兩種都要撈出來。
    // 只看 consumed 會漏掉最慘的那一種：剩餘已經是 0 的學生（補歷史時很常見，
    // 堂數本來就上完了），每補一堂就多欠一堂，而且一堂都沒「被扣掉」，
    // 於是整個補救區塊連出現都不會出現（2026-08-11 回報「為什麼會有欠幾堂」）。
    if (!l.consumed && !l.partnerConsumed && !l.owed && !l.partnerOwed) return false;
    return isBackfilledRecord(l);
  });
}

/** 把那些課扣掉的堂數還回去（紀錄留著，狀態也留著，只是不再扣） */
function refundBackfilledLessons() {
  const rows = backfilledConsumedLessons();
  let refunded = 0, cleared = 0;
  for (const l of rows) {
    for (const [idKey, consumedKey, owedKey] of SESSION_SLOTS) {
      if (l[consumedKey]) {
        const st = studentById(l[idKey]);
        if (st) { st.remaining += 1; st.updatedAt = new Date().toISOString(); refunded++; }
        l[consumedKey] = false;
      }
      // 欠課也是同一件事的另一面：剩餘是 0 的時候扣不動，就被記成「欠一堂」。
      // 補歷史本來就不該扣，那個欠也不該存在。
      if (l[owedKey]) { l[owedKey] = false; cleared++; }
    }
  }
  return { lessons: rows.length, refunded, cleared };
}

function backfillRefundSection() {
  const rows = backfilledConsumedLessons();
  if (!rows.length) return "";
  // 每位受影響的學生：要補回幾堂、要清掉幾筆欠課
  const byStudent = new Map();
  for (const l of rows) {
    for (const [idKey, consumedKey, owedKey] of SESSION_SLOTS) {
      if (!l[consumedKey] && !l[owedKey]) continue;
      const st = studentById(l[idKey]);
      const name = st ? (st.name || "（未命名）") : "（已刪除的學生）";
      const row = byStudent.get(name) || { back: 0, owed: 0 };
      if (l[consumedKey]) row.back += 1;
      if (l[owedKey]) row.owed += 1;
      byStudent.set(name, row);
    }
  }
  const totalOwed = [...byStudent.values()].reduce((a, r) => a + r.owed, 0);
  return `

      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">

}

        <div class="row">
          <div class="row-main">版本</div>
          <div class="row-end mono">${esc(BUILD)}</div>
        </div>
        <div class="row">
          <div class="row-main">資料存放位置</div>
          <div class="row-end">這台裝置的瀏覽器</div>
        </div>

/* ════════════════════════════════════════════════
   6. 匯出／匯入
   檔案格式與 iOS 版的備份檔一致，兩邊可以互搬。
   ════════════════════════════════════════════════ */

function buildBackup() {
  const indexOf = new Map(S.students.map((s, i) => [s.id, i]));
  // 檢測掛的是名單而不是學生，另外編一組索引
  const leadIndexOf = new Map(S.leads.map((l, i) => [l.id, i]));
  // 認不出來的日期一律退回「現在」。原本是 `new Date(v).toISOString()`，
  // 遇到無法解析的字串會丟 "Invalid time value" —— 而這裡是匯出，
  // 整份備份會做不出來。備份是資料出了問題時的**逃生口**，
  // 不能因為某一筆的 createdAt 壞掉就整個堵住。
  const iso = (v) => {
    const d = v ? new Date(v) : null;
    return d && !isNaN(d.getTime()) ? d.toISOString() : new Date().toISOString();
  };

  return {
    version: 1,
    appVersion: "web-1.0",
    exportedAt: new Date().toISOString(),
    students: S.students.map((s) => ({
      name: s.name, phone: s.phone, email: s.email || "", rate: s.rate,
      totalPurchasedSessions: s.totalPurchased, remainingSessions: s.remaining,
      notes: s.notes, color: s.color,
      packageExpiryDate: s.expiry ? new Date(s.expiry + "T00:00:00").toISOString() : null,
      customFieldsJSON: JSON.stringify(s.custom || {}),
      renewalCount: s.renewalCount || 0, mayNotRenew: !!s.mayNotRenew,
      acquisitionRaw: s.acquisition, statusRaw: s.status,
      pausedUntil: null, archivedAt: s.status === "archived" ? iso(s.updatedAt) : null,
      createdAt: iso(s.createdAt), updatedAt: iso(s.updatedAt),
      // 顏色標籤，逗號分隔（iOS 的 Student.tagsCSV）
      tagsCSV: (s.tags || []).join(","),
      payments: s.payments.map((p) => ({
        amount: p.amount, date: p.date, methodRaw: p.method, notes: p.notes || "",
        createdAt: iso(p.createdAt),
        // 這筆收費對應第幾筆續約。跟這個格式其他地方一樣用陣列索引不用 id，
        // 沒有對應就是 null。iOS 讀到不認得的欄位會直接忽略，不會壞。
        renewalIndex: (() => {
          const i = s.renewals.findIndex((r) => r.id === p.renewalId);
          return i >= 0 ? i : null;
        })(),
      })),
      renewals: s.renewals.map((r) => ({
        date: r.date, sessionsPurchased: r.sessions, amount: r.amount,
        // 上一期結轉的堂數。iOS 還沒有這個欄位，讀到不認得的鍵會直接忽略。
        carryOverSessions: r.carryOver || 0,
        // 「這筆就是 0 元，我確認過了」。iOS 讀到不認得的鍵會忽略。
        amountConfirmed: !!r.amountOk,
        notes: r.notes || "", createdAt: iso(r.createdAt),
      })),
      inbody: [],
      exercises: [],
    })),
    lessons: S.lessons.map((l) => ({
      title: "", date: l.date, startTime: l.start, endTime: l.end,
      statusRaw: l.status, notes: l.notes || "", locationName: l.location || "",
      consumedSession: !!l.consumed, consumedPartnerSession: !!l.partnerConsumed,
      owedSession: !!l.owed, owedPartnerSession: !!l.partnerOwed,
      createdAt: iso(l.createdAt), updatedAt: iso(l.createdAt),
      studentIndex: indexOf.has(l.studentId) ? indexOf.get(l.studentId) : null,
      partnerIndex: indexOf.has(l.partnerId) ? indexOf.get(l.partnerId) : null,
      // 正課／檢測、成交結果、單堂顏色、檢測對象（iOS 也是這幾個鍵）
      kindRaw: kindOf(l),
      outcomeRaw: outcomeOf(l),
      colorTag: l.color || "",
      leadIndex: leadIndexOf.has(l.leadId) ? leadIndexOf.get(l.leadId) : null,
    })),
    leads: S.leads.map((l) => ({
      name: l.name, phone: l.phone, email: l.email || "",
      sourceRaw: l.source === "walkIn" ? "walk-in" : l.source,
      statusRaw: l.status, notes: l.notes || "",
      createdAt: iso(l.createdAt), updatedAt: iso(l.updatedAt),
    })),
    locations: [],
    settings: {
      employmentType: S.settings.employment,
      // 身份。iOS 用同一個鍵（一般教練／承攬教練），兩邊搬得過去。
      userRole: roleOf(),
      defaultLessonDurationMinutes: String(S.settings.defaultDuration),
      // iOS 還沒有這個設定。讀到不認得的鍵會直接忽略，不會壞。
      lowSessionsThreshold: String(Math.max(1, +S.settings.lowSessions || 3)),
      customFieldDefinitions: JSON.stringify(S.settings.customFields),
      // 型別與選項。iOS 只讀上面那個名稱陣列，多這一個鍵它會忽略。
      customFieldSpecs: JSON.stringify(S.settings.customFieldSpecs || {}),
      coachPackages: JSON.stringify(S.settings.packages.map((p) => ({
        id: p.id, name: p.name, sessions: p.sessions, price: p.price,
      }))),
      salaryRule: JSON.stringify(S.settings.salary),
      // iOS 的 TagStore 用 {id,name,colorHex}，網頁用 {id,name,color}，這裡轉一次
      studentTags: JSON.stringify(allTags().map((t) => ({
        id: t.id, name: t.name, colorHex: t.color,
      }))),
      colorTheme: "amber",
    },
  };
}

function exportData() {
  saveFile(`coach-mate-backup-${today()}.json`, JSON.stringify(buildBackup(), null, 2));

      <p class="row-sub" style="margin:0 0 12px">

/** 把備份檔（iOS 或網頁版產生的）讀成網頁版的資料結構 */
function parseBackup(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.students)) {
    throw new Error("這不是教練小幫手的備份檔");
  }
  if (raw.version > 1) throw new Error(`這個備份是較新版本（v${raw.version}）建立的`);

  const dayOf = (isoStr) => {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    return isNaN(d) ? "" : dayStr(d);
  };
  const parseJSON = (s, fallback) => {
    try { return JSON.parse(s); } catch { return fallback; }
  };

  const students = raw.students.map((d, i) => ({
    id: uid(), _i: i,
    name: d.name || "", phone: d.phone || "", email: d.email || "",
    rate: d.rate || 0,
    totalPurchased: d.totalPurchasedSessions || 0,
    remaining: d.remainingSessions || 0,
    notes: d.notes || "",
    color: d.color || STUDENT_COLORS[i % STUDENT_COLORS.length],
    expiry: dayOf(d.packageExpiryDate),
    // 匯入這條路也要正規化，不然從 App 搬過來的「魔羯座」還是兩種寫法
    custom: normalizeCustom(parseJSON(d.customFieldsJSON, {}) || {}),
    renewalCount: d.renewalCount || 0,
    mayNotRenew: !!d.mayNotRenew,
    acquisition: ACQUISITION[d.acquisitionRaw] ? d.acquisitionRaw : "selfDeveloped",
    status: ["active", "paused", "archived"].includes(d.statusRaw) ? d.statusRaw : "active",
    ...(() => {
      // 續約要先有 id，收費才接得回去。舊備份沒有 renewalIndex，
      // 那就交給 linkLegacyPayments 用日期＋金額去配。
      const renewals = (d.renewals || []).map((r) => ({
        id: uid(), date: r.date || "", sessions: r.sessionsPurchased || 0,
        amount: r.amount || 0, carryOver: Math.max(0, +r.carryOverSessions || 0),
        amountOk: !!r.amountConfirmed,
        notes: r.notes || "", createdAt: r.createdAt,
      }));
      const payments = (d.payments || []).map((p) => {
        const i = p.renewalIndex;
        const linked = Number.isInteger(i) && renewals[i] ? renewals[i].id : "";
        return {
          id: uid(), amount: p.amount || 0, date: p.date || "",
          method: p.methodRaw || "cash", notes: p.notes || "", createdAt: p.createdAt,
          ...(linked ? { renewalId: linked } : {}),
        };
      });
      return { renewals, payments: linkLegacyPayments(payments, renewals) };
    })(),
    // 顏色標籤：舊備份沒有這一欄
    tags: typeof d.tagsCSV === "string"
      ? d.tagsCSV.split(",").map((x) => x.trim()).filter(Boolean)
      : [],
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  // 名單要排在課程前面還原：檢測掛在名單上，順序反了就對不到人
  const leads = (raw.leads || []).map((d) => ({
    id: uid(), name: d.name || "", phone: d.phone || "", email: d.email || "",
    source: d.sourceRaw === "walk-in" ? "walkIn" : (LEAD_SOURCE[d.sourceRaw] ? d.sourceRaw : "other"),
    status: LEAD_STATUS[d.statusRaw] ? d.statusRaw : "pending",
    notes: d.notes || "",
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  const lessons = (raw.lessons || []).map((d) => ({
    id: uid(),
    date: d.date || "", start: d.startTime || "09:00", end: d.endTime || "10:00",
    status: LESSON_STATUS[d.statusRaw] ? d.statusRaw : "scheduled",
    notes: d.notes || "", location: d.locationName || "",
    studentId: students[d.studentIndex]?.id || "",
    partnerId: students[d.partnerIndex]?.id || "",
    consumed: !!d.consumedSession, partnerConsumed: !!d.consumedPartnerSession,
    owed: !!d.owedSession, partnerOwed: !!d.owedPartnerSession,
    // 正課／檢測。舊備份沒有這幾欄，一律當正課。
    kind: d.kindRaw === "assessment" ? "assessment" : "lesson",
    outcome: OUTCOME[d.outcomeRaw] ? d.outcomeRaw : "pending",
    color: typeof d.colorTag === "string" ? d.colorTag : "",
    leadId: leads[d.leadIndex]?.id || "",
    createdAt: d.createdAt || new Date().toISOString(),
  }));

  const rawSettings = raw.settings || {};
  const settings = clone(DEFAULT_SETTINGS);
  if (rawSettings.employmentType) settings.employment = rawSettings.employmentType;
  if (rawSettings.userRole) {
    settings.role = rawSettings.userRole === "contractor" ? "contractor" : "coach";
  }
  if (rawSettings.defaultLessonDurationMinutes) {
    settings.defaultDuration = clampDuration(+rawSettings.defaultLessonDurationMinutes);
  }
  if (rawSettings.lowSessionsThreshold) {
    settings.lowSessions = Math.max(1, Math.round(+rawSettings.lowSessionsThreshold) || 3);
  }
  const fields = parseJSON(rawSettings.customFieldDefinitions, null);
  if (Array.isArray(fields)) settings.customFields = fields.filter((f) => typeof f === "string");
  const specs = parseJSON(rawSettings.customFieldSpecs, null);
  if (specs && typeof specs === "object") settings.customFieldSpecs = specs;
  const pkgs = parseJSON(rawSettings.coachPackages, null);
  if (Array.isArray(pkgs)) {
    settings.packages = pkgs.map((p) => ({
      id: p.id || uid(), name: p.name || "方案",
      sessions: p.sessions || 0, price: p.price || 0,
    }));
  }
  const salary = parseJSON(rawSettings.salaryRule, null);
  if (salary && typeof salary === "object") {
    settings.salary = {
      ...DEFAULT_SALARY, ...salary,
      tiers: Array.isArray(salary.tiers)
        ? salary.tiers.map((t) => ({ minSessions: t.minSessions || 0, percent: t.percent || 0 }))
        : DEFAULT_SALARY.tiers,
    };
  }
  // 顏色標籤。iOS 存的是 colorHex，網頁用 color。
  const tags = parseJSON(rawSettings.studentTags, null);
  if (Array.isArray(tags)) {
    settings.tags = tags
      .filter((t) => t && t.id && t.name)
      .map((t) => ({ id: t.id, name: t.name, color: t.colorHex || t.color || TAG_COLORS[0] }));
  }
  settings.theme = S.settings.theme;   // 外觀是這台裝置的偏好，不跟著備份走

  students.forEach((s) => delete s._i);
  return { students, lessons, leads, settings };
}

function importFile(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("讀不到這個檔案");
  reader.onload = () => {
    let parsed;
    try {
      parsed = parseBackup(JSON.parse(reader.result));
    } catch (e) {
      openSheet({
        title: "匯入失敗",
        body: `<p style="margin:0;color:var(--ink-2)">${esc(e.message || "檔案格式不對")}<br>
               請選擇從教練小幫手匯出的 JSON 備份檔。</p>`,
      });
      return;
    }
    askImportMode(parsed);
  };
  reader.readAsText(file);
}

/** 讀進來之後、真的寫進去之前，問一下要合併還是取代 */
function askImportMode(parsed) {
  const summary = `${parsed.students.length} 位學生・${parsed.lessons.length} 堂課・${parsed.leads.length} 筆名單`;
  openSheet({
    title: "要怎麼匯入？",
    body: `
      <div class="note-box" style="margin-bottom:14px">備份內容：${summary}</div>
      <p style="margin:0 0 6px;color:var(--ink-2)"><strong>合併</strong>：保留現在的資料，把備份加進來。同名同電話的學生視為同一人，不會重複建立。</p>
      <p style="margin:0;color:var(--ink-2)"><strong>取代</strong>：先清空現在的資料，整份換成備份的內容。</p>`,
    extraFoot: `<button class="btn btn-sm" type="button" data-action="do-merge">合併</button>`,
    confirmLabel: "取代全部",
    onConfirm: () => applyImport(parsed, "replace"),
    onMount: (root) => {
      root.addEventListener("click", (e) => {
        if (!e.target.closest('[data-action="do-merge"]')) return;
        applyImport(parsed, "merge");
        closeSheet();
      });
    },
  });
}

function applyImport(parsed, mode) {
  if (mode === "replace") {
    S = { students: parsed.students, lessons: parsed.lessons, leads: parsed.leads, settings: parsed.settings };
  } else {
    const keyOf = (s) => `${(s.name || "").trim()}|${(s.phone || "").trim()}`;
    const existing = new Map(S.students.map((s) => [keyOf(s), s]));
    const remap = new Map();
    for (const s of parsed.students) {
      const hit = existing.get(keyOf(s));
      if (hit && (s.name || s.phone)) {
        remap.set(s.id, hit.id);
      } else {
        S.students.push(s);
        existing.set(keyOf(s), s);
        remap.set(s.id, s.id);
      }
    }
    // 課也要比對「是不是同一堂」。學生早就有「同名同電話視為同一人」，
    // 課卻完全沒有 —— 重匯一次、或匯入一份跟這台有共同歷史的備份，
    // 那些課會整批再長一次（iOS 那邊 2026-08-11 修過同一條）。
    // 同一位、同一天、同一個開始時間就是同一堂：本來就擋掉時段重疊的課。
    const lessonKey = (l) => `${l.studentId || "-"}@${l.date} ${l.start}`;
    const seenLessons = new Set(S.lessons.map(lessonKey));
    for (const l of parsed.lessons) {
      l.studentId = remap.get(l.studentId) || "";
      l.partnerId = remap.get(l.partnerId) || "";
      const key = lessonKey(l);
      if (seenLessons.has(key)) continue;
      seenLessons.add(key);
      S.lessons.push(l);
    }
    S.leads.push(...parsed.leads);
    // 合併時只補上目前沒有的自訂欄位，其他設定維持這台裝置的
    for (const f of parsed.settings.customFields) {
      if (!S.settings.customFields.includes(f)) S.settings.customFields.push(f);
    }
  }
  save(); render();
  toast(mode === "replace" ? "已用備份取代原本的資料" : "已合併備份資料");
}

/* ── 示範資料 ───────────────────────────────── */

function seedDemo() {
  const names = DEMO_NAMES;
  const jobs = ["工程師", "護理師", "老師", "業務", "設計師", "工程師", "自由業", "護理師"];
  const genders = ["女", "男", "女", "男", "男", "女", "男", "女"];
  const births = ["1994-03-12", "1988-11-02", "1999-06-25", "1985-01-30", "1996-09-08", "1992-12-19", "1979-04-14", "2001-07-07"];

  const students = names.map((name, i) => {
    const total = [10, 20, 10, 30, 20, 10, 20, 10][i];
    const used = [7, 4, 9, 12, 18, 1, 6, 10][i];
    const rate = [1100, 1000, 1200, 950, 1000, 1300, 1000, 1150][i];
    const s = newStudent({
      name, phone: "09" + String(10000000 + i * 1111111).slice(0, 8),
      rate, totalPurchased: total, remaining: Math.max(0, total - used),
      color: STUDENT_COLORS[i % STUDENT_COLORS.length],
      acquisition: ["selfDeveloped", "referral", "companyLead"][i % 3],
      custom: { "性別": genders[i], "職業": jobs[i], "生日": births[i] },
      renewalCount: i % 3,
    });
    s.payments = [{ id: uid(), amount: rate * total, date: dayStr(addDays(new Date(), -20 - i * 9)),
                    method: i % 2 ? "transfer" : "cash", notes: `${total} 堂方案`, createdAt: new Date().toISOString() }];
    s.renewals = [{ id: uid(), date: dayStr(addDays(new Date(), -20 - i * 9)), sessions: total,
                    amount: rate * total, notes: "", createdAt: new Date().toISOString() }];
    return s;
  });

  const lessons = [];
  const slots = [["09:00", 90], ["11:00", 60], ["14:00", 90], ["19:00", 60], ["20:30", 90]];
  for (let d = -21; d <= 14; d++) {
    const date = dayStr(addDays(new Date(), d));
    const wd = (parseDay(date).getDay() + 6) % 7;
    if (wd >= 5) continue;
    const n = 2 + (Math.abs(d) % 2);
    for (let k = 0; k < n; k++) {
      const [start, mins] = slots[(Math.abs(d) + k) % slots.length];
      const st = students[(Math.abs(d) * 3 + k) % students.length];
      lessons.push({
        id: uid(), date, start, end: timeOf(minutesOf(start) + mins),
        status: d < 0 ? (Math.abs(d) % 11 === 0 ? "absent" : "attended") : "scheduled",
        notes: "", location: "", studentId: st.id, partnerId: "",
        consumed: d < 0 && Math.abs(d) % 11 !== 0, partnerConsumed: false, owed: false, partnerOwed: false,
        createdAt: new Date().toISOString(),
      });
    }
  }

  const leadNames = [["周子瑜", "referral", "converted"], ["何柏叡", "online", "contacted"],
                     ["蔡沐恩", "company", "pending"], ["鄭雅文", "walkIn", "converted"],
                     ["謝定澄", "online", "pending"], ["曾苡宸", "referral", "contacted"],
                     ["高子萱", "company", "converted"]];
  const leads = leadNames.map(([name, source, status], i) => ({
    id: uid(), name, phone: "", email: "", source, status,
    notes: status === "pending" ? "等對方回訊息" : "",
    createdAt: addDays(new Date(), -40 + i * 5).toISOString(),
    updatedAt: addDays(new Date(), -6 + i).toISOString(),
  }));

  S = {
    students, lessons, leads,
    settings: { ...clone(DEFAULT_SETTINGS), theme: S.settings.theme, employment: "company" },
  };
  save(); render();
  toast(`已載入示範資料：${students.length} 位學生・${lessons.length} 堂課`);
}

        save(); render(); toast(`欄位改名為「${el.value.trim()}」，已填的資料一起搬過去了`);
      } else { render(); }   // 沒改成功就把輸入框還原成原本的名字
      return;
    }
    if (action === "set-field-type") {
      const specs = S.settings.customFieldSpecs || (S.settings.customFieldSpecs = {});
      const name = el.dataset.value;
      specs[name] = { ...(specs[name] || {}), type: el.value };
      save(); render();
      return;
    }
    if (action === "set-field-options") {
      const specs = S.settings.customFieldSpecs || (S.settings.customFieldSpecs = {});
      const name = el.dataset.value;
      // 全形與半形逗號、頓號都當分隔符 —— 使用者不會記得該打哪一個
      specs[name] = { ...(specs[name] || {}),
        options: el.value.split(/[,，、]/).map((x) => x.trim()).filter(Boolean) };
      save(); render();
      return;
    }
    if (action === "set-low-sessions") {
      // 至少 1 —— 設成 0 的話這個提醒等於關掉，但畫面上看不出來是關的
      const v = Math.max(1, Math.round(+el.value) || 1);
      S.settings.lowSessions = v;
      el.value = v;
      save(); render();
      return;
    }
  }

  if (e.target.id === "import-file" && e.target.files?.[0]) {
    importFile(e.target.files[0]);
    e.target.value = "";
  }
});

document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();

  if (form.dataset.form === "add-field") {
    const name = form.elements.field.value.trim();
    if (!name) return;
    if (S.settings.customFields.includes(name)) { toast("已經有同名欄位了"); return; }
    S.settings.customFields.push(name);
    save(); render(); toast(`已新增欄位「${name}」`);
    return;
  }

  if (form.dataset.form === "add-package") {
    const name = form.elements.name.value.trim();
    const sessions = +form.elements.sessions.value || 0;
    if (!name || sessions <= 0) { toast("方案要有名稱與堂數"); return; }
    // 方案存的一律是整包的總額：續約套用時直接帶入金額欄，
    // 而那一欄存進續約紀錄的也是總額（銷售統計與抽成都拿總額算）。
    const typed = Math.max(0, +form.elements.price.value || 0);
    const price = form.elements.priceMode.value === "unit" ? typed * sessions : typed;
    S.settings.packages.push({ id: uid(), name, sessions, price });
    save(); render();
    toast(`已加入方案「${name}」・${sessions} 堂 ${money(price)}`);
    return;
  }

  if (form.dataset.form === "add-tier") {
    const sessions = +form.elements.sessions.value || 0;
    const percent = +form.elements.percent.value || 0;
    if (sessions <= 0 || percent <= 0 || percent > 100) {
      toast("請填有效的堂數與百分比");
      return;
    }
    S.settings.salary.tiers = S.settings.salary.tiers.filter((t) => t.minSessions !== sessions);
    S.settings.salary.tiers.push({ minSessions: sessions, percent });
    save();
    render();
    // 重畫之後把焦點放回堂數欄，接著填下一級
    const next = $('[data-form="add-tier"] [name="sessions"]');
    if (next) next.focus();
    toast(`已加入：滿 ${sessions} 堂抽 ${percent}%`);
  }
});

/* ════════════════════════════════════════════════
   7.5 加到主畫面時把資料帶過去

   iOS 的「加入主畫面」會開一個獨立的儲存空間，跟 Safari 裡的
   localStorage **完全不互通**。教練在 Safari 建好一堆學生，加到主畫面
   打開卻是空的，看起來像資料不見了。這不是 bug，是 iOS 的行為，
   而且沒有任何 API 能直接共用。

   唯一能穿過去的通道是「網址」：加入主畫面時，iOS 會把當下完整的網址
   （含 # 後面的片段）存進那個圖示。所以做法是先把備份塞進 location.hash，
   再請使用者加到主畫面；桌面版第一次打開就從 hash 把資料撈回來。

   # 後面的內容不會送到伺服器，GitHub Pages 只會拿到 index.html。
   ════════════════════════════════════════════════ */

/** 現在是從主畫面圖示打開的嗎 */
function isStandalone() {
  // 這個判斷會被畫面用到，任何一個屬性取不到就整頁白掉，所以一路用 ?.
  return window.navigator?.standalone === true
      || window.matchMedia?.("(display-mode: standalone)")?.matches === true;
}

/** 網址太長 iOS 會存不住。超過這個長度就不要走 hash，改請人用複製貼上。 */
const HANDOFF_MAX = 60000;
const HANDOFF_KEY = "coach-mate-handoff-done";

const b64encode = (bytes) => {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  // 網址片段裡 + / = 會被各種東西誤解，換成 URL 安全的字元
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64decode = (str) => {
  const padded = str.replace(/-/g, "+").replace(/_/g, "/")
    + "=".repeat((4 - (str.length % 4)) % 4);
  const bin = atob(padded);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
};

/** 壓縮過的備份。CompressionStream 在舊瀏覽器沒有，就退回不壓縮。 */
async function encodeHandoff() {
  const json = JSON.stringify(buildBackup());
  const raw = new TextEncoder().encode(json);
  if (typeof CompressionStream === "undefined") return "r" + b64encode(raw);
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));
  const packed = new Uint8Array(await new Response(stream).arrayBuffer());
  return "z" + b64encode(packed);
}

async function decodeHandoff(payload) {
  const kind = payload[0];
  const bytes = b64decode(payload.slice(1));
  if (kind === "r") return JSON.parse(new TextDecoder().decode(bytes));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

/**
 * 啟動時檢查網址裡有沒有要帶進來的資料。
 * 圖示裡的網址不會變，所以同一份資料只認一次，否則每次打開都會蓋掉。
 */
async function consumeHandoff() {
  const match = /[#&]import=([^&]+)/.exec(location.hash || "");
  if (!match) return false;
  const payload = match[1];

  // 這份 payload 已經帶進來過了就跳過（每次開 App 都重蓋才是災難）
  const stamp = payload.length + ":" + payload.slice(0, 24);
  try {
    if (localStorage.getItem(HANDOFF_KEY) === stamp) return false;
  } catch (e) {}

  try {
    const backup = await decodeHandoff(payload);
    const parsed = parseBackup(backup);
    const hasData = S.students.length || S.lessons.length;
    // 這台已經有資料了就不要默默蓋掉，先問過
    if (hasData && !confirm(
      `這個連結帶著一份資料（${parsed.students.length} 位學生、${parsed.lessons.length} 堂課）。`
      + `要用它取代目前這台裝置上的 ${S.students.length} 位學生嗎？`)) {
      try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
      return false;
    }
    S = parsed;
    save();
    try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
    toast(`已帶進 ${S.students.length} 位學生`);
    return true;
  } catch (e) {
    console.warn("網址裡的資料讀不出來", e);
    toast("網址裡的資料讀不出來，請改用「貼上備份文字」");
    return false;
  }
}

/** 「加到主畫面」的引導 */

  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const hasData = S.students.length > 0 || S.lessons.length > 0;

  if (hasData) {
    try {
      payload = await encodeHandoff();
      tooBig = payload.length > HANDOFF_MAX;
    } catch (e) {
      tooBig = true;
    }
  }

  const steps = ios
    ? `<li>點畫面<strong>下方中間的分享圖示</strong>（往上的箭頭）</li>
       <li>往下捲，選<strong>「加入主畫面」</strong></li>

       <li>選<strong>「加到主畫面」</strong>或「安裝應用程式」</li>`;

    body: `
      <p class="row-sub" style="margin:0 0 12px">

      </p>

      ${hasData ? `
        <div class="note-box" style="margin-bottom:12px">
          <strong>重要：主畫面的圖示跟現在這個瀏覽器，資料是分開的。</strong>
          你現在的 ${S.students.length} 位學生<u>不會</u>自動跑過去。
          ${tooBig
            ? `你的資料量比較大，沒辦法用網址帶過去。請改走這條：
               先按「複製備份文字」把資料複製起來 → 加到主畫面 → 打開桌面圖示 →
               設定 → 貼上備份文字 → 取代全部。`
            : `按下面的按鈕，我會把資料放進網址裡，你接著照步驟加到主畫面，
               第一次打開就會自動帶進去。`}
        </div>` : `
        <div class="note-box" style="margin-bottom:12px">
          你現在還沒有資料，<strong>這是最好的時機</strong>——先加到主畫面，
          之後都從桌面圖示開來輸入，就不會有資料分兩邊的問題。
        </div>`}

      <p style="font-weight:650;margin:0 0 6px">加入的步驟</p>
      <ol style="margin:0;padding-left:20px;line-height:2;font-size:14px">${steps}</ol>

      ${hasData && !tooBig ? `
        <p class="hint" style="margin-top:12px">
          按「好，我要開始加」之後，網址會變長（那是你的資料），這是正常的。
          接著再照上面的步驟操作。加完之後打開桌面圖示，資料就在裡面了。
        </p>` : ""}
      ${hasData && tooBig ? `
        <button class="btn btn-sm" type="button" data-action="copy-backup" style="margin-top:12px">
          複製備份文字
        </button>` : ""}`,
    onConfirm: () => {
      if (!hasData || tooBig) return;
      // 只改 hash 不會重新載入頁面，但網址列會更新，
      // 之後「加入主畫面」存下來的就是這一份帶著資料的網址
      location.hash = "import=" + payload;
      // 自己這一份已經有資料了，不用再帶一次
      try {
        localStorage.setItem(HANDOFF_KEY, payload.length + ":" + payload.slice(0, 24));
      } catch (e) {}
      toast("網址已經帶上你的資料，接著按分享 → 加入主畫面");
    },
  });
}

/**
 * 從主畫面圖示打開、但裡面是空的——這幾乎一定是
 * 「在 Safari 裡建了資料，加到主畫面後看不到」那個情況。
 * 直接把原因跟解法講清楚，不要讓人以為資料不見了。
 */
function standaloneEmptyNotice() {
  if (!isStandalone()) return "";
  if (S.students.length || S.lessons.length) return "";
  return `
    <section class="card" style="border:1px solid var(--warn)">
      <div class="sec-head"><h2 class="sec-title">這裡是空的？你的資料還在</h2></div>
      <p class="row-sub" style="margin:0 0 10px">
        主畫面的圖示跟瀏覽器裡的網頁，<strong>資料是分開存的</strong>（這是 iPhone 的規則，
        不是資料不見了）。之前在瀏覽器裡輸入的學生，還好好地留在那邊。
      </p>
      <p class="row-sub" style="margin:0 0 12px">
        搬過來的方法：回到<strong>瀏覽器</strong>打開同一個網址 → 設定 →
        <strong>複製備份文字</strong> → 回到這個圖示 → 下面的<strong>貼上備份文字</strong> → 取代全部。
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" type="button" data-action="paste-backup">貼上備份文字</button>
        <button class="btn btn-sm" type="button" data-action="import">選擇備份檔</button>
      </div>
    </section>`;
}

/* ════════════════════════════════════════════════
   7.6 有新版本的時候

   加到主畫面的圖示沒有網址列，也就沒有重新整理按鈕、沒有下拉更新。
   GitHub Pages 的快取是十分鐘，所以教練「完全關掉 App 再打開」時
   會拿到新版——但只是切出去再切回來並不會，可能一直停在舊版好幾天，
   而且你完全不知道他們看到的是哪一版。

   做法：讀一個很小的 version.json（明確不用快取），跟自己內建的
   BUILD 比對，不一樣就跳一條橫幅讓人按一下更新。

   沒有用 service worker。它能做真正的離線快取，但也是「更新卡住」
   這類 bug 的頭號來源，而這裡要解的是更新通知，不是離線。
   ════════════════════════════════════════════════ */

/** 最近一次檢查的時間，避免切來切去就狂打 */
let lastUpdateCheck = 0;
const UPDATE_CHECK_INTERVAL = 5 * 60 * 1000;   // 5 分鐘
let updateBannerShown = false;

async function checkForUpdate({ force = false } = {}) {
  // 本機用檔案打開時沒有 version.json，不用檢查
  if (location.protocol === "file:") return;
  if (typeof fetch !== "function") return;
  if (navigator.onLine === false) return;
  if (updateBannerShown) return;

  const now = Date.now();
  if (!force && now - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
  lastUpdateCheck = now;

  try {
    // cache: no-store 是關鍵：不然連版本檔本身都可能拿到快取的舊值
    const res = await fetch("version.json", { cache: "no-store" });
    if (!res.ok) return;
    const { build } = await res.json();
    if (build && build !== BUILD) showUpdateBanner(build);
  } catch (e) {
    // 沒網路、擋掉了、檔案不在——都靜靜算了，不能影響離線使用
  }
}

function showUpdateBanner(newBuild) {
  if (updateBannerShown) return;
  updateBannerShown = true;

  const bar = document.createElement("div");
  bar.className = "update-bar";
  bar.innerHTML = `
    <span class="update-text">
      <strong>有新版本可以用了</strong>
      <span class="update-sub">目前 ${esc(BUILD)}　→　${esc(newBuild)}</span>
    </span>
    <button type="button" class="btn btn-primary btn-sm" data-update-now>立即更新</button>
    <button type="button" class="btn btn-sm btn-ghost" data-update-later aria-label="稍後再說">✕</button>`;
  document.body.appendChild(bar);

  bar.querySelector("[data-update-now]").addEventListener("click", applyUpdate);
  bar.querySelector("[data-update-later]").addEventListener("click", () => {
    bar.remove();
    // 關掉之後這次開啟就不再吵，下次重開再說
  });
}

async function applyUpdate() {
  // 資料在 localStorage，重載不會弄丟，但還是先確保寫進去了
  try { save(); } catch (e) {}

  // 沒有註冊 service worker，但如果哪天有了，這裡先清掉才不會又載到舊的
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) {}

  // 帶一個一次性參數繞過 HTTP 快取。單靠 location.reload() 不一定
  // 會重新跟伺服器要檔案。載入後會把這個參數拿掉，網址保持乾淨。
  const url = new URL(location.href);
  url.searchParams.set("_v", Date.now().toString(36));
  location.replace(url.toString());
}

/** 重載完把繞過快取用的參數清掉，不然它會一直留在網址上 */
function stripCacheBuster() {
  // 這是開機路徑上的程式碼，取不到東西就整頁白掉，所以一路防
  if (!(location.search || "").includes("_v=")) return;
  if (typeof URL !== "function" || !history?.replaceState) return;
  const url = new URL(location.href);
  url.searchParams.delete("_v");
  history.replaceState(null, "", url.pathname + url.search + url.hash);
}

/* ════════════════════════════════════════════════
   8. 啟動
   ════════════════════════════════════════════════ */

// 每個人打開都是自己的空白帳本，不預先塞示範資料——
// 這是要給不同教練各自試用的，別人的假學生混在裡面只會擋路。
// 想先看看長什麼樣子，總覽頁與設定頁都有「載入示範資料」。
const loaded = load();
let startupRefund = null;
if (loaded) {
  S = loaded;
  // 一次性補救：2026-08-11 有一版把「補登的課」也扣了堂數（剩餘是 0 的還會
  // 記成欠課）。那是錯的——補的是歷史，剩餘堂數早就反映過了。
  // 自動跑，不要求使用者自己去設定裡找按鈕；跑過就記一個旗標，不會跑第二次。
  if (!S.settings.backfillRefundDone) {
    const r = refundBackfilledLessons();
    S.settings.backfillRefundDone = true;
    if (r.refunded || r.cleared) startupRefund = r;
  }
  autoMarkPastLessons();
  if (S.settings.salesPeriod) salesPeriod = S.settings.salesPeriod;
  save();
} else {
  S = blankState();
}

render();

// 補回來了要講一聲，不然堂數自己變多也很嚇人
if (startupRefund) {
  toast(`已把補登時誤扣的堂數還回去：${startupRefund.refunded} 堂`
    + (startupRefund.cleared ? `，並清掉 ${startupRefund.cleared} 筆欠課` : ""));
}

// 網址裡如果帶著資料（從瀏覽器加到主畫面時放進去的），把它撈出來。
// 放在 render() 之後：解壓縮是非同步的，不要為了它讓畫面空白著。
function runHandoff() {
  consumeHandoff().then((imported) => {
    if (imported) {
      autoMarkPastLessons();
      save();
      render();
    }
  });
}
runHandoff();

// 頁面已經開著的時候只換 hash 不會重新載入（例如把帶資料的連結
// 貼進網址列）。這時候什麼都不做會看起來像連結壞掉，所以也接一下。
window.addEventListener("hashchange", runHandoff);

// 有沒有新版本。開啟時查一次，之後每次從背景切回來也查
//（教練多半是把 App 留在背景，不會真的關掉再開）。
stripCacheBuster();
checkForUpdate({ force: true });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});
</script>

</body>
