}

function renewSheet(student) {
  const packages = S.settings.packages;
  openSheet({
    title: `續約 · ${student.name}`,
    body: `
      <div class="note-box" style="margin-bottom:14px">
        目前剩 <strong class="mono">${student.remaining}</strong> 堂，累計購買 <strong class="mono">${student.totalPurchased}</strong> 堂。
        ${student.remaining > 0
          ? `<br>還沒上完就先續約沒關係——<strong>剩下的 ${student.remaining} 堂會結轉</strong>，跟這次買的加在一起。`
          : ""}
      </div>
      ${packages.length ? fieldSelect("pkg", "選擇方案",
        [["", "自己填"], ...packages.map((p) => [p.id, `${p.name}・${p.sessions} 堂・${money(p.price)}`])], "") : ""}
      <div class="seg" style="max-width:260px;margin-bottom:8px">
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="priceMode" value="total">
      <div class="field-row">
        ${fieldText("sessions", "加購堂數", 10, { type: "number", required: true })}
        ${fieldText("amount", "總額", "", { type: "number" })}
      </div>
      <p class="hint" data-price-hint>存進去的一律是總額——銷售統計與業績抽成都是拿總額去算的。</p>
      ${fieldText("carryOver", "上一期剩下的堂數", student.remaining || 0, { type: "number",
        hint: "自動帶入他現在手上的堂數。只是記下「這一期有幾堂是上次留下來的」，"
            + "不會再加一次到剩餘堂數裡。補以前的紀錄時改成當時的數字。" })}
      <p class="hint" data-carry-hint></p>
      <div class="field-row">
        ${fieldText("date", "合約日期", today(), { type: "date",
          hint: "簽約的那一天。銷售統計與「依簽約」計薪的業績都照這個日期分月。" })}
        ${fieldSelect("method", "付款方式", [["cash", "現金"], ["transfer", "轉帳"], ["other", "其他"]], "cash")}
      </div>
      <div class="switch">
        <label for="f-separatePayDate">收費日期與合約不同天</label>
        <input id="f-separatePayDate" name="separatePayDate" type="checkbox">
      </div>
      <div data-pay-date hidden>
        ${fieldText("payDate", "收費日期", today(), { type: "date",
          hint: "錢什麼時候進來。收入算在這個月，業績留在合約那個月。" })}
      </div>
      ${fieldText("expiry", "新的到期日", student.expiry, { type: "date", hint: "留白就不改" })}
      ${fieldText("notes", "備註", "")}
      <div class="divider"></div>
      <div class="switch">
        <label for="f-addOn">這是加購活動（綁在目前的合約底下）</label>
        <input id="f-addOn" name="addOn" type="checkbox">
      </div>
      <p class="hint">主約底下再加賣的小方案（4 堂、2 堂那種）。堂數一樣加給學生、
        錢一樣算進銷售，但<strong>不算又續一次約</strong>，剩餘堂數的分母也會併進同一期。</p>
      <div class="switch">
        <label for="f-backfill">補登以前的續約</label>
        <input id="f-backfill" name="backfill" type="checkbox">
      </div>
      <p class="hint">補以前的紀錄用。堂數一樣算進「已購」與銷售統計，但<strong>不會加到剩餘堂數</strong>——那些課早就上完了，加上去會灌水。</p>
      <div class="switch">
        <label for="f-recordPayment">同時新增收費紀錄</label>
        <input id="f-recordPayment" name="recordPayment" type="checkbox" checked>
      </div>
      <p class="hint">這筆錢如果在「收費」那邊已經記過了，取消勾選，否則累計收費與月營收會重複計算。</p>`,
    confirmLabel: "確認續約",
    onConfirm: (form) => {
      const sessions = +form.elements.sessions.value || 0;
      if (sessions <= 0) { toast("加購堂數要大於 0"); return false; }
      // 存進去的一律是總額。銷售統計的均價是「總額 ÷ 堂數」除出來的，
      // 業績抽成也是直接乘總額 —— 存單價的話兩邊都會少一個數量級。
      const typed = +form.elements.amount.value || 0;
      const amount = form.elements.priceMode.value === "unit" ? typed * sessions : typed;
      const date = form.elements.date.value || today();
      // 收費日期預設跟合約同一天。分開填是很常見的：這個月簽約、下個月才
      // 轉帳。混在一起的話收入會記到錯的月份，而業績本來就該留在簽約那個月。
      const payDate = (form.elements.separatePayDate && form.elements.separatePayDate.checked
        && form.elements.payDate.value) || date;
      // 補登舊紀錄時只補「歷史」，不動「現況」。
      // 已購與續約紀錄是歷史（銷售統計要用），剩餘堂數是現況——
      // 三個月前買的 10 堂早就上完了，加回剩餘會憑空多出十堂課。
      const backfill = form.elements.backfill.checked;
      // 上一期沒用完的堂數。**在加新堂數之前**讀，那時候的 remaining 就是結轉。
      // 只是記下來（分母與說明要用），不會再加一次進 remaining ——
      // 那些課本來就已經在 remaining 裡了。
      const carryOver = Math.max(0, +form.elements.carryOver.value || 0);
      // 加購是綁在主約底下的小活動，不是又續一次約 —— 次數不加
      const addOn = !!(form.elements.addOn && form.elements.addOn.checked);
      // 而且**日期跟到期日都跟著主約**，不另外記一個 ——
      // 加購自己一個日期的話，銷售統計會把它算到別的月份去。
      const mainForAddOn = addOn ? currentPackageParts(student).main : null;
      const recordDate = mainForAddOn ? (mainForAddOn.date || date) : date;
      student.totalPurchased += sessions;
      if (!backfill) student.remaining += sessions;
      if (!addOn) student.renewalCount += 1;
      if (form.elements.expiry.value && !addOn) student.expiry = form.elements.expiry.value;
      const renewalId = uid();
      student.renewals.push({ id: renewalId, date: recordDate, sessions, amount, carryOver, addOn,
                              ...(mainForAddOn ? { mainId: mainForAddOn.id, expiry: mainForAddOn.expiry || "" } : {}),
                              notes: form.elements.notes.value, createdAt: new Date().toISOString() });
      // 舊的錢常常已經記過了，再記一次會讓營收憑空翻倍，所以能關掉。
      // 但**金額 0 也要記**：不記的話續約紀錄與收費紀錄的筆數就對不起來，
      // 對帳時會以為漏了一筆。0 元本身也是資訊（贈送、補課、待收）。
      if (form.elements.recordPayment.checked) {
        student.payments.push({
          // 存關聯而不是把堂數抄成字串：抄過去的數字改續約時不會跟著動。
          id: uid(), renewalId, amount, date: payDate, method: form.elements.method.value,
          // 刻意不把堂數寫進備註。這行是建立當下凍住的字串，之後改續約紀錄
          // 的堂數它不會跟著動，而兩邊沒有關聯欄位可以追 —— 重複記一份遲早
          // 不同步。堂數的真相在續約紀錄裡。
          notes: form.elements.notes.value || "續約", createdAt: new Date().toISOString(),
        });
      }
      student.updatedAt = new Date().toISOString();
      save(); render();
      // 補登不加剩餘堂數是刻意的，但**要講出來** —— 只說「已補登 N 堂」的話，
      // 使用者會回頭看剩餘堂數沒動，以為沒存進去（2026-08-17 回報）
      toast(backfill
        ? `已補登 ${student.name} ${sessions} 堂・剩餘堂數不變（仍 ${student.remaining} 堂）`
        : `${student.name} 續約 ${sessions} 堂・剩餘 ${student.remaining} 堂`);
    },
    onMount: (root) => {
      const modeInput = root.querySelector('[name="priceMode"]');
      const amountInput = root.querySelector('[name="amount"]');
      const sessionsInput = root.querySelector('[name="sessions"]');
      const amountLabel = root.querySelector('label[for="f-amount"]');
      const hint = root.querySelector("[data-price-hint]");

      // 續約完手上會有幾堂，在按下確認之前就要看得到 ——
      // 「這次買的 ＋ 上期剩的」是使用者心裡真正在算的那個數字。
      const carryInput = root.querySelector('[name="carryOver"]');
      const carryHint = root.querySelector("[data-carry-hint]");
      const backfillBox = root.querySelector('[name="backfill"]');
      const refreshCarry = () => {
        if (!carryHint || !carryInput) return;
        const n = Math.max(0, +sessionsInput.value || 0);
        const c = Math.max(0, +carryInput.value || 0);
        if (backfillBox && backfillBox.checked) {
          carryHint.textContent = "補登不會加剩餘堂數，這一格只用來說明那一期手上有幾堂。";
          return;
        }
        carryHint.textContent = c
          ? `這次買 ${n} 堂 ＋ 上期剩 ${c} 堂 ＝ 續約後這一期共 ${n + c} 堂`
          : `這次買 ${n} 堂，上一期沒有剩下的堂數。`;
      };

      // 不管你用哪一種輸入，兩個數字都同時顯示出來 ——
      // 「我剛剛填的是一堂還是全部」這個問題不該在按下確認之後才想起來。
      const refresh = () => {
        refreshCarry();
        const n = Math.max(0, +sessionsInput.value || 0);
        const v = Math.max(0, +amountInput.value || 0);
        const unit = modeInput.value === "unit";
        if (amountLabel) amountLabel.textContent = unit ? "每堂單價" : "總額";
        if (!hint) return;
        if (!n || !v) {
          hint.textContent = "存進去的一律是總額——銷售統計與業績抽成都是拿總額去算的。";
          return;
        }
        hint.textContent = unit
          ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
          : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`;
      };

      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-price-mode]");
        if (!btn) return;
        e.preventDefault();
        modeInput.value = btn.dataset.priceMode;
        root.querySelectorAll("[data-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.priceMode === modeInput.value)));
        refresh();
      });
      amountInput.addEventListener("input", refresh);
      sessionsInput.addEventListener("input", refresh);
      if (carryInput) carryInput.addEventListener("input", refreshCarry);
      if (backfillBox) backfillBox.addEventListener("change", refreshCarry);
      refreshCarry();

      // 收費日期只有「不同天」時才出現；沒開的時候要跟著合約走，
      // 不然它會靜靜留在今天，收入就記到錯的月份
      const sepBox = root.querySelector('[name="separatePayDate"]');
      const payDateBox = root.querySelector("[data-pay-date]");
      const payDateInput = root.querySelector('[name="payDate"]');
      const dateInput = root.querySelector('[name="date"]');
      if (sepBox && payDateBox && payDateInput && dateInput) {
        const syncPayDate = () => {
          payDateBox.hidden = !sepBox.checked;
          if (!sepBox.checked) payDateInput.value = dateInput.value;
        };
        sepBox.addEventListener("change", syncPayDate);
        dateInput.addEventListener("change", syncPayDate);
        syncPayDate();
      }

      const pkg = root.querySelector('[name="pkg"]');
      if (!pkg) return;
      pkg.addEventListener("change", () => {
        const p = packages.find((x) => x.id === pkg.value);
        if (!p) return;
        sessionsInput.value = p.sessions;
        amountInput.value = p.price;
        // 方案存的是整包的價錢，所以選了方案就把模式切回總額，
        // 不然停在單價模式會把整包價格再乘一次堂數。
        modeInput.value = "total";
        root.querySelectorAll("[data-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.priceMode === "total")));
        refresh();
      });
    },
  });
}

/* ── 課表 ───────────────────────────────────── */

/**
 * 「有 N 場檢測還沒回報結果」。
 * 不主動問的話成交率永遠算不出來，那個數字就會一直是騙人的。
 */
function pendingOutcomeBanner() {
  const pending = awaitingOutcome();
  if (!pending.length) return "";
  const first = pending[0];
  const name = leadById(first.leadId)?.name || "某位客人";
  const color = LESSON_KIND.assessment.color;
  return `
    <button class="card" type="button" data-action="report-outcome" data-id="${first.id}"
            style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;
                   border:1px solid ${color}44;background:${color}14;cursor:pointer">
      <span style="font-size:20px">❓</span>
      <span style="flex:1">
        <span style="display:block;font-weight:650">
          ${pending.length === 1 ? `${esc(name)} 的檢測成交了嗎？` : `有 ${pending.length} 場檢測還沒回報結果`}
        </span>
        <span class="muted" style="font-size:12px">
          ${pending.length === 1 ? esc(first.date + " " + first.start) : `最舊的是 ${esc(name)}．${esc(first.date)}`}
        </span>
      </span>
      <span class="muted">›</span>
    </button>`;
}

function viewCalendar() {
  const anchor = parseDay(weekAnchor) || new Date();
  const start = startOfWeek(anchor);
  const days = [...Array(7)].map((_, i) => addDays(start, i));
  const dayLessons = S.lessons.filter((l) => l.date === selectedDate)
    .sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
  const sel = parseDay(selectedDate);

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">課表</h1>
        <p class="page-sub">${esc(dayStr(days[0]))} ～ ${esc(dayStr(days[6]))}</p>
      </div>
      <div class="head-actions">
        <button class="btn" type="button" data-action="cal-refresh">${icon("refresh", 15)}刷新</button>
        <button class="btn" type="button" data-action="new-assessment">${icon("plus", 15)}排檢測</button>
        <button class="btn btn-primary" type="button" data-action="new-lesson">${icon("plus", 15)}排課</button>
      </div>
    </div>

    <div class="stack">
      ${pendingOutcomeBanner()}
      <section class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
          <button class="btn btn-sm btn-ghost" type="button" data-action="week" data-value="-1">← 上一週</button>
          <button class="btn btn-sm" type="button" data-action="week" data-value="0">今天</button>
          <button class="btn btn-sm btn-ghost" type="button" data-action="week" data-value="1">下一週 →</button>
        </div>
        <div class="week">
          ${days.map((d) => {
            const ds = dayStr(d);
            // 一個點代表那天有課，有檢測才多一個紫點 —— 最多兩個。
            // 中間試過「每堂一個色點」（照學生的代表色），畫面變成一排彩虹，
            // 又雜又看不出重點（2026-08-12 回報）。要看幾堂點進去就好。
            const ofDay = S.lessons.filter((l) => l.date === ds && l.status !== "cancelled");
            const hasLesson = ofDay.some((l) => !isAssessment(l));
            const hasAssess = ofDay.some((l) => isAssessment(l));
            return `<button class="day ${ds === today() ? "today" : ""}" type="button"
                      data-action="pick-day" data-value="${ds}" aria-pressed="${ds === selectedDate}">
              <span class="day-name">${weekdayName(d)}</span>
              <span class="day-num">${d.getDate()}</span>
              <span class="day-dots">
                ${hasLesson ? `<span class="day-dot"></span>` : ""}
                ${hasAssess ? `<span class="day-dot day-dot-assess"></span>` : ""}
              </span>
            </button>`;
          }).join("")}
        </div>
      </section>

      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">${esc(selectedDate)}　週${sel ? weekdayName(sel) : ""}</h2>
          <span class="sec-sub">${dayLessons.length ? `${dayLessons.length} 堂` : "空堂"}</span>
        </div>
        ${dayLessons.length ? dayLessons.map((l) => {
          const st = studentById(l.studentId);
          const partner = studentById(l.partnerId);
          const meta = LESSON_STATUS[l.status] || LESSON_STATUS.scheduled;
          const assess = isAssessment(l);
          const oc = OUTCOME[outcomeOf(l)];
          const names = assess
            ? (leadById(l.leadId)?.name || "檢測")
            : ([st?.name, partner?.name].filter(Boolean).join("＋") || "（未指定學生）");
          return `
          <div class="row">
            <span class="dot" style="background:${esc(lessonColor(l))}"></span>
            <div class="row-main">
              <div class="row-title">${esc(names)}
                ${assess ? `<span class="pill" style="background:${LESSON_KIND.assessment.color}22;color:${LESSON_KIND.assessment.color}">檢測</span>` : ""}
                <span class="pill ${meta.pill}">${meta.label}</span>
                ${assess && outcomeOf(l) !== "pending" ? `<span class="pill ${oc.pill}">${oc.label}</span>` : ""}
                </div>
              <div class="row-sub mono">${esc(l.start)}–${esc(l.end)}${l.location ? "　" + esc(l.location) : ""}</div>
              ${assess && needsOutcome(l) ? `<div class="row-sub" style="color:var(--warn)">還沒回報成交與否</div>` : ""}
              ${// 剩幾堂就寫在課上（跟 iOS 一致）——快用完的時候要在排課的地方看得到，
                // 而不是等翻到學生頁才發現。檢測不扣堂數，不用寫。
                assess ? "" : [st, partner].filter(Boolean).map((who) => {
                  const low = (who.remaining || 0) <= (S.settings.lowSessions || 3);
                  return `<div class="row-sub" style="${low ? "color:var(--warn)" : ""}">${
                    partner ? esc(who.name) + " " : ""}${
                    who.remaining > 0 ? `剩 ${who.remaining} 堂` : "堂數已用完"}</div>`;
                }).join("")}
              ${l.notes ? `<div class="row-sub">${esc(l.notes)}</div>` : ""}
            </div>
            <div class="row-end" style="display:flex;align-items:center;gap:6px">
              <select data-action="lesson-status" data-id="${l.id}" aria-label="課程狀態"
                      style="width:auto;padding:4px 8px;font-size:12.5px">
                ${Object.entries(LESSON_STATUS).map(([k, v]) =>
                  `<option value="${k}" ${l.status === k ? "selected" : ""}>${v.label}</option>`).join("")}
              </select>
              ${assess ? `<button class="btn btn-sm" type="button" data-action="report-outcome" data-id="${l.id}">${outcomeOf(l) === "pending" ? "回報" : "改結果"}</button>` : ""}
              <button class="btn btn-sm" type="button" data-action="edit-lesson" data-id="${l.id}">編輯</button>
            </div>
          </div>`;
        }).join("") : `<p class="empty">這天沒有課。點右上角「排課」新增。</p>`}
      </section>
    </div>`;
}

/**
 * 排課／排檢測。
 *
 * `presetKind` 是給「排檢測」那顆按鈕用的。檢測本來只能從這張表單的
 * 「種類」下拉點出來 —— 沒點開表單的人根本不知道有這個功能，
 * 使用者的說法是「網頁版沒有檢測」（2026-08-11）。功能一直都在，是入口沒有。
 */
function lessonSheet(existing, presetKind = "lesson", presetStudentId = "") {
  const l = existing || {
    id: uid(), date: selectedDate, start: "09:00",
    end: timeOf(minutesOf("09:00") + S.settings.defaultDuration),
    status: "scheduled", notes: "", location: "",
    // 預設選第一位時，要跟下拉裡看到的順序一致（照筆畫的第一位）。
    // 從「太久沒上課」那一列按過來時直接帶那位（`presetStudentId`）——
    // 從名單看到人再自己去下拉裡找一次，是這個功能最容易白做的一段。
    studentId: presetStudentId || activeStudentsByName()[0]?.id || "", partnerId: "",
    kind: presetKind, outcome: "pending", color: "", leadId: "",
    consumed: false, partnerConsumed: false, owed: false, partnerOwed: false,
    createdAt: new Date().toISOString(),
  };
  const dur = durationOf(l) || S.settings.defaultDuration;
  const assessing = isAssessment(l);

  // 正課一定要有學生；檢測的對象還不是學生，沒有學生也能排
  if (!assessing && !activeStudents().length && !existing) {
    toast("請先新增至少一位學生，或改排檢測");
  }

  // 可以約檢測的名單。
  //
  // **做過檢測的人不再列出來**（2026-08-20：「檢測過了不要放在潛在客群裡」）——
  // 檢測是對還沒買課的人做的第一次試教，同一個人做第二次不是這條路要處理的事。
  // 已轉正式、已婉拒同理。真的要再約一次，下面「直接打名字」照樣可以，
  // 而且同名同電話會沿用原本那筆名單，不會多開一筆。
  const openLeads = S.leads.filter((x) =>
    x.status !== "converted" && x.status !== "lost" && x.status !== "assessed");

  openSheet({
    title: existing ? (assessing ? "檢測詳情" : "課程詳情")
                    : (assessing ? "新增檢測" : "新增課程"),
    body: `
      ${existing ? "" : `
        ${fieldSelect("kind", "種類", [["lesson", "正課"], ["assessment", "檢測（對還沒買課的人）"]], l.kind)}
        <p class="hint" data-kind-hint style="margin:-6px 0 10px">
          檢測是對還沒買課的人做的試教。佔課表時段，但不扣堂數、不算課程收入與抽成。上完之後會問你成交了沒。
        </p>`}

      <div data-kind-block="lesson" ${assessing ? 'hidden' : ''}>
        ${activeStudentsByName().length > 6 ? `
          <div class="field">
            <label for="f-studentSearch">找學生</label>
            <input id="f-studentSearch" type="search" autocomplete="off"
                   placeholder="搜尋姓名、電話或備註" data-student-search>
            <span class="hint" data-student-search-hint></span>
          </div>` : ""}
        ${fieldSelect("studentId", "學生", studentOptions(false, "", { showRemaining: true }), l.studentId)}
        ${fieldSelect("partnerId", "共同課第二位", studentOptions(true, "（沒有，一對一）", { showRemaining: true }), l.partnerId)}
      </div>

      <div data-kind-block="assessment" ${assessing ? '' : 'hidden'}>
        ${openLeads.length
          ? fieldSelect("leadId", "從潛在客群挑",
              [["", "（不從名單挑，直接打名字）"]].concat(
                openLeads.map((x) => [x.id, `${x.name}．${LEAD_SOURCE[x.source] || "其他"}`])),
              l.leadId)
          : `<p class="hint">${S.leads.length
                ? "名單上的人都檢測過或已成交了，直接在下面打名字就好。"
                : "名單裡還沒有人，直接在下面打名字就好。"}</p>`}
        <div data-lead-new ${l.leadId ? 'hidden' : ''}>
          ${fieldText("leadName", "姓名", leadById(l.leadId)?.name || "", { placeholder: "王小明" })}
          <div class="field-row">
            ${fieldText("leadPhone", "電話（選填）", "", { type: "tel" })}
            ${fieldSelect("leadSource", "怎麼認識的", Object.entries(LEAD_SOURCE), "referral")}
          </div>
          <p class="hint">存檔時會自動把這個人加進潛在客群，之後追蹤與成交率都會算到他頭上。</p>
        </div>
      </div>

      <div class="field-row">
        ${fieldText("date", "日期", l.date, { type: "date" })}
        ${fieldText("start", "開始時間", l.start, { type: "time" })}
      </div>
      ${durationPicker(dur)}
      ${existing ? "" : `
        <p class="hint" data-past-hint></p>
        <div data-past-consume hidden>
          <div class="switch">
            <label for="f-consumePast">同時扣掉學生一堂課</label>
            <input id="f-consumePast" name="consumePast" type="checkbox">
          </div>
          <p class="hint">補以前的課通常<strong>不用扣</strong>——那些課早就上完了，
            剩餘堂數多半已經反映過。剛上完才回來記、堂數還沒扣的話再勾起來。</p>
        </div>`}
      ${existing ? fieldSelect("status", "狀態", Object.entries(LESSON_STATUS).map(([k, v]) => [k, v.label]), l.status) : ""}
      ${existing && assessing
        ? fieldSelect("outcome", "成交結果",
            Object.entries(OUTCOME).map(([k, v]) => [k, v.label]), outcomeOf(l))
        : ""}
      ${// 一般教練不需要區分上課地點，那一格對他只是雜訊（跟 iOS 一致）。
        // 已經填過地點的課還是要看得到、改得到，不然換身份就等於把資料藏起來。
        isContractor() || (l.location || "").trim() ? `
        ${fieldText("location", "上課地點", l.location,
            { placeholder: isContractor() ? "在哪個場館" : "選填",
              list: knownLocations().length ? "known-locations" : "",
              hint: knownLocations().length ? "打幾個字會從用過的地點裡挑" : "" })}
        ${knownLocations().length ? `<datalist id="known-locations">${
          knownLocations().map((n) => `<option value="${esc(n)}"></option>`).join("")}</datalist>` : ""}`
      : ""}
      ${fieldText("notes", "備註", l.notes)}

      ${existing ? `
        <div class="divider"></div>
        <label class="field-label">這堂課的顏色</label>
        <div class="swatches" data-color-picker>
          <button type="button" class="swatch swatch-auto ${l.color ? "" : "on"}" data-color=""
                  title="跟著狀態／種類">自動</button>
          ${LESSON_COLORS.map((c) => `
            <button type="button" class="swatch ${l.color === c ? "on" : ""}"
                    data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
        </div>
        <input type="hidden" name="color" value="${esc(l.color || "")}">
        <p class="hint">留在「自動」就跟著課程狀態（或檢測）的顏色走。</p>` : ""}

      ${existing ? "" : `
        <div class="divider" data-kind-block="lesson" ${assessing ? 'hidden' : ''}></div>
        <div class="field-row" data-kind-block="lesson" ${assessing ? 'hidden' : ''}>
          ${fieldSelect("repeat", "重複排課", [["1", "只排這一天"], ["4", "每週同一天，共 4 週"], ["8", "每週同一天，共 8 週"], ["12", "每週同一天，共 12 週"]], "1")}
        </div>`}`,
    extraFoot: existing ? `<button class="btn btn-danger btn-sm" type="button" data-action="delete-lesson" data-id="${l.id}">刪除</button>` : "",
    onConfirm: (form) => {
      const date = form.elements.date.value || today();
      const start = form.elements.start.value || "09:00";
      const minutes = readDuration(form);
      const end = timeOf(minutesOf(start) + minutes);
      const kind = existing ? kindOf(l) : (form.elements.kind?.value || "lesson");
      // 一般教練的表單沒有這一格，讀不到就沿用原本的值（換身份不該把地點清掉）
      const location = form.elements.location
        ? form.elements.location.value.trim() : (l.location || "");
      const notes = form.elements.notes.value;
      const color = form.elements.color ? form.elements.color.value : (l.color || "");

      // ── 檢測 ──────────────────────────────────────────
      if (kind === "assessment") {
        let leadId = form.elements.leadId ? form.elements.leadId.value : "";
        if (!leadId) {
          const name = (form.elements.leadName?.value || "").trim();
          if (!name) { toast("請選一位名單上的人，或直接打上對方的名字"); return false; }
          const phone = (form.elements.leadPhone?.value || "").trim();
          // 同名同電話的人已經在名單裡就沿用，不要每排一次檢測就多一筆
          const dup = S.leads.find((x) => x.name === name && (x.phone || "") === phone);
          if (dup) {
            leadId = dup.id;
          } else {
            const lead = {
              id: uid(), name, phone, email: "",
              source: form.elements.leadSource?.value || "referral",
              status: "contacted", notes: "",
              createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
            };
            S.leads.push(lead);
            leadId = lead.id;
          }
        }

        const clash = S.lessons.find((x) =>
          x.id !== l.id && x.date === date && x.status !== "cancelled" &&
          minutesOf(x.start) < minutesOf(end) && minutesOf(start) < minutesOf(x.end));
        if (clash) { toast(`${date} ${clash.start}-${clash.end} 已經有課，時段重疊`); return false; }

        if (existing) {
          Object.assign(l, { date, start, end, location, notes, leadId, color });
          const newStatus = form.elements.status.value;
          if (newStatus !== l.status) setLessonStatus(l, newStatus);
          const newOutcome = form.elements.outcome?.value;
          if (newOutcome && newOutcome !== outcomeOf(l)) applyOutcome(l, newOutcome);
        } else {
          // 時段已經過了就直接記成已上課（檢測不扣堂數，但要從「待回報成交」
          // 那一列冒出來問你成交了沒）
          S.lessons.push({ ...l, id: uid(), kind: "assessment", outcome: "pending",
                           date, start, end, location, notes, leadId, color,
                           studentId: "", partnerId: "",
                           status: isPastSlot(date, end, start) ? "attended" : "scheduled" });
        }
        save(); render();
        toast(existing ? "已更新檢測" : `已排檢測．${leadById(leadId)?.name || ""}`);
        return;
      }

      // ── 正課 ──────────────────────────────────────────
      const studentId = form.elements.studentId.value;
      const partnerId = form.elements.partnerId.value;
      if (!studentId) { toast("請選一位學生"); return false; }
      if (partnerId && partnerId === studentId) { toast("共同課的兩位不能是同一人"); return false; }

      const repeat = existing ? 1 : +form.elements.repeat.value || 1;
      const made = [];
      for (let i = 0; i < repeat; i++) {
        const d = dayStr(addDays(parseDay(date), i * 7));
        const clash = S.lessons.find((x) =>
          x.id !== l.id && x.date === d && x.status !== "cancelled" &&
          minutesOf(x.start) < minutesOf(end) && minutesOf(start) < minutesOf(x.end) &&
          [x.studentId, x.partnerId].some((id) => id && [studentId, partnerId].includes(id)));
        if (clash) {
          toast(`${d} ${clash.start}-${clash.end} 已經有課，時段重疊`);
          return false;
        }
        made.push(d);
      }

      if (existing) {
        Object.assign(l, { date, start, end, location, notes, studentId, partnerId, color });
        const newStatus = form.elements.status.value;
        if (newStatus !== l.status) setLessonStatus(l, newStatus);
      } else {
        // 補以前的課時，時段已經過了就直接記成「已上課」（並扣堂數）；
        // 未來的課維持「已排定」。以前一律建成已排定，補歷史的人每一堂都要
        // 再手動改一次，不然要等下次開 App 的自動補標才會對。
        // 重複排課時逐堂判斷 —— 第一堂可能已經過了，後面幾堂還沒。
        // 時段已經過了就記成「已上課」，但**預設不扣堂數**：那些課早就上完了，
        // 剩餘堂數多半已經反映過（跟續約的「補登」是同一個道理——補的是歷史，
        // 不是現況）。硬扣下去就是憑空吃掉學生手上的課。
        // 剛上完才回來記、堂數還沒扣的人可以勾「同時扣掉學生一堂課」。
        const consumePast = !!(form.elements.consumePast && form.elements.consumePast.checked);
        for (const d of made) {
          const lesson = { ...l, id: uid(), kind: "lesson", date: d, start, end,
                           location, notes, studentId, partnerId, color,
                           status: "scheduled", consumed: false, partnerConsumed: false,
                           owed: false, partnerOwed: false };
          S.lessons.push(lesson);
          if (!isPastSlot(d, end, start)) continue;
          if (consumePast) {
            // 要扣就走 setLessonStatus，才會正確扣堂數／記欠課
            setLessonStatus(lesson, "attended");
          } else {
            // 只記錄，不動堂數
            lesson.status = "attended";
          }
        }
      }
      save(); render();
      const done = made.filter((d) => isPastSlot(d, end, start)).length;
      const consumed = done && form.elements.consumePast && form.elements.consumePast.checked;
      toast(existing ? "已更新課程"
        : done ? `已排 ${made.length} 堂課，其中 ${done} 堂記成已上課${consumed ? "（已扣堂數）" : "（未扣堂數）"}`
               : `已排 ${made.length} 堂課`);
    },
    onMount: (root) => {
      wireDurationPicker(root);
      wireStudentSearch(root);

      // 已經過去的時段會直接記成「已上課」並扣堂數 —— 在按下確認之前就要講，
      // 不然補歷史的人會以為只是排了一堂，回頭才發現堂數少了。
      const pastHint = root.querySelector("[data-past-hint]");
      const dateEl = root.querySelector('[name="date"]');
      const startEl = root.querySelector('[name="start"]');
      const kindEl = root.querySelector('[name="kind"]');
      const refreshPastHint = () => {
        const form = root.querySelector("#sheet-form");
        if (!pastHint || !dateEl || !startEl || !form) return;
        const end = timeOf(minutesOf(startEl.value || "09:00") + readDuration(form));
        const past = isPastSlot(dateEl.value || today(), end, startEl.value || "09:00");
        const isAssess = kindEl ? kindEl.value === "assessment" : assessing;
        pastHint.textContent = past
          ? (isAssess
              ? "這個時段已經過了，會直接記成「已上課」，並在待回報那裡問你成交了沒。"
              : "這個時段已經過了，會記成「已上課」，但預設不扣堂數。")
          : "還沒到的時段會是「已排定」，時間過了自己會變成已上課。";
        const consumeBox = root.querySelector("[data-past-consume]");
        if (consumeBox) consumeBox.hidden = !past || isAssess;
      };
      root.addEventListener("input", refreshPastHint);
      root.addEventListener("change", refreshPastHint);
      refreshPastHint();

      // 切換正課／檢測時換掉對應的欄位
      const kindSelect = root.querySelector('[name="kind"]');
      const syncKind = () => {
        const k = kindSelect.value;
        root.querySelectorAll("[data-kind-block]").forEach((el) => {
          el.hidden = el.dataset.kindBlock !== k;
        });
        const hint = root.querySelector("[data-kind-hint]");
        if (hint) hint.hidden = k !== "assessment";
      };
      if (kindSelect) { kindSelect.addEventListener("change", syncKind); syncKind(); }

      // 從名單挑了人就不用再打名字
      const leadSelect = root.querySelector('[name="leadId"]');
      const leadNew = root.querySelector("[data-lead-new]");
      if (leadSelect && leadNew) {
        leadSelect.addEventListener("change", () => { leadNew.hidden = !!leadSelect.value; });
      }

      // 顏色
      const picker = root.querySelector("[data-color-picker]");
      const colorInput = root.querySelector('[name="color"]');
      if (picker && colorInput) {
        picker.addEventListener("click", (e) => {
          const btn = e.target.closest(".swatch");
          if (!btn) return;
          e.preventDefault();
          colorInput.value = btn.dataset.color;
          picker.querySelectorAll(".swatch").forEach((s) => s.classList.remove("on"));
          btn.classList.add("on");
        });
      }

      root.addEventListener("click", (e) => {
        if (!e.target.closest('[data-action="delete-lesson"]')) return;
        closeSheet();
        // 還沒扣過堂數的課（時間還沒到、或補登時沒勾扣課）刪掉不會動到剩餘，
        // 講「會還給學生」只會讓人以為刪一堂就多一堂。
        const willRefund = SESSION_SLOTS.some(([, consumedKey]) => l[consumedKey]);
        confirmSheet("刪除課程",
          willRefund ? "已扣掉的堂數會還給學生。" : "這堂課沒扣過堂數，剩餘堂數不會變動。", () => {
          releaseLesson(l);
          S.lessons = S.lessons.filter((x) => x.id !== l.id);
          save(); render(); toast("已刪除課程");
        }, "刪除");
      });
    },
  });
}

/**
 * 套用檢測結果。成交就把名單轉成正式學生，沒成交留在待追蹤名單。
 * iOS 版是同一套邏輯，兩邊要一致。
 */
function applyOutcome(lesson, outcome) {
  lesson.outcome = outcome;
  // 時段已經過了就當作有做，這樣它才會從待回報清單消失
  if (lesson.status === "scheduled" && lesson.date <= today()) lesson.status = "attended";

  const lead = leadById(lesson.leadId);
  if (!lead) return null;
  lead.updatedAt = new Date().toISOString();

  if (outcome === "closed") {
    lead.status = "converted";
    // 同名同電話已經有學生就沿用，不要又開一筆重複的
    const existing = S.students.find((s) =>
      s.name === lead.name && (s.phone || "") === (lead.phone || ""));
    if (existing) {
      if (existing.status === "archived") existing.status = "active";
      return existing;
    }
    const acquisition = lead.source === "company" ? "companyLead"
      : lead.source === "referral" ? "referral" : "selfDeveloped";
    const s = newStudent({ name: lead.name, phone: lead.phone, acquisition, notes: lead.notes });
    S.students.push(s);
    return s;
  }

  if (outcome === "notClosed" || outcome === "followUp") {
    // 檢測過但還沒買，跟「還沒聯繫過」是不同的階段
    lead.status = "assessed";
  }
  return null;
}

/** 檢測結果回報：問「成交了嗎」，成交就順手開續約 */
function outcomeSheet(lesson) {
  const lead = leadById(lesson.leadId);
  const name = lead?.name || "這位客人";
  openSheet({
    title: "檢測結果",
    confirmLabel: "儲存",
    body: `
      <p style="font-weight:650;font-size:16px;margin-bottom:2px">${esc(name)}</p>
      <p class="hint" style="margin-bottom:12px">
        ${esc(lesson.date)}　${esc(lesson.start)}–${esc(lesson.end)}
        ${lead ? "．來源：" + esc(LEAD_SOURCE[lead.source] || "其他") : ""}
      </p>
      ${fieldSelect("outcome", "成交了嗎", [
        ["closed", "成交了 —— 轉成正式學生"],
        ["followUp", "還要再約 —— 留在名單裡"],
        ["notClosed", "沒成交 —— 留在待追蹤名單"],
      ], "closed")}
      ${fieldText("note", "備註（選填）", "", { placeholder: "聊到哪、他在猶豫什麼" })}
      <p class="hint">「再約」不會算進成交率的分母，還在進行中。</p>`,
    onConfirm: (form) => {
      const outcome = form.elements.outcome.value;
      const note = form.elements.note.value.trim();
      if (note && lead) lead.notes = lead.notes ? `${lead.notes}\n${note}` : note;

      const student = applyOutcome(lesson, outcome);
      save(); render();

      if (outcome === "closed") {
        toast(`${name} 已轉成學生`);
        // 成交了就順手把買了幾堂、多少錢記進去
        if (student) setTimeout(() => renewSheet(student), 350);
      } else if (outcome === "notClosed") {
        toast(`已記錄，${name} 留在待追蹤名單`);
      } else {
        toast(`已記錄，記得再約 ${name}`);
      }
    },
  });
}

/* ── 收費 ───────────────────────────────────── */

function viewPayments() {
  const ym = thisMonth();
  const rows = allPayments().sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const monthRows = rows.filter((p) => (p.date || "").startsWith(ym));
  // 「收到」就是真的已經收到的。日期還沒到的是預收（教練常常先把下個月的
  // 課錢記進來），混在一起會讓這個數字比實際入帳的多 —— iOS 早就分開算了，
  // 這邊跟著對齊。整月的總額在總覽頁的「本月收入」看。
  const todayStr = today();
  const collectedThisMonth = monthRows
    .filter((p) => (p.date || "") <= todayStr).reduce((a, p) => a + (p.amount || 0), 0);
  const upcomingThisMonth = monthRows
    .filter((p) => (p.date || "") > todayStr).reduce((a, p) => a + (p.amount || 0), 0);
  // 列表只顯示選到的那一段。整月／累計的數字在上面的方塊，不受這裡影響。
  const bounds = periodBounds(paymentRange);
  const listed = bounds
    ? rows.filter((p) => inPeriod(p.date, bounds.from, bounds.to))
    : rows;
  const isCompany = S.settings.employment === "company";
  const sal = isCompany ? salaryFor(ym) : null;
  // 薪資試算要照計薪基準決定畫哪幾列（同 salaryFor 與設定頁的判斷）
  const countsLessons = S.settings.salary.payoutBasisRaw !== "onSale";
  const countsSales = S.settings.salary.payoutBasisRaw !== "perLesson";

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">收費</h1>
        <p class="page-sub">${ym}　本月 ${monthRows.length} 筆</p>
      </div>
      <div class="head-actions">
        <button class="btn btn-primary" type="button" data-action="new-payment">${icon("plus", 15)}新增收費</button>
      </div>
    </div>

    <div class="stack">
      ${(() => {
        const stuck = paymentsStuckOnEntryDay();
        if (!stuck.length) return "";
        const sum = stuck.reduce((a, r) => a + (r.payment.amount || 0), 0);
        return `
          <div class="note-box">
            <strong>有 ${stuck.length} 筆收費的日期停在補登那天</strong>（合計 ${money(sum)}），
            所以那些錢全算進了這個月。它們對應的合約已經是別的日期了——
            按一下就把收費日期改成跟合約同一天。
            <div style="margin-top:9px">
              <button class="btn btn-sm btn-primary" type="button" data-action="fix-payment-dates">
                用合約日期修正</button>
            </div>
          </div>`;
      })()}
      <div class="tiles">
        ${tile({ value: money(collectedThisMonth), label: "本月收到", iconName: "money", color: "var(--good)",
                 note: upcomingThisMonth
                   ? `${monthRows.length} 筆・另有預收 ${money(upcomingThisMonth)}`
                   : `${monthRows.length} 筆` })}
        ${tile({ value: money(rows.reduce((a, p) => a + p.amount, 0)), label: "累計收入", iconName: "money",
                 color: "var(--gold)", note: `${rows.length} 筆` })}
        ${isCompany
          // 底薪印的是**實際加上去的金額**，不是設定值。原本寫
          // `sal.baseSalary || 設定值`，而「達標後取消底薪」算出來就是 0（falsy）——
          // 於是達標當月這裡照樣印著 $20,000，跟旁邊的合計對不起來（2026-08-27）。
          ? tile({ value: money(sal.total), label: "本月實拿", iconName: "target", color: "var(--info)",
                   note: `${sal.mode === "higherOf" ? "底薪補差額" : "底薪"} ${money(sal.baseSalary)}` })
          : tile({ value: money(S.students.reduce((a, s) => a + s.remaining * sessionPrice(s), 0)),
                   label: "未上課的預收", iconName: "clock", color: "var(--info)", note: "剩餘堂數 × 鐘點" })}
      </div>

      ${isCompany ? (() => {
        // 排完會是多少：已經上到的 ＋ 這個月還沒上的排定課。
        // 月初只看「已上」永遠接近 0，看不出這個月排的量值多少錢。
        const proj = salaryFor(ym, { projected: true });
        const more = Math.max(0, proj.total - sal.total);
        return `
      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">本月薪資試算</h2>
          <span class="sec-sub">依「設定 → 薪資規則」計算</span>
        </div>

        ${/* 排完會多少、還差幾堂跳級 —— 都只有鐘點制才有級距可言。
              選「依簽約」時堂數一律是 0，這段會變成「這個月沒有排了還沒上的課」，
              對業績制的人是句廢話。 */""}
        ${!countsLessons ? "" : proj.pendingSessions ? `
        <div class="tiles" style="grid-template-columns:1fr 1fr;margin-bottom:12px">
          ${tile({ value: money(sal.total), label: "已上課的部分", iconName: "money",
                   color: "var(--good)", note: `${sal.sessions} 堂・抽成 ${sal.pct}%` })}
          ${tile({ value: money(proj.total), label: "這個月排完", iconName: "target",
                   color: "var(--gold)",
                   note: `${proj.sessions} 堂・抽成 ${proj.pct}%` })}
        </div>
        <p class="hint" style="margin:-4px 0 10px">
          還有 <strong>${proj.pendingSessions} 堂</strong>排了還沒上，全部上完會多
          <strong>${money(more)}</strong>。缺席與取消的不算在裡面。${
            proj.pct > sal.pct
              ? `　上完會從 ${sal.pct}% 跳到 <strong>${proj.pct}%</strong>。`
              : proj.nextTier
              ? `　再上 <strong>${proj.nextTier.minSessions - proj.sessions} 堂</strong>可以跳到 ${proj.nextTier.percent}%。`
              : ""}
        </p>` : `
        <p class="hint" style="margin:0 0 10px">這個月沒有排了還沒上的課，下面就是最終數字。${
          sal.nextTier
            ? `再上 <strong>${sal.nextTier.minSessions - sal.sessions} 堂</strong>可以跳到 ${sal.nextTier.percent}%。`
            : (S.settings.salary.tiers || []).length
            ? "已達最高級距。"
            : ""}</p>`}

        ${/* 上課那一段只有把課算進薪水時才有意義。選「依簽約」時原本照樣畫
              「上課堂數 0 堂・課程收入 $0・適用抽成 50%」，看起來像算錯了。 */""}
        ${countsLessons ? `
          <div class="row"><div class="row-main">上課堂數</div><div class="row-end mono">${sal.sessions} 堂${
            proj.pendingSessions ? `<span class="muted" style="font-size:12px">（排完 ${proj.sessions}）</span>` : ""}</div></div>
          <div class="row"><div class="row-main">課程收入</div><div class="row-end mono">${money(sal.lessonRevenue)}</div></div>
          <div class="row"><div class="row-main">適用抽成</div><div class="row-end mono">${sal.pct}%</div></div>
          <div class="row"><div class="row-main">鐘點抽成</div><div class="row-end mono">${money(sal.lessonPay)}</div></div>` : ""}

        ${countsSales ? `
          <div class="row"><div class="row-main">本月簽約</div><div class="row-end mono">${sal.saleCount} 筆・${money(sal.salesAmount)}</div></div>
          ${sal.companySalesAmount ? `
            <div class="row"><div class="row-main" style="padding-left:14px">自己開發</div><div class="row-end mono">${money(sal.selfSalesAmount)}</div></div>
            <div class="row"><div class="row-main" style="padding-left:14px">公司名單</div><div class="row-end mono">${money(sal.companySalesAmount)}</div></div>` : ""}
          <div class="row"><div class="row-main">業績獎金</div><div class="row-end mono">${money(sal.salesBonus)}</div></div>` : ""}

        ${/* 「取高者」加上去的是**補到底薪的差額**，不是底薪本身。標成「底薪」
              會讓人以為底薪跟抽成相加了。0 就整列不畫 —— 原因寫在下面那行 note 裡。 */""}
        ${sal.baseSalary > 0 ? `
          <div class="row"><div class="row-main">${sal.mode === "higherOf" ? "底薪補差額" : "底薪"}</div>
            <div class="row-end mono">${money(sal.baseSalary)}</div></div>` : ""}
        ${sal.baseNote ? `<p class="hint" style="margin:-6px 0 8px">${sal.baseNote}</p>` : ""}
        <div class="row"><div class="row-main" style="font-weight:650">實拿合計</div>
          <div class="row-end mono" style="font-weight:700;color:var(--gold)">${money(sal.total)}</div></div>
      </section>`;
      })() : ""}

      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">收費紀錄</h2>
          <span class="sec-sub">${listed.length} 筆${
            paymentRange !== "all" && rows.length > listed.length ? `（全部 ${rows.length} 筆）` : ""}</span>
        </div>
        <div class="seg seg-wrap" style="margin-bottom:12px">
          ${[["thisMonth", "本月"], ["lastMonth", "上月"], ["thisYear", "今年"], ["all", "全部"]].map(([v, t]) =>
            `<button type="button" data-action="payment-range" data-value="${v}"
                     aria-pressed="${paymentRange === v}">${t}</button>`).join("")}
        </div>
        ${listed.length ? listed.map((p) => {
          const st = studentById(p.studentId);
          const method = { cash: "現金", transfer: "轉帳", other: "其他" }[p.method] || "其他";
          return `
          <div class="row">
            <span class="dot" style="background:${esc(st?.color || "var(--muted)")}"></span>
            <div class="row-main">
              <div class="row-title">${esc(st?.name || "（已刪除的學生）")}</div>
              <div class="row-sub mono">${esc(p.date)}　${method}${st && paymentLabel(st, p) ? "　" + esc(paymentLabel(st, p)) : ""}</div>
            </div>
            <div class="row-end">
              <span class="mono" style="font-weight:600">${money(p.amount)}</span>
              <div style="margin-top:5px;display:flex;gap:4px;justify-content:flex-end">
                <button class="btn btn-sm" type="button" data-action="edit-payment"
                        data-id="${p.id}" data-student="${p.studentId}">編輯</button>
                <button class="btn btn-sm btn-ghost" type="button" data-action="delete-payment"
                        data-id="${p.id}" data-student="${p.studentId}">刪除</button>
              </div>
            </div>
          </div>`;
        }).join("") : `<p class="empty">${rows.length ? "這段期間沒有收費紀錄。" : "還沒有收費紀錄。"}</p>`}
      </section>
    </div>`;
}

/**
 * 「這筆錢是哪一次續約收的」的選項。
 *
 * 手動新增的收費以前永遠沒有 renewalId，接不回任何一筆續約，於是
 * 續約編輯列的「同時更新收費紀錄」開關根本不會出現 —— 改了續約金額，
 * 收費就是不會跟上，而且畫面上完全沒有說明為什麼。
 * 所以關聯要能用手指定，不能只靠日期＋金額去猜。
 */
function renewalOptions(student) {
  return [["", "不對應（單獨的一筆）"],
    ...renewalsOf(student).map((r) =>
      [r.id, `${r.date || "（無日期）"}・${r.sessions || 0} 堂・${money(r.amount || 0)}`])];
}

/** 收費表單裡「對應的續約」那一格。學生換了要整格重畫，選項不一樣。 */
function renewalPickField(student, value) {
  if (!student) return "";
  const rs = renewalsOf(student);
  if (!rs.length) {
    return `<p class="hint">${esc(student.name || "這位學生")}還沒有續約紀錄，這筆收費沒有可以對應的對象。</p>`;
  }
  return fieldSelect("renewalId", "對應的續約", renewalOptions(student), value || "",
    "對應起來之後，這一列會即時顯示那筆續約的堂數；改續約金額時也才有「同時更新收費紀錄」可以勾。");
}

/**
 * 「每堂單價 × 堂數」要乘的那個堂數，以及它是哪裡來的。
 *
 * 收費紀錄本身沒有堂數（一筆錢就是一筆錢），所以要向外找：
 * 　1. 有選「對應的續約」→ 用那筆買的堂數
 * 　2. 沒選（或這位學生根本沒有續約紀錄）→ 退回「本期購買堂數」
 *
 * 第 2 條是後來補的。原本只認續約，於是**還沒有任何續約紀錄的學生完全沒有
 * 單價選項**（實際踩到：一位剩 3 堂、本期 30 堂的學生，想填「每堂 1300」，
 * 但那一格只收總額，1300 就被當成整包的錢存進去）。
 * 搬家進來的學生大多是這樣：堂數是手填的，續約紀錄還沒補。
 */
function unitPriceBasis(student, renewalId) {
  if (!student) return { sessions: 0, from: "" };
  const r = renewalId ? (student.renewals || []).find((x) => x.id === renewalId) : null;
  if (r) return { sessions: r.sessions || 0, from: "對應的續約" };
  const cur = currentPackageSessions(student);
  return cur > 0 ? { sessions: cur, from: "本期購買堂數" } : { sessions: 0, from: "" };
}

/** 只要堂數的舊介面（測試與 onConfirm 在用） */
function sessionsOfRenewalId(student, renewalId) {
  return unitPriceBasis(student, renewalId).sessions;
}

/**
 * 新增或編輯一筆收費。
 *
 * 以前只能新增與刪除：金額打錯只能刪掉重建，而重建會失去 renewalId，
 * 於是「改續約金額，收費跟不上」變成沒有出口的死路。
 */
function paymentSheet(student = null, payment = null) {
  if (!activeStudents().length) { toast("請先新增至少一位學生"); return; }
  const editing = !!(student && payment);
  const owner = editing ? student : null;

  openSheet({
    title: editing ? "編輯收費" : "新增收費",
    body: `
      ${editing
        ? `<div class="row" style="padding-top:0">
             <span class="dot" style="background:${esc(student.color || "var(--muted)")}"></span>
             <div class="row-main"><div class="row-title">${esc(student.name || "（未命名）")}</div>
               <div class="row-sub">要換人請刪掉這筆，重新記一次</div></div>
           </div>`
        : fieldSelect("studentId", "學生", studentOptions(false), activeStudentsByName()[0].id)}
      <div data-renewal-pick>${renewalPickField(owner || activeStudentsByName()[0], editing ? payment.renewalId : "")}</div>
      <p class="hint" data-link-warn hidden></p>
      <div class="seg" style="max-width:260px;margin-bottom:8px" data-price-toggle hidden>
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-pay-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="payPriceMode" value="total">
      <div class="field-row">
        ${fieldText("amount", "金額", editing ? (payment.amount || 0) : "", { type: "number", required: true })}
        ${fieldText("date", "日期", editing ? (payment.date || today()) : today(), { type: "date" })}
      </div>
      <p class="hint" data-pay-price-hint></p>
      ${fieldSelect("method", "付款方式", [["cash", "現金"], ["transfer", "轉帳"], ["other", "其他"]],
                    editing ? (payment.method || "cash") : "cash")}
      ${fieldText("notes", "備註", editing ? (payment.notes || "") : "")}`,
    // 刪除以前只有「收費」那一頁的列上有，從學生詳情點進來的那條路完全刪不掉
    // （2026-08-11 回報）。放在表單裡，哪一條路進來都刪得到。
    extraFoot: editing
      ? `<button class="btn btn-danger btn-sm" type="button" data-del-payment="1">刪除</button>`
      : "",
    onMount: (root) => {
      // 這顆在 .scrim 裡面，全域的 data-action 分派會跳過它，自己接。
      root.addEventListener("click", (e) => {
        if (!e.target.closest("[data-del-payment]")) return;
        e.preventDefault();
        const r = renewalOfPayment(student, payment);
        closeSheet();
        confirmSheet("刪除收費紀錄",
          `${esc(student.name || "這位學生")}　${esc(payment.date || "")}　${money(payment.amount || 0)}` +
          (r ? `<br>這筆錢掛在 ${esc(r.date || "")} 的續約底下。<strong>續約紀錄不會跟著刪</strong>，那筆課還是賣出去了；要連續約一起拿掉請到「編輯學生 → 續約紀錄」刪那一筆。`
             : "<br>這筆沒有對應到任何續約，刪掉只影響收入統計。"),
          () => {
            student.payments = (student.payments || []).filter((p) => p.id !== payment.id);
            student.updatedAt = new Date().toISOString();
            save(); render(); toast("已刪除收費紀錄");
          }, "刪除");
      });

      const studentSel = root.querySelector('[name="studentId"]');
      const modeInput = root.querySelector('[name="payPriceMode"]');
      const toggle = root.querySelector("[data-price-toggle]");
      const amountInput = root.querySelector('[name="amount"]');
      const amountLabel = root.querySelector('label[for="f-amount"]');
      const hint = root.querySelector("[data-pay-price-hint]");

      const currentStudent = () =>
        editing ? student : studentById(studentSel ? studentSel.value : "");

      /**
       * 單價模式的堂數來自對應的續約，所以沒有對應就不能給單價選項 ——
       * 堂數是 0，乘下去金額直接變成 0。
       */
      const basis = () => {
        const sel = root.querySelector('[name="renewalId"]');
        return unitPriceBasis(currentStudent(), sel ? sel.value : "");
      };

      const setMode = (mode) => {
        modeInput.value = mode;
        root.querySelectorAll("[data-pay-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.payPriceMode === mode)));
      };

      // 不管用哪一種輸入，兩個數字都同時顯示 ——
      // 「我剛剛填的是一堂還是全部」不該在按下儲存之後才想起來。
      const refresh = () => {
        // 有續約紀錄卻沒接：這筆錢會單獨存在，之後改續約金額不會問你要不要同步，
        // 對帳時也看不出是哪一次買的。不擋（有些錢真的不屬於任何一次續約），但要講。
        const warn = root.querySelector("[data-link-warn]");
        if (warn) {
          const st = currentStudent();
          const sel = root.querySelector('[name="renewalId"]');
          const loose = !!(st && renewalsOf(st).length && !(sel && sel.value));
          warn.hidden = !loose;
          if (loose) {
            warn.innerHTML = "<strong>還沒選「對應的續約」。</strong>這筆錢會單獨存在——"
              + "收費那一列不會顯示堂數，之後改續約金額也不會問你要不要一起改。"
              + "它屬於某一次續約就選起來。";
          }
        }
        const { sessions: n, from } = basis();
        // 連本期堂數都是 0 才真的沒有堂數可以換算，選項收起來並強制回總額
        if (!n) {
          if (modeInput.value === "unit") setMode("total");
          toggle.hidden = true;
        } else {
          toggle.hidden = false;
        }
        const unit = modeInput.value === "unit";
        const v = Math.max(0, +amountInput.value || 0);
        if (amountLabel) amountLabel.textContent = unit ? "每堂單價" : "金額";
        if (!hint) return;
        if (!n) {
          hint.textContent = "這位學生還沒有堂數可以換算，這一格填實收的金額。";
        } else if (!v) {
          hint.textContent = `堂數用「${from}」的 ${n} 堂。存進去的一律是總額。`;
        } else {
          hint.textContent = (unit
            ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
            : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`)
            + `（堂數取自${from}）`;
        }
      };

      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-pay-price-mode]");
        if (!btn) return;
        e.preventDefault();
        setMode(btn.dataset.payPriceMode);
        refresh();
      });
      amountInput.addEventListener("input", refresh);
      // 續約的下拉是重畫出來的（換學生時），所以用委派接 change
      root.addEventListener("change", (e) => {
        if (e.target.name === "renewalId") refresh();
      });

      if (studentSel) {
        studentSel.addEventListener("change", () => {
          const box = root.querySelector("[data-renewal-pick]");
          if (box) box.innerHTML = renewalPickField(studentById(studentSel.value), "");
          setMode("total");   // 換人之後堂數的來源也換了，別停在單價
          refresh();
        });
      }
      refresh();
    },
    onConfirm: (form) => {
      const st = editing ? student : studentById(form.elements.studentId.value);
      if (!st) return false;
      // 選項是從這位學生的續約長出來的，但表單值仍要驗一次 ——
      // 換過學生之後留在 DOM 裡的舊值不能直接信。
      const picked = form.elements.renewalId ? form.elements.renewalId.value : "";
      const renewalId = (st.renewals || []).some((r) => r.id === picked) ? picked : "";

      // 存進去的一律是總額，理由跟續約一樣：收入統計與業績抽成都是拿總額去算的。
      // 單價模式沒有堂數時當成總額 —— 乘 0 會把金額直接吃掉。
      const typed = Math.max(0, +form.elements.amount.value || 0);
      const n = sessionsOfRenewalId(st, renewalId);
      const unit = form.elements.payPriceMode
                && form.elements.payPriceMode.value === "unit" && n > 0;
      const amount = unit ? typed * n : typed;
      // **$0 是合法的**：贈課、補課、抵用、還沒收到錢，都是真的會發生的紀錄，
      // 而且擋掉它只會逼人隨便填一個數字，那才真的把帳弄髒（2026-08-12）。
      // 續約當下自動產生的收費本來就允許 0，這裡不該有第二套規矩。

      const fields = {
        amount, date: form.elements.date.value || today(),
        method: form.elements.method.value, notes: form.elements.notes.value,
        ...(renewalId ? { renewalId } : {}),
      };

      if (editing) {
        Object.assign(payment, fields);
        // 取消對應時要真的把欄位拿掉，留著空字串會讓 paymentsOfRenewal 之類
        // 的判斷變成「有 renewalId 但指向不存在的續約」。
        if (!renewalId) delete payment.renewalId;
        st.updatedAt = new Date().toISOString();
      } else {
        st.payments.push({ id: uid(), ...fields, createdAt: new Date().toISOString() });
      }
      save(); render();
      // 有沒有接上要講出來，不然「為什麼收費那列沒有堂數」永遠是個謎
      const loose = !renewalId && renewalsOf(st).length ? "（沒有對應到續約）" : "";
      toast((editing ? `已更新為 ${money(amount)}` : `已記錄 ${money(amount)}`) + loose);
    },
  });
}

/* ── 分析 ───────────────────────────────────── */

/**
 * 銷售統計：「這段期間總共賣了幾堂」。
 * 跟收費不同——收費看錢什麼時候進來（含預收），銷售看課什麼時候賣掉。
 */
/**
 * 沒填金額、但底下掛著收費的續約。
 *
 * 補歷史時很常見：續約紀錄只填了堂數與日期，錢另外記在收費那一頁。
 * 但**銷售統計的資料來源是續約紀錄**，於是「銷售金額」只算得到有填金額的那幾筆
 * ——實際收了 $190,800 卻只顯示 $43,200，每堂均價也跟著垮掉
 * （2026-08-11 回報「銷售金額有問題」）。
 *
 * 這些是補得回來的：底下掛著的收費加起來就是這筆合約的金額。
 * 沒有掛收費的那種猜不出來，不動它。
 */
/**
 * 長條圖上的月份標籤。
 *
 * 原本寫 `month.slice(5) + "月"`，出來是「08月」——多一個 0 很醜，
 * 而且跨年的區間看不出是哪一年（2025-08 與 2026-08 都印成「08月」）。
 */
function monthLabel(month, all) {
  const spansYears = new Set(all.map((m) => m.month.slice(0, 4))).size > 1;
  const [y, mm] = month.split("-");
  return spansYears ? `${y.slice(2)}/${+mm} 月` : `${+mm} 月`;
}

function renewalsMissingAmount() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      if ((r.amount || 0) > 0) continue;
      const paid = paymentsOfRenewal(s, r.id).reduce((a, p) => a + (p.amount || 0), 0);
      if (paid > 0) rows.push({ student: s, renewal: r, paid });
    }
  }
  return rows;
}

/**
 * 合約日期還停在「補登那天」的續約。
 *
 * 補歷史時「新增一筆」的日期預設是今天，沒改到的話那筆合約就掛在今天 ——
 * 於是兩年的業績全堆進這個月，銷售的月份完全失真
 * （2026-08-11 回報「銷售金額的時間也不對」）。
 *
 * 認定條件抓得很緊，避免把正常的今日成交也搬走：
 *   1. 合約日期**剛好等於建立那一天**（沒動過預設值）
 *   2. 底下掛著的收費是**更早的日期**
 * 今天簽約、下個月才收錢的那種收費日在後面，不會被動到。
 */
function renewalsWithDefaultDate() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      if (!r.createdAt || !r.date) continue;
      const created = new Date(r.createdAt);
      if (isNaN(created.getTime()) || r.date !== dayStr(created)) continue;
      const dates = paymentsOfRenewal(s, r.id).map((p) => p.date).filter(Boolean).sort();
      const earliest = dates[0];
      if (!earliest || earliest >= r.date) continue;   // 只往前搬，不往後
      rows.push({ student: s, renewal: r, to: earliest });
    }
  }
  return rows;
}

/** 把合約日期改成底下收費的日期 */
function fixRenewalDatesFromPayments() {
  const rows = renewalsWithDefaultDate();
  for (const { student, renewal, to } of rows) {
    renewal.date = to;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

/**
 * 需要人看一眼的合約：日期停在補登那天、或金額還沒填。
 *
 * 為什麼不能自動修：真正的簽約日期在資料裡沒有第二個來源。補歷史時收費日期
 * 往往也跟著填成同一天（實測 37 位教練資料：23 筆合約與它們的收費全部
 * 落在補登當天），所以「用收費日期推回去」在真實資料上一筆都救不到。
 * 能做的是**把要改的攤在同一張表上一次改完**，而不是叫人一筆一筆點進去。
 */
/**
 * 一天之內有這麼多位不同學生的合約，就不是真的同一天簽的，是補登。
 *
 * 門檻本來是 5，結果實際資料裡 8/09 那批只有 4 位 —— 整批被漏掉，
 * 使用者看到的是「工具只列出 13 筆，但明明有 20 筆要修」（2026-08-12）。
 * 一天連三位不同學生同時簽約本來就不常見，3 已經夠保守。
 */
const BULK_ENTRY_MIN = 3;

/**
 * 刪掉一個自訂欄位時，學生填在那一格的內容怎麼辦。
 *
 * 以前一律留著：欄位從畫面上消失，值還躺在資料裡（重新新增同名欄位就會回來）。
 * 那對「改錯名字想重來」的人是對的，但對「這欄不要了」的人來說，資料留著卻
 * 看不到、也刪不掉，只會在匯出的備份裡陰魂不散 —— 所以改成問一句
 * （2026-08-12 回報）。預設**留著**，因為刪掉救不回來。
 */
function deleteFieldSheet(name) {
  const filled = S.students.filter((s) => (s.custom || {})[name]);
  openSheet({
    title: "刪除自訂欄位",
    confirmLabel: "刪除",
    body: `
      <p style="margin-top:0">「${esc(name)}」會從學生表單與客群分析裡拿掉。</p>
      ${filled.length ? `
        <div class="note-box" style="margin:10px 0">
          目前有 <strong>${filled.length} 位學生</strong>填了這一格，例如
          ${filled.slice(0, 3).map((s) => `${esc(s.name || "（未命名）")}：${esc(s.custom[name])}`).join("、")}${filled.length > 3 ? " 等" : ""}。
        </div>
        <div class="switch">
          <label for="f-wipeValues">連同他們填的內容一起刪掉</label>
          <input id="f-wipeValues" name="wipeValues" type="checkbox">
        </div>
        <p class="hint">不勾的話內容會留在資料裡（畫面上看不到），之後<strong>重新新增一個
          同名欄位就會整批回來</strong>——想改欄位型別或排序的話這樣最安全。
          勾了就真的刪掉，救不回來。</p>`
      : `<p class="hint">目前沒有人填過這一格。</p>`}`,
    onConfirm: (form) => {
      const wipe = !!(form.elements.wipeValues && form.elements.wipeValues.checked);
      S.settings.customFields = S.settings.customFields.filter((f) => f !== name);
      if (S.settings.customFieldSpecs) delete S.settings.customFieldSpecs[name];
      if (wipe) {
        for (const s of filled) {
          delete s.custom[name];
          s.updatedAt = new Date().toISOString();
        }
      }
      save(); render();
      toast(`已刪除欄位「${name}」`
        + (filled.length ? (wipe ? `，並清掉 ${filled.length} 位學生填的內容` : "，內容留著") : ""));
    },
  });
}

/** 所有合約，給「顯示全部」用 */
function allContractRows() {
  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      rows.push({ student: s, renewal: r, sameDay: false, noAmount: !(r.amount > 0) });
    }
  }
  return rows.sort((a, b) => (b.renewal.date || "").localeCompare(a.renewal.date || ""));
}

function contractsNeedingReview() {
  // 「日期等於建立那天」不能單獨當證據 —— 當天簽約當天輸入本來就是這樣，
  // 那是最正常的一筆。真正的特徵是**一整批擠在同一天**：
  // 正常一天不會有五位不同的學生同時簽約，那是補歷史時日期沒改。
  const sameDayByDate = new Map();
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      const created = r.createdAt ? new Date(r.createdAt) : null;
      if (!created || isNaN(created.getTime()) || r.date !== dayStr(created)) continue;
      if (!sameDayByDate.has(r.date)) sameDayByDate.set(r.date, new Set());
      sameDayByDate.get(r.date).add(s.id);
    }
  }
  const bulkDates = new Set([...sameDayByDate.entries()]
    .filter(([, ids]) => ids.size >= BULK_ENTRY_MIN).map(([d]) => d));

  const rows = [];
  for (const s of S.students) {
    for (const r of s.renewals || []) {
      const created = r.createdAt ? new Date(r.createdAt) : null;
      const bulkDay = !!(created && !isNaN(created.getTime()) && r.date === dayStr(created)
                         && bulkDates.has(r.date));
      // 未來的日期幾乎一定是打錯或選錯的（實例：首購掛在 2027-01-26）。
      // 這種不必等到湊成一批，單獨一筆就要問。
      const future = !!(r.date && r.date > today());
      // 「今天買的 36 堂，但他手上只剩 7 堂」—— 今天買的不可能已經上掉 29 堂。
      // 這是最後一種漏網的：日期被改成今天（不等於建檔那天）、也還沒到未來，
      // 但一看堂數就知道那份合約不是今天的。
      const latest = renewalsOf(s)[0];
      const usedAlready = !!(latest === r && r.date >= today() && (r.sessions || 0) > 0
                             && (s.remaining || 0) < (r.sessions || 0));
      const sameDay = bulkDay || future || usedAlready;
      // $0 本身是合法的（贈課、補課）。只有「還沒確認過」的才提出來問一次，
      // 在批次表按過套用就記 amountOk，不再一直標記同一筆。
      const noAmount = !(r.amount > 0) && !r.amountOk;
      if (sameDay || noAmount) rows.push({ student: s, renewal: r, sameDay, noAmount });
    }
  }
  return rows.sort((a, b) => (a.student.name || "").localeCompare(b.student.name || "", "zh-Hant"));
}

/** 用底下收費的金額補上合約金額 */
function fillRenewalAmountsFromPayments() {
  const rows = renewalsMissingAmount();
  for (const { student, renewal, paid } of rows) {
    renewal.amount = paid;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

/**
 * 看起來重複的紀錄。
 *
 * 補歷史的時候很容易同一筆記兩次（改了一半重來、匯入過兩次、批次表補了一筆
 * 但錢其實早就記過）。判斷抓得很緊：**同一位學生、同一天、金額與堂數都一樣**
 * 才算同一筆。
 *
 * 刻意**不自動刪** —— 分期付款真的會出現同一天兩筆同額的收費。列出來讓人看過
 * 再決定，比自作主張刪掉安全得多。
 */
function duplicateRecords() {
  const groups = [];
  for (const s of S.students) {
    const seen = new Map();
    for (const r of s.renewals || []) {
      const key = `${r.date || ""}|${r.sessions || 0}|${r.amount || 0}`;
      if (!seen.has(key)) seen.set(key, []);
      seen.get(key).push(r);
    }
    for (const [, list] of seen) {
      if (list.length > 1) groups.push({ kind: "renewal", student: s, list });
    }

    const pseen = new Map();
    for (const p of s.payments || []) {
      const key = `${p.date || ""}|${p.amount || 0}`;
      if (!pseen.has(key)) pseen.set(key, []);
      pseen.get(key).push(p);
    }
    for (const [, list] of pseen) {
      if (list.length > 1) groups.push({ kind: "payment", student: s, list });
    }
  }
  return groups;
}

/**
 * 每一組留一筆、其餘刪掉。
 *
 * 留哪一筆有講究：**留底下掛著收費的那筆續約**（刪掉有關聯的那筆會讓收費變孤兒），
 * 收費則留已經接上續約的那筆（孤兒收費才是後來多出來的那個）。
 */
function removeDuplicates(groups) {
  let removed = 0;
  for (const g of groups) {
    if (g.kind === "renewal") {
      const keep = g.list.find((r) => paymentsOfRenewal(g.student, r.id).length) || g.list[0];
      for (const r of g.list) {
        if (r === keep) continue;
        removeRenewalRecord(g.student, r);
        removed++;
      }
    } else {
      const keep = g.list.find((p) => p.renewalId) || g.list[0];
      const drop = new Set(g.list.filter((p) => p !== keep).map((p) => p.id));
      g.student.payments = g.student.payments.filter((p) => !drop.has(p.id));
      removed += drop.size;
    }
    g.student.updatedAt = new Date().toISOString();
  }
  return removed;
}

function duplicateSheet() {
  const groups = duplicateRecords();
  if (!groups.length) { toast("沒有看起來重複的紀錄"); return; }
  const extra = groups.reduce((a, g) => a + g.list.length - 1, 0);

  openSheet({
    title: `看起來重複的紀錄（${extra} 筆多的）`,
    confirmLabel: `刪掉多的 ${extra} 筆`,
    body: `
      <p class="hint" style="margin-top:0">
        同一位學生、同一天、金額（與堂數）都一樣的紀錄。<strong>每一組會留下一筆</strong>——
        續約留底下有掛收費的那筆，收費留已經接上續約的那筆。<br>
        分期付款真的可能同一天收兩筆一樣的錢，<strong>不是你的情況就先關掉這張表</strong>，
        不會自動刪。
      </p>
      ${groups.map((g) => `
        <div class="row" style="display:block;padding:8px 0">
          <div class="row-title" style="font-size:14px">
            ${esc(g.student.name || "（未命名）")}
            <span class="pill pill-mute">${g.kind === "renewal" ? "續約" : "收費"}</span>
            <span class="muted" style="font-weight:400;font-size:12px">　${g.list.length} 筆一模一樣</span>
          </div>
          <div class="row-sub">
            ${esc(g.list[0].date || "（無日期）")}
            ${g.kind === "renewal" ? `・${g.list[0].sessions || 0} 堂` : ""}
            ・${money(g.list[0].amount || 0)}
          </div>
        </div>`).join("")}`,
    onConfirm: () => {
      const n = removeDuplicates(duplicateRecords());
      save(); render();
      toast(n ? `已刪掉 ${n} 筆重複的紀錄` : "沒有刪掉任何東西");
    },
  });
}

/**
 * 一次改完所有要修的合約。
 *
 * 一筆一筆點進去改 23 筆不現實 —— 補完歷史的人正是需要這張表。
 * 只改日期與金額：堂數改了會連動累計已購，那要走續約紀錄那邊的編輯。
 */
/**
 * 日期卡在「補登那天」的收費。
 *
 * 合約日期修好了，收費卻還留在補登那天 —— 而「本月收到」與月營收看的是**收費
 * 日期**，所以修完合約畫面上完全沒變（2026-08-12 實例：本月收到 $1,062,540，
 * 而一輩子的累計才 $3,262,460）。
 *
 * 一樣用批次補登的特徵，而且抓得很緊：
 *   1. 這筆收費**掛在某一筆續約**底下，而且日期跟那筆合約不同天
 *   2. 收費日期落在「同一天有 5 位以上不同學生」的那種日子
 *   3. 合約日期比它**早** —— 只往前搬，不動「這個月簽約、下個月才收錢」
 */
function paymentsStuckOnEntryDay() {
  const byDate = new Map();
  for (const s of S.students) {
    for (const p of s.payments || []) {
      if (!p.date) continue;
      if (!byDate.has(p.date)) byDate.set(p.date, new Set());
      byDate.get(p.date).add(s.id);
    }
  }
  const bulk = new Set([...byDate.entries()]
    .filter(([, ids]) => ids.size >= BULK_ENTRY_MIN).map(([d]) => d));

  const rows = [];
  for (const s of S.students) {
    for (const p of s.payments || []) {
      if (!p.renewalId || !bulk.has(p.date)) continue;
      const r = renewalOfPayment(s, p);
      if (!r || !r.date || r.date >= p.date) continue;
      rows.push({ student: s, payment: p, to: r.date });
    }
  }
  return rows;
}

/** 把那些收費的日期改成對應合約的日期 */
function fixPaymentDatesFromRenewals() {
  const rows = paymentsStuckOnEntryDay();
  for (const { student, payment, to } of rows) {
    payment.date = to;
    student.updatedAt = new Date().toISOString();
  }
  return rows.length;
}

function batchContractSheet(showAll = false) {
  // 我的判斷再怎麼修都會有漏網的（實際資料就漏過兩批），所以留一條退路：
  // 「顯示全部合約」讓人自己看、自己改，不必跟我的啟發式規則吵架。
  const rows = showAll ? allContractRows() : contractsNeedingReview();
  if (!rows.length) { toast("沒有需要修正的合約"); return; }
  const dateStuck = rows.filter((r) => r.sameDay).length;
  const noAmount = rows.filter((r) => r.noAmount).length;

  openSheet({
    title: showAll ? `所有合約（${rows.length} 筆）` : `批次修正合約（${rows.length} 筆）`,
    confirmLabel: "全部套用",
    body: `
      <p class="hint" style="margin-top:0">
        ${dateStuck ? `<strong>${dateStuck} 筆的日期停在補登那天</strong>，業績會全算到那個月。
          <strong style="color:var(--warn)">這幾筆的日期 App 猜不出來，要你自己填</strong>——
          底下每一列都附了那位學生的到期日與最早上課日，照著回想。` : ""}
        ${noAmount ? `<strong>${noAmount} 筆還沒填金額</strong>，銷售金額會少算。` : ""}
        改成實際簽約的日期與金額，沒動到的那幾列不會被存。
        <strong>金額留 0 也可以</strong>（贈課、補課），套用之後就不會再問同一筆。
      </p>
      ${showAll ? "" : `<p class="hint" style="margin-top:0">
        少列到的話按這裡 →
        <button class="btn btn-sm" type="button" data-action="batch-contracts-all">顯示全部合約</button>
      </p>`}
      <div class="switch">
        <label for="f-makePayments">沒有收費紀錄的，照這裡的金額與日期補一筆</label>
        <input id="f-makePayments" name="makePayments" type="checkbox" checked>
      </div>
      <p class="hint">以這張表為準把收費紀錄補齊——已經有收費的那幾筆不會被動到
        （要讓它們跟著改，到那一筆續約的「編輯」裡勾「同時更新收費紀錄」）。</p>
      ${rows.map(({ student, renewal, sameDay, noAmount }) => {
        // 給一點線索幫忙回想：這位學生的方案到期日、以及最早的一堂課
        const dates = lessonsOf(student.id).map((l) => l.date).filter(Boolean).sort();
        const clues = [student.expiry ? `到期 ${student.expiry}` : "",
                       dates[0] ? `最早上課 ${dates[0]}` : ""].filter(Boolean).join("・");
        return `
        <div class="row" style="display:block;padding:9px 0">
          <div class="row-title" style="font-size:14px">
            ${esc(student.name || "（未命名）")}
            <span class="muted" style="font-weight:400;font-size:12px">　${renewal.sessions || 0} 堂</span>
            ${sameDay ? '<span class="pill pill-warn">日期</span>' : ""}
            ${noAmount ? '<span class="pill pill-warn">金額</span>' : ""}
          </div>
          ${(sameDay || clues) ? `<div class="muted" style="font-size:11.5px">${
            [sameDay ? `現在是 ${esc(renewal.date || "")}（補登那天）` : "", esc(clues)]
              .filter(Boolean).join("・")}</div>` : ""}
          <div class="field-row" style="margin-top:5px">
            ${// 日期停在補登那天的那幾列**留空**。預填成現在那個（錯的）日期，
              // 看起來就像已經填好了、沒事要做 —— 使用者按了「全部套用」什麼都
              // 沒發生，還被回一句「已處理 N 筆」（2026-08-12 回報）。
              fieldText(`d_${renewal.id}`, sameDay ? "合約日期（要填）" : "合約日期",
                        sameDay ? "" : (renewal.date || ""), { type: "date" })}
            ${fieldText(`a_${renewal.id}`, "金額", renewal.amount || "", { type: "number" })}
          </div>
        </div>`;
      }).join("")}`,
    onConfirm: (form) => {
      const makePayments = !!(form.elements.makePayments && form.elements.makePayments.checked);
      let changed = 0, made = 0, linked = 0, realEdits = 0;
      for (const { student, renewal } of rows) {
        const d = form.elements[`d_${renewal.id}`];
        const a = form.elements[`a_${renewal.id}`];
        const newDate = d ? d.value : renewal.date;
        const newAmount = a ? Math.max(0, +a.value || 0) : (renewal.amount || 0);
        let touched = false;
        if (newDate && newDate !== renewal.date) {
          // 掛在底下、而且**本來就跟合約同一天**的收費要跟著搬。
          // 不搬的話「本月收到」與月營收全部留在補登那個月，改了合約日期
          // 也看不出差別（2026-08-12 回報「本月收到那邊也是都沒有改過來」）。
          // 刻意分開填過的收費日期不動 —— 那是「這個月簽約、下個月才轉帳」。
          const wasDate = renewal.date;
          for (const p of paymentsOfRenewal(student, renewal.id)) {
            if ((p.date || "") === wasDate) p.date = newDate;
          }
          renewal.date = newDate;
          touched = true;
        }
        if (newAmount !== (renewal.amount || 0)) { renewal.amount = newAmount; touched = true; }
        if (touched) realEdits++;
        // 看過了就是看過了 —— 留 0 是他的決定，不要下次再問一次
        if (!renewal.amountOk) { renewal.amountOk = true; touched = true; }

        // 以這張表為準把收費補齊。已經掛著收費的不動：那可能是分期或訂金，
        // 硬塞第二筆會讓累計收費憑空多一份。
        if (makePayments && !paymentsOfRenewal(student, renewal.id).length) {
          // **先找找看錢是不是早就記過了，只是沒接上**。
          // 不找就直接補，同一筆錢會變成兩筆（實測：五位各有一筆孤兒收費，
          // 補完之後累計收費從 6 萬變 12 萬）。金額一樣就當同一筆，
          // 日期一樣的優先。
          const loose = unlinkedPayments(student)
            .filter((p) => (p.amount || 0) === (renewal.amount || 0));
          const hit = loose.find((p) => p.date === renewal.date) || loose[0];
          if (hit) {
            hit.renewalId = renewal.id;
            linked++;
          } else {
            student.payments = student.payments || [];
            student.payments.push({
              id: uid(), renewalId: renewal.id, amount: renewal.amount || 0,
              date: renewal.date || today(), method: "cash", notes: "",
              createdAt: new Date().toISOString(),
            });
            made++;
          }
          touched = true;
        }
        if (!touched) continue;
        changed++;
        student.updatedAt = new Date().toISOString();
      }
      // 合約日期改完，還卡在補登那天的收費一起收乾淨 —— 不然「本月收到」
      // 完全沒變，使用者會以為整件事沒發生（2026-08-12 回報）。
      const movedPayments = fixPaymentDatesFromRenewals();
      save(); render();
      // 只有「確認過 0 元」不算真的改了什麼 —— 回一句「已處理」會讓人以為
      // 日期也修好了，然後回頭發現提示還在
      toast(realEdits
        ? `已修正 ${realEdits} 筆`
          + (movedPayments ? `，${movedPayments} 筆收費日期跟著搬` : "")
          + (linked ? `，接回 ${linked} 筆已經記過的收費` : "")
          + (made ? `，補上 ${made} 筆收費` : "")
        : "日期還沒填，所以沒有東西被改 —— 那幾格要你自己輸入");
    },
  });
}

/**
 * 某一類的檢測場次清單。
 *
 * 卡片上的數字要能點進去看「是哪幾場、對象是誰」——
 * 「這個月 7 場、成交 2 位」本身沒有可以行動的資訊，
 * 但「沒成交的那位是王小明、來源是公司名單」才叫得出下一步。
 *
 * 用同一個 assessmentsInRange 過濾，跟 assessmentStats 算出來的數字才對得起來。
 * （iOS 的 AssessmentStats.lessons 是同一條規則，兩邊要一起改。）
 */
function assessmentList(from, to, filter) {
  const rows = assessmentsInRange(from, to);
  let matched;
  if (filter === "all") matched = rows;
  else if (filter === "pending") matched = rows.filter((l) => needsOutcome(l));
  else if (filter.startsWith("source:")) {
    const key = filter.slice(7);
    matched = rows.filter((l) => leadById(l.leadId)?.source === key);
  } else matched = rows.filter((l) => outcomeOf(l) === filter);

  // 新的排前面。要追的通常是最近那幾場。
  return matched.sort((a, b) =>
    (b.date + b.startTime).localeCompare(a.date + a.startTime));
}

/** 名單頁的標題文字。跟 iOS 的 AssessmentStats.Filter.title 一字不差。 */
function assessmentFilterTitle(filter) {
  if (filter === "all") return "全部檢測";
  if (filter === "pending") return "還沒回報";
  if (filter.startsWith("source:")) return LEAD_SOURCE[filter.slice(7)] || "來源";
  return OUTCOME[filter]?.label || "檢測";
}

/** 檢測名單。分析頁的每個數字都導到這裡。 */
function openAssessmentList(filter) {
  const b = periodBounds("thisMonth");
  const rows = assessmentList(b.from, b.to, filter);
  const title = assessmentFilterTitle(filter);

  const body = rows.length === 0
    ? `<p class="hint" style="text-align:center;padding:24px 0">這個月沒有「${esc(title)}」的檢測。</p>`
    : `
      <p class="sec-sub" style="margin:0 0 10px">${rows.length} 場</p>
      ${rows.map((l) => {
        const lead = leadById(l.leadId);
        const name = lead?.name || l.studentName || "（沒有記名字）";
        const o = outcomeOf(l);
        // pending 要分兩種：時間過了叫「待回報」（你欠一個動作），
        // 還沒到的叫「未結束」（不用管）。跟 iOS 一樣。
        const label = o === "pending"
          ? (needsOutcome(l) ? "待回報" : "未結束")
          : OUTCOME[o].label;
        const [, mm, dd] = l.date.split("-");
        const meta = [`${+mm}/${+dd} ${l.startTime}`,
                      lead?.source ? LEAD_SOURCE[lead.source] : "",
                      lead?.phone || ""].filter(Boolean).join("・");
        return `
          <div class="row">
            <div class="row-main">
              <div class="row-title">${esc(name)}</div>
              <div class="row-sub">${esc(meta)}</div>
            </div>
            <span class="pill ${OUTCOME[o].pill}">${esc(label)}</span>
          </div>`;
      }).join("")}
      ${filter === "pending" ? `
        <p class="hint" style="margin-top:12px">
          這些是時間已經過了但還沒回報成交與否的。沒回報的話成交率會少算——到課表點「回報」補上。
        </p>` : ""}
      ${filter === "notClosed" ? `
        <p class="hint" style="margin-top:12px">
          沒成交不代表白做。看得出是哪個來源、哪一類的人容易沒成交，下次就知道要調整什麼。
        </p>` : ""}`;

  openSheet({ title, body, confirmLabel: "", closeLabel: "關閉" });
}

function jumpBar(items) {

    ${items.map(([id, label]) =>
      `<button type="button" data-action="jump" data-value="${id}">${esc(label)}</button>`).join("")}

}

/**
 * 排行榜。四張榜共用同一段期間與同一個名次上限 —— 分開設定的話，
 * 「上課最多」看本月、「消費最多」看全部，兩張表擺在一起卻不是同一回事。
 *
 * **一次只畫一張榜**（2026-08-14）：四張疊起來的話，選「全部」＋幾十位學生
 * 就是幾百列，要看第二張榜得先捲過第一張。榜之間用上面那排按鈕換。
 */
function rankingSection(students) {
  const preset = periodBounds(rankPeriod);
  const from = preset ? preset.from : (rankFrom || today());
  const to = preset ? preset.to : (rankTo || today());
  const limit = RANK_LIMITS.some(([n]) => n === rankLimit) ? rankLimit : 5;

  const metric = RANK_METRICS.find((m) => m.key === rankMetric) || RANK_METRICS[0];

  return `
    <section class="card" id="sec-ranking">
      <div class="sec-head">
        <h2 class="sec-title">排行榜</h2>
        <span class="sec-sub">${rankPeriod === "all" ? "所有時間" : `${esc(from)} ～ ${esc(to)}`}・在檔 ${students.length} 位</span>
      </div>

      <div class="seg seg-wrap" style="margin-bottom:8px">
        ${RANK_METRICS.map((m) =>
          `<button type="button" data-action="rank-metric" data-value="${m.key}"
                   aria-pressed="${metric.key === m.key}">${m.title}</button>`).join("")}
      </div>

      <div class="seg seg-wrap" style="margin-bottom:8px">
        ${Object.entries(SALES_PERIODS).map(([k, label]) =>
          `<button type="button" data-action="rank-period" data-value="${k}"
                   aria-pressed="${rankPeriod === k}">${label}</button>`).join("")}
      </div>

      ${rankPeriod === "custom" ? `
        <div class="field-row" style="margin-bottom:8px">
          <div class="field">
            <label for="rank-from">從</label>
            <input id="rank-from" type="date" value="${esc(from)}" data-rank-from>
          </div>
          <div class="field">
            <label for="rank-to">到</label>
            <input id="rank-to" type="date" value="${esc(to)}" data-rank-to>
          </div>
        </div>` : ""}

      <div class="seg seg-wrap" style="margin-bottom:4px">
        ${RANK_LIMITS.map(([n, label]) =>
          `<button type="button" data-action="rank-limit" data-value="${n}"
                   aria-pressed="${limit === n}">${label}</button>`).join("")}
      </div>
      <p class="hint">選「全部」會把每一位學生都列出來，包含這段期間掛零的。</p>

      ${students.length ? (() => {
        const rows = rankingRows(metric, students, from, to, limit);
        // 「12 位」會讓人以為十二個人都有到課率，其實有幾位是算不出來的
        const ranked = rows.filter((r) => r.value > 0).length;
        const rest = rows.length - ranked;
        const shown = limit > 0
          ? (rows.length === limit ? `前 ${rows.length} 位` : `${rows.length} 位`)
          : (rest ? `${ranked} 位有數字・另 ${rest} 位沒有` : `${rows.length} 位`);
        return `
          <div style="margin-top:14px">
            <div class="sec-head" style="margin-bottom:4px">
              <h3 class="sec-title" style="font-size:14px">${metric.title}</h3>
              <span class="sec-sub">${metric.sub}・${shown}</span>
            </div>
            ${rows.length
              ? rows.map((r, i) => rankRow(i, r.student, r.text, r.note, r.value > 0)).join("")
              : `<p class="empty">這段期間沒有資料。</p>`}
          </div>`;
      })() : `<p class="empty">還沒有學生，排行榜會在有資料之後自動出現。</p>`}
    </section>`;
}

// 掛零的那些（只有「全部」看得到）不編號 —— 印成「第 18 名」會讓人
// 以為那是個成績，其實是「這段期間沒有」。
function rankRow(i, s, value, note, ranked = true) {
  return `<div class="row">
    <span class="mono" style="width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;
      background:${i === 0 && ranked ? "var(--gold)" : "var(--surface-2)"};color:${i === 0 && ranked ? "var(--on-gold)" : "var(--muted)"}">${ranked ? i + 1 : "–"}</span>
    <span class="dot" style="background:${esc(s.color)}"></span>
    <div class="row-main"><div class="row-title">${esc(s.name)}</div></div>
    <div class="row-end mono" style="font-weight:600">${esc(value)}${
      note ? `<span class="row-sub mono" style="display:block;font-weight:400">${esc(note)}</span>` : ""}</div>
  </div>`;
}

/** 用實際數字解釋底薪的給法，比抽象敘述好懂 */
function baseModeHint(rule) {
  const base = rule.baseSalary || 0;
  const threshold = rule.baseSalaryThreshold || 40;
  switch (rule.baseSalaryMode || "always") {
    case "belowThreshold":
      return `不滿 ${threshold} 堂時領 ${money(base)} 底薪加抽成；滿 ${threshold} 堂之後底薪歸零，只算抽成。`;
    case "higherOf":
      return `底薪 ${money(base)} 與抽成比大小，領高的那個，不相加。抽成算出 ${money(base / 2)} 就領 ${money(base)}；算出 ${money(base * 2)} 就領 ${money(base * 2)}。`;
    default:
      return `底薪 ${money(base)} 固定給，抽成另外加上去。`;
  }
}
