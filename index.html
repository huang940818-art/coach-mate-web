/**
 * 學生詳情（對應 iOS 的 StudentDetailView）。
 *
 * 網頁版原本點學生沒反應，只能從「編輯」「續約」進去，想看某個人的
 * 課程與收費紀錄得自己去別的頁面翻，翻到了也認不出是誰的。
 *
 * 做成 sheet 而不是獨立頁面：這個 App 的子畫面全是 sheet
 * （lessonSheet / renewSheet / adjustSessionsSheet），為了一個唯讀畫面
 * 多加一條路由與網址狀態不划算。
 *
 * 唯讀。要改資料走上面那排按鈕，跟 iOS 一樣。
 */
function studentDetailSheet(student) {
  const ls = lessonsOf(student.id)
    .slice()
    .sort((a, b) => (b.date + b.start).localeCompare(a.date + a.start));

  // 跟 iOS 的出缺勤統計對齊：「已出席」只算 attended，
  // 但出席率把遲到當成有到（人有來，只是晚了）。
  const attended = ls.filter((l) => l.status === "attended").length;
  const absent = ls.filter((l) => l.status === "absent").length;
  const late = ls.filter((l) => l.status === "late").length;
  const counted = attended + absent + late;
  const rate = counted ? (attended + late) / counted : 0;

  const pays = (student.payments || []).slice()
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const paid = pays.reduce((a, p) => a + (p.amount || 0), 0);
  const fields = Object.entries(student.custom || {}).filter(([, v]) => v);
  const owed = owedCount(student.id);

  const byMonth = {};
  for (const l of ls) {
    const m = (l.date || "").slice(0, 7) || "（無日期）";
    if (!byMonth[m]) byMonth[m] = [];
    byMonth[m].push(l);
  }
  const months = Object.keys(byMonth).sort().reverse();

  const statCell = (value, label, color) => `
    <div style="flex:1;text-align:center">
      <div style="font-size:20px;font-weight:700;color:${color}">${value}</div>
      <div class="muted" style="font-size:11px">${label}</div>
    </div>`;

  openSheet({
    title: student.name || "（未命名）",
    closeLabel: "關閉",
    body: `
      <div class="row" style="padding-top:0">
        <span class="dot" style="background:${esc(student.color)}"></span>
        <div class="row-main">
          <div class="row-title">
            ${esc(student.name || "（未命名）")}
            ${student.status === "archived" ? '<span class="pill pill-mute">封存</span>' : ""}
            ${student.status === "paused" ? '<span class="pill pill-mute">暫停</span>' : ""}
            ${student.mayNotRenew ? '<span class="pill pill-warn">可能不續約</span>' : ""}
            ${owed > 0 ? `<span class="pill pill-crit">欠 ${owed} 堂</span>` : ""}
          </div>
          <div class="row-sub">
            ${student.phone ? esc(student.phone) + "　" : ""}${student.rate ? "每堂 " + money(student.rate) : ""}
          </div>
        </div>
        <div class="row-end">
          <div class="mono" style="font-weight:600">${student.remaining}<span class="muted" style="font-size:12px"> / ${currentPackageSessions(student)} 堂</span></div>
          ${student.expiry ? `<div class="muted" style="font-size:12px">到期 ${esc(student.expiry)}</div>` : ""}
        </div>
      </div>
      ${tagsOf(student).length ? `<div class="tag-row" style="margin-bottom:10px">${tagsOf(student).map((t) =>
        `<span class="tag-chip tag-chip-sm" style="--tag:${esc(t.color)}"><span class="tag-dot"></span>${esc(t.name)}</span>`).join("")}</div>` : ""}

      <div style="display:flex;gap:6px;margin-bottom:12px">
        <button type="button" class="btn btn-sm btn-primary" data-detail-action="renew">續約</button>
        <button type="button" class="btn btn-sm" data-detail-action="adjust">調整堂數</button>
        <button type="button" class="btn btn-sm" data-detail-action="edit">編輯</button>
      </div>

      <div class="seg" style="margin-bottom:12px">
        ${[["lessons", "課程紀錄"], ["payments", "收費紀錄"], ["stats", "統計"]].map(([v, t], i) =>
          `<button type="button" data-detail-tab="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>

      <div data-panel="lessons">
        ${months.length ? months.map((m) => `
          <div class="row-title" style="font-size:13px;margin:10px 0 4px">${esc(m)}　<span class="muted" style="font-weight:400">${byMonth[m].length} 堂</span></div>
          ${byMonth[m].map((l) => {
            const meta = LESSON_STATUS[l.status] || LESSON_STATUS.scheduled;
            const isPartner = l.partnerId === student.id;
            return `
            <div class="row" style="padding:6px 0">
              <div class="row-main">
                <div class="row-title" style="font-size:14px">
                  ${esc(l.date)} <span class="pill ${meta.pill}">${meta.label}</span>
                  ${isPartner ? '<span class="pill pill-mute">雙人課</span>' : ""}
                  ${(isPartner ? l.partnerOwed : l.owed) ? '<span class="pill pill-crit">欠一堂</span>' : ""}
                </div>
                <div class="row-sub mono">${esc(l.start)}–${esc(l.end)}　${durationLabel(durationOf(l))}${l.location ? "　" + esc(l.location) : ""}</div>
              </div>
            </div>`;
          }).join("")}`).join("") : `<p class="empty">還沒有課程紀錄。</p>`}
      </div>

      <div data-panel="payments" hidden>
        ${pays.length ? `
          <p class="hint" style="margin:0 0 8px">共 ${pays.length} 筆・累計 ${money(paid)}</p>
          ${pays.map((p) => `
            <div class="row" style="padding:6px 0">
              <div class="row-main">
                <div class="row-title" style="font-size:14px">${esc(p.date)}</div>
                ${paymentLabel(student, p) ? `<div class="row-sub">${esc(paymentLabel(student, p))}</div>` : ""}
              </div>
              <div class="row-end">
                <div class="mono" style="font-weight:600">${money(p.amount)}</div>
                <div class="muted" style="font-size:12px">${({ cash: "現金", transfer: "轉帳", other: "其他" })[p.method] || "其他"}</div>
              </div>
            </div>`).join("")}` : `<p class="empty">還沒有收費紀錄。</p>`}
      </div>

      <div data-panel="stats" hidden>
        <div class="row-title" style="font-size:13px;margin-bottom:6px">出缺勤統計</div>
        <div style="display:flex;margin-bottom:10px">
          ${statCell(ls.length, "總課程", "var(--info)")}
          ${statCell(attended, "已出席", "var(--good)")}
          ${statCell(absent, "缺席", "var(--crit)")}
          ${statCell(late, "遲到", "var(--warn)")}
        </div>
        ${counted ? `
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span class="muted">出席率</span>
            <strong style="color:${rate >= 0.8 ? "var(--good)" : "var(--warn)"}">${(rate * 100).toFixed(0)}%</strong>
          </div>
          <span class="bar-track" style="display:block;margin-bottom:14px"><span class="bar-fill" style="width:${(rate * 100).toFixed(1)}%"></span></span>`
        : `<p class="hint">還沒有上過課，算不出出席率。</p>`}

        ${fields.length ? `
          <div class="row-title" style="font-size:13px;margin-bottom:6px">學生資訊</div>
          ${fields.map(([k, v]) => `
            <div class="row" style="padding:5px 0">
              <div class="row-main"><span class="muted" style="font-size:13px">${esc(k)}</span></div>
              <div class="row-end" style="font-size:14px">${esc(v)}</div>
            </div>`).join("")}` : ""}

        <div class="row-title" style="font-size:13px;margin:12px 0 6px">累計數據</div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">續約次數</span></div>
          <div class="row-end mono" style="font-weight:600">${student.renewalCount || 0}</div>
        </div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">累計已購</span></div>
          <div class="row-end mono" style="font-weight:600">${student.totalPurchased || 0} 堂</div>
        </div>
        <div class="row" style="padding:5px 0">
          <div class="row-main"><span class="muted" style="font-size:13px">累計收費</span></div>
          <div class="row-end mono" style="font-weight:600">${money(paid)}</div>
        </div>
        <p class="hint">缺席與遲到都是從課程紀錄實算的，不是另外一組計數，所以跟上面那排一定對得起來。續約的每一筆明細在「編輯」裡。</p>
      </div>`,
    onMount: (root) => {
      root.addEventListener("click", (e) => {
        const t = e.target.closest("[data-detail-tab]");
        if (t) {
          e.preventDefault();
          const v = t.dataset.detailTab;
          root.querySelectorAll("[data-detail-tab]").forEach((b) =>
            b.setAttribute("aria-pressed", String(b.dataset.detailTab === v)));
          root.querySelectorAll("[data-panel]").forEach((p) => {
            p.hidden = p.dataset.panel !== v;
          });
          return;
        }
        // 這些按鈕在 .scrim 裡面，全域的 data-action 分派會跳過它們
        // （那是為了不讓表單裡的按鈕誤觸發頁面動作），所以自己接。
        const act = e.target.closest("[data-detail-action]");
        if (!act) return;
        e.preventDefault();
        const a = act.dataset.detailAction;
        closeSheet();
        if (a === "renew") renewSheet(student);
        else if (a === "edit") studentSheet(student);
        else if (a === "adjust") adjustSessionsSheet(student);
      });
    },
  });
}

/**
 * 編輯學生頁面裡的續約紀錄（對應 iOS 的 RenewalHistorySectionView）。
 *
 * 抽成函式是因為刪掉一筆之後要就地重畫這一塊 —— 不能整張表單重開，
 * 那會把使用者其他還沒存的修改一起吃掉。
 */
/** 目前正在就地編輯的那筆續約紀錄 id（null＝沒有在編輯） */
let editingRenewalId = null;

/**
 * 改一筆續約紀錄的內容。
 *
 * 已購是所有續約堂數的累計，改了堂數就要補上差額。
 * 次數不變 —— 還是同一筆，只是內容改了。
 * 剩餘堂數與收費紀錄都不動：看不出這筆當初是不是補登的（補登本來就沒加過
 * 剩餘），收費也是各自獨立的一筆。
 *
 * 抽成函式是為了測得到 —— 原本這幾行埋在 DOM 事件處理器裡，
 * 而算錯就是已購堂數與業績一起歪掉。
 */
function applyRenewalEdit(student, record, patch) {
  const newSessions = Math.max(0, +patch.sessions || 0);
  student.totalPurchased = Math.max(0,
    (student.totalPurchased || 0) - (record.sessions || 0) + newSessions);
  record.date = patch.date || record.date;
  record.sessions = newSessions;
  // 這裡也吃得下單價 —— 存進去的一律是總額，理由跟 renewSheet 一樣：
  // 銷售統計的均價是「總額 ÷ 堂數」除出來的，業績抽成也是直接乘總額。
  const typed = Math.max(0, +patch.amount || 0);
  record.amount = patch.priceMode === "unit" ? typed * newSessions : typed;
  record.notes = patch.notes ?? record.notes;

  // 勾了才同步，而且只動掛在這筆續約底下的收費。堂數不用同步 ——
  // 收費那一列的堂數是即時從續約讀出來的，本來就會跟著變。
  if (patch.syncPayment) {
    for (const p of paymentsOfRenewal(student, record.id)) {
      p.amount = record.amount;
      p.date = record.date;
    }
  }

  student.updatedAt = new Date().toISOString();
  return record;
}

/** 掛在這筆續約底下的收費紀錄（分期的話會有好幾筆） */
function paymentsOfRenewal(student, renewalId) {
  return (student.payments || []).filter((p) => p.renewalId && p.renewalId === renewalId);
}

/**
 * 改續約時，那筆收費要不要跟著改？
 *
 * 不能無條件同步：收費金額不一定等於續約金額 —— 分期或部分收款時
 * 一筆 $46,800 的續約底下可能掛著三筆 $1,300，硬同步會把它們全部
 * 改成 $46,800，資料反而爛掉。
 *
 * 所以只在「本來就對得起來」時預設打勾：剛好一筆收費、且金額與續約
 * 相同，代表它就是續約當下自動產生的那筆，跟著改才是使用者要的。
 */
function shouldSyncPaymentByDefault(student, record) {
  const hits = paymentsOfRenewal(student, record.id);
  return hits.length === 1 && (hits[0].amount || 0) === (record.amount || 0);
}

/**
 * 更新續約編輯列底下的換算提示，兩個數字同時看得到。
 * 「我剛剛填的是一堂還是全部」不該在按下儲存之後才想起來。
 */
function refreshRenewalHint(box) {
  const hint = box.querySelector("[data-r-price-hint]");
  if (!hint) return;
  const num = (n) => Math.max(0, +(box.querySelector(`[name="${n}"]`)?.value || 0));
  const n = num("r_sessions");
  const v = num("r_amount");
  const unit = (box.querySelector('[name="r_priceMode"]')?.value || "total") === "unit";
  if (!n || !v) { hint.textContent = "存進去的一律是總額。"; return; }
  hint.textContent = unit
    ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
    : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`;
}

/**
 * 刪掉一筆續約紀錄。次數與已購跟著回去，剩餘堂數不動（理由同上）。
 */
function removeRenewalRecord(student, record) {
  student.renewals = (student.renewals || []).filter((x) => x.id !== record.id);
  student.renewalCount = Math.max(0, (student.renewalCount || 0) - 1);
  student.totalPurchased = Math.max(0, (student.totalPurchased || 0) - (record.sessions || 0));
  student.updatedAt = new Date().toISOString();
}

function renewalHistoryBlock(student) {
  const rs = renewalsOf(student);
  const sessions = rs.reduce((a, r) => a + (r.sessions || 0), 0);
  const amount = rs.reduce((a, r) => a + (r.amount || 0), 0);

  // 編輯狀態的那一列。就地換成輸入框，不另外開 sheet ——
  // openSheet 會先關掉現有的那張，等於把使用者在編輯學生表單裡
  // 其他還沒存的修改一起吃掉。
  const editRow = (r) => `
    <div class="row" style="padding:8px 0;display:block" data-renewal-row="${r.id}">
      <div class="field-row">
        ${fieldText("r_date", "日期", r.date || "", { type: "date" })}
        ${fieldText("r_sessions", "堂數", r.sessions || 0, { type: "number" })}
      </div>
      <div class="seg" style="max-width:260px;margin-bottom:8px">
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-r-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="r_priceMode" value="total">
      <div class="field-row">
        ${fieldText("r_amount", "總額", r.amount || 0, { type: "number" })}
        ${fieldText("r_notes", "備註", r.notes || "")}
      </div>
      <p class="hint" data-r-price-hint>${
        r.sessions ? `${money(r.amount || 0)} ÷ ${r.sessions} 堂 ＝ 每堂 ${money(Math.round((r.amount || 0) / r.sessions))}` : "存進去的一律是總額。"
      }</p>
      ${(() => {
        const linked = paymentsOfRenewal(student, r.id);
        if (!linked.length) return "";
        const on = shouldSyncPaymentByDefault(student, r);
        const sum = linked.reduce((a, p) => a + (p.amount || 0), 0);
        return `
        <div class="switch">
          <label for="f-r_syncPayment">同時更新收費紀錄</label>
          <input id="f-r_syncPayment" name="r_syncPayment" type="checkbox" ${on ? "checked" : ""}>
        </div>
        <p class="hint">${linked.length === 1
          ? `底下掛著一筆 ${money(sum)} 的收費，勾了會把金額與日期一起改成上面填的。`
          : `底下掛著 ${linked.length} 筆收費、合計 ${money(sum)}（看起來是分期）。勾了會把每一筆都改成上面填的金額，通常不是你要的。`}
          堂數不用管，收費那邊顯示的堂數本來就是即時從這筆續約讀出來的。</p>`;
      })()}
      <div style="display:flex;gap:6px;justify-content:flex-end">
        <button type="button" class="btn btn-sm" data-cancel-renewal="1">取消</button>
        <button type="button" class="btn btn-sm btn-primary" data-save-renewal="${r.id}">儲存這筆</button>
      </div>
    </div>`;

  const showRow = (r) => `
    <div class="row" style="padding:8px 0">
      <div class="row-main">
        <div class="row-title" style="font-size:14px">${esc(r.date || "（無日期）")}
          ${isFirstPurchase(student, r) ? '<span class="pill pill-mute">首購</span>' : ""}
          ${paymentsOfRenewal(student, r.id).length === 0 ? '<span class="pill pill-warn">沒有收費紀錄</span>' : ""}
        </div>
        ${r.notes ? `<div class="row-sub">${esc(r.notes)}</div>` : ""}
      </div>
      <div class="row-end" style="display:flex;align-items:center;gap:8px">
        <div style="text-align:right">
          <div class="mono" style="font-weight:600">${r.sessions || 0} 堂</div>
          <div class="muted" style="font-size:12px">${money(r.amount || 0)}</div>
        </div>
        <button type="button" class="btn btn-sm" data-edit-renewal="${r.id}"
                title="修改這筆續約紀錄">編輯</button>
        <button type="button" class="btn btn-sm btn-danger" data-del-renewal="${r.id}"
                title="刪除這筆續約紀錄">刪除</button>
      </div>
    </div>`;

  return `
    <div class="row-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
      <span>續約紀錄</span>
      ${rs.length ? (() => {
        const linked = rs.filter((r) => paymentsOfRenewal(student, r.id).length).length;
        return `<span class="muted" style="font-size:12px;font-weight:400">${rs.length} 次・${sessions} 堂・累計 ${money(amount)}${
          linked < rs.length ? `・<strong style="color:var(--warn)">${rs.length - linked} 筆沒有收費</strong>` : ""}</span>`;
      })() : ""}
    </div>
    ${rs.length ? rs.map((r) => (r.id === editingRenewalId ? editRow(r) : showRow(r))).join("")
                : `<p class="empty" style="padding:16px 0">尚無續約紀錄。按「續約」新增，補以前的請勾「補登以前的續約」。</p>`}
    <p class="hint">改堂數會連動累計已購，改金額會連動銷售統計。<strong>剩餘堂數和收費紀錄都不會跟著動</strong>——看不出這筆當初是不是補登的，收費也是各自獨立的一筆。要改請用「調整剩餘堂數」與「收費」那一頁。</p>`;
}

function studentSheet(existing) {
  const s = existing || newStudent();
  const fields = S.settings.customFields;
  // 上次關掉時可能停在某筆的編輯狀態，重開要回到乾淨的樣子
  editingRenewalId = null;
  openSheet({
    title: existing ? "編輯學生" : "新增學生",
    body: `
      ${fieldText("name", "姓名", s.name, { required: true, placeholder: "王小明" })}
      <div class="field-row">
        ${fieldText("phone", "電話", s.phone, { type: "tel" })}
        ${fieldText("rate", "每堂費用", s.rate || "", { type: "number", hint: "算收入與抽成用" })}
      </div>
      <div class="field-row">
        <input type="hidden" name="currentSessionsInitial" value="${currentPackageSessions(s)}">
        ${fieldText("currentSessions", "本期購買堂數", currentPackageSessions(s), {
          type: "number",
          hint: renewalsOf(s).length
            ? `累計已購 ${s.totalPurchased || 0} 堂。改這格等於改最近一筆續約紀錄，累計會自動跟著調。`
            : `還沒有續約紀錄，這格就是他目前的合約。`,
        })}
        ${fieldText("remaining", "剩餘堂數", s.remaining || 0, { type: "number" })}
      </div>
      <div class="field-row">
        ${fieldText("expiry", "方案到期日", s.expiry, { type: "date" })}
        ${fieldSelect("acquisition", "客戶來源", Object.entries(ACQUISITION), s.acquisition)}
      </div>
      <div class="field-row">
        ${fieldSelect("status", "狀態", [["active", "在檔"], ["paused", "暫停"], ["archived", "封存"]], s.status)}
        ${fieldText("renewalCount", "續約次數", s.renewalCount || 0,
            { type: "number", hint: "按「續約」會自動加一，這裡只用來更正" })}
      </div>
      <div class="switch">
        <label for="f-mayNotRenew">標記為可能不續約</label>
        <input id="f-mayNotRenew" name="mayNotRenew" type="checkbox" ${s.mayNotRenew ? "checked" : ""}>
      </div>
      <div class="divider"></div>
      <label class="field-label">代表色</label>
      <div class="swatches" data-color-picker>
        ${STUDENT_COLORS.map((c) => `
          <button type="button" class="swatch ${s.color === c ? "on" : ""}"
                  data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
      </div>
      <input type="hidden" name="color" value="${esc(s.color || STUDENT_COLORS[0])}">

      ${allTags().length ? `
        <label class="field-label" style="margin-top:12px">標籤</label>
        <div class="tag-filter" data-tag-picker>
          ${allTags().map((t) => `
            <button type="button" class="tag-chip ${(s.tags || []).includes(t.id) ? "on" : ""}"
                    data-tag="${t.id}" style="--tag:${esc(t.color)}">
              <span class="tag-dot"></span>${esc(t.name)}
            </button>`).join("")}
        </div>
        <input type="hidden" name="tags" value="${esc((s.tags || []).join(","))}">
        <p class="hint">到「設定 → 顏色標籤」可以新增、改名或換顏色。</p>` : ""}

      <div class="divider"></div>
      <p class="hint" style="margin:0 0 10px">自訂欄位（填了才會出現在客群分析）</p>
      ${fields.map((f) => fieldText("cf_" + f, f, s.custom?.[f] || "",
          { type: f === "生日" ? "date" : "text" })).join("")}
      ${fields.length ? "" : `<p class="hint">還沒有自訂欄位，可以到「設定」新增。</p>`}
      <div class="field">
        <label for="f-notes">備註</label>
        <textarea id="f-notes" name="notes">${esc(s.notes)}</textarea>
      </div>
      ${existing ? `
        <div class="divider"></div>
        <div data-renewal-history>${renewalHistoryBlock(s)}</div>`
      : `
        <div class="divider"></div>
        <div class="switch">
          <label for="f-firstPayment">同時建立首次收費紀錄</label>
          <input id="f-firstPayment" name="firstPayment" type="checkbox" checked>
        </div>
        <p class="hint">金額用「每堂費用 × 購買堂數」算。這筆錢如果已經在別的地方記過了就取消勾選。<br>
        首購一定會留下一筆續約紀錄（不算進「續約次數」）——不然這筆生意不會出現在銷售統計與業績抽成裡。</p>`}`,
    extraFoot: existing ? `<button class="btn btn-danger btn-sm" type="button" data-action="delete-student" data-id="${s.id}">刪除</button>` : "",
    onConfirm: (form) => {
      const name = form.elements.name.value.trim();
      if (!name) { toast("請填學生姓名"); return false; }
      s.name = name;
      s.phone = form.elements.phone.value.trim();
      s.rate = +form.elements.rate.value || 0;
      s.remaining = Math.max(0, +form.elements.remaining.value || 0);
      // 「本期購買堂數」改的是最近一筆續約的堂數，累計自動跟著調差額。
      // 不能直接蓋掉 totalPurchased —— 那是所有續約的總和，
      // 銷售統計與客群分析都在用，蓋掉就整組錯。
      const typedCurrent = Math.max(0, +form.elements.currentSessions.value || 0);
      // 跟「開啟表單時的值」比，不是跟續約紀錄現在的值比。
      // 使用者可能在下面的續約紀錄那邊改過同一筆，這格若沒被動過就不該
      // 插手 —— 拿開啟當下的舊值再算一次差額，等於把那個修改打回去。
      const initialCurrent = Math.max(0, +form.elements.currentSessionsInitial.value || 0);
      const latestRenewal = renewalsOf(s)[0];
      if (latestRenewal) {
        if (typedCurrent !== initialCurrent && typedCurrent !== (latestRenewal.sessions || 0)) {
          applyRenewalEdit(s, latestRenewal, {
            date: latestRenewal.date, sessions: typedCurrent,
            amount: latestRenewal.amount, notes: latestRenewal.notes,
          });
        }
      } else if (typedCurrent !== initialCurrent) {
        // 還沒有續約紀錄的人，那筆購買本身就是他現在的合約
        s.totalPurchased = typedCurrent;
      }

      // 新學生的首購也要留一筆續約紀錄，否則這筆生意不會出現在銷售統計與
      // 業績抽成裡（那兩個的資料來源都是 renewals）。iOS 的 StudentFormView
      // 本來就會建，網頁版一直沒有，等於第一筆永遠漏算。
      //
      // 刻意不動 renewalCount：那個數字的意思是「續約過幾次」，
      // 第一次買不算續約。兩邊一致。
      if (!existing && typedCurrent > 0) {
        const firstAmount = Math.max(0, (s.rate || 0) * typedCurrent);
        const rid = uid();
        const stamp = new Date().toISOString();
        // 備註留空：「首次購買」是由誰最早推導出來的，不寫死。
        // 之後補了更早的續約，那筆才是首購。
        s.renewals.push({ id: rid, date: today(), sessions: typedCurrent,
                          amount: firstAmount, notes: "", createdAt: stamp });
        if (form.elements.firstPayment.checked) {
          s.payments.push({ id: uid(), renewalId: rid, amount: firstAmount,
                            date: today(), method: "cash", notes: "",
                            createdAt: stamp });
        }
      }
      s.expiry = form.elements.expiry.value;
      s.acquisition = form.elements.acquisition.value;
      s.status = form.elements.status.value;
      // 只改次數，不碰 s.renewals。那個陣列是銷售統計的資料來源，
      // 在這裡補一筆假的續約紀錄會讓業績憑空多出一筆金額。
      // 所以這格是「更正數字」，真的成交要走「續約」按鈕。
      s.renewalCount = Math.max(0, +form.elements.renewalCount.value || 0);
      s.mayNotRenew = form.elements.mayNotRenew.checked;
      s.notes = form.elements.notes.value;
      s.color = form.elements.color.value || s.color;
      // 設定裡已經刪掉的標籤不要再寫回去
      s.tags = form.elements.tags
        ? form.elements.tags.value.split(",").filter((id) => id && tagById(id))
        : (s.tags || []);
      s.custom = { ...s.custom };
      for (const f of fields) {
        const v = form.elements["cf_" + f].value.trim();
        if (v) s.custom[f] = v; else delete s.custom[f];
      }
      s.updatedAt = new Date().toISOString();
      if (!existing) S.students.push(s);
      save(); render();
      toast(existing ? "已更新學生資料" : `已新增 ${s.name}`);
    },
    onMount: (root) => {
      // 代表色
      const picker = root.querySelector("[data-color-picker]");
      const colorInput = root.querySelector('[name="color"]');
      if (picker && colorInput) {
        picker.addEventListener("click", (e) => {
          const btn = e.target.closest(".swatch");
          if (!btn) return;
          e.preventDefault();
          colorInput.value = btn.dataset.color;
          picker.querySelectorAll(".swatch").forEach((x) => x.classList.remove("on"));
          btn.classList.add("on");
        });
      }

      // 標籤（可複選）
      const tagPicker = root.querySelector("[data-tag-picker]");
      const tagInput = root.querySelector('[name="tags"]');
      if (tagPicker && tagInput) {
        tagPicker.addEventListener("click", (e) => {
          const btn = e.target.closest("[data-tag]");
          if (!btn) return;
          e.preventDefault();
          btn.classList.toggle("on");
          tagInput.value = [...tagPicker.querySelectorAll(".tag-chip.on")]
            .map((x) => x.dataset.tag).join(",");
        });
      }

      // 刪除單筆續約紀錄。跟 iOS 一樣是立即生效的動作，不等整張表單按儲存，
      // 所以只重畫這一塊，其他欄位還沒存的修改要留著。
      const histBox = root.querySelector("[data-renewal-history]");
      if (histBox) {
        const redraw = () => { histBox.innerHTML = renewalHistoryBlock(s); };

        // 在下面改動續約紀錄之後，上面那格「本期購買堂數」要跟著更新。
        // 不然它會停在開啟表單當下的舊值，按儲存時再用那個舊值算一次差額，
        // 等於把剛剛在下面做的修改整個打回去。
        const syncCurrentField = () => {
          const el = root.querySelector('[name="currentSessions"]');
          const init = root.querySelector('[name="currentSessionsInitial"]');
          if (el) el.value = currentPackageSessions(s);
          if (init) init.value = currentPackageSessions(s);
          const box = el && el.closest(".field");
          const hint = box && box.querySelector(".hint");
          if (hint) {
            hint.textContent = renewalsOf(s).length
              ? `累計已購 ${s.totalPurchased || 0} 堂。改這格等於改最近一筆續約紀錄，累計會自動跟著調。`
              : "還沒有續約紀錄，這格就是他目前的合約。";
          }
        };

        // 編輯列是 redraw 出來的，沒辦法在掛載時綁 input，所以用委派。
        histBox.addEventListener("input", (e) => {
          const box = e.target.closest("[data-renewal-row]");
          if (box) refreshRenewalHint(box);
        });

        histBox.addEventListener("click", (e) => {
          // 進入編輯：只換那一列的樣子，其他欄位的未存修改不受影響
          const edit = e.target.closest("[data-edit-renewal]");
          if (edit) {
            e.preventDefault();
            editingRenewalId = edit.dataset.editRenewal;
            redraw();
            return;
          }

          if (e.target.closest("[data-cancel-renewal]")) {
            e.preventDefault();
            editingRenewalId = null;
            redraw();
            return;
          }

          // 總額／單價切換。刻意「不」換算欄位裡已經填的數字 ——
          // 使用者可能是先打了數字才發現模式選錯，幫他乘除反而會把
          // 原本正確的輸入改壞。下面的提示會同時顯示兩個數字，
          // 按下儲存之前就看得出來對不對。
          const pm = e.target.closest("[data-r-price-mode]");
          if (pm) {
            e.preventDefault();
            const box = pm.closest("[data-renewal-row]");
            if (!box) return;
            const mode = pm.dataset.rPriceMode;
            box.querySelector('[name="r_priceMode"]').value = mode;
            box.querySelectorAll("[data-r-price-mode]").forEach((b) =>
              b.setAttribute("aria-pressed", String(b.dataset.rPriceMode === mode)));
            const lab = box.querySelector('label[for="f-r_amount"]');
            if (lab) lab.textContent = mode === "unit" ? "每堂單價" : "總額";
            refreshRenewalHint(box);
            return;
          }

          const saveBtn = e.target.closest("[data-save-renewal]");
          if (saveBtn) {
            e.preventDefault();
            const rec = (s.renewals || []).find((x) => x.id === saveBtn.dataset.saveRenewal);
            const box = histBox.querySelector(`[data-renewal-row="${saveBtn.dataset.saveRenewal}"]`);
            if (!rec || !box) return;
            const val = (n) => box.querySelector(`[name="${n}"]`)?.value ?? "";
            const syncBox = box.querySelector('[name="r_syncPayment"]');
            applyRenewalEdit(s, rec, {
              date: val("r_date"), sessions: val("r_sessions"),
              amount: val("r_amount"), notes: val("r_notes"),
              priceMode: val("r_priceMode"),
              syncPayment: !!(syncBox && syncBox.checked),
            });
            editingRenewalId = null;
            save(); render(); redraw(); syncCurrentField();
            toast(`已更新 ${rec.date} 的續約紀錄`);
            return;
          }

          const btn = e.target.closest("[data-del-renewal]");
          if (!btn) return;
          e.preventDefault();
          const r = (s.renewals || []).find((x) => x.id === btn.dataset.delRenewal);
          if (!r) return;
          removeRenewalRecord(s, r);
          editingRenewalId = null;
          save(); render(); redraw(); syncCurrentField();
          toast(`已刪除 ${r.date} 的續約紀錄`);
        });
      }

      root.addEventListener("click", (e) => {
        const del = e.target.closest('[data-action="delete-student"]');
        if (!del) return;
        closeSheet();
        confirmSheet("刪除學生", `會一併刪掉 ${esc(s.name)} 的課程與收費紀錄，無法復原。`, () => {
          S.lessons = S.lessons.filter((l) => l.studentId !== s.id && l.partnerId !== s.id);
          S.students = S.students.filter((x) => x.id !== s.id);
          save(); render(); toast("已刪除");
        }, "刪除");
      });
    },
  });
}

/**
 * 手動調整剩餘堂數。
 * 系統算錯、線下補課、送一堂，這些都得手動調。
 * 刻意「不」動已購堂數：已購是賣出去的量，銷售統計要用，
 * 不能因為送人一堂就讓業績跟著變多。
 */
function adjustSessionsSheet(student) {
  const before = student.remaining || 0;
  openSheet({
    title: "調整剩餘堂數",
    confirmLabel: "儲存",
    body: `
      <p style="font-weight:650;margin-bottom:2px">${esc(student.name)}</p>
      <p class="hint" style="margin-bottom:12px">目前剩 ${before} 堂．已購 ${student.totalPurchased || 0} 堂</p>
      ${fieldText("remaining", "改成", before, { type: "number" })}
      <div class="quick-steps">
        ${[-1, 1, 5, 10].map((n) => `
          <button type="button" class="btn btn-sm" data-step="${n}">${n > 0 ? "+" + n : n}</button>`).join("")}
      </div>
      ${fieldText("reason", "原因（選填）", "", { placeholder: "例如：線下補一堂、系統算錯" })}
      ${owedCount(student.id) > 0
        ? `<p class="hint" style="color:var(--warn)">目前欠 ${owedCount(student.id)} 堂（上了課但當時沒堂數可扣）。</p>`
        : ""}
      <p class="hint">只改剩餘堂數，已購 ${student.totalPurchased || 0} 堂不變，銷售統計不受影響。要記錄新買的堂數請用「續約」。</p>`,
    onConfirm: (form) => {
      const target = Math.max(0, +form.elements.remaining.value || 0);
      if (target === before) { toast("沒有變動"); return false; }
      student.remaining = target;

      const reason = form.elements.reason.value.trim();
      const stamp = `［${today()}］剩餘堂數 ${before} → ${target}` + (reason ? `：${reason}` : "");
      student.notes = student.notes ? `${student.notes}\n${stamp}` : stamp;
      student.updatedAt = new Date().toISOString();

      save(); render();
      toast(`已改為剩 ${target} 堂`);
    },
    onMount: (root) => {
      const input = root.querySelector('[name="remaining"]');
      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-step]");
        if (!btn || !input) return;
        e.preventDefault();
        input.value = Math.max(0, (+input.value || 0) + (+btn.dataset.step));
      });
    },
  });
}

/**
 * 回報問題。
 * 教練能講的通常只有「它壞了」，真正要查的是版本、瀏覽器、資料量，
 * 所以那些自動附上。送出方式是開啟郵件草稿，不需要後端也不用藏金鑰
 * （這份原始碼是公開的）。
 */
const ISSUE_KINDS = {
  bug: "怪怪的／算錯",
  broken: "打不開或卡住",
  feature: "希望多一個功能",
  other: "其他",
};

function reportIssueSheet() {
  const info = [
    `版本：${BUILD}`,
    `瀏覽器：${navigator.userAgent}`,
    `畫面：${window.innerWidth}×${window.innerHeight}`,
    `資料量：學生 ${S.students.length}．課程 ${S.lessons.length}．名單 ${S.leads.length}`,
  ].join("\n");

  openSheet({
    title: "回報問題",
    confirmLabel: "寫成郵件",
    body: `
      ${fieldSelect("kind", "這是哪一種問題", Object.entries(ISSUE_KINDS), "bug")}
      <div class="field">
        <label for="f-detail">發生了什麼事</label>
        <textarea id="f-detail" name="detail" rows="5"
          placeholder="哪一頁、你按了什麼、預期看到什麼、實際看到什麼。&#10;例如：某位學生續約 10 堂之後，剩餘堂數只加了 8 堂。"></textarea>
      </div>
      ${fieldText("contact", "怎麼聯絡你（選填）", "", { placeholder: "LINE 或電話" })}
      <details style="margin-top:10px">
        <summary class="hint" style="cursor:pointer">會一起附上的資訊</summary>
        <pre class="mono" style="font-size:11px;white-space:pre-wrap;color:var(--muted);margin-top:6px">${esc(info)}</pre>
      </details>
      <p class="hint">沒有學生姓名、電話或任何個人資料，只有版本與瀏覽器，還有總筆數。會開啟郵件草稿，<strong>記得按下寄出</strong>才會送出去。</p>`,
    onConfirm: (form) => {
      const detail = form.elements.detail.value.trim();
      if (!detail) { toast("請描述一下發生了什麼事"); return false; }
      const contact = form.elements.contact.value.trim();
      const kind = ISSUE_KINDS[form.elements.kind.value] || "其他";

      const subject = `教練小幫手回報：${kind}`;
      const body = [detail, contact ? `聯絡方式：${contact}` : "", "――――――――――\n" + info]
        .filter(Boolean).join("\n\n");
      const url = `mailto:${DEVELOPER_EMAIL}?subject=${encodeURIComponent(subject)}`
                + `&body=${encodeURIComponent(body)}`;

      // 有些瀏覽器沒有預設郵件程式，開不起來就退成複製到剪貼簿
      try {
        window.location.href = url;
        toast("已開啟郵件草稿，記得按寄出");
      } catch (err) {
        navigator.clipboard?.writeText(`${DEVELOPER_EMAIL}\n\n${subject}\n\n${body}`);
        toast(`開不了郵件程式，內容已複製，請傳給 ${DEVELOPER_EMAIL}`);
      }
    },
  });
}

/** 顏色標籤的設定 */
function tagSettingsSheet() {
  const counts = tagCounts();
  const draft = clone(allTags());

  openSheet({
    title: "顏色標籤",
    confirmLabel: "完成",
    body: `
      <div data-tag-list>
        ${draft.length
          ? draft.map((t) => tagEditorRow(t, counts[t.id] || 0)).join("")
          : `<p class="hint">還沒有標籤。在下面加一個，之後就能在學生名單上照標籤篩選。</p>`}
      </div>
      <div class="divider"></div>
      <p class="hint" style="margin:0 0 8px">新增標籤</p>
      ${fieldText("newName", "名稱", "", { placeholder: "減脂、產後、備賽…" })}
      <div class="swatches" data-new-color-picker>
        ${TAG_COLORS.map((c, i) => `
          <button type="button" class="swatch ${i === 0 ? "on" : ""}"
                  data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
      </div>
      <input type="hidden" name="newColor" value="${TAG_COLORS[0]}">
      <button type="button" class="btn btn-sm" data-action="add-tag" style="margin-top:8px">加入</button>
      <p class="hint">改名字或顏色，所有貼過這個標籤的學生會一起變。</p>`,
    onConfirm: () => {
      // 名字被清空的標籤存下去只會變成一個看不見的膠囊，直接濾掉
      S.settings.tags = draft.filter((t) => (t.name || "").trim());
      save(); render();
      toast("已更新標籤");
    },
    onMount: (root) => {
      const list = root.querySelector("[data-tag-list]");

      const redraw = () => {
        const c = tagCounts();
        list.innerHTML = draft.length
          ? draft.map((t) => tagEditorRow(t, c[t.id] || 0)).join("")
          : `<p class="hint">還沒有標籤。</p>`;
      };

      // 新標籤的顏色
      const newPicker = root.querySelector("[data-new-color-picker]");
      const newColor = root.querySelector('[name="newColor"]');
      newPicker.addEventListener("click", (e) => {
        const btn = e.target.closest(".swatch");
        if (!btn) return;
        e.preventDefault();
        newColor.value = btn.dataset.color;
        newPicker.querySelectorAll(".swatch").forEach((x) => x.classList.remove("on"));
        btn.classList.add("on");
      });

      root.addEventListener("click", (e) => {
        const add = e.target.closest('[data-action="add-tag"]');
        if (add) {
          e.preventDefault();
          const input = root.querySelector('[name="newName"]');
          const name = input.value.trim();
          if (!name) { toast("請填標籤名稱"); return; }
          draft.push({ id: uid(), name, color: newColor.value });
          input.value = "";
          redraw();
          return;
        }

        const del = e.target.closest("[data-del-tag]");
        if (del) {
          e.preventDefault();
          const id = del.dataset.delTag;
          const used = (tagCounts()[id] || 0);
          if (used > 0 && !confirm(`這個標籤目前貼在 ${used} 位學生身上，刪掉之後他們身上的這個標籤也會一起拿掉。學生資料本身不受影響。`)) return;
          // 立刻從學生身上拔掉，不然按「完成」之前名單上還看得到
          removeTagEverywhere(id);
          const i = draft.findIndex((t) => t.id === id);
          if (i >= 0) draft.splice(i, 1);
          save();
          redraw();
          return;
        }

        const swatch = e.target.closest("[data-tag-color]");
        if (swatch) {
          e.preventDefault();
          const tag = draft.find((t) => t.id === swatch.dataset.tagColor);
          if (tag) { tag.color = swatch.dataset.color; redraw(); }
        }
      });

      list.addEventListener("input", (e) => {
        const field = e.target.closest("[data-tag-name]");
        if (!field) return;
        const tag = draft.find((t) => t.id === field.dataset.tagName);
        if (tag) tag.name = field.value;
      });
    },
  });
}

function tagEditorRow(tag, count) {
  return `
    <div class="tag-editor">
      <div class="tag-editor-head">
        <span class="tag-dot" style="--tag:${esc(tag.color)}"></span>
        <input type="text" value="${esc(tag.name)}" data-tag-name="${tag.id}" aria-label="標籤名稱">
        <span class="muted" style="font-size:12px;white-space:nowrap">${count} 位</span>
        <button type="button" class="btn btn-sm btn-danger" data-del-tag="${tag.id}">刪除</button>
      </div>
      <div class="swatches">
        ${TAG_COLORS.map((c) => `
          <button type="button" class="swatch swatch-sm ${tag.color === c ? "on" : ""}"
                  data-tag-color="${tag.id}" data-color="${c}" style="background:${c}"
                  aria-label="${c}"></button>`).join("")}
      </div>
    </div>`;
}

function renewSheet(student) {
  const packages = S.settings.packages;
  openSheet({
    title: `續約 · ${student.name}`,
    body: `
      <div class="note-box" style="margin-bottom:14px">
        目前剩 <strong class="mono">${student.remaining}</strong> 堂，累計購買 <strong class="mono">${student.totalPurchased}</strong> 堂。
      </div>
      ${packages.length ? fieldSelect("pkg", "選擇方案",
        [["", "自己填"], ...packages.map((p) => [p.id, `${p.name}・${p.sessions} 堂・${money(p.price)}`])], "") : ""}
      <div class="seg" style="max-width:260px;margin-bottom:8px">
        ${[["total", "輸入總額"], ["unit", "輸入單價"]].map(([v, t], i) =>
          `<button type="button" data-price-mode="${v}" aria-pressed="${i === 0}">${t}</button>`).join("")}
      </div>
      <input type="hidden" name="priceMode" value="total">
      <div class="field-row">
        ${fieldText("sessions", "加購堂數", 10, { type: "number", required: true })}
        ${fieldText("amount", "總額", "", { type: "number" })}
      </div>
      <p class="hint" data-price-hint>存進去的一律是總額——銷售統計與業績抽成都是拿總額去算的。</p>
      <div class="field-row">
        ${fieldText("date", "日期", today(), { type: "date" })}
        ${fieldSelect("method", "付款方式", [["cash", "現金"], ["transfer", "轉帳"], ["other", "其他"]], "cash")}
      </div>
      ${fieldText("expiry", "新的到期日", student.expiry, { type: "date", hint: "留白就不改" })}
      ${fieldText("notes", "備註", "")}
      <div class="divider"></div>
      <div class="switch">
        <label for="f-backfill">補登以前的續約</label>
        <input id="f-backfill" name="backfill" type="checkbox">
      </div>
      <p class="hint">補以前的紀錄用。堂數一樣算進「已購」與銷售統計，但<strong>不會加到剩餘堂數</strong>——那些課早就上完了，加上去會灌水。</p>
      <div class="switch">
        <label for="f-recordPayment">同時新增收費紀錄</label>
        <input id="f-recordPayment" name="recordPayment" type="checkbox" checked>
      </div>
      <p class="hint">這筆錢如果在「收費」那邊已經記過了，取消勾選，否則累計收費與月營收會重複計算。</p>`,
    confirmLabel: "確認續約",
    onConfirm: (form) => {
      const sessions = +form.elements.sessions.value || 0;
      if (sessions <= 0) { toast("加購堂數要大於 0"); return false; }
      // 存進去的一律是總額。銷售統計的均價是「總額 ÷ 堂數」除出來的，
      // 業績抽成也是直接乘總額 —— 存單價的話兩邊都會少一個數量級。
      const typed = +form.elements.amount.value || 0;
      const amount = form.elements.priceMode.value === "unit" ? typed * sessions : typed;
      const date = form.elements.date.value || today();
      // 補登舊紀錄時只補「歷史」，不動「現況」。
      // 已購與續約紀錄是歷史（銷售統計要用），剩餘堂數是現況——
      // 三個月前買的 10 堂早就上完了，加回剩餘會憑空多出十堂課。
      const backfill = form.elements.backfill.checked;
      student.totalPurchased += sessions;
      if (!backfill) student.remaining += sessions;
      student.renewalCount += 1;
      if (form.elements.expiry.value) student.expiry = form.elements.expiry.value;
      const renewalId = uid();
      student.renewals.push({ id: renewalId, date, sessions, amount, notes: form.elements.notes.value, createdAt: new Date().toISOString() });
      // 舊的錢常常已經記過了，再記一次會讓營收憑空翻倍，所以能關掉。
      // 但**金額 0 也要記**：不記的話續約紀錄與收費紀錄的筆數就對不起來，
      // 對帳時會以為漏了一筆。0 元本身也是資訊（贈送、補課、待收）。
      if (form.elements.recordPayment.checked) {
        student.payments.push({
          // 存關聯而不是把堂數抄成字串：抄過去的數字改續約時不會跟著動。
          id: uid(), renewalId, amount, date, method: form.elements.method.value,
          // 刻意不把堂數寫進備註。這行是建立當下凍住的字串，之後改續約紀錄
          // 的堂數它不會跟著動，而兩邊沒有關聯欄位可以追 —— 重複記一份遲早
          // 不同步。堂數的真相在續約紀錄裡。
          notes: form.elements.notes.value || "續約", createdAt: new Date().toISOString(),
        });
      }
      student.updatedAt = new Date().toISOString();
      save(); render();
      toast(backfill ? `已補登 ${student.name} ${sessions} 堂` : `${student.name} 續約 ${sessions} 堂`);
    },
    onMount: (root) => {
      const modeInput = root.querySelector('[name="priceMode"]');
      const amountInput = root.querySelector('[name="amount"]');
      const sessionsInput = root.querySelector('[name="sessions"]');
      const amountLabel = root.querySelector('label[for="f-amount"]');
      const hint = root.querySelector("[data-price-hint]");

      // 不管你用哪一種輸入，兩個數字都同時顯示出來 ——
      // 「我剛剛填的是一堂還是全部」這個問題不該在按下確認之後才想起來。
      const refresh = () => {
        const n = Math.max(0, +sessionsInput.value || 0);
        const v = Math.max(0, +amountInput.value || 0);
        const unit = modeInput.value === "unit";
        if (amountLabel) amountLabel.textContent = unit ? "每堂單價" : "總額";
        if (!hint) return;
        if (!n || !v) {
          hint.textContent = "存進去的一律是總額——銷售統計與業績抽成都是拿總額去算的。";
          return;
        }
        hint.textContent = unit
          ? `${n} 堂 × ${money(v)} ＝ 總額 ${money(v * n)}`
          : `${money(v)} ÷ ${n} 堂 ＝ 每堂 ${money(Math.round(v / n))}`;
      };

      root.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-price-mode]");
        if (!btn) return;
        e.preventDefault();
        modeInput.value = btn.dataset.priceMode;
        root.querySelectorAll("[data-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.priceMode === modeInput.value)));
        refresh();
      });
      amountInput.addEventListener("input", refresh);
      sessionsInput.addEventListener("input", refresh);

      const pkg = root.querySelector('[name="pkg"]');
      if (!pkg) return;
      pkg.addEventListener("change", () => {
        const p = packages.find((x) => x.id === pkg.value);
        if (!p) return;
        sessionsInput.value = p.sessions;
        amountInput.value = p.price;
        // 方案存的是整包的價錢，所以選了方案就把模式切回總額，
        // 不然停在單價模式會把整包價格再乘一次堂數。
        modeInput.value = "total";
        root.querySelectorAll("[data-price-mode]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.priceMode === "total")));
        refresh();
      });
    },
  });
}

/* ── 課表 ───────────────────────────────────── */

/**
 * 「有 N 場檢測還沒回報結果」。
 * 不主動問的話成交率永遠算不出來，那個數字就會一直是騙人的。
 */
function pendingOutcomeBanner() {
  const pending = awaitingOutcome();
  if (!pending.length) return "";
  const first = pending[0];
  const name = leadById(first.leadId)?.name || "某位客人";
  const color = LESSON_KIND.assessment.color;
  return `
    <button class="card" type="button" data-action="report-outcome" data-id="${first.id}"
            style="display:flex;align-items:center;gap:10px;text-align:left;width:100%;
                   border:1px solid ${color}44;background:${color}14;cursor:pointer">
      <span style="font-size:20px">❓</span>
      <span style="flex:1">
        <span style="display:block;font-weight:650">
          ${pending.length === 1 ? `${esc(name)} 的檢測成交了嗎？` : `有 ${pending.length} 場檢測還沒回報結果`}
        </span>
        <span class="muted" style="font-size:12px">
          ${pending.length === 1 ? esc(first.date + " " + first.start) : `最舊的是 ${esc(name)}．${esc(first.date)}`}
        </span>
      </span>
      <span class="muted">›</span>
    </button>`;
}

function viewCalendar() {
  const anchor = parseDay(weekAnchor) || new Date();

  const days = [...Array(7)].map((_, i) => addDays(start, i));
  const dayLessons = S.lessons.filter((l) => l.date === selectedDate)
    .sort((a, b) => minutesOf(a.start) - minutesOf(b.start));
  const sel = parseDay(selectedDate);

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">課表</h1>
        <p class="page-sub">${esc(dayStr(days[0]))} ～ ${esc(dayStr(days[6]))}</p>
      </div>
      <div class="head-actions">
        <button class="btn" type="button" data-action="cal-refresh">${icon("refresh", 15)}刷新</button>
        <button class="btn btn-primary" type="button" data-action="new-lesson">${icon("plus", 15)}排課</button>
      </div>
    </div>

    <div class="stack">
      ${pendingOutcomeBanner()}
      <section class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px">
          <button class="btn btn-sm btn-ghost" type="button" data-action="week" data-value="-1">← 上一週</button>
          <button class="btn btn-sm" type="button" data-action="week" data-value="0">今天</button>
          <button class="btn btn-sm btn-ghost" type="button" data-action="week" data-value="1">下一週 →</button>
        </div>
        <div class="week">
          ${days.map((d) => {
            const ds = dayStr(d);
            const count = S.lessons.filter((l) => l.date === ds && l.status !== "cancelled").length;
            return `<button class="day ${ds === today() ? "today" : ""}" type="button"
                      data-action="pick-day" data-value="${ds}" aria-pressed="${ds === selectedDate}">
              <span class="day-name">${weekdayName(d)}</span>
              <span class="day-num">${d.getDate()}</span>
              <span class="day-dot ${count ? "" : "hidden"}"></span>
            </button>`;
          }).join("")}
        </div>
      </section>

      <section class="card">
        <div class="sec-head">
          <h2 class="sec-title">${esc(selectedDate)}　週${sel ? weekdayName(sel) : ""}</h2>
          <span class="sec-sub">${dayLessons.length ? `${dayLessons.length} 堂` : "空堂"}</span>
        </div>
        ${dayLessons.length ? dayLessons.map((l) => {
          const st = studentById(l.studentId);
          const partner = studentById(l.partnerId);
          const meta = LESSON_STATUS[l.status] || LESSON_STATUS.scheduled;
          const assess = isAssessment(l);
          const oc = OUTCOME[outcomeOf(l)];
          const names = assess

          return `
          <div class="row">
            <span class="dot" style="background:${esc(lessonColor(l))}"></span>
            <div class="row-main">
              <div class="row-title">${esc(names)}
                ${assess ? `<span class="pill" style="background:${LESSON_KIND.assessment.color}22;color:${LESSON_KIND.assessment.color}">檢測</span>` : ""}
                <span class="pill ${meta.pill}">${meta.label}</span>
                ${assess && outcomeOf(l) !== "pending" ? `<span class="pill ${oc.pill}">${oc.label}</span>` : ""}
                ${(l.owed || l.partnerOwed) ? '<span class="pill pill-crit">欠一堂</span>' : ""}</div>
              <div class="row-sub mono">${esc(l.start)}–${esc(l.end)}　${durationLabel(durationOf(l))}${l.location ? "　" + esc(l.location) : ""}</div>
              ${assess && needsOutcome(l) ? `<div class="row-sub" style="color:var(--warn)">還沒回報成交與否</div>` : ""}

                ${Object.entries(LESSON_STATUS).map(([k, v]) =>
                  `<option value="${k}" ${l.status === k ? "selected" : ""}>${v.label}</option>`).join("")}
              </select>
              ${assess ? `<button class="btn btn-sm" type="button" data-action="report-outcome" data-id="${l.id}">${outcomeOf(l) === "pending" ? "回報" : "改結果"}</button>` : ""}

            </div>

function lessonSheet(existing) {
  const l = existing || {
    id: uid(), date: selectedDate, start: "09:00",
    end: timeOf(minutesOf("09:00") + S.settings.defaultDuration),
    status: "scheduled", notes: "", location: "",
    studentId: activeStudents()[0]?.id || "", partnerId: "",
    kind: "lesson", outcome: "pending", color: "", leadId: "",
    consumed: false, partnerConsumed: false, owed: false, partnerOwed: false,
    createdAt: new Date().toISOString(),
  };
  const dur = durationOf(l) || S.settings.defaultDuration;
  const assessing = isAssessment(l);

  // 正課一定要有學生；檢測的對象還不是學生，沒有學生也能排
  if (!assessing && !activeStudents().length && !existing) {
    toast("請先新增至少一位學生，或改排檢測");
  }

  // 還沒成交、可以約檢測的名單（已轉正式的人不用再檢測一次）
  const openLeads = S.leads.filter((x) =>
    x.status !== "converted" && x.status !== "lost");

  openSheet({
    title: existing ? (assessing ? "檢測詳情" : "課程詳情") : "新增課程",
    body: `
      ${existing ? "" : `
        ${fieldSelect("kind", "種類", [["lesson", "正課"], ["assessment", "檢測（對還沒買課的人）"]], l.kind)}
        <p class="hint" data-kind-hint style="margin:-6px 0 10px">
          檢測是對還沒買課的人做的試教。佔課表時段，但不扣堂數、不算課程收入與抽成。上完之後會問你成交了沒。
        </p>`}

      <div data-kind-block="lesson" ${assessing ? 'hidden' : ''}>
        ${fieldSelect("studentId", "學生", studentOptions(false), l.studentId)}
        ${fieldSelect("partnerId", "共同課第二位", studentOptions(true, "（沒有，一對一）"), l.partnerId)}
      </div>

      <div data-kind-block="assessment" ${assessing ? '' : 'hidden'}>
        ${openLeads.length
          ? fieldSelect("leadId", "從潛在客群挑",
              [["", "（不從名單挑，直接打名字）"]].concat(
                openLeads.map((x) => [x.id, `${x.name}．${LEAD_SOURCE[x.source] || "其他"}`])),
              l.leadId)
          : `<p class="hint">名單裡還沒有人，直接在下面打名字就好。</p>`}
        <div data-lead-new ${l.leadId ? 'hidden' : ''}>
          ${fieldText("leadName", "姓名", leadById(l.leadId)?.name || "", { placeholder: "王小明" })}
          <div class="field-row">
            ${fieldText("leadPhone", "電話（選填）", "", { type: "tel" })}
            ${fieldSelect("leadSource", "怎麼認識的", Object.entries(LEAD_SOURCE), "referral")}
          </div>
          <p class="hint">存檔時會自動把這個人加進潛在客群，之後追蹤與成交率都會算到他頭上。</p>
        </div>
      </div>

      <div class="field-row">
        ${fieldText("date", "日期", l.date, { type: "date" })}
        ${fieldText("start", "開始時間", l.start, { type: "time" })}
      </div>
      ${durationPicker(dur)}
      ${existing ? fieldSelect("status", "狀態", Object.entries(LESSON_STATUS).map(([k, v]) => [k, v.label]), l.status) : ""}
      ${existing && assessing
        ? fieldSelect("outcome", "成交結果",
            Object.entries(OUTCOME).map(([k, v]) => [k, v.label]), outcomeOf(l))
        : ""}
      ${fieldText("location", "上課地點", l.location, { placeholder: "選填" })}
      ${fieldText("notes", "備註", l.notes)}

      ${existing ? `
        <div class="divider"></div>
        <label class="field-label">這堂課的顏色</label>
        <div class="swatches" data-color-picker>
          <button type="button" class="swatch swatch-auto ${l.color ? "" : "on"}" data-color=""
                  title="跟著狀態／種類">自動</button>
          ${LESSON_COLORS.map((c) => `
            <button type="button" class="swatch ${l.color === c ? "on" : ""}"
                    data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}
        </div>
        <input type="hidden" name="color" value="${esc(l.color || "")}">
        <p class="hint">留在「自動」就跟著課程狀態（或檢測）的顏色走。</p>` : ""}

      ${existing ? "" : `
        <div class="divider" data-kind-block="lesson" ${assessing ? 'hidden' : ''}></div>
        <div class="field-row" data-kind-block="lesson" ${assessing ? 'hidden' : ''}>
          ${fieldSelect("repeat", "重複排課", [["1", "只排這一天"], ["4", "每週同一天，共 4 週"], ["8", "每週同一天，共 8 週"], ["12", "每週同一天，共 12 週"]], "1")}
        </div>`}`,
    extraFoot: existing ? `<button class="btn btn-danger btn-sm" type="button" data-action="delete-lesson" data-id="${l.id}">刪除</button>` : "",
    onConfirm: (form) => {
      const date = form.elements.date.value || today();
      const start = form.elements.start.value || "09:00";
      const minutes = readDuration(form);
      const end = timeOf(minutesOf(start) + minutes);
      const kind = existing ? kindOf(l) : (form.elements.kind?.value || "lesson");
      const location = form.elements.location.value.trim();
      const notes = form.elements.notes.value;
      const color = form.elements.color ? form.elements.color.value : (l.color || "");

      // ── 檢測 ──────────────────────────────────────────
      if (kind === "assessment") {
        let leadId = form.elements.leadId ? form.elements.leadId.value : "";
        if (!leadId) {
          const name = (form.elements.leadName?.value || "").trim();
          if (!name) { toast("請選一位名單上的人，或直接打上對方的名字"); return false; }
          const phone = (form.elements.leadPhone?.value || "").trim();
          // 同名同電話的人已經在名單裡就沿用，不要每排一次檢測就多一筆
          const dup = S.leads.find((x) => x.name === name && (x.phone || "") === phone);
          if (dup) {
            leadId = dup.id;
          } else {
            const lead = {
              id: uid(), name, phone, email: "",
              source: form.elements.leadSource?.value || "referral",
              status: "contacted", notes: "",
              createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
            };
            S.leads.push(lead);
            leadId = lead.id;
          }
        }

        const clash = S.lessons.find((x) =>
          x.id !== l.id && x.date === date && x.status !== "cancelled" &&
          minutesOf(x.start) < minutesOf(end) && minutesOf(start) < minutesOf(x.end));
        if (clash) { toast(`${date} ${clash.start}-${clash.end} 已經有課，時段重疊`); return false; }

        if (existing) {
          Object.assign(l, { date, start, end, location, notes, leadId, color });
          const newStatus = form.elements.status.value;
          if (newStatus !== l.status) setLessonStatus(l, newStatus);
          const newOutcome = form.elements.outcome?.value;
          if (newOutcome && newOutcome !== outcomeOf(l)) applyOutcome(l, newOutcome);
        } else {
          S.lessons.push({ ...l, id: uid(), kind: "assessment", outcome: "pending",
                           date, start, end, location, notes, leadId, color,
                           studentId: "", partnerId: "" });
        }
        save(); render();
        toast(existing ? "已更新檢測" : `已排檢測．${leadById(leadId)?.name || ""}`);
        return;
      }

      // ── 正課 ──────────────────────────────────────────
      const studentId = form.elements.studentId.value;
      const partnerId = form.elements.partnerId.value;
      if (!studentId) { toast("請選一位學生"); return false; }
      if (partnerId && partnerId === studentId) { toast("共同課的兩位不能是同一人"); return false; }

      const repeat = existing ? 1 : +form.elements.repeat.value || 1;
      const made = [];
      for (let i = 0; i < repeat; i++) {
        const d = dayStr(addDays(parseDay(date), i * 7));
        const clash = S.lessons.find((x) =>
          x.id !== l.id && x.date === d && x.status !== "cancelled" &&
          minutesOf(x.start) < minutesOf(end) && minutesOf(start) < minutesOf(x.end) &&
          [x.studentId, x.partnerId].some((id) => id && [studentId, partnerId].includes(id)));
        if (clash) {
          toast(`${d} ${clash.start}-${clash.end} 已經有課，時段重疊`);
          return false;
        }
        made.push(d);
      }

      if (existing) {
        Object.assign(l, { date, start, end, location, notes, studentId, partnerId, color });
        const newStatus = form.elements.status.value;
        if (newStatus !== l.status) setLessonStatus(l, newStatus);
      } else {
        for (const d of made) {
          S.lessons.push({ ...l, id: uid(), kind: "lesson", date: d, start, end,
                           location, notes, studentId, partnerId, color });
        }
      }
      save(); render();
      toast(existing ? "已更新課程" : `已排 ${made.length} 堂課`);
    },
    onMount: (root) => {
      wireDurationPicker(root);

      // 切換正課／檢測時換掉對應的欄位
      const kindSelect = root.querySelector('[name="kind"]');
      const syncKind = () => {
        const k = kindSelect.value;
        root.querySelectorAll("[data-kind-block]").forEach((el) => {
          el.hidden = el.dataset.kindBlock !== k;
        });
        const hint = root.querySelector("[data-kind-hint]");
        if (hint) hint.hidden = k !== "assessment";
      };
      if (kindSelect) { kindSelect.addEventListener("change", syncKind); syncKind(); }

      // 從名單挑了人就不用再打名字
      const leadSelect = root.querySelector('[name="leadId"]');
      const leadNew = root.querySelector("[data-lead-new]");
      if (leadSelect && leadNew) {
        leadSelect.addEventListener("change", () => { leadNew.hidden = !!leadSelect.value; });
      }

      // 顏色
      const picker = root.querySelector("[data-color-picker]");
      const colorInput = root.querySelector('[name="color"]');
      if (picker && colorInput) {
        picker.addEventListener("click", (e) => {
          const btn = e.target.closest(".swatch");
          if (!btn) return;
          e.preventDefault();
          colorInput.value = btn.dataset.color;
          picker.querySelectorAll(".swatch").forEach((s) => s.classList.remove("on"));
          btn.classList.add("on");
        });
      }

      root.addEventListener("click", (e) => {
        if (!e.target.closest('[data-action="delete-lesson"]')) return;
        closeSheet();
        confirmSheet("刪除課程", "已扣掉的堂數會還給學生。", () => {
          releaseLesson(l);
          S.lessons = S.lessons.filter((x) => x.id !== l.id);
          save(); render(); toast("已刪除課程");
        }, "刪除");
      });
    },
  });
}

/**
 * 套用檢測結果。成交就把名單轉成正式學生，沒成交留在待追蹤名單。
 * iOS 版是同一套邏輯，兩邊要一致。
 */
function applyOutcome(lesson, outcome) {
  lesson.outcome = outcome;
  // 時段已經過了就當作有做，這樣它才會從待回報清單消失
  if (lesson.status === "scheduled" && lesson.date <= today()) lesson.status = "attended";

  const lead = leadById(lesson.leadId);
  if (!lead) return null;
  lead.updatedAt = new Date().toISOString();

  if (outcome === "closed") {
    lead.status = "converted";
    // 同名同電話已經有學生就沿用，不要又開一筆重複的
    const existing = S.students.find((s) =>
      s.name === lead.name && (s.phone || "") === (lead.phone || ""));
    if (existing) {
      if (existing.status === "archived") existing.status = "active";
      return existing;
    }
    const acquisition = lead.source === "company" ? "companyLead"
      : lead.source === "referral" ? "referral" : "selfDeveloped";
    const s = newStudent({ name: lead.name, phone: lead.phone, acquisition, notes: lead.notes });
    S.students.push(s);
    return s;
  }

  if (outcome === "notClosed" || outcome === "followUp") {
    // 檢測過但還沒買，跟「還沒聯繫過」是不同的階段
    lead.status = "assessed";
  }
  return null;
}

/** 檢測結果回報：問「成交了嗎」，成交就順手開續約 */
function outcomeSheet(lesson) {
  const lead = leadById(lesson.leadId);
  const name = lead?.name || "這位客人";
  openSheet({
    title: "檢測結果",
    confirmLabel: "儲存",
    body: `
      <p style="font-weight:650;font-size:16px;margin-bottom:2px">${esc(name)}</p>
      <p class="hint" style="margin-bottom:12px">
        ${esc(lesson.date)}　${esc(lesson.start)}–${esc(lesson.end)}
        ${lead ? "．來源：" + esc(LEAD_SOURCE[lead.source] || "其他") : ""}
      </p>
      ${fieldSelect("outcome", "成交了嗎", [
        ["closed", "成交了 —— 轉成正式學生"],
        ["followUp", "還要再約 —— 留在名單裡"],
        ["notClosed", "沒成交 —— 留在待追蹤名單"],
      ], "closed")}
      ${fieldText("note", "備註（選填）", "", { placeholder: "聊到哪、他在猶豫什麼" })}
      <p class="hint">「再約」不會算進成交率的分母，還在進行中。</p>`,
    onConfirm: (form) => {
      const outcome = form.elements.outcome.value;
      const note = form.elements.note.value.trim();
      if (note && lead) lead.notes = lead.notes ? `${lead.notes}\n${note}` : note;

      const student = applyOutcome(lesson, outcome);
      save(); render();

      if (outcome === "closed") {
        toast(`${name} 已轉成學生`);
        // 成交了就順手把買了幾堂、多少錢記進去
        if (student) setTimeout(() => renewSheet(student), 350);
      } else if (outcome === "notClosed") {
        toast(`已記錄，${name} 留在待追蹤名單`);
      } else {
        toast(`已記錄，記得再約 ${name}`);
      }
    },
  });
}

  return `

/** 用實際數字解釋底薪的給法，比抽象敘述好懂 */
function baseModeHint(rule) {
  const base = rule.baseSalary || 0;
  const threshold = rule.baseSalaryThreshold || 40;
  switch (rule.baseSalaryMode || "always") {
    case "belowThreshold":
      return `不滿 ${threshold} 堂時領 ${money(base)} 底薪加抽成；滿 ${threshold} 堂之後底薪歸零，只算抽成。`;
    case "higherOf":
      return `底薪 ${money(base)} 與抽成比大小，領高的那個，不相加。抽成算出 ${money(base / 2)} 就領 ${money(base)}；算出 ${money(base * 2)} 就領 ${money(base * 2)}。`;
    default:
      return `底薪 ${money(base)} 固定給，抽成另外加上去。`;
  }
}

function viewSettings() {
  const st = S.settings;
  const rule = st.salary;
  const basis = rule.payoutBasisRaw;
  const countsLessons = basis !== "onSale";

/* ════════════════════════════════════════════════
   6. 匯出／匯入
   檔案格式與 iOS 版的備份檔一致，兩邊可以互搬。
   ════════════════════════════════════════════════ */

function buildBackup() {
  const indexOf = new Map(S.students.map((s, i) => [s.id, i]));
  // 檢測掛的是名單而不是學生，另外編一組索引
  const leadIndexOf = new Map(S.leads.map((l, i) => [l.id, i]));
  const iso = (v) => (v ? new Date(v).toISOString() : new Date().toISOString());

  return {
    version: 1,
    appVersion: "web-1.0",
    exportedAt: new Date().toISOString(),
    students: S.students.map((s) => ({
      name: s.name, phone: s.phone, email: s.email || "", rate: s.rate,
      totalPurchasedSessions: s.totalPurchased, remainingSessions: s.remaining,
      notes: s.notes, color: s.color,
      packageExpiryDate: s.expiry ? new Date(s.expiry + "T00:00:00").toISOString() : null,
      customFieldsJSON: JSON.stringify(s.custom || {}),
      renewalCount: s.renewalCount || 0, mayNotRenew: !!s.mayNotRenew,
      acquisitionRaw: s.acquisition, statusRaw: s.status,
      pausedUntil: null, archivedAt: s.status === "archived" ? iso(s.updatedAt) : null,
      createdAt: iso(s.createdAt), updatedAt: iso(s.updatedAt),
      // 顏色標籤，逗號分隔（iOS 的 Student.tagsCSV）
      tagsCSV: (s.tags || []).join(","),
      payments: s.payments.map((p) => ({
        amount: p.amount, date: p.date, methodRaw: p.method, notes: p.notes || "",
        createdAt: iso(p.createdAt),
        // 這筆收費對應第幾筆續約。跟這個格式其他地方一樣用陣列索引不用 id，
        // 沒有對應就是 null。iOS 讀到不認得的欄位會直接忽略，不會壞。
        renewalIndex: (() => {
          const i = s.renewals.findIndex((r) => r.id === p.renewalId);
          return i >= 0 ? i : null;
        })(),
      })),
      renewals: s.renewals.map((r) => ({
        date: r.date, sessionsPurchased: r.sessions, amount: r.amount,
        notes: r.notes || "", createdAt: iso(r.createdAt),
      })),
      inbody: [],
      exercises: [],
    })),
    lessons: S.lessons.map((l) => ({
      title: "", date: l.date, startTime: l.start, endTime: l.end,
      statusRaw: l.status, notes: l.notes || "", locationName: l.location || "",
      consumedSession: !!l.consumed, consumedPartnerSession: !!l.partnerConsumed,
      owedSession: !!l.owed, owedPartnerSession: !!l.partnerOwed,
      createdAt: iso(l.createdAt), updatedAt: iso(l.createdAt),
      studentIndex: indexOf.has(l.studentId) ? indexOf.get(l.studentId) : null,
      partnerIndex: indexOf.has(l.partnerId) ? indexOf.get(l.partnerId) : null,
      // 正課／檢測、成交結果、單堂顏色、檢測對象（iOS 也是這幾個鍵）
      kindRaw: kindOf(l),
      outcomeRaw: outcomeOf(l),
      colorTag: l.color || "",
      leadIndex: leadIndexOf.has(l.leadId) ? leadIndexOf.get(l.leadId) : null,
    })),
    leads: S.leads.map((l) => ({
      name: l.name, phone: l.phone, email: l.email || "",
      sourceRaw: l.source === "walkIn" ? "walk-in" : l.source,
      statusRaw: l.status, notes: l.notes || "",
      createdAt: iso(l.createdAt), updatedAt: iso(l.updatedAt),
    })),
    locations: [],
    settings: {
      employmentType: S.settings.employment,
      defaultLessonDurationMinutes: String(S.settings.defaultDuration),
      customFieldDefinitions: JSON.stringify(S.settings.customFields),
      coachPackages: JSON.stringify(S.settings.packages.map((p) => ({
        id: p.id, name: p.name, sessions: p.sessions, price: p.price,
      }))),
      salaryRule: JSON.stringify(S.settings.salary),
      // iOS 的 TagStore 用 {id,name,colorHex}，網頁用 {id,name,color}，這裡轉一次
      studentTags: JSON.stringify(allTags().map((t) => ({
        id: t.id, name: t.name, colorHex: t.color,
      }))),
      colorTheme: "amber",
    },
  };
}

function exportData() {
  saveFile(`coach-mate-backup-${today()}.json`, JSON.stringify(buildBackup(), null, 2));
}

/**
 * 手機下載檔案常常卡住，所以留一條不靠下載的備份路徑：
 * 把備份整段複製走，貼到記事本、LINE 給自己或 Email，要還原時再貼回來。

function copyBackupSheet() {
  const json = JSON.stringify(buildBackup());
  openSheet({
    title: "複製備份文字",
    closeLabel: "關閉",
    body: `
      <p class="row-sub" style="margin:0 0 12px">

      </p>
      <textarea id="backup-text" readonly style="min-height:150px;font-size:11px;font-family:var(--mono)">${esc(json)}</textarea>
      <p class="hint" style="margin-top:8px">共 ${json.length.toLocaleString("en-US")} 個字，包含 ${S.students.length} 位學生、${S.lessons.length} 堂課。</p>`,
    extraFoot: `<button class="btn btn-sm btn-primary" type="button" data-action="do-copy">全部複製</button>`,
    onMount: (root) => {
      root.addEventListener("click", async (e) => {
        if (!e.target.closest('[data-action="do-copy"]')) return;
        const box = $("#backup-text", root);
        try {
          await navigator.clipboard.writeText(json);
          toast("已複製，貼到記事本或傳給自己存起來");
        } catch (err) {
          // 舊版 Safari 沒有 clipboard API，退回選取整段讓使用者自己按複製
          box.focus();
          box.setSelectionRange(0, box.value.length);
          toast("已全選，請長按畫面選「複製」");
        }
      });
    },
  });
}

/** 把備份檔（iOS 或網頁版產生的）讀成網頁版的資料結構 */
function parseBackup(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.students)) {
    throw new Error("這不是教練小幫手的備份檔");
  }
  if (raw.version > 1) throw new Error(`這個備份是較新版本（v${raw.version}）建立的`);

  const dayOf = (isoStr) => {
    if (!isoStr) return "";
    const d = new Date(isoStr);
    return isNaN(d) ? "" : dayStr(d);
  };
  const parseJSON = (s, fallback) => {
    try { return JSON.parse(s); } catch { return fallback; }
  };

  const students = raw.students.map((d, i) => ({
    id: uid(), _i: i,
    name: d.name || "", phone: d.phone || "", email: d.email || "",
    rate: d.rate || 0,
    totalPurchased: d.totalPurchasedSessions || 0,
    remaining: d.remainingSessions || 0,
    notes: d.notes || "",
    color: d.color || STUDENT_COLORS[i % STUDENT_COLORS.length],
    expiry: dayOf(d.packageExpiryDate),
    custom: parseJSON(d.customFieldsJSON, {}) || {},
    renewalCount: d.renewalCount || 0,
    mayNotRenew: !!d.mayNotRenew,
    acquisition: ACQUISITION[d.acquisitionRaw] ? d.acquisitionRaw : "selfDeveloped",
    status: ["active", "paused", "archived"].includes(d.statusRaw) ? d.statusRaw : "active",
    ...(() => {
      // 續約要先有 id，收費才接得回去。舊備份沒有 renewalIndex，
      // 那就交給 linkLegacyPayments 用日期＋金額去配。
      const renewals = (d.renewals || []).map((r) => ({
        id: uid(), date: r.date || "", sessions: r.sessionsPurchased || 0,
        amount: r.amount || 0, notes: r.notes || "", createdAt: r.createdAt,
      }));
      const payments = (d.payments || []).map((p) => {
        const i = p.renewalIndex;
        const linked = Number.isInteger(i) && renewals[i] ? renewals[i].id : "";
        return {
          id: uid(), amount: p.amount || 0, date: p.date || "",
          method: p.methodRaw || "cash", notes: p.notes || "", createdAt: p.createdAt,
          ...(linked ? { renewalId: linked } : {}),
        };
      });
      return { renewals, payments: linkLegacyPayments(payments, renewals) };
    })(),
    // 顏色標籤：舊備份沒有這一欄
    tags: typeof d.tagsCSV === "string"
      ? d.tagsCSV.split(",").map((x) => x.trim()).filter(Boolean)
      : [],
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  // 名單要排在課程前面還原：檢測掛在名單上，順序反了就對不到人
  const leads = (raw.leads || []).map((d) => ({
    id: uid(), name: d.name || "", phone: d.phone || "", email: d.email || "",
    source: d.sourceRaw === "walk-in" ? "walkIn" : (LEAD_SOURCE[d.sourceRaw] ? d.sourceRaw : "other"),
    status: LEAD_STATUS[d.statusRaw] ? d.statusRaw : "pending",
    notes: d.notes || "",
    createdAt: d.createdAt || new Date().toISOString(),
    updatedAt: d.updatedAt || new Date().toISOString(),
  }));

  const lessons = (raw.lessons || []).map((d) => ({
    id: uid(),
    date: d.date || "", start: d.startTime || "09:00", end: d.endTime || "10:00",
    status: LESSON_STATUS[d.statusRaw] ? d.statusRaw : "scheduled",
    notes: d.notes || "", location: d.locationName || "",
    studentId: students[d.studentIndex]?.id || "",
    partnerId: students[d.partnerIndex]?.id || "",
    consumed: !!d.consumedSession, partnerConsumed: !!d.consumedPartnerSession,
    owed: !!d.owedSession, partnerOwed: !!d.owedPartnerSession,
    // 正課／檢測。舊備份沒有這幾欄，一律當正課。
    kind: d.kindRaw === "assessment" ? "assessment" : "lesson",
    outcome: OUTCOME[d.outcomeRaw] ? d.outcomeRaw : "pending",
    color: typeof d.colorTag === "string" ? d.colorTag : "",
    leadId: leads[d.leadIndex]?.id || "",
    createdAt: d.createdAt || new Date().toISOString(),
  }));

  const rawSettings = raw.settings || {};
  const settings = clone(DEFAULT_SETTINGS);
  if (rawSettings.employmentType) settings.employment = rawSettings.employmentType;
  if (rawSettings.defaultLessonDurationMinutes) {
    settings.defaultDuration = clampDuration(+rawSettings.defaultLessonDurationMinutes);
  }
  const fields = parseJSON(rawSettings.customFieldDefinitions, null);
  if (Array.isArray(fields)) settings.customFields = fields.filter((f) => typeof f === "string");
  const pkgs = parseJSON(rawSettings.coachPackages, null);
  if (Array.isArray(pkgs)) {
    settings.packages = pkgs.map((p) => ({
      id: p.id || uid(), name: p.name || "方案",
      sessions: p.sessions || 0, price: p.price || 0,
    }));
  }
  const salary = parseJSON(rawSettings.salaryRule, null);
  if (salary && typeof salary === "object") {
    settings.salary = {
      ...DEFAULT_SALARY, ...salary,
      tiers: Array.isArray(salary.tiers)
        ? salary.tiers.map((t) => ({ minSessions: t.minSessions || 0, percent: t.percent || 0 }))
        : DEFAULT_SALARY.tiers,
    };
  }
  // 顏色標籤。iOS 存的是 colorHex，網頁用 color。
  const tags = parseJSON(rawSettings.studentTags, null);
  if (Array.isArray(tags)) {
    settings.tags = tags
      .filter((t) => t && t.id && t.name)
      .map((t) => ({ id: t.id, name: t.name, color: t.colorHex || t.color || TAG_COLORS[0] }));
  }
  settings.theme = S.settings.theme;   // 外觀是這台裝置的偏好，不跟著備份走

  students.forEach((s) => delete s._i);
  return { students, lessons, leads, settings };
}

function importFile(file) {
  const reader = new FileReader();
  reader.onerror = () => toast("讀不到這個檔案");
  reader.onload = () => {
    let parsed;
    try {
      parsed = parseBackup(JSON.parse(reader.result));
    } catch (e) {
      openSheet({
        title: "匯入失敗",
        body: `<p style="margin:0;color:var(--ink-2)">${esc(e.message || "檔案格式不對")}<br>
               請選擇從教練小幫手匯出的 JSON 備份檔。</p>`,
      });
      return;
    }
    askImportMode(parsed);
  };
  reader.readAsText(file);
}

/** 讀進來之後、真的寫進去之前，問一下要合併還是取代 */
function askImportMode(parsed) {
  const summary = `${parsed.students.length} 位學生・${parsed.lessons.length} 堂課・${parsed.leads.length} 筆名單`;
  openSheet({
    title: "要怎麼匯入？",
    body: `
      <div class="note-box" style="margin-bottom:14px">備份內容：${summary}</div>
      <p style="margin:0 0 6px;color:var(--ink-2)"><strong>合併</strong>：保留現在的資料，把備份加進來。同名同電話的學生視為同一人，不會重複建立。</p>
      <p style="margin:0;color:var(--ink-2)"><strong>取代</strong>：先清空現在的資料，整份換成備份的內容。</p>`,
    extraFoot: `<button class="btn btn-sm" type="button" data-action="do-merge">合併</button>`,
    confirmLabel: "取代全部",
    onConfirm: () => applyImport(parsed, "replace"),
    onMount: (root) => {
      root.addEventListener("click", (e) => {
        if (!e.target.closest('[data-action="do-merge"]')) return;
        applyImport(parsed, "merge");
        closeSheet();
      });
    },
  });
}

function applyImport(parsed, mode) {
  if (mode === "replace") {
    S = { students: parsed.students, lessons: parsed.lessons, leads: parsed.leads, settings: parsed.settings };
  } else {
    const keyOf = (s) => `${(s.name || "").trim()}|${(s.phone || "").trim()}`;
    const existing = new Map(S.students.map((s) => [keyOf(s), s]));
    const remap = new Map();
    for (const s of parsed.students) {
      const hit = existing.get(keyOf(s));
      if (hit && (s.name || s.phone)) {
        remap.set(s.id, hit.id);
      } else {
        S.students.push(s);
        existing.set(keyOf(s), s);
        remap.set(s.id, s.id);
      }
    }
    for (const l of parsed.lessons) {
      l.studentId = remap.get(l.studentId) || "";
      l.partnerId = remap.get(l.partnerId) || "";
      S.lessons.push(l);
    }
    S.leads.push(...parsed.leads);
    // 合併時只補上目前沒有的自訂欄位，其他設定維持這台裝置的
    for (const f of parsed.settings.customFields) {
      if (!S.settings.customFields.includes(f)) S.settings.customFields.push(f);
    }
  }
  save(); render();
  toast(mode === "replace" ? "已用備份取代原本的資料" : "已合併備份資料");
}

function seedDemo() {
  const names = DEMO_NAMES;
  const jobs = ["工程師", "護理師", "老師", "業務", "設計師", "工程師", "自由業", "護理師"];
  const genders = ["女", "男", "女", "男", "男", "女", "男", "女"];
  const births = ["1994-03-12", "1988-11-02", "1999-06-25", "1985-01-30", "1996-09-08", "1992-12-19", "1979-04-14", "2001-07-07"];

  const students = names.map((name, i) => {
    const total = [10, 20, 10, 30, 20, 10, 20, 10][i];
    const used = [7, 4, 9, 12, 18, 1, 6, 10][i];
    const rate = [1100, 1000, 1200, 950, 1000, 1300, 1000, 1150][i];
    const s = newStudent({
      name, phone: "09" + String(10000000 + i * 1111111).slice(0, 8),
      rate, totalPurchased: total, remaining: Math.max(0, total - used),
      color: STUDENT_COLORS[i % STUDENT_COLORS.length],
      acquisition: ["selfDeveloped", "referral", "companyLead"][i % 3],
      custom: { "性別": genders[i], "職業": jobs[i], "生日": births[i] },
      renewalCount: i % 3,
    });
    s.payments = [{ id: uid(), amount: rate * total, date: dayStr(addDays(new Date(), -20 - i * 9)),
                    method: i % 2 ? "transfer" : "cash", notes: `${total} 堂方案`, createdAt: new Date().toISOString() }];
    s.renewals = [{ id: uid(), date: dayStr(addDays(new Date(), -20 - i * 9)), sessions: total,
                    amount: rate * total, notes: "", createdAt: new Date().toISOString() }];
    return s;
  });

  const lessons = [];
  const slots = [["09:00", 90], ["11:00", 60], ["14:00", 90], ["19:00", 60], ["20:30", 90]];
  for (let d = -21; d <= 14; d++) {
    const date = dayStr(addDays(new Date(), d));
    const wd = (parseDay(date).getDay() + 6) % 7;
    if (wd >= 5) continue;
    const n = 2 + (Math.abs(d) % 2);
    for (let k = 0; k < n; k++) {
      const [start, mins] = slots[(Math.abs(d) + k) % slots.length];
      const st = students[(Math.abs(d) * 3 + k) % students.length];
      lessons.push({
        id: uid(), date, start, end: timeOf(minutesOf(start) + mins),
        status: d < 0 ? (Math.abs(d) % 11 === 0 ? "absent" : "attended") : "scheduled",
        notes: "", location: "", studentId: st.id, partnerId: "",
        consumed: d < 0 && Math.abs(d) % 11 !== 0, partnerConsumed: false, owed: false, partnerOwed: false,
        createdAt: new Date().toISOString(),
      });
    }
  }

  const leadNames = [["周子瑜", "referral", "converted"], ["何柏叡", "online", "contacted"],
                     ["蔡沐恩", "company", "pending"], ["鄭雅文", "walkIn", "converted"],
                     ["謝定澄", "online", "pending"], ["曾苡宸", "referral", "contacted"],
                     ["高子萱", "company", "converted"]];
  const leads = leadNames.map(([name, source, status], i) => ({
    id: uid(), name, phone: "", email: "", source, status,
    notes: status === "pending" ? "等對方回訊息" : "",
    createdAt: addDays(new Date(), -40 + i * 5).toISOString(),
    updatedAt: addDays(new Date(), -6 + i).toISOString(),
  }));

  S = {
    students, lessons, leads,
    settings: { ...clone(DEFAULT_SETTINGS), theme: S.settings.theme, employment: "company" },
  };
  save(); render();
  toast(`已載入示範資料：${students.length} 位學生・${lessons.length} 堂課`);
}

/* ════════════════════════════════════════════════
   7. 事件
