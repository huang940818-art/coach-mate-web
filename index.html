<meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)">
<!-- 加到主畫面之後像 App 一樣全螢幕開啟 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教練小幫手">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">

<body>

<style>
/* ───────────────────────────────────────────────
   教練小幫手 · 網頁版
   色彩沿用 iOS App 的琥珀金，中性色帶暖調偏向主色。
   數字一律等寬，讓欄位對得起來。
   ─────────────────────────────────────────────── */

:root {
  /* 讓原生控制項（下拉、日期選擇器、捲軸）跟著主題走，深色底下才不會整片變白 */
  color-scheme: light;

  --paper:      #FBF9F6;
  --surface:    #FFFFFF;
  --surface-2:  #F4F0E9;
  --ink:        #221D16;
  --ink-2:      #5C5348;
  --muted:      #8A8074;
  --line:       #E7E1D8;
  --line-2:     #D6CEC2;
  --gold:       #A8721B;
  --gold-soft:  rgba(168, 114, 27, 0.10);
  --gold-line:  rgba(168, 114, 27, 0.35);
  --good:       #15803D;
  --good-soft:  rgba(21, 128, 61, 0.10);
  --warn:       #B45309;
  --warn-soft:  rgba(180, 83, 9, 0.10);
  --crit:       #BE123C;
  --crit-soft:  rgba(190, 18, 60, 0.10);
  --info:       #2563EB;
  --info-soft:  rgba(37, 99, 235, 0.10);
  --shadow:     0 1px 2px rgba(34, 29, 22, .05), 0 8px 24px -16px rgba(34, 29, 22, .25);

  --r-card: 14px;
  --r-in:   10px;
  --r-pill: 999px;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
          "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper:     #14110D;
    --surface:   #1D1913;
    --surface-2: #262019;
    --ink:       #F2ECE3;
    --ink-2:     #C6BCAE;
    --muted:     #9A9083;
    --line:      #2E2820;
    --line-2:    #3D3529;
    --gold:      #E4A94A;
    --gold-soft: rgba(228, 169, 74, 0.12);
    --gold-line: rgba(228, 169, 74, 0.38);
    --good:      #5CD98A;
    --good-soft: rgba(92, 217, 138, 0.12);
    --warn:      #FB923C;
    --warn-soft: rgba(251, 146, 60, 0.12);
    --crit:      #FB7185;
    --crit-soft: rgba(251, 113, 133, 0.12);
    --info:      #6BA6FF;
    --info-soft: rgba(107, 166, 255, 0.12);
    --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .7);
  }
}

/* 使用者手動切換主題時要蓋過系統偏好，兩個方向都要 */
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:     #14110D;
  --surface:   #1D1913;
  --surface-2: #262019;
  --ink:       #F2ECE3;
  --ink-2:     #C6BCAE;
  --muted:     #9A9083;
  --line:      #2E2820;
  --line-2:    #3D3529;
  --gold:      #E4A94A;
  --gold-soft: rgba(228, 169, 74, 0.12);
  --gold-line: rgba(228, 169, 74, 0.38);
  --good:      #5CD98A;
  --good-soft: rgba(92, 217, 138, 0.12);
  --warn:      #FB923C;
  --warn-soft: rgba(251, 146, 60, 0.12);
  --crit:      #FB7185;
  --crit-soft: rgba(251, 113, 133, 0.12);
  --info:      #6BA6FF;
  --info-soft: rgba(107, 166, 255, 0.12);
  --shadow:    0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -16px rgba(0, 0, 0, .7);
}
:root[data-theme="light"] {
  color-scheme: light;
  --paper:     #FBF9F6;
  --surface:   #FFFFFF;
  --surface-2: #F4F0E9;
  --ink:       #221D16;
  --ink-2:     #5C5348;
  --muted:     #8A8074;
  --line:      #E7E1D8;
  --line-2:    #D6CEC2;
  --gold:      #A8721B;
  --gold-soft: rgba(168, 114, 27, 0.10);
  --gold-line: rgba(168, 114, 27, 0.35);
  --good:      #15803D;
  --good-soft: rgba(21, 128, 61, 0.10);
  --warn:      #B45309;
  --warn-soft: rgba(180, 83, 9, 0.10);
  --crit:      #BE123C;
  --crit-soft: rgba(190, 18, 60, 0.10);
  --info:      #2563EB;
  --info-soft: rgba(37, 99, 235, 0.10);
  --shadow:    0 1px 2px rgba(34, 29, 22, .05), 0 8px 24px -16px rgba(34, 29, 22, .25);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: 4px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── 版面骨架 ───────────────────────────────── */

.app { display: flex; min-height: 100vh; }

.rail {
  width: 216px;
  flex: 0 0 216px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 20px 12px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 18px;
}
.brand-mark {
  width: 30px; height: 30px; flex: none;
  border-radius: 9px;
  background: var(--gold-soft);
  border: 1px solid var(--gold-line);
  display: grid; place-items: center;
  color: var(--gold);
}
.brand-name { font-weight: 700; letter-spacing: .01em; }
.brand-sub { font-size: 11px; color: var(--muted); letter-spacing: .06em; }

.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: var(--r-in);
  background: transparent;
  color: var(--ink-2);
  cursor: pointer;
  text-align: left;
  position: relative;
  transition: background .12s ease, color .12s ease;
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] {
  background: var(--gold-soft);
  color: var(--gold);
  font-weight: 600;
}
.nav-btn[aria-current="page"]::before {
  content: "";
  position: absolute; left: -12px; top: 8px; bottom: 8px;
  width: 3px; border-radius: 0 3px 3px 0;
  background: var(--gold);
}
.nav-btn svg { flex: none; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }

main {
  flex: 1;
  min-width: 0;
  padding: 26px 26px 90px;
}
.wrap { max-width: 1060px; margin: 0 auto; }

.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 14px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.page-title { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
.page-sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* 區塊捷徑。分析頁一整頁疊下來有三千多 px，要看另一區得一路捲
   （2026-08-14 回報：「要查另一個需要滑很久」）。黏在最上面，
   一按就跳到那一區。 */
.jumpbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; gap: 6px;
  margin: -6px -4px 14px;
  padding: 8px 4px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.jumpbar::-webkit-scrollbar { display: none; }
.jumpbar button {
  flex: none;
  padding: 5px 11px;
  font-size: 12.5px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  cursor: pointer;
}
.jumpbar button:hover { color: var(--ink); border-color: var(--gold-line); }
/* 跳過去時要留出捷徑列本身的高度，不然標題正好被它蓋住 */
[id^="sec-"] { scroll-margin-top: 58px; }

/* 手機底部分頁 */
.tabbar {
  display: none;
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
}
.tabbar .nav-btn {
  flex-direction: column; gap: 3px;
  font-size: 10px; padding: 6px 2px;
  justify-content: center; text-align: center;
}
.tabbar .nav-btn::before { display: none; }

@media (max-width: 860px) {
  .rail { display: none; }
  .tabbar { display: flex; }
  main { padding: 18px 14px 96px; }
  .page-title { font-size: 20px; }
}

/* ── 元件 ───────────────────────────────────── */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 16px;
  box-shadow: var(--shadow);
}
.stack { display: flex; flex-direction: column; gap: 14px; }

.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.sec-title { font-size: 15px; font-weight: 650; margin: 0; }
.sec-sub { font-size: 12px; color: var(--muted); }

/* 統計格：一律等高，這是 App 版本最常被抱怨的地方 */
/* **`hidden` 屬性一定要壓得過 display。**
   瀏覽器預設的 `[hidden]{display:none}` 屬於 UA 樣式，任何作者樣式都贏得過它 ——
   而這個專案裡 .row、.seg、.field、.tiles 全都設了 display，於是
   `element.hidden = true` 完全沒作用。實例：學生搜尋寫著「找到 2 位」，
   整排學生卻還好端端留在畫面上（2026-08-12 回報）。
   影響的不只搜尋：單價切換、收費日期、詳情頁分頁那些也都是靠 hidden 收合的。 */
[hidden] { display: none !important; }

.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
  gap: 12px;
  align-items: stretch;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 14px;
  min-height: 118px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  box-shadow: var(--shadow);
  text-align: left;
}
.tile-icon { color: var(--tile-color, var(--gold)); margin-bottom: 6px; }
.tile-value {
  font-family: var(--mono);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.15;
  overflow-wrap: anywhere;
}
.tile-unit { font-size: 12px; color: var(--muted); font-family: var(--sans); margin-left: 2px; }
.tile-label { font-size: 12.5px; color: var(--ink-2); }
/* 說明行永遠佔位，四格才不會一高一矮 */
.tile-note { font-size: 11px; color: var(--muted); margin-top: auto; min-height: 1.4em; font-family: var(--mono); font-variant-numeric: tabular-nums; }
button.tile { cursor: pointer; font: inherit; transition: border-color .12s ease, transform .12s ease; }
button.tile:hover { border-color: var(--gold-line); }
button.tile:active { transform: translateY(1px); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  border-radius: var(--r-pill);
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
  font-size: 13.5px;
  transition: background .12s ease, border-color .12s ease;
}
.btn:hover { background: var(--surface-2); }
/* 主色按鈕的文字色跟著主題走：淺色底用白字，深色底的金色較亮要用深字 */
:root { --on-gold: #FFFFFF; }
@media (prefers-color-scheme: dark) { :root { --on-gold: #17130C; } }
:root[data-theme="dark"] { --on-gold: #17130C; }
:root[data-theme="light"] { --on-gold: #FFFFFF; }

.btn-primary {
  background: var(--gold); border-color: var(--gold);
  color: var(--on-gold); font-weight: 600;
}
.btn-primary:hover { filter: brightness(1.06); background: var(--gold); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn-danger { color: var(--crit); border-color: var(--line-2); }
.btn-danger:hover { background: var(--crit-soft); }
.btn-sm { padding: 4px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px;
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 550;
  white-space: nowrap;
}
.pill-good { background: var(--good-soft); color: var(--good); }
.pill-warn { background: var(--warn-soft); color: var(--warn); }
.pill-crit { background: var(--crit-soft); color: var(--crit); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-gold { background: var(--gold-soft); color: var(--gold); }
.pill-mute { background: var(--surface-2); color: var(--muted); }

.row {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row-main { min-width: 0; flex: 1; }
.row-title { font-weight: 550; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.row-sub { font-size: 12px; color: var(--muted); }
.row-end { text-align: right; flex: none; font-variant-numeric: tabular-nums; }

/*
 * 續約紀錄那一列。原本直接用 `.row`（單行 flex：內容一份、按鈕一份），
 * 但這一列的兩邊都會長大 —— 左邊最多掛四個 pill（這一期／加購／首購／沒有收費），
 * 右邊最多三顆按鈕（改回主約／編輯／刪除）再加堂數與金額。
 * 手機寬度下 `.row-end` 就吃掉八成，`.row-main` 被壓到六十幾 px，
 * 於是「2026-08-02」被逐字折成三行，「＋結轉 20 ＝ 22」也疊到金額上
 *（2026-08-27 回報，畫面截圖）。
 *
 * 改成三塊各自可換行：內容／數字／按鈕。窄畫面時按鈕整條落到下一行，
 * 上面那行就有足夠寬度讓日期不斷行。
 */
.renewal-row { align-items: flex-start; flex-wrap: wrap; row-gap: 8px; column-gap: 10px; }
.renewal-row .row-main { flex: 1 1 52%; }
.renewal-row .row-title { font-size: 14px; align-items: flex-start; }
.r-date { white-space: nowrap; }
.r-figs {
  flex: 0 0 auto; margin-left: auto; text-align: right;
  font-variant-numeric: tabular-nums; line-height: 1.4;
}
.r-sessions { font-weight: 600; white-space: nowrap; }
.r-carry, .r-amount { font-size: 12px; color: var(--muted); white-space: nowrap; }
.r-acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex: 0 0 auto; }
@media (max-width: 560px) {
  /* 按鈕自己佔滿一行，上面那行才有寬度給日期與 pill */
  .r-acts { flex: 1 0 100%; }
}

.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

/* 看起來就能按的數字（剩餘堂數）。原本跟純文字長得一樣，沒人知道能點。 */
.tap-adjust {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 6px; margin: -2px -6px;
  border-radius: var(--r-in);
  border-bottom: 1px dashed var(--line);
  cursor: pointer;
}
.tap-adjust:hover { background: var(--surface-2); border-bottom-color: var(--gold); }
.tap-adjust svg { color: var(--muted); }

.empty {
  color: var(--muted); font-size: 13px;
  padding: 22px 4px; text-align: center;
}

.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }

/* 表單 */
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.field > label { font-size: 12.5px; color: var(--ink-2); font-weight: 550; }
/* 說明文字。以前只有 .field 裡面的 .hint 有樣式，單獨一段 <p class="hint">
   會用 15px 內文大小、內文顏色去畫 —— 全站 50 幾處，畫面上就是一面牆。
   說明一律小一號、灰一階，內容才站得出來。 */
.hint { font-size: 12px; line-height: 1.6; color: var(--muted); margin: 6px 0; }
.field .hint { font-size: 11.5px; margin: 0; }

/* 長篇的「為什麼」收進來，需要的人自己點開。
   規則本身要看得到，理由不必一直佔著版面。 */
details.help { margin: 8px 0; }
details.help > summary {
  cursor: pointer; list-style: none;
  font-size: 12px; color: var(--ink-2); font-weight: 550;
  padding: 5px 0;
}
details.help > summary::-webkit-details-marker { display: none; }
details.help > summary::before { content: "＋ "; color: var(--muted); }
details.help[open] > summary::before { content: "－ "; }
details.help > summary:hover { color: var(--ink); }
details.help .hint { margin-top: 2px; }
input[type="text"], input[type="tel"], input[type="email"], input[type="number"],
input[type="date"], input[type="time"], select, textarea {
  width: 100%;
  padding: 8px 11px;
  border: 1px solid var(--line-2);
  border-radius: var(--r-in);
  background: var(--surface);
  color: var(--ink);
}
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
textarea { min-height: 66px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
@media (max-width: 520px) { .field-row { grid-template-columns: 1fr; } }

.seg { display: flex; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: var(--r-in); }
.seg button {
  flex: 1; border: 0; background: transparent; color: var(--ink-2);
  padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }

.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
.switch input { width: 42px; height: 24px; appearance: none; background: var(--line-2); border-radius: 999px; position: relative; cursor: pointer; transition: background .15s ease; flex: none; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s ease; }
.switch input:checked { background: var(--gold); }
.switch input:checked::after { transform: translateX(18px); }

/* 對話框 */
/* 對話框預設置中。只有「手指操作的小螢幕」才貼在底部當抽屜用——
   那是手機才順手的形式，滑鼠環境貼在邊緣只會讓人找不到。
   用 pointer 判斷而不是只看寬度，視窗拉窄的桌機才不會被誤判成手機。 */
.scrim {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(20, 17, 13, .45);
  display: grid; place-items: center;
  padding: 24px;
}
@media (max-width: 699px) and (pointer: coarse) {
  .scrim { place-items: end center; padding: 0; }
}
dialog.sheet {
  /* 瀏覽器給 dialog[open] 的預設是 position:absolute + margin:auto。
     我們把 margin 歸零自己排版，所以要把它放回版面流程裡，
     否則會脫離外層的置中，整個貼到左邊緣。 */
  position: relative;
  border: 0; padding: 0; margin: 0;

// 手機上沒有 viewport meta 的話會用 980px 排版再縮小，字會小到看不清楚。
// 外層若已經提供就不重複加。
if (!document.querySelector('meta[name="viewport"]')) {
  const meta = document.createElement("meta");
  meta.name = "viewport";
  meta.content = "width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(meta);
}

// 給別人測試時，畫面整片白最難問出原因。攔下沒接住的錯誤，
// 直接把訊息印在畫面上，對方截圖就知道壞在哪。
window.addEventListener("error", (e) => showFatal(e.message, e.filename, e.lineno));
window.addEventListener("unhandledrejection", (e) => showFatal(String(e.reason)));

function showFatal(message, file, line) {
  if (document.getElementById("fatal")) return;
  const box = document.createElement("div");
  box.id = "fatal";
  box.setAttribute("style", "position:fixed;inset:0;z-index:999;background:#FBF9F6;color:#221D16;" +
    "font:15px/1.6 -apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;padding:24px;overflow:auto");
  box.innerHTML =
    '<h1 style="font-size:18px;margin:0 0 8px">這頁沒能正常開起來</h1>' +
    '<p style="margin:0 0 14px;color:#5C5348">把下面這段截圖傳回來就能修。</p>' +
    '<pre style="white-space:pre-wrap;word-break:break-word;background:#F4F0E9;padding:12px;' +
    'border-radius:10px;font-size:12px;margin:0 0 14px"></pre>' +
    '<button style="padding:8px 16px;border-radius:999px;border:1px solid #A8721B;' +
    'background:#A8721B;color:#fff;font:inherit">重新載入</button>';
  // 版本在下面才宣告，萬一是載入到一半就出錯，讀不到就算了
  let build = "";
  try { build = "版本 " + BUILD; } catch (e) { build = "版本 未知（載入未完成）"; }
  box.querySelector("pre").textContent =
    [message, file ? file + ":" + line : "", build, navigator.userAgent].filter(Boolean).join("\n\n");
  box.querySelector("button").onclick = () => location.reload();
  (document.body || document.documentElement).appendChild(box);
}

# 教練小幫手 使用說明

給教練管學生、課表、收費的小工具。目前是測試版，想聽聽你用起來順不順。

打開網頁就能用，**不用註冊、沒有帳號密碼**。

你輸入的東西存在**你自己手機（或電腦）的瀏覽器裡**，沒有上傳到任何伺服器。

- 關掉分頁、關掉瀏覽器
- 手機關機重開

- Android（Chrome）：右上角選單，選「加到主畫面」

## 五、換手機怎麼搬

1. 舊手機：設定 → 匯出檔案，或複製備份文字
2. 把檔案或文字傳給自己（AirDrop、LINE、Email 都可以）
3. 新手機：打開同一個網址 → 設定 → 匯入檔案或貼上備份文字 → 取代全部

## 六、常見問題

**可以多個人共用同一份資料嗎？**

不行。目前每位教練的資料各自獨立，不會互通。

**我的學生資料會被誰看到嗎？**

不會。資料沒有離開你的裝置。

**沒有網路可以用嗎？**

第一次要連網把頁面載進來，之後大部分操作不需要網路。但建議還是在有網路時使用。

**為什麼不用登入？**

測試階段刻意不做帳號，讓你點開就能試。

**網頁版跟手機 App 一樣嗎？**

功能大致相同。兩邊的匯出檔格式互通，網頁版匯出的檔可以匯進 App，反過來也可以。

// 舊一點的 iOS Safari（15.4 以前）沒有 structuredClone，直接用會整頁白掉。
// 這裡的資料都是純 JSON，用序列化複製就夠。
const clone = (obj) => JSON.parse(JSON.stringify(obj));

function blankState() {
  return { students: [], lessons: [], leads: [], settings: clone(DEFAULT_SETTINGS) };
}

let S = blankState();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object") return null;
    const settings = {
      ...clone(DEFAULT_SETTINGS),
      ...(parsed.settings || {}),
      salary: { ...DEFAULT_SALARY, ...((parsed.settings || {}).salary || {}) },
    };
    // 標籤是後來才加的。舊資料沒有這個鍵時給預設值，
    // 但「使用者把標籤全刪光」存下來的是空陣列，那要尊重，不能又塞回範例標籤。
    if (!Array.isArray((parsed.settings || {}).tags)) {
      settings.tags = clone(DEFAULT_SETTINGS.tags);
    }
    return {
      students: (Array.isArray(parsed.students) ? parsed.students : []).map((s) => ({
        ...s,
        tags: Array.isArray(s.tags) ? s.tags : [],
        // 續約紀錄與自訂欄位都是後來才加的。**沒有補正的話不是顯示成空的，
        // 是直接炸掉**：程式裡有好幾處是 `s.renewals.push(...)`／
        // `s.custom["年齡"]` 這樣直接用的（2026-08-09 實測：早期測試教練的
        // 資料一打開「分析」頁整頁掛掉、「續約」按下去沒反應、銷售統計與
        // 匯出備份也一起失敗 —— 連救資料的出口都堵住）。
        //
        // 補在這裡而不是在每個使用點加 `|| []`：這是所有存下來的資料唯一的
        // 入口，補一次就好，散在幾十處反而會漏。
        // carryOver（上一期結轉的堂數）是後來才加的，舊資料一律當 0 ——
        // 分母會拿它去加，undefined 會讓整個數字變成 NaN。
        renewals: (Array.isArray(s.renewals) ? s.renewals : [])
          .map((r) => ({ ...r, carryOver: Math.max(0, +r.carryOver || 0),
                         amountOk: !!r.amountOk, addOn: !!r.addOn,
                         // 加購綁在哪一份主約底下、以及它原本記的日期。
                         // ...r 本來就會帶著，明寫出來是為了不被當成沒人用的欄位刪掉。
                         ...(r.mainId ? { mainId: r.mainId } : {}),
                         ...(r.soldOn !== undefined ? { soldOn: r.soldOn } : {}) })),
        // 「魔羯座」是常見的另一種寫法，但同一群人被拆成兩堆客群分析就沒意義。
        // 統一成「摩羯座」（iOS 版與教育部字典的寫法）。
        custom: normalizeCustom((s.custom && typeof s.custom === "object") ? s.custom : {}),
        // 續約時自動產生的收費備註原本會寫死「續約 N 堂」，但那個數字在
        // 建立當下就凍住了：之後回頭改續約紀錄的堂數，這行不會跟著動，
        // 於是好幾筆收費全都停在同一個數字，看起來像堂數沒存進去。
        //
        // 收費與續約是兩個獨立的陣列，沒有關聯欄位可以追（同一天同金額的
        // 收費可能有好幾筆，靠日期＋金額配對也認不出來），所以乾脆不要在
        // 收費這邊重複記堂數 —— 真相在續約紀錄裡，那邊是對的。
        //
        // 只改「完全符合自動產生格式」的那幾筆。你自己手打的備註不會被動到，
        // 而且改完之後不再符合這個格式，重複載入也不會再改一次。
        payments: linkLegacyPayments(
          Array.isArray(s.payments) ? s.payments : [],
          Array.isArray(s.renewals) ? s.renewals : []),
      })),
      // 課程種類、檢測結果、單堂顏色也是後來才加的，舊課一律當正課。
      // owed／partnerOwed 一律清掉：2026-08-11 起網頁版沒有「欠課」這個概念，
      // 留著只是讓舊資料在畫面上冒出一個沒人處理得了的紅字。
      lessons: (Array.isArray(parsed.lessons) ? parsed.lessons : []).map((l) => ({
        ...l,
        owed: false, partnerOwed: false,
        kind: l.kind === "assessment" ? "assessment" : "lesson",
        outcome: OUTCOME[l.outcome] ? l.outcome : "pending",
        color: typeof l.color === "string" ? l.color : "",
        leadId: l.leadId || "",
      })),
      leads: Array.isArray(parsed.leads) ? parsed.leads : [],
      settings,
    };
  } catch (e) {
    console.warn("讀取本機資料失敗，改用空白資料", e);
    return null;
  }
}

/**
 * 舊資料的一次性補救：把還沒有 renewalId 的收費接回對應的續約。
 *
 * 續約產生收費時兩筆的日期與金額是同一組值，所以拿這兩個去配。
 * **只在配到剛好一筆時才接** —— 同一天同金額有好幾筆續約的話就認不出來，
 * 猜錯比留白更糟（會在收費上印出別筆的堂數）。
 *
 * 順便把舊的「續約 N 堂」備註洗掉：那個數字是凍住的，接上關聯之後
 * 堂數會從續約紀錄即時讀出來，備註再留一份只會互相矛盾。
 * 只洗完全符合自動格式的，自己打的不動。
 */
/** 自訂欄位的值要正規化的地方（目前只有星座的兩種寫法） */
function normalizeCustom(custom) {
  if (custom["星座"] === "魔羯座") return { ...custom, 星座: "摩羯座" };
  return custom;
}

function linkLegacyPayments(payments, renewals) {
  const ids = new Set(renewals.map((r) => r.id));
  return payments.map((p) => {
    const notes = /^續約 \d+ 堂$/.test(p.notes || "") ? "續約" : p.notes;
    // 指向已經被刪掉的續約：那個 id 是斷頭，留著只會讓這筆錢既印不出堂數、
    // 又不算「還沒對應」，等於再也接不回去。拿掉之後下面照樣有機會補接。
    if (p.renewalId && !ids.has(p.renewalId)) {
      const { renewalId, ...rest } = p;
      p = rest;
    }
    if (p.renewalId) return { ...p, notes };
    const hits = renewals.filter((r) =>
      (r.date || "") === (p.date || "") && (r.amount || 0) === (p.amount || 0));
    return hits.length === 1
      ? { ...p, notes, renewalId: hits[0].id }
      : { ...p, notes };
  });
}

let saveFailed = false;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
    saveFailed = false;
  } catch (e) {
    if (!saveFailed) {
      saveFailed = true;
      toast("存不進瀏覽器空間，請先匯出備份再清理資料");
    }
  }
}

/* ════════════════════════════════════════════════
   2. 日期與格式
   日期一律 "YYYY-MM-DD" 字串，時間 "HH:mm"。
   固定格式下字串比較就等於日期比較。
   ════════════════════════════════════════════════ */

const pad = (n) => String(n).padStart(2, "0");
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const monthStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
const today = () => dayStr(new Date());
const thisMonth = () => monthStr(new Date());

function parseDay(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) {           // 週一為一週之始
  const x = new Date(d);
  const wd = (x.getDay() + 6) % 7;
  return addDays(x, -wd);
}
const WD = ["一", "二", "三", "四", "五", "六", "日"];
const weekdayName = (d) => WD[(d.getDay() + 6) % 7];

function minutesOf(hhmm) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || "");
  return m ? +m[1] * 60 + +m[2] : 0;
}
const timeOf = (mins) => `${pad(Math.floor(((mins % 1440) + 1440) % 1440 / 60))}:${pad(((mins % 60) + 60) % 60)}`;
const durationOf = (l) => Math.max(0, minutesOf(l.end) - minutesOf(l.start));

const money = (n) => "$" + Math.round(n || 0).toLocaleString("en-US");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* 課程時長：只留 1 小時與 1.5 小時，其他走自訂 */
const DURATIONS = [60, 90];
const DURATION_MIN = 10, DURATION_MAX = 480;
const clampDuration = (m) => Math.min(Math.max(Math.round(m) || 0, DURATION_MIN), DURATION_MAX);
const isPresetDuration = (m) => DURATIONS.includes(m);
function durationLabel(mins) {
  if (!mins || mins <= 0) return "0 分鐘";
  const h = Math.floor(mins / 60), m = mins % 60;
  if (h === 0) return `${m} 分鐘`;
  if (m === 0) return `${h} 小時`;
  if (m === 30) return `${(mins / 60).toFixed(1)} 小時`;
  return `${h} 小時 ${m} 分`;
}

/**

 *
 * Collator 建一次就好：每次比較都 new 一個，幾十位學生的下拉會明顯變慢。
 */
const nameCollator = new Intl.Collator("zh-Hant-u-co-stroke", { numeric: true });
const byStudentName = (a, b) => nameCollator.compare(a.name || "", b.name || "");

/**
 * 換課程狀態時同步扣還堂數。
 * consumed 旗標讓狀態改來改去也不會重複扣。
 *
 * **沒有「欠課」這件事**（2026-08-11 起）：剩餘是 0 就不扣，課照樣記成已上，
 * 不會留下一筆之後要還的帳。owed 那兩個欄位只為了備份格式跟 iOS 對齊而保留，
 * 網頁版一律寫 false。
 */
function setLessonStatus(lesson, status) {
  // 檢測的對象還沒買課，沒有堂數可扣
  if (!LESSON_KIND[kindOf(lesson)].consumes) {
    lesson.status = status;
    return;
  }
  const shouldConsume = CONSUMING.includes(status);
  for (const [idKey, consumedKey, owedKey] of SESSION_SLOTS) {
    const st = studentById(lesson[idKey]);
    if (!st) continue;
    if (shouldConsume && !lesson[consumedKey]) {
      // **沒有「欠課」這件事**（2026-08-11）。以前剩餘是 0 卻標了已出席，
      // 會記一筆「欠一堂」，之後加堂數再自動還回去 —— 但實際上教練不是這樣
      // 記帳的，那個紅字只會讓人以為資料壞了。現在扣到 0 就停：課照樣是
      // 已上課，只是沒有堂數可扣。
      if (st.remaining > 0) {
        st.remaining -= 1;
        lesson[consumedKey] = true;
      }
      lesson[owedKey] = false;
    } else if (!shouldConsume) {
      if (lesson[consumedKey]) {
        st.remaining += 1;
        lesson[consumedKey] = false;
      }
      lesson[owedKey] = false;
    }
    st.updatedAt = new Date().toISOString();
  }
  lesson.status = status;
}

/**
 * 刪掉一位學生，連同他在課表上留下的痕跡。
 *
 * 原本是一行 `S.lessons.filter(l => l.studentId !== id && l.partnerId !== id)`，
 * 兩個問題（2026-08-11 查出來）：
 *
 *  1. **共同課的另一位陪葬**。甲乙一起上的課，刪掉乙（他只是「第二位」）
 *     會把整堂刪掉 —— 那是**甲的**課，甲的紀錄憑空少一堂。
 *     現在只把乙從那堂課上拿掉，課留給甲。
 *  2. **另一位已扣的堂數沒還回去**。刪掉主要學生時整堂會消失，但同一堂
 *     也扣過對方一堂；課不見了、堂數卻沒還，對方等於平白少一堂課。
 *     刪單一堂課本來就會 releaseLesson，這裡漏了。
 *
 * 回傳統計是為了講給使用者聽：刪了幾堂、幾堂只是拿掉共同上課的人、
 * 還了幾堂給別人。
 */
function removeStudentEverywhere(student) {
  const kept = [];
  let removed = 0, detached = 0, refunded = 0;
  for (const l of S.lessons) {
    if (l.studentId === student.id) {
      // 整堂要刪：同一堂如果也扣過共同上課那位的堂數，要還給他
      if (l.partnerId && l.partnerId !== student.id && l.partnerConsumed) {
        const p = studentById(l.partnerId);
        if (p) { p.remaining += 1; p.updatedAt = new Date().toISOString(); refunded++; }
      }
      removed++;
      continue;
    }
    if (l.partnerId === student.id) {
      // 這是別人的課，他只是被找來一起上。課留著，人拿掉。
      l.partnerId = "";
      l.partnerConsumed = false;
      l.partnerOwed = false;
      detached++;
    }
    kept.push(l);
  }
  S.lessons = kept;
  S.students = S.students.filter((x) => x.id !== student.id);
  return { removed, detached, refunded };
}

/** 刪課要把已扣的堂數還回去；課都不存在了，欠課紀錄也跟著取消 */
function releaseLesson(lesson) {
  for (const [idKey, consumedKey, owedKey] of SESSION_SLOTS) {
    if (lesson[consumedKey]) {
      const st = studentById(lesson[idKey]);
      if (st) st.remaining += 1;
    }
    lesson[consumedKey] = false;
    lesson[owedKey] = false;
  }
}

/** 這位學生有幾堂「上了但沒堂數可扣」的課 */

/** 結束時間已過卻還停在「已排定」的課，補標成已出席 */
/**
 * 這個時段過了沒。
 *
 * 「結束時間已經過去」才算過了 —— 正在上的那一堂不能算完成。
 * 抽出來是因為兩個地方要用同一把尺：開 App 時的自動補標，
 * 以及新排一堂課時要預設成「已上課」還是「已排定」。
 */
function isPastSlot(date, end, start = "") {
  const now = new Date();
  const nowDay = dayStr(now), nowMin = now.getHours() * 60 + now.getMinutes();
  // 跨午夜的課（23:30–00:30）結束時間會比開始時間小，實際上是**隔天**才結束。
  // 不看這件事的話，今晚 23:30 那堂會被當成早上就已經上完 —— 排下去立刻
  // 記成已出席、還扣一堂。
  const endsNextDay = start && minutesOf(end) <= minutesOf(start);
  const endDay = endsNextDay ? dayStr(addDays(parseDay(date) || now, 1)) : date;
  return endDay < nowDay || (endDay === nowDay && minutesOf(end) <= nowMin);
}

function autoMarkPastLessons() {
  let changed = 0;
  for (const l of S.lessons) {
    if (l.status !== "scheduled") continue;
    if (!isPastSlot(l.date, l.end, l.start)) continue;
    // 上完課忘了按 → 補標並扣一堂（那堂課真的用掉了）。
    // 但**事後才補進來的紀錄不扣**（建立時間晚於課程結束）——那是在補歷史，
    // 剩餘堂數早就反映過了。不分這兩種的話，每次開 App 都會再犯一次。
    if (isBackfilledRecord(l)) l.status = "attended";
    else setLessonStatus(l, "attended");
    changed++;
  }
  return changed;
}

/** 這筆課是不是「事後才補進來的」——建立時間晚於課程結束 */
function isBackfilledRecord(l) {
  if (!l.createdAt || !l.date || !l.end) return false;
  const slotEnd = new Date(`${l.date}T${l.end}:00`);
  const created = new Date(l.createdAt);
  if (isNaN(slotEnd.getTime()) || isNaN(created.getTime())) return false;
  return created > slotEnd;
}

function lessonsOf(studentId) {
  return S.lessons.filter((l) => l.studentId === studentId || l.partnerId === studentId);
}
/**
 * 已上堂數。**檢測不算** —— 它佔時段但不扣堂數（`LESSON_KIND.assessment.consumes`
 * 是 false），算進來的話「已上 N 堂」會比實際多，而那個數字還被拿去推算收入。
 * 新排的檢測 studentId 是空的，但把一堂正課改成檢測時 studentId 會留著。
 */
function attendedCount(studentId) {
  return lessonsOf(studentId)
    .filter((l) => !isAssessment(l) && CONSUMING.includes(l.status)).length;
}

/**
 * 「已經上掉幾堂」。
 *
 * 兩個來源，優先用實算：
 * 　1. 課程紀錄裡標成已出席／遲到的堂數（`attendedCount`）—— 這是有憑據的
 * 　2. 一堂課程紀錄都沒有時，用「已購 − 剩餘」推算
 *
 * 為什麼需要第 2 條：搬家進來的學生沒有課程紀錄（堂數是照舊系統手填的），
 * 於是列表寫「已上 0 堂」，可是他買了 30 堂、只剩 3 堂 —— 那明明是上了 27 堂。
 * 0 是「我沒有紀錄」，不是「他沒上過課」，但畫面上看起來一樣（2026-08-09 回報）。
 *
 * 刻意**不把兩者相加**：課程紀錄上的那幾堂已經反映在剩餘堂數裡，加起來會
 * 重複計算。
 *
 * **取兩者大的那個**（2026-08-12 改）。原本「有紀錄就以紀錄為準」，但補歷史
 * 的人只會記最近幾堂：買了 36 剩 12（等於上了 24），補了 4 堂紀錄之後
 * 「已上 24 堂」竟然變成「已上 4 堂」——數字反而縮水，看起來像資料壞了。
 * 紀錄是「我有憑據的那幾堂」，餘額差是「他實際上掉幾堂」，後者才是總數。
 */
function consumedSessions(student) {
  if (!student) return { count: 0, estimated: false, recorded: 0 };
  const recorded = attendedCount(student.id);
  const implied = Math.max(0, (student.totalPurchased || 0) - Math.max(0, student.remaining || 0));
  if (implied > recorded) return { count: implied, estimated: true, recorded };
  return { count: recorded, estimated: false, recorded };
}

/**
 * 最後一次真的上到課是哪一天（"YYYY-MM-DD"，沒有就 null）。
 *
 * 只認 `CONSUMING`（已出席／遲到）—— 排定的課還沒發生，取消與缺席那天他人沒到，
 * 拿來當「上次上課」會讓一個三週沒來的人看起來像上週才上過。
 * **檢測不算**：那是還沒買課的人的試教，跟「這位學生多久沒來」是兩件事。
 * 未來日期的紀錄也排除（補課先標成已出席會讓天數變負的）。
 */
function lastAttendedDate(studentId) {
  const t = today();
  const days = lessonsOf(studentId)
    .filter((l) => !isAssessment(l) && CONSUMING.includes(l.status) && l.date && l.date <= t)
    .map((l) => l.date)
    .sort();
  return days.length ? days[days.length - 1] : null;
}

/** 那天到今天隔了幾天（今天＝0）。認不出來的日期回 null，不要算成 0。 */
function daysSince(day) {
  const d = parseDay(day);
  if (!d) return null;
  const t = parseDay(today());
  return Math.round((t - d) / 86400000);
}

/** 已經排好、還沒上的課（今天以後） */
function hasUpcomingLesson(studentId) {
  const t = today();
  return lessonsOf(studentId).some((l) => l.status === "scheduled" && l.date >= t);
}

/**
 * 太久沒上課的人 —— 總覽頁那一區。
 *
 * 三個條件，缺一個這份名單就會變成雜訊：
 * 　1. **手上還有堂數**：課上完了的人要談的是續約，不是排課，那是另一區的事。
 * 　2. **沒有排好的下一堂**：已經約好下週見的人跳出來只會讓人以為漏了什麼。
 * 　3. 距離上次上課 ≥ 門檻天數。
 *
 * 一堂課程紀錄都沒有的人分兩種，**只有後者該進名單**：
 * 　·「上過課但沒記」——補歷史的人只記最近幾堂，整批搬進來的更是一堂都沒有。
 * 　　他們明明還在上，只是不知道是哪天；列成「太久沒上課」是錯的資訊，比沒有更糟。
 * 　　認法是 `consumedSessions` 推算得出他上掉過課（已購 > 剩餘）。
 * 　·「真的還沒開始」——剛買完課、一堂都還沒上（已購 ≈ 剩餘）。那才是要約的人，
 * 　　用**建檔那天**算，因為那才是「這位學生放著多久了」。
 *
 * 這條規則是拿 `fixtures/migrated-roster.json` 跑出來的：不分開的話，
 * 整批搬進來的八位全部跳出來寫「還沒有上課紀錄」，一整區都是雜訊（2026-08-27）。
 */
function idleStudents(minDays = idleDaysSetting()) {
  return activeStudents()
    .filter((s) => (s.remaining || 0) > 0 && !hasUpcomingLesson(s.id))
    .map((s) => {
      const last = lastAttendedDate(s.id);
      if (!last && consumedSessions(s).count > 0) return null;   // 上過課，只是沒記錄
      const from = last || dayOfISO(s.createdAt);
      return { student: s, last, days: daysSince(from) };
    })
    .filter((x) => x && x.days !== null && x.days >= minDays)
    .sort((a, b) => b.days - a.days);
}

/** ISO 時間戳（createdAt）取本地日期字串。時區踩過坑，不要用 toISOString。 */
function dayOfISO(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  return isNaN(d) ? null : dayStr(d);
}

/** 至少 1 天。設成 0 等於每個人都「太久沒上課」，那份名單就沒用了。 */
function idleDaysSetting() {
  return Math.max(1, Math.round(+S.settings.idleDays) || DEFAULT_SETTINGS.idleDays);
}

/** 「14 天前」這種說法。今天／昨天照講，其他寫天數。 */
function daysAgoLabel(days) {
  if (days === null || days === undefined) return "";
  if (days <= 0) return "今天";
  if (days === 1) return "昨天";
  return `${days} 天前`;
}

/** 續約紀錄，新的排前面。日期相同時用建立時間分先後。 */
function renewalsOf(student) {
  return [...(student.renewals || [])].sort((a, b) =>
    (b.date || "").localeCompare(a.date || "")
    || (b.createdAt || "").localeCompare(a.createdAt || ""));
}

/**
 * 這筆收費對應到哪一筆續約（沒有就是 null）。
 *
 * 以前是把「續約 N 堂」直接寫進收費備註，但那是建立當下凍住的字串：
 * 回頭改續約紀錄的堂數，備註不會跟著動，於是好幾筆收費全停在同一個數字。
 * 改成存 renewalId，顯示時去讀活的堂數，改哪邊都不會再對不上。
 */
function renewalOfPayment(student, payment) {
  if (!payment || !payment.renewalId) return null;
  return (student.renewals || []).find((r) => r.id === payment.renewalId) || null;
}

/**
 * 這筆續約是不是「首次購買」。
 *
 * 由**位置**推導，不是建立學生時寫死的備註 —— 使用者後來補了一筆更早的
 * 續約，那筆才是首購，原本那筆就變成續約了。存成固定字串的話，
 * 補完歷史之後標籤會停在錯的那一筆。
 */
function isFirstPurchase(student, record) {
  const all = renewalsOf(student);          // 新的排前面
  const first = all[all.length - 1];
  return !!first && !!record && first.id === record.id;
}

/** 收費那一列要顯示的說明文字 */
function paymentLabel(student, payment) {
  const r = renewalOfPayment(student, payment);
  const note = (payment.notes || "").trim();
  if (!r) return note;
  const base = `${isFirstPurchase(student, r) ? "首次購買" : "續約"} ${r.sessions || 0} 堂`;
  // 自動產生的「續約」不必再印一次，自己打的備註要留著
  return note && note !== "續約" ? `${base}　${note}` : base;
}

/**
 * 這一期合約買了幾堂。
 *
 * totalPurchased 是「累計」—— 補完歷史之後會變成 50、80，
 * 拿它當分母看不出這期的進度（「0 / 50 堂」沒有意義）。
 * 改用最近一次續約買的堂數，累計那個數字移到編輯頁的續約紀錄裡看。
 *
 * 沒有任何續約紀錄的人（直接在表單填「購買堂數」建的），
 * 那筆購買本身就是他現在的合約，所以退回 totalPurchased。
 */
function currentPackageSessions(student) {
  // 加購不算「這一期買的主約」——它是綁在主約底下的小活動
  const { main } = currentPackageParts(student);
  return main ? (main.sessions || 0) : (student.totalPurchased || 0);
}

/**
 * 這一期上一次剩下來、結轉進來的堂數。
 *
 * 續約不必等合約用完 —— 上一期還沒上完就先買下一期是常態。那些沒用完的課
 * 不會消失，會跟新買的加在一起，所以「這一期手上總共有幾堂」是
 * **這次買的 ＋ 上期結轉的**。
 *
 * 續約當下學生的 `remaining` 就是結轉的數字，所以 renewSheet 會自動帶入；
 * 補歷史時算不出來，就在續約紀錄那邊自己填。
 */
/**
 * 這位學生的每堂單價。
 *
 * 優先用他自己的「每堂費用」；沒填就從**最近一筆有金額的合約**換算
 * （總額 ÷ 堂數）。補歷史的人多半只填了合約，沒有一位一位去補鐘點費，
 * 而這個數字撐著「已上 N 堂值多少」「未上課的預收」與公司教練的鐘點抽成 ——
 * 拿 0 去乘，那幾個數字全部是 0（2026-08-12 回報「價格有問題」）。
 */
function sessionPrice(student) {
  if (student.rate > 0) return student.rate;
  for (const r of renewalsOf(student)) {
    if ((r.sessions || 0) > 0 && (r.amount || 0) > 0) {
      return Math.round(r.amount / r.sessions);
    }
  }
  return 0;
}

/**
 * 這一期的組成：主約 ＋ 綁在它底下的加購。
 *
 * 教練常常在主約底下再推小活動（36 堂的約底下再賣 4 堂、2 堂的便宜方案）。
 * 那些是**同一期的加購**，不是新的一期。以前每一筆都是獨立的續約紀錄，
 * 於是分母只認最新那一筆，畫面就變成「30 / 2 堂」——買了 2 堂的活動，
 * 反而把 36 堂的主約蓋掉了（2026-08-12 回報）。
 *
 * 標成加購（`addOn`）之後：分母是主約＋加購，續約次數也不會被加購灌水
 * （那不是又續一次約）。銷售統計照舊一筆一筆算，那些錢是真的收到的。
 */
function currentPackageParts(student) {
  const rs = renewalsOf(student);              // 新的排前面
  const mainIndex = rs.findIndex((r) => !r.addOn);
  const main = mainIndex >= 0 ? rs[mainIndex] : null;
  // 只算「比主約新」的那些加購 —— 更早的加購屬於上一期，早就結束了
  const addOns = rs.slice(0, mainIndex < 0 ? rs.length : mainIndex).filter((r) => r.addOn);
  return { main, addOns };
}

/**
 * 這一期（進行中）的那幾筆續約紀錄：主約＋掛在它底下的加購。
 *
 * 為什麼要分：續約紀錄把**還在上的這份合約**跟**早就上完的那幾份**混在一起列，
 * 表頭的「170 堂・累計 $187,400」是全部加總 —— 想知道「已經完成的是多少」就得
 * 自己減。試用者的做法是**把進行中那筆刪掉**，然後發現總購買堂數與金額少了一份
 * （2026-08-15 回報）。刪資料是唯一的出路就代表畫面沒把話講完。
 *
 * 判斷：最近一筆主約（＋比它新的加購）就是這一期。學生手上還有剩餘堂數才算
 * 「進行中」，剩 0 就是連這一期也上完了。
 */
function currentPackageRenewalIds(student) {
  const { main, addOns } = currentPackageParts(student);
  if (!main) return new Set();
  return new Set([main.id, ...addOns.map((r) => r.id)]);
}

/** 這一期還在進行中嗎（手上還有課） */
function isPackageInProgress(student) {
  return (student.remaining || 0) > 0 && !!currentPackageParts(student).main;
}

/**
 * 分母那個數字是怎麼來的，寫成一行給人看。
 * 只有一份主約、沒加購也沒結轉的時候回空字串 —— 那時候分母本身就講完了。
 */
function packageBreakdown(student) {
  const add = addOnSessions(student), carry = carryOverOf(student);
  if (!add && !carry) return "";
  return [`本期 ${currentPackageSessions(student)}`,
          add ? `加購 ${add}` : "",
          carry ? `結轉 ${carry}` : ""].filter(Boolean).join("＋");
}

/** 這一期加購了幾堂 */
function addOnSessions(student) {
  return currentPackageParts(student).addOns.reduce((a, r) => a + (r.sessions || 0), 0);
}

function carryOverOf(student) {
  // 結轉記在主約上（加購不是新的一期，不會有自己的結轉）
  const { main } = currentPackageParts(student);
  return main ? Math.max(0, +main.carryOver || 0) : 0;
}

/**
 * 這一期手上總共有幾堂（分母用這個）。
 *
 * 以前分母只放「這次買的」，於是提早續約的人會看到「19 / 4」——
 * 19 堂裡有 15 堂是上一期結轉的，但畫面上完全沒有這件事，看起來就像算錯
 * （2026-08-11 回報）。註記結轉之後分母才說得出實話。
 *
 * **注意結轉不會加進 remaining** —— 那些堂數本來就已經在 remaining 裡了，
 * 再加一次就是憑空多出來。結轉是「說明這 19 堂怎麼來的」，不是一筆新的進帳。
 */
function currentPackageTotal(student) {
  return currentPackageSessions(student) + addOnSessions(student) + carryOverOf(student);
}
// 註：**剩餘堂數比「這次買的」多是合理的，不要去「修正」它。**
// 上一期結轉過來就會這樣（實例：最近買的是 4 堂補課，手上還有 19 堂是前一期
// 剩的）。iOS 也是為了同一個理由，把「剩餘不得大於購買」的自動夾擠限縮成
// 只在新增學生時做。曾經想過「往前找裝得下剩餘的那一筆」，那會讓分母不再是
// 他這期真的買了幾堂 —— 分母說謊比分子大醜。現在的解法是把結轉記下來，
// 分母改成「這次買的＋結轉」，兩個數字都留著，畫面上也講得出來。

/**
 * 身份：一般教練還是承攬教練。
 *
 * 跟 iOS 的 `userRole` 是同一個東西（備份也用那個鍵），差別只有一件事：
 * 承攬教練在場館授課，每一堂要登記上課地點；一般教練不必，那一格對他來說
 * 只是雜訊。舊資料沒有這個鍵，一律當一般教練。
 */
function roleOf() {
  return S.settings.role === "contractor" ? "contractor" : "coach";
}
const isContractor = () => roleOf() === "contractor";

/** 這位教練用過的上課地點，排課時給他直接選 */
function knownLocations() {
  const seen = new Map();
  for (const l of S.lessons) {
    const name = (l.location || "").trim();
    if (name) seen.set(name, (seen.get(name) || 0) + 1);
  }
  return [...seen.entries()].sort((a, b) => b[1] - a[1]).map(([name]) => name);
}

function paymentsOf(studentId) {
  const st = studentById(studentId);
  return st ? st.payments : [];
}
function allPayments() {
  return S.students.flatMap((s) => s.payments.map((p) => ({ ...p, studentId: s.id })));
}

/** 這個月收到的錢 */
function monthRevenue(ym = thisMonth()) {
  return allPayments().filter((p) => (p.date || "").startsWith(ym)).reduce((a, p) => a + (p.amount || 0), 0);
}

/** 抽成級距：當月堂數落在哪一級 */
function percentForSessions(count) {
  const rule = S.settings.salary;
  const sorted = [...(rule.tiers || [])].sort((a, b) => a.minSessions - b.minSessions);
  let pct = rule.basePercent;
  for (const t of sorted) if (count >= t.minSessions) pct = t.percent;
  return pct;
}

/**
 * 公司教練的當月薪資試算。
 *
 * `projected: true` 是**排完會是多少**：已經上到的，加上這個月**還沒上的排定課**。
 * 缺席與取消不算 —— 那兩個是已經發生的事實，不會再變成收入。
 * 月中最想知道的其實是這個數字（「這個月排滿了能領多少」「再幾堂跳級」），
 * 而預設的 onlyAttended 只算已上，月初永遠接近 0（2026-08-27 小春要的）。
 */
function salaryFor(ym, opts = {}) {
  const rule = S.settings.salary;
  const basis = rule.payoutBasisRaw;
  const countsLessons = basis !== "onSale";
  const countsSales = basis !== "perLesson";

  let sessions = 0, lessonRevenue = 0, pendingSessions = 0;
  if (countsLessons) {
    for (const l of S.lessons) {
      if (!l.date.startsWith(ym)) continue;
      // 檢測佔時段但不算課程收入也不進抽成堂數
      if (!LESSON_KIND[kindOf(l)].paid) continue;
      const attended = CONSUMING.includes(l.status);
      const ok = opts.projected
        ? (attended || l.status === "scheduled")
        : (rule.onlyAttended ? attended : l.status !== "cancelled");
      if (!ok) continue;
      if (opts.projected && !attended) {
        // 幾堂是「還沒上、算進來的」—— 差額從哪來要講得出來
        for (const id of [l.studentId, l.partnerId]) if (studentById(id)) pendingSessions += 1;
      }
      for (const id of [l.studentId, l.partnerId]) {
        const st = studentById(id);
        if (!st) continue;
        sessions += 1;
        lessonRevenue += rule.useStudentRate ? sessionPrice(st) : (rule.perLessonRate || 0);
      }
    }
  }
  const pct = percentForSessions(sessions);
  const lessonPay = lessonRevenue * pct / 100;

  // 命名跟 iOS 的 SalaryBreakdown 對齊：salesAmount 是**本月簽約總額**，
  // selfSalesAmount／companySalesAmount 是拆開的兩邊。原本 salesAmount 存的是
  // 「自己開發」那一半，名字看起來卻像總額 —— 一直沒人用所以沒爆，
  // 但收費頁現在要把三個數字都畫出來了（2026-08-30）。
  let selfSalesAmount = 0, companySalesAmount = 0, salesBonus = 0, saleCount = 0;
  if (countsSales) {
    for (const st of S.students) {
      for (const r of st.renewals) {
        if (!(r.date || "").startsWith(ym)) continue;
        const isCompany = rule.separateCompanyLeadRate && st.acquisition === "companyLead";
        const rate = isCompany ? rule.companyLeadSalesPercent : rule.salesPercent;
        if (isCompany) companySalesAmount += r.amount; else selfSalesAmount += r.amount;
        salesBonus += r.amount * rate / 100;
        saleCount += 1;
      }
    }
  }
  const salesAmount = selfSalesAmount + companySalesAmount;

  // ── 底薪 ────────────────────────────────────────────────
  // 「底薪」在不同公司是三種完全不同的東西，用同一種算法會差好幾萬：
  //   always         底薪照給，抽成另外加
  //   belowThreshold 堂數到了門檻，底薪就沒了（低堂數時的保護）
  //   higherOf       底薪與抽成取高者，不相加
  // 算出來的是「實際要加上去的金額」，這樣 total 一律是 抽成 ＋ 這個數字。
  const configuredBase = rule.baseSalary || 0;
  const mode = rule.baseSalaryMode || "always";
  const threshold = rule.baseSalaryThreshold || 40;
  const earned = lessonPay + salesBonus;

  let baseSalary;
  if (mode === "belowThreshold") baseSalary = sessions >= threshold ? 0 : configuredBase;
  else if (mode === "higherOf")  baseSalary = Math.max(0, configuredBase - earned);
  else                           baseSalary = configuredBase;

  // 這個月為什麼是這個底薪。不解釋的話，達標當月薪水突然少一截
  // 會看起來像算錯。
  let baseNote = null;
  if (configuredBase > 0 && mode === "belowThreshold") {
    baseNote = baseSalary > 0
      ? `還沒滿 ${threshold} 堂（目前 ${sessions} 堂），底薪照給`
      : `已達 ${threshold} 堂，依規則不再給底薪，只算抽成`;
  } else if (configuredBase > 0 && mode === "higherOf") {
    baseNote = baseSalary > 0
      ? `抽成 ${money(earned)} 沒做到底薪 ${money(configuredBase)}，補到底薪`
      : `抽成 ${money(earned)} 已超過底薪 ${money(configuredBase)}，領抽成`;
  }

  const total = baseSalary + earned;

  // 還差幾堂跳到下一級。抽成級距是這個試算最值得看的地方 ——
  // 「再兩堂多 5%」跟「已經到頂」是完全不同的決定。
  const nextTier = [...(rule.tiers || [])]
    .sort((a, b) => a.minSessions - b.minSessions)
    .find((t) => t.minSessions > sessions) || null;

  return { sessions, pendingSessions, lessonRevenue, pct, lessonPay, salesAmount,
           selfSalesAmount, companySalesAmount, saleCount, salesBonus,
           baseSalary, configuredBase, mode, threshold,
           earned, baseNote, total, nextTier };
}

/* ── 檢測成交率 ─────────────────────────────── */

/** 區間內（含頭尾兩天）做過的檢測，取消的不算 */
function assessmentsInRange(from, to) {
  const [a, b] = from <= to ? [from, to] : [to, from];
  return S.lessons.filter((l) =>
    isAssessment(l) && l.status !== "cancelled" && inPeriod(l.date, a, b));
}

function assessmentStats(from, to) {
  const rows = assessmentsInRange(from, to);
  const by = (o) => rows.filter((l) => outcomeOf(l) === o).length;
  const closed = by("closed"), notClosed = by("notClosed");
  const settled = closed + notClosed;
  return {
    total: rows.length,
    closed, notClosed,
    followUp: by("followUp"),
    // 時段已過但還沒回報的
    pending: rows.filter((l) => needsOutcome(l)).length,
    settled,
    // 一場都還沒有結論就回傳 null，不要顯示 0% 誤導人
    rate: settled ? closed / settled * 100 : null,
  };
}

/** 依名單來源拆開看成交率 */
function assessmentBySource(from, to) {
  const rows = assessmentsInRange(from, to);
  return Object.keys(LEAD_SOURCE).map((key) => {
    const group = rows.filter((l) => leadById(l.leadId)?.source === key);
    const closed = group.filter((l) => outcomeOf(l) === "closed").length;
    return { key, label: LEAD_SOURCE[key], total: group.length, closed,
             rate: group.length ? closed / group.length * 100 : null };
  }).filter((r) => r.total > 0).sort((a, b) => b.total - a.total);
}

/** 已經上完、但還沒回報成交與否的檢測 */
function needsOutcome(l) {
  return isAssessment(l) && outcomeOf(l) === "pending"
      && l.status !== "cancelled" && l.date <= today();
}

/** 待回報的檢測，舊的排前面 */
function awaitingOutcome() {
  return S.lessons.filter(needsOutcome)
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
}

const leadById = (id) => S.leads.find((l) => l.id === id) || null;

/* ── 銷售統計 ───────────────────────────────── */
// 「這段期間總共賣了幾堂」。堂數與金額都來自續約紀錄（首購也會寫一筆），
// 跟收費紀錄是兩回事——收費看錢什麼時候進來，銷售看課什麼時候賣掉。

const SALES_PERIODS = {
  thisMonth: "本月", lastMonth: "上月", thisYear: "今年", all: "全部", custom: "自訂",
};

/** 期間對應的起訖日。自訂要另外給日期，這裡回傳 null。 */
function periodBounds(key, now = new Date()) {
  const y = now.getFullYear(), m = now.getMonth();
  const lastDay = (yy, mm) => new Date(yy, mm + 1, 0).getDate();
  switch (key) {
    case "thisMonth":
      return { from: `${y}-${pad(m + 1)}-01`, to: `${y}-${pad(m + 1)}-${pad(lastDay(y, m))}` };
    case "lastMonth": {
      const d = new Date(y, m - 1, 1);
      const py = d.getFullYear(), pm = d.getMonth();
      return { from: `${py}-${pad(pm + 1)}-01`, to: `${py}-${pad(pm + 1)}-${pad(lastDay(py, pm))}` };
    }
    case "thisYear":  return { from: `${y}-01-01`, to: `${y}-12-31` };
    // 字串比較，這兩個邊界包得住任何實際會出現的日期
    case "all":       return { from: "0000-01-01", to: "9999-12-31" };
    default:          return null;
  }
}

/**
 * 這一段是不是「全部時間」（`periodBounds("all")` 那兩個哨兵值）。
 */
function isWholePeriod(from, to) {
  const w = periodBounds("all");
  return from <= w.from && to >= w.to;
}

/**
 * 這筆紀錄算不算在這段期間裡。
 *
 * **「全部」要連沒有日期的紀錄一起算**（2026-08-14 撞出來的）：日期是字串比較，
 * `"" >= "0000-01-01"` 是 false，所以日期空白的續約／收費**連選「全部」都會消失** ——
 * 銷售金額短少、消費最多印 $0，而使用者只會看到「錢不見了」。
 * 匯入時解不出來的日期就會變成空字串（`parseBackup` 的 `dayOf`）。
 * 指定期間時當然還是要有日期才算得進去，沒有日期歸不到任何一個月。
 */
function inPeriod(date, from, to) {
  if (isWholePeriod(from, to)) return true;
  const d = date || "";
  return d >= from && d <= to;
}

/** 所有續約紀錄（含首購），帶上是誰買的 */
function allRenewals() {
  return S.students.flatMap((s) => s.renewals.map((r) => ({ ...r, studentId: s.id })));
}

function salesSummary(from, to) {
  const [a, b] = from <= to ? [from, to] : [to, from];
  const rows = allRenewals().filter((r) => inPeriod(r.date, a, b));
  const sessions = rows.reduce((n, r) => n + (r.sessions || 0), 0);
  const amount = rows.reduce((n, r) => n + (r.amount || 0), 0);
  const people = new Set(rows.map((r) => r.studentId).filter(Boolean));
  return {
    sessions, amount, count: rows.length, students: people.size,
    // 沒賣出東西就回傳 null，不要顯示 0 元均價
    unitPrice: sessions ? Math.round(amount / sessions) : null,
    dealSize: rows.length ? Math.round(amount / rows.length) : null,
    rows,
  };
}

/** 依月份拆開，舊的在前 */
function salesByMonth(from, to) {
  const { rows } = salesSummary(from, to);
  const buckets = {};
  for (const r of rows) {
    const ym = (r.date || "").slice(0, 7);
    if (ym.length !== 7) continue;
    buckets[ym] = buckets[ym] || { sessions: 0, amount: 0 };
    buckets[ym].sessions += r.sessions || 0;
    buckets[ym].amount += r.amount || 0;
  }
  return Object.entries(buckets)
    .map(([month, v]) => ({ month, ...v }))
    .sort((x, y) => x.month.localeCompare(y.month));
}

/** 這段期間買最多的人 */
function salesTopStudents(from, to, limit = 5) {
  const { rows } = salesSummary(from, to);
  const buckets = {};
  for (const r of rows) {
    if (!r.studentId) continue;
    buckets[r.studentId] = buckets[r.studentId] || { sessions: 0, amount: 0 };
    buckets[r.studentId].sessions += r.sessions || 0;
    buckets[r.studentId].amount += r.amount || 0;
  }
  return Object.entries(buckets)
    .map(([id, v]) => ({ student: studentById(id), ...v }))
    .filter((r) => r.student)
    .sort((x, y) => y.sessions - x.sessions || x.student.name.localeCompare(y.student.name))
    .slice(0, limit);
}

/* ── 排行榜 ───────────────────────────────── */
/**
 * 原本只有「上課最多」「消費最多」兩張寫死前五名的表（2026-08-13 試用回報：
 * 「是不是能夠呈現更多的名次」「到課率最高、消費的金額、上課堂數等等」）。
 * 兩件事一起解：**名次可以看更多**，而且**每一榜都吃期間**。
 *
 * 期間直接沿用銷售那組（本月／上月／今年／全部／自訂）—— 使用者說自己能設
 * 時間區間很好用，那就讓整個分析頁都能這樣看，不要一頁一種規矩。
 *
 * 每一榜都吃 from/to，所以**同一個期間換不同榜，看的是同一批課／同一批錢**。
 */
/** 到課率要有幾堂紀錄才進榜 */
const RANK_RATE_MIN = 3;

/** 名次要看幾名。0 ＝ 全部。 */
const RANK_LIMITS = [[5, "前 5 名"], [10, "前 10 名"], [0, "全部"]];

const RANK_METRICS = [
  {
    key: "attended",
    title: "上課最多",
    sub: "已出席與遲到的堂數；沒有紀錄的依剩餘推算",
    /**
     * 跟「買最多堂」同一個坑，而且更嚴重（2026-08-14 拿真實名單驗出來的）：
     * 補歷史進來的人**一筆課程紀錄都沒有**（堂數是照舊系統手填的），
     * 於是整張榜都是 0 堂、畫面寫「這段期間沒有資料」——可是那八位都上了幾百堂。
     *
     * 「全部」期間改用 `consumedSessions`（課程紀錄與「已購 − 剩餘」取大的那個），
     * 跟學生列表上「已上 N 堂」印的是同一個數字。是推算的就寫出來。
     * **指定期間時只認課程紀錄** —— 推算出來的堂數沒有日期，分不到月份上。
     */
    rows: (students, from, to, opts = {}) => students.map((s) => {
      const n = rangeLessons(s.id, from, to).filter((l) => CONSUMING.includes(l.status)).length;
      if (opts.wholeTime) {
        const c = consumedSessions(s);
        if (c.count > n) {
          // 推算值一樣時（買一樣多、剩一樣多），有紀錄的那位排前面：
          // 那是有憑據的堂數，照姓名排等於把資訊丟掉
          return { student: s, value: c.count, weight: c.recorded, text: `${c.count} 堂`,
                   note: c.recorded ? `有紀錄的 ${c.recorded} 堂・其餘依剩餘推算`
                                    : "沒有課程紀錄，依剩餘推算" };
        }
      }
      // 這個月沒上課是常態，不用特別講；**整份資料一堂紀錄都沒有**才是資料缺口，
      // 那個 0 會被當成「他沒在上課」，一定要說出來。
      const c = consumedSessions(s);
      return { student: s, value: n, text: `${n} 堂`,
               note: !lessonsOf(s.id).length && c.count
                 ? `沒有課程紀錄（累計約 ${c.count} 堂）` : "" };
    }),
  },
  {
    key: "spent",
    title: "消費最多",
    // 「收到的錢」不精確：日期還沒到的預收也在收費紀錄裡（總覽的「本月收到」
    // 刻意不含預收，兩邊講法要對得起來）
    sub: "收費紀錄的金額，含預收",
    rows: (students, from, to) => students.map((s) => {
      const n = (s.payments || [])
        .filter((p) => inPeriod(p.date, from, to))
        .reduce((a, p) => a + (p.amount || 0), 0);
      return { student: s, value: n, text: money(n) };
    }),
  },
  {
    key: "rate",
    title: "到課率最高",
    // 只上過一堂的人是 100%，排在上了 40 堂 95% 的人前面 —— 那不是「到課率高」，
    // 是「還看不出來」。所以要有紀錄下限，而且把分母印出來。
    sub: `至少 ${RANK_RATE_MIN} 堂紀錄`,
    rows: (students, from, to) => students.map((s) => {
      const ls = rangeLessons(s.id, from, to)
        .filter((l) => ["attended", "late", "absent"].includes(l.status));
      // 紀錄不足的人在「全部」裡照樣列出來，只是沒有百分比可以印。
      // value 給 -1：排在所有真的算得出來的人後面，前 5／前 10 也不會撈到他。
      if (ls.length < RANK_RATE_MIN) {
        return { student: s, value: -1, text: "—",
                 note: ls.length ? `只有 ${ls.length} 堂紀錄` : "沒有課程紀錄" };
      }
      // 出席率把遲到算成有到（人有來，只是晚了）—— 跟學生詳情、iOS 同一把尺
      const came = ls.filter((l) => CONSUMING.includes(l.status)).length;
      const pct = came / ls.length * 100;
      // weight＝分母。同樣 100%，8/8 比 3/3 更站得住腳，要排在前面
      return { student: s, value: pct, weight: ls.length,
               text: `${pct.toFixed(0)}%`, note: `${came}/${ls.length} 堂` };
    }),
  },
  {
    key: "purchased",
    title: "買最多堂",
    sub: "續約買的堂數；沒有紀錄的用累計已購",
    /**
     * 這一榜踩過一個坑（2026-08-14 拿真實名單驗出來的）：只看續約紀錄的話，
     * **買了 30 堂但沒有任何續約紀錄的人會顯示「0 堂」，看起來像沒買過課**。
     * 真實的 8 位裡就有 1 位是這樣（直接在表單填購買堂數建的，不會產生續約紀錄），
     * 另外 3 位的續約紀錄合計也比累計已購少（補歷史只補了一部分）。
     *
     * 所以「全部」期間改成**取兩者大的那個**，跟 `consumedSessions`（已上堂數）
     * 同一個道理：續約紀錄是「我有憑據的那幾筆」，累計已購才是「他總共買了多少」。
     * 差額會寫在旁邊，不會假裝那是有紀錄的數字。
     *
     * **指定期間時不能這樣補** —— 沒有日期的購買歸不到任何一個月，硬算就是造假。
     * 那種情況印 0，但要說出來是「沒有續約紀錄」，不要讓人以為他沒買課。
     */
    rows: (students, from, to, opts = {}) => students.map((s) => {
      const all = s.renewals || [];
      const rs = all.filter((r) => inPeriod(r.date, from, to));
      const recorded = rs.reduce((a, r) => a + (r.sessions || 0), 0);
      const amt = rs.reduce((a, r) => a + (r.amount || 0), 0);
      const purchased = Math.max(0, s.totalPurchased || 0);

      if (opts.wholeTime && purchased > recorded) {
        return {
          student: s, value: purchased, text: `${purchased} 堂`,
          note: recorded
            ? `有紀錄的 ${recorded} 堂・其餘依累計已購`
            : (all.length ? "續約紀錄對不上累計已購" : "沒有續約紀錄，依累計已購"),
        };
      }
      // 這個月沒續約是常態，不用特別講；**整份資料一筆續約都沒有**才是資料缺口。
      return {
        student: s, value: recorded, text: `${recorded} 堂`,
        note: amt ? money(amt)
                  : (!all.length && purchased ? `沒有續約紀錄（累計已購 ${purchased} 堂）` : ""),
      };
    }),
  },
];

/** 某位學生在區間內的課（共同課的第二位也算他自己的），檢測不算 */
function rangeLessons(studentId, from, to) {
  return lessonsOf(studentId).filter((l) =>
    !isAssessment(l) && inPeriod(l.date, from, to));
}

/**
 * 一張榜。同分用姓名排，順序才不會每次 render 都跳。
 *
 * **選「全部」時連 0 的人都要列出來**（2026-08-13 小春：「學生都要寫出來」）——
 * 這個月一堂都沒上、一毛都沒繳的那幾位，正是教練最需要看到的名字，
 * 而榜單把他們濾掉就等於在說「沒這個人」。前 5／前 10 才只看有數字的
 * （名次表上塞一排 0 沒有意義）。
 */
function rankingRows(metric, students, from, to, limit) {
  // 有些榜在看得到全部歷史時可以補上沒有紀錄的部分（見「買最多堂」），
  // 指定期間就不行。
  const opts = { wholeTime: isWholePeriod(from, to) };
  const rows = metric.rows(students, from, to, opts)
    .sort((a, b) => b.value - a.value
                 || (b.weight || 0) - (a.weight || 0)
                 || a.student.name.localeCompare(b.student.name));
  if (limit > 0) return rows.filter((r) => r.value > 0).slice(0, limit);
  return rows;
}

/* ── 顏色標籤 ───────────────────────────────── */
// 學生代表色一人只能一個顏色，回答不了「哪些人是減脂的」。
// 標籤是另一層：教練自己定義一組有顏色的名字，一位學生可以貼好幾個。

const TAG_COLORS = ["#A8721B", "#E05B7B", "#3BA99E", "#5B8DEF", "#9B6FD4",
                    "#E86A5C", "#10B981", "#F59E0B", "#EC4899", "#64748B"];

const allTags = () => S.settings.tags || [];
const tagById = (id) => allTags().find((t) => t.id === id) || null;

/** 這位學生身上對得上目前設定的標籤（設定裡刪掉的就不算） */
function tagsOf(student) {
  return (student.tags || []).map(tagById).filter(Boolean);
}

/** 每個標籤各貼了幾位在檔學生 */
function tagCounts() {
  const counts = {};
  for (const s of S.students) {
    if (!onRoster(s)) continue;
    for (const id of (s.tags || [])) counts[id] = (counts[id] || 0) + 1;
  }
  return counts;
}

/** 刪標籤時要把貼在學生身上的那筆也拔掉 */
function removeTagEverywhere(tagId) {
  S.settings.tags = allTags().filter((t) => t.id !== tagId);
  for (const s of S.students) {
    if ((s.tags || []).includes(tagId)) {
      s.tags = s.tags.filter((t) => t !== tagId);
      s.updatedAt = new Date().toISOString();
    }
  }
}

/* ── 成交率 ─────────────────────────────────── */

function conversionStats(ym = thisMonth()) {
  const leads = S.leads;
  const converted = leads.filter((l) => l.status === "converted");
  const addedThisMonth = leads.filter((l) => (l.createdAt || "").slice(0, 7) === ym);
  const convertedThisMonth = converted.filter((l) => (l.updatedAt || "").slice(0, 7) === ym);
  const bySource = Object.keys(LEAD_SOURCE).map((key) => {
    const group = leads.filter((l) => l.source === key);
    return { key, label: LEAD_SOURCE[key], total: group.length, converted: group.filter((l) => l.status === "converted").length };
  }).filter((r) => r.total > 0).sort((a, b) => b.total - a.total);

  return {
    total: leads.length,
    converted: converted.length,
    open: leads.filter((l) => l.status !== "converted").length,
    rate: leads.length ? converted.length / leads.length * 100 : null,
    addedThisMonth: addedThisMonth.length,
    convertedThisMonth: convertedThisMonth.length,
    monthRate: addedThisMonth.length ? convertedThisMonth.length / addedThisMonth.length * 100 : null,
    bySource,
  };
}

/* ── 客群分析 ───────────────────────────────── */

/**
 * 56 歲以上原本全擠在同一格，看不出六十幾、七十幾、八十幾的差別
 * （長輩客群本來就是分開帶的）。60 起改對齊整十的年代。
 * 沒有人落在的那格會被 viewAnalysis 濾掉，多切幾格不會多出空列。
 */
const AGE_GROUPS = [
  ["18歲以下", 0, 17], ["18-25歲", 18, 25], ["26-35歲", 26, 35],
  ["36-45歲", 36, 45], ["46-55歲", 46, 55], ["56-59歲", 56, 59],
  ["60-69歲", 60, 69], ["70-79歲", 70, 79], ["80歲以上", 80, 200],
];

function ageOf(student) {
  const direct = parseInt(student.custom["年齡"], 10);
  if (Number.isFinite(direct) && direct > 0) return direct;
  const bd = parseDay(student.custom["生日"]);
  if (!bd) return null;
  const now = new Date();
  let age = now.getFullYear() - bd.getFullYear();
  const before = now.getMonth() < bd.getMonth() ||
    (now.getMonth() === bd.getMonth() && now.getDate() < bd.getDate());
  if (before) age -= 1;
  return age > 0 ? age : null;
}

/** 自訂欄位可以是哪些型別 */
const FIELD_TYPES = [["text", "文字"], ["number", "數字"], ["date", "日期"], ["select", "單選"]];

/**
 * 某個自訂欄位的型別與選項。
 *
 * 原本只有「生日」被寫死成日期欄位，其他一律純文字 —— 想要一個「日期」欄位
 * 就只能取名叫生日。現在型別是自己設的，寫死的特例拿掉了。
 */
/** 十二星座。寫法統一用「摩羯座」（教育部字典的寫法，iOS 版也是這個）。 */
const ZODIAC = ["牡羊座", "金牛座", "雙子座", "巨蟹座", "獅子座", "處女座",
                "天秤座", "天蠍座", "射手座", "摩羯座", "水瓶座", "雙魚座"];

/** 各星座的起始日（月, 日）。在 1/20 之前的一律是摩羯座。 */
const ZODIAC_START = [[1, 20, "水瓶座"], [2, 19, "雙魚座"], [3, 21, "牡羊座"], [4, 20, "金牛座"],
                      [5, 21, "雙子座"], [6, 22, "巨蟹座"], [7, 23, "獅子座"], [8, 23, "處女座"],
                      [9, 23, "天秤座"], [10, 24, "天蠍座"], [11, 22, "射手座"], [12, 22, "摩羯座"]];

/** 生日（YYYY-MM-DD）換成星座。認不出來就回空字串。 */
function zodiacOf(birthday) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(birthday || "");
  if (!m) return "";
  const mm = +m[2], dd = +m[3];
  let cur = "摩羯座";
  for (const [cm, cd, name] of ZODIAC_START) {
    if (mm > cm || (mm === cm && dd >= cd)) cur = name;
  }
  return cur;
}

/**
 * 「星座」與「生日」有內建的型別，不用自己去設定裡指定。
 *
 * 星座本來是純文字，於是同一個星座會有兩種寫法（實例：37 位學生裡有
 * 「摩羯座」也有「魔羯座」），客群分析就把同一群人拆成兩堆
 * （2026-08-11 回報）。改成下拉之後打不出第二種寫法。
 */
const BUILTIN_SPECS = {
  星座: { type: "select", options: ZODIAC },
  生日: { type: "date", options: [] },
  性別: { type: "select", options: ["女", "男"] },
};

function fieldSpec(name) {
  const raw = (S.settings.customFieldSpecs || {})[name] || BUILTIN_SPECS[name] || {};
  const type = FIELD_TYPES.some(([v]) => v === raw.type) ? raw.type : "text";
  const options = Array.isArray(raw.options)
    ? raw.options.map((o) => String(o).trim()).filter(Boolean) : [];
  return { type, options };
}

/**
 * 改一個自訂欄位的名字。
 *
 * **學生已經填的值要一起搬**：`s.custom` 是用欄位名稱當鍵的，不搬的話改個
 * 名字等於把所有人在那一欄填過的資料清空（而且看起來像是自己不見的）。
 */
function renameCustomField(oldName, newName) {
  const name = String(newName || "").trim();
  if (!name || name === oldName) return false;
  const list = S.settings.customFields;
  if (list.includes(name)) { toast("已經有同名欄位了"); return false; }
  const i = list.indexOf(oldName);
  if (i < 0) return false;
  list[i] = name;

  const specs = S.settings.customFieldSpecs || (S.settings.customFieldSpecs = {});
  if (specs[oldName]) { specs[name] = specs[oldName]; delete specs[oldName]; }

  for (const st of S.students) {
    if (st.custom && Object.prototype.hasOwnProperty.call(st.custom, oldName)) {
      st.custom[name] = st.custom[oldName];
      delete st.custom[oldName];
      st.updatedAt = new Date().toISOString();
    }
  }
  return true;
}

/** 欄位上下移動。陣列順序就是顯示順序，所以搬動陣列就夠了。 */
function moveCustomField(name, dir) {
  const list = S.settings.customFields;
  const i = list.indexOf(name);
  const j = i + (dir === "up" ? -1 : 1);
  if (i < 0 || j < 0 || j >= list.length) return false;
  [list[i], list[j]] = [list[j], list[i]];
  return true;
}

/** 年齡另有長條圖；日期型別每一筆都不一樣，長條圖沒有意義 */
const FIELDS_WITH_OWN_CHART = new Set(["年齡"]);

/**
 * 只有真的有學生填了值的自訂欄位，才會多出一張分佈圖。
 * 設定裡新增一個欄位但沒人填，不該憑空多一欄「未填 100%」。
 */
function customFieldDistributions() {
  const students = activeStudents();
  const keys = [...S.settings.customFields];
  for (const s of students) {
    for (const k of Object.keys(s.custom || {})) if (!keys.includes(k)) keys.push(k);
  }
  const out = [];
  for (const key of keys) {
    if (FIELDS_WITH_OWN_CHART.has(key)) continue;
    // 日期型別每個人都不一樣，畫成長條圖是一堆高度 1 的長條
    if (fieldSpec(key).type === "date") continue;
    const dist = new Map();
    for (const s of students) {
      const v = String(s.custom?.[key] ?? "").trim();
      if (!v) continue;
      dist.set(v, (dist.get(v) || 0) + 1);
    }
    const filled = [...dist.values()].reduce((a, b) => a + b, 0);
    if (!filled) continue;
    const data = [...dist.entries()]
      .map(([label, count]) => ({ label, count }))
      .sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
    const blank = students.length - filled;
    if (blank > 0) data.push({ label: "未填", count: blank });
    out.push({ field: key, data });
  }
  return out;
}

let activeDialog = null;

function openSheet({ title, body, confirmLabel = "儲存", closeLabel = "取消", onConfirm, extraFoot = "", onMount }) {
  closeSheet();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `
    <dialog class="sheet" open aria-label="${esc(title)}">
      <div class="sheet-head">
        <span class="sheet-title">${esc(title)}</span>
        <button class="btn btn-ghost btn-sm" type="button" data-close>關閉</button>
      </div>
      <form class="sheet-body" id="sheet-form">${body}</form>
      <div class="sheet-foot">
        ${extraFoot}
        <button class="btn" type="button" data-close>${esc(closeLabel)}</button>
        ${onConfirm ? `<button class="btn btn-primary" type="button" data-confirm>${esc(confirmLabel)}</button>` : ""}
      </div>
    </dialog>`;
  document.body.appendChild(scrim);
  activeDialog = scrim;

  scrim.addEventListener("click", (e) => {
    if (e.target === scrim || e.target.closest("[data-close]")) closeSheet();
    if (e.target.closest("[data-confirm]")) {
      const form = $("#sheet-form", scrim);
      if (onConfirm(form, scrim) !== false) closeSheet();
    }
  });
  $("#sheet-form", scrim).addEventListener("submit", (e) => {
    e.preventDefault();
    if (onConfirm && onConfirm($("#sheet-form", scrim), scrim) !== false) closeSheet();
  });
  if (onMount) onMount(scrim);
  // 只有空白表單（新增）才把游標放進第一格。編輯既有資料時第一格多半是姓名，
  // 自動聚焦會直接彈出鍵盤、看起來像逼人改名字。
  const first = scrim.querySelector(
    "#sheet-form input:not([type=hidden]):not([type=checkbox]):not([type=radio]), #sheet-form textarea");
  if (first && !first.value) first.focus();
}

function closeSheet() {
  if (activeDialog) { activeDialog.remove(); activeDialog = null; }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

function confirmSheet(title, message, onYes, yesLabel = "確定") {
  openSheet({
    title,
    body: `<p style="margin:0;color:var(--ink-2)">${message}</p>`,
    confirmLabel: yesLabel,
    onConfirm: () => { onYes(); },
  });
}

    <select id="f-${name}" name="${name}" data-duration-select>

function readDuration(form, name = "duration") {
  const sel = form.elements[name].value;
  if (sel !== "custom") return +sel;
  return clampDuration(+form.elements[name + "Custom"].value);
}

function wireDurationPicker(root) {
  const sel = $("[data-duration-select]", root);
  if (!sel) return;
  sel.addEventListener("change", () => {
    $("[data-duration-custom]", root).style.display = sel.value === "custom" ? "" : "none";

}

/**
 * 排課時用打字找學生。
 *
 * 學生一多，下拉就是一條長長的名單，手機上要滑很久
 * （2026-08-20：「排課的時候要可以輸入東西方便搜索學生」）。
 *
 * 兩件事值得記著：
 *  1. **整份重建 <option>，不是把不合的設成 hidden** —— option 的 hidden
 *     在 Safari 不管用，藏不掉的話等於沒篩。
 *  2. **目前選到的那位一定留著**，就算他不符合現在打的字。不然重建之後
 *     選取值會掉，存下去就是「未指定學生」。
 *
 * 打的字剛好只對到一位時直接幫他選起來（第二位不自動選——空白的「一對一」
 * 本身就是一個有意義的選擇）。
 */
function wireStudentSearch(root) {
  const box = root.querySelector("[data-student-search]");
  if (!box) return;
  const hint = root.querySelector("[data-student-search-hint]");
  const sels = ["studentId", "partnerId"]
    .map((n) => root.querySelector(`[name="${n}"]`)).filter(Boolean);
  // 完整的選項留一份：篩選一律從這份重建，不是拿畫面上剩下的再篩一次
  const all = new Map(sels.map((sel) =>
    [sel, [...sel.options].map((o) => ({ v: o.value, t: o.textContent }))]));

  const refresh = () => {
    const q = box.value.trim().toLowerCase();
    // 比對哪些欄位跟 iOS 的 StudentPicker.search 一致：姓名、電話、備註
    const hits = activeStudentsByName().filter((st) => !q ||
      [st.name, st.phone, st.notes].some((f) => (f || "").toLowerCase().includes(q)));
    const hitIds = new Set(hits.map((st) => st.id));

    for (const sel of sels) {
      const required = sel === sels[0];        // 「學生」是必填，沒有空白選項
      const chosen = sel.value;
      // 選到的那位不符合現在打的字時，兩個欄位的處理刻意不一樣：
      //  - 學生：改選第一個符合的（打字就是為了換人），清單裡也不留那個不相干的名字
      //  - 第二位：留著。他是刻意選的，篩選不該把人默默拿掉變成「一對一」
      // 但一個都篩不到時「學生」還是要留著原本那位 —— 必填欄位不能變成空的。
      const keepChosen = !required || !hits.length || hitIds.has(chosen);
      const keep = all.get(sel).filter((o) =>
        !o.v || (keepChosen && o.v === chosen) || hitIds.has(o.v));
      sel.innerHTML = keep.map((o) =>
        `<option value="${esc(o.v)}">${esc(o.t)}</option>`).join("");
      sel.value = keepChosen ? chosen : hits[0].id;
    }

    if (hint) {
      hint.textContent = !q ? ""
        : hits.length ? `符合的有 ${hits.length} 位`
        : `找不到「${box.value.trim()}」（封存的學生不會出現在這裡）`;
    }
  };

  box.addEventListener("input", refresh);
  // 表單裡按 Enter 會直接送出整張表單 —— 在搜尋框按 Enter 只是「找好了」
  box.addEventListener("keydown", (e) => { if (e.key === "Enter") e.preventDefault(); });
  refresh();
}

function studentOptions(includeBlank = true, blankLabel = "（未選擇）", { showRemaining = false } = {}) {
  // 排課、收費那幾個下拉以前是**建檔順序**，找人只能一個一個看過去
  // （2026-08-17：「排課的時候也照筆畫排」）
  const opts = activeStudentsByName().map((s) => [
    s.id,
    // 排課時把剩幾堂寫在名字後面。**沒堂數的照樣選得到**——補以前的課
    // （「假設我要補七月的排課」）本來就是對著已經上完的人排，
    // 而且時段已經過的課不會再扣一次堂數，也不會扣成負的。
    showRemaining
      ? `${s.name || "（未命名）"}（剩 ${s.remaining || 0} 堂）`
      : (s.name || "（未命名）"),
  ]);
  return includeBlank ? [["", blankLabel], ...opts] : opts;
}

/* 單色長條圖：類別靠列標籤辨識，不用顏色編碼，也就不需要圖例 */
function barChart(rows, { unit = "位", total = null } = {}) {
  if (!rows.length) return `<p class="empty">還沒有資料</p>`;
  const max = Math.max(...rows.map((r) => r.count), 1);
  const sum = total ?? rows.reduce((a, r) => a + r.count, 0);
  return `<div class="bars">${rows.map((r) => `
    <div class="bar-row">
      <span class="bar-label" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(r.count / max * 100).toFixed(1)}%"></span></span>
      <span class="bar-value">${r.count} ${unit}${sum ? `　${(r.count / sum * 100).toFixed(0)}%` : ""}</span>
    </div>`).join("")}</div>`;
}

/**
 * 只認得說明文件用得到的那幾種語法：# ## 標題、**粗體**、- 與 1. 清單、段落。
 * 目的是讓說明維持 Markdown 原文，之後整段搬到 App 或官網都不用改寫。
 */
/**
 * 說明文件用的小 markdown。刻意只做這幾種語法，但**用到的每一種都要真的有效**
 * —— 沒支援的語法會原封不動印在畫面上，而使用者只會覺得那段壞掉了。
 * 2026-08-17 就是這樣：說明裡最重要的那段警告（iPhone 桌面圖示與 Safari
 * 資料不互通）寫成 `>` 引言區塊，渲染器不認得，整段帶著 `>` 印出來。
 * 加語法時記得也加一條測試，並在 `.guide` 補樣式。
 */
function renderMarkdown(md) {
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    // [文字](網址)：只收 http(s)，其他一律當純文字（javascript: 那種不要碰）
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  const out = [];
  let list = null;
  let quote = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const closeQuote = () => {
    if (!quote.length) return;
    // 引言裡面照樣可以有粗體與清單，所以整段再跑一次
    out.push(`<blockquote>${renderMarkdown(quote.join("\n"))}</blockquote>`);
    quote = [];
  };
  const closeAll = () => { closeList(); closeQuote(); };

  for (const raw of md.split("\n")) {
    const line = raw.trim();
    let m;
    // 引言區塊：連續的 "> " 收成同一段（中間的 ">" 空行是段落分隔）
    if ((m = /^>\s?(.*)$/.exec(line))) { closeList(); quote.push(m[1]); continue; }
    closeQuote();
    if (!line) { closeList(); continue; }
    // 頁面已經有 h1，說明內的標題往下降一級
    if ((m = /^#\s+(.*)$/.exec(line))) { closeAll(); out.push(`<h2>${inline(m[1])}</h2>`); continue; }
    if ((m = /^##\s+(.*)$/.exec(line))) { closeAll(); out.push(`<h3>${inline(m[1])}</h3>`); continue; }
    if ((m = /^###\s+(.*)$/.exec(line))) { closeAll(); out.push(`<h4>${inline(m[1])}</h4>`); continue; }
    if (/^(-{3,}|\*{3,})$/.test(line)) { closeAll(); out.push("<hr>"); continue; }
    if ((m = /^[-*]\s+(.*)$/.exec(line))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push(`<li>${inline(m[1])}</li>`); continue;
    }
    if ((m = /^\d+\.\s+(.*)$/.exec(line))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push(`<li>${inline(m[1])}</li>`); continue;
    }
    closeList();
    out.push(`<p>${inline(line)}</p>`);
  }
  closeAll();
  return out.join("");
}

/**
 * 存檔。有官方的存檔功能就優先用，沒有才退回瀏覽器自己的下載。
 * iPhone 上的下載不一定會成功，所以另外還提供「複製備份文字」那條路。
 */
async function saveFile(filename, text) {
  const dl = window.claude && window.claude.downloads;
  if (dl) {
    try {
      await dl.save({ filename, data: text });
      toast("已存好檔案");
      return;
    } catch (err) {
      const code = err && err.code;
      if (code === "declined") { toast("已取消"); return; }
      if (code === "too_large") { toast("資料太大存不下來，請先清掉一些舊資料"); return; }
      if (code === "rate_limited") { toast("剛剛才存過，等幾秒再試一次"); return; }
      // 其他情況（這個環境不支援之類的）就走下面的備援
    }
  }
  // **iPhone 優先走分享面板**。
  //
  // 用 <a download> 存下來的檔案，iOS 有時候會掉副檔名或被認成 public.data，
  // 於是在 App 的「檔案」選擇器裡是灰的、點不下去 —— 症狀就是使用者說的
  // 「網頁輸出的還是沒辦法放入程式」（2026-08-11、08-12 各回報一次）。
  // 分享面板送出去的是帶著正確型別的檔案，可以直接「儲存到檔案」或丟給
  // 教練小幫手，不必經過那一層判斷。
  try {
    const file = new File([text], filename, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      toast("已送出檔案");
      return;
    }
  } catch (err) {
    // 使用者按取消也會走到這裡。取消就安靜結束，不要再彈一次下載。
    if (err && err.name === "AbortError") { toast("已取消"); return; }
  }

  try {
    // **型別一定要是 application/json**。原本寫 application/octet-stream，
    // iPhone 存下來的檔案在「檔案」App 裡不會被認成 JSON，而 iOS 版的匯入是
    // `allowedContentTypes: [.json]` —— 那個檔在選擇器裡是灰的、根本點不下去，
    // 症狀就是「網頁的資料沒辦法匯入 App」（2026-08-11 回報）。
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("已下載檔案");
  } catch (e) {
    toast("這個瀏覽器擋住了下載，請換 Safari 或 Chrome 再試");
  }
}

}

function viewStudents() {
  const all = S.students;
  const tags = allTags();
  const counts = tagCounts();
  // 太久沒上課的那個 pill 走跟總覽同一份名單（同一條規則、同一個門檻），
  // 免得兩個地方對同一位學生講不一樣的話。
  const idle = new Map(idleStudents().map((x) => [x.student.id, x]));
  // **搜尋不在這裡篩。**
  // 邊打邊 render() 會把 <input> 整個換掉 —— 焦點與游標可以補回來，但**中文
  // 輸入法的組字狀態補不回來**，用注音根本打不出名字（2026-08-12 回報）。
  // 所以這裡照舊畫出全部，打字時只是把不符合的那幾列 hidden 起來，
  // 輸入框從頭到尾都是同一個元素。
  const list = all.filter((s) => {
    // 「在檔」＝**沒有被封存的都算**，跟表頭那個「在檔 N 位」用同一把尺
    // （onRoster）。原本寫死 status === "active"，於是暫停的學生從在檔消失、
    // 封存那頁也沒有，只有「全部」找得到，而表頭的數字還把他算進去 ——
    // 兩個數字對不起來。課程結束待續約的人更不能藏起來，那正是要追的人。
    if (studentFilter === "active" && !onRoster(s)) return false;
    if (studentFilter === "archived" && s.status !== "archived") return false;
    if (studentFilter === "awaiting" && !needsRenewal(s)) return false;
    // 選了多個標籤是「任一符合」——想找的通常是「減脂或備賽的人」
    if (activeTagFilter.size && !(s.tags || []).some((t) => activeTagFilter.has(t))) return false;
    return true;
  }).sort(byStudentName);

  return `
    <div class="page-head">
      <div>
        <h1 class="page-title">學生</h1>
        <p class="page-sub">在檔 ${all.filter(onRoster).length} 位${
          all.filter(needsRenewal).length ? `・待續約 ${all.filter(needsRenewal).length} 位` : ""
        }・封存 ${all.filter((s) => s.status === "archived").length} 位</p>
      </div>

      <div class="seg seg-wrap" style="max-width:420px">
        ${(() => {
          // 標了「課程結束待續約」之後要有地方只看這些人 —— 不然標了等於沒標
          // （2026-08-17：「課程結束待續約哪裡看」）
          const due = all.filter(needsRenewal).length;
          return [["active", "在檔"], ["awaiting", due ? `待續約 ${due}` : "待續約"],
                  ["archived", "封存"], ["all", "全部"]].map(([v, t]) =>
            `<button type="button" data-action="student-filter" data-value="${v}" aria-pressed="${studentFilter === v}">${t}</button>`).join("");
        })()}
      </div>

      ${tags.length ? `
        <div class="tag-filter">
          ${tags.map((t) => `
            <button type="button" class="tag-chip ${activeTagFilter.has(t.id) ? "on" : ""}"
