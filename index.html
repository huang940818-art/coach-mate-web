document.addEventListener("click", (e) => {
  const navBtn = e.target.closest("[data-tab]");
  if (navBtn) { tab = navBtn.dataset.tab; render(); return; }

  if (e.target.closest("#theme-btn")) {
    const order = ["auto", "light", "dark"];
    S.settings.theme = order[(order.indexOf(S.settings.theme) + 1) % 3];
    save(); render(); return;
  }

  const el = e.target.closest("[data-action]");
  if (!el || el.closest(".scrim")) return;
  const { action, value, id } = el.dataset;

  switch (action) {
    case "goto": tab = value; render(); break;
    case "open-guide": guideSheet(); break;
    case "dismiss-notice":
      try { localStorage.setItem(NOTICE_KEY, ANNOUNCEMENT.id); } catch (err) {}
      render();
      break;
    case "new-student": studentSheet(null); break;
    case "view-student": studentDetailSheet(studentById(id)); break;
    case "edit-student": studentSheet(studentById(id)); break;
    case "renew": renewSheet(studentById(id)); break;
    case "student-filter": studentFilter = value; render(); break;
    case "toggle-tag-filter":
      if (activeTagFilter.has(id)) activeTagFilter.delete(id); else activeTagFilter.add(id);
      render(); break;
    case "clear-tag-filter": activeTagFilter.clear(); render(); break;
    case "adjust-sessions": adjustSessionsSheet(studentById(id)); break;
    case "report-outcome": outcomeSheet(S.lessons.find((l) => l.id === id)); break;
    case "edit-tags": tagSettingsSheet(); break;
    case "report-issue": reportIssueSheet(); break;
    case "add-to-home": addToHomeSheet(); break;
    case "sales-period":
      salesPeriod = value;
      if (value === "custom" && !salesFrom) {
        const b = periodBounds("thisMonth");
        salesFrom = b.from; salesTo = b.to;
      }
      render(); break;
    case "set-base-mode":
      S.settings.salary.baseSalaryMode = value; save(); render(); break;

    case "new-lesson": lessonSheet(null); break;
    case "edit-lesson": lessonSheet(S.lessons.find((l) => l.id === id)); break;
    case "pick-day": selectedDate = value; render(); break;
    case "week": {
      if (value === "0") { weekAnchor = today(); selectedDate = today(); }
      else weekAnchor = dayStr(addDays(parseDay(weekAnchor), +value * 7));
      render(); break;
    }
    case "cal-refresh":
    case "refresh-all": {
      const n = autoMarkPastLessons();
      save(); render();
      toast(n ? `已更新 ${n} 堂課的狀態` : "已是最新狀態");
      break;
    }

    case "new-payment": paymentSheet(); break;
    case "delete-payment": {
      const st = studentById(el.dataset.student);
      if (!st) break;
      confirmSheet("刪除收費紀錄", "這筆收費會從紀錄中移除。", () => {
        st.payments = st.payments.filter((p) => p.id !== id);
        save(); render(); toast("已刪除");
      }, "刪除");
      break;
    }

    case "new-lead": leadSheet(); break;
    case "delete-lead":
      S.leads = S.leads.filter((l) => l.id !== id);
      save(); render(); toast("已刪除名單");
      break;

    case "set-employment": S.settings.employment = value; save(); render(); break;
    case "set-theme": S.settings.theme = value; save(); render(); break;
    case "set-basis": S.settings.salary.payoutBasisRaw = value; save(); render(); break;
    case "edit-duration": durationSheet(); break;
    case "del-field":
      S.settings.customFields = S.settings.customFields.filter((f) => f !== value);
      save(); render(); toast(`已刪除欄位「${value}」`);
      break;
    case "del-package":
      S.settings.packages = S.settings.packages.filter((p) => p.id !== id);
      save(); render();
      break;
    case "del-tier":
      S.settings.salary.tiers = S.settings.salary.tiers.filter((t) => String(t.minSessions) !== value);
      save(); render();
      break;

    case "export": exportData(); break;
    case "import": $("#import-file").click(); break;
    case "copy-backup": copyBackupSheet(); break;
    case "paste-backup": pasteBackupSheet(); break;
    case "seed":
      confirmSheet("載入示範資料", "會先清空目前的資料，再放入 8 位示範學生、約 60 堂課與 7 筆名單。",
        () => seedDemo(), "載入");
      break;
    case "wipe":
      confirmSheet("清除所有資料", "所有學生、課程、收費與名單都會被刪除，無法復原。建議先匯出備份。",
        () => { S = blankState(); save(); render(); toast("已清除所有資料"); }, "清除");
      break;
  }
});

/* 下拉選單改狀態 */
document.addEventListener("change", (e) => {
  // 銷售統計的自訂起訖日
  if (e.target.matches("[data-sales-from]")) { salesFrom = e.target.value; render(); return; }
  if (e.target.matches("[data-sales-to]")) { salesTo = e.target.value; render(); return; }

  const el = e.target.closest("[data-action]");
  if (el) {
    const { action, id, key } = el.dataset;
    if (action === "lesson-status") {
      const l = S.lessons.find((x) => x.id === id);
      if (l) { setLessonStatus(l, el.value); save(); render(); toast(`已改為「${LESSON_STATUS[el.value].label}」`); }
      return;
    }
    if (action === "lead-status") {
      const lead = S.leads.find((x) => x.id === id);
      if (!lead) return;
      const wasConverted = lead.status === "converted";
      lead.status = el.value;
      lead.updatedAt = new Date().toISOString();
      save();
      if (!wasConverted && el.value === "converted") {
        render();
        convertLead(lead);
        toast(`${lead.name} 轉成正式學生，確認一下資料`);
      } else { render(); }
      return;
    }
    if (action === "toggle-salary") {
      S.settings.salary[key] = el.checked;
      save(); render();
      return;
    }
    if (action === "salary-num") {
      const v = +el.value;
      S.settings.salary[key] = Number.isFinite(v) ? v : 0;
      save();
      return;
    }
  }

  if (e.target.id === "import-file" && e.target.files?.[0]) {
    importFile(e.target.files[0]);
    e.target.value = "";
  }
});

/* 設定頁的小表單：加入後清空，讓使用者直接填下一筆 */
document.addEventListener("submit", (e) => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();

  if (form.dataset.form === "add-field") {
    const name = form.elements.field.value.trim();
    if (!name) return;
    if (S.settings.customFields.includes(name)) { toast("已經有同名欄位了"); return; }
    S.settings.customFields.push(name);
    save(); render(); toast(`已新增欄位「${name}」`);
    return;
  }

  if (form.dataset.form === "add-package") {
    const name = form.elements.name.value.trim();
    const sessions = +form.elements.sessions.value || 0;
    if (!name || sessions <= 0) { toast("方案要有名稱與堂數"); return; }
    // 方案存的一律是整包的總額：續約套用時直接帶入金額欄，
    // 而那一欄存進續約紀錄的也是總額（銷售統計與抽成都拿總額算）。
    const typed = Math.max(0, +form.elements.price.value || 0);
    const price = form.elements.priceMode.value === "unit" ? typed * sessions : typed;
    S.settings.packages.push({ id: uid(), name, sessions, price });
    save(); render();
    toast(`已加入方案「${name}」・${sessions} 堂 ${money(price)}`);
    return;
  }

  if (form.dataset.form === "add-tier") {
    const sessions = +form.elements.sessions.value || 0;
    const percent = +form.elements.percent.value || 0;
    if (sessions <= 0 || percent <= 0 || percent > 100) {
      toast("請填有效的堂數與百分比");
      return;
    }
    S.settings.salary.tiers = S.settings.salary.tiers.filter((t) => t.minSessions !== sessions);
    S.settings.salary.tiers.push({ minSessions: sessions, percent });
    save();
    render();
    // 重畫之後把焦點放回堂數欄，接著填下一級
    const next = $('[data-form="add-tier"] [name="sessions"]');
    if (next) next.focus();
    toast(`已加入：滿 ${sessions} 堂抽 ${percent}%`);
  }
});

function durationSheet() {
  openSheet({
    title: "預設課程時長",
    body: durationPicker(S.settings.defaultDuration) +
      `<p class="hint">排課時會先帶入這個長度，個別課程還是可以改。</p>`,
    onConfirm: (form) => {
      S.settings.defaultDuration = readDuration(form);
      save(); render();
      toast(`預設改成 ${durationLabel(S.settings.defaultDuration)}`);
    },
    onMount: wireDurationPicker,
  });
}

/* ════════════════════════════════════════════════
   7.5 加到主畫面時把資料帶過去

   iOS 的「加入主畫面」會開一個獨立的儲存空間，跟 Safari 裡的
   localStorage **完全不互通**。教練在 Safari 建好一堆學生，加到主畫面
   打開卻是空的，看起來像資料不見了。這不是 bug，是 iOS 的行為，
   而且沒有任何 API 能直接共用。

   唯一能穿過去的通道是「網址」：加入主畫面時，iOS 會把當下完整的網址
   （含 # 後面的片段）存進那個圖示。所以做法是先把備份塞進 location.hash，
   再請使用者加到主畫面；桌面版第一次打開就從 hash 把資料撈回來。

   # 後面的內容不會送到伺服器，GitHub Pages 只會拿到 index.html。
   ════════════════════════════════════════════════ */

/** 現在是從主畫面圖示打開的嗎 */
function isStandalone() {
  // 這個判斷會被畫面用到，任何一個屬性取不到就整頁白掉，所以一路用 ?.
  return window.navigator?.standalone === true
      || window.matchMedia?.("(display-mode: standalone)")?.matches === true;
}

/** 網址太長 iOS 會存不住。超過這個長度就不要走 hash，改請人用複製貼上。 */
const HANDOFF_MAX = 60000;
const HANDOFF_KEY = "coach-mate-handoff-done";

const b64encode = (bytes) => {
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  // 網址片段裡 + / = 會被各種東西誤解，換成 URL 安全的字元
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};
const b64decode = (str) => {
  const padded = str.replace(/-/g, "+").replace(/_/g, "/")
    + "=".repeat((4 - (str.length % 4)) % 4);
  const bin = atob(padded);
  return Uint8Array.from(bin, (c) => c.charCodeAt(0));
};

/** 壓縮過的備份。CompressionStream 在舊瀏覽器沒有，就退回不壓縮。 */
async function encodeHandoff() {
  const json = JSON.stringify(buildBackup());
  const raw = new TextEncoder().encode(json);
  if (typeof CompressionStream === "undefined") return "r" + b64encode(raw);
  const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));
  const packed = new Uint8Array(await new Response(stream).arrayBuffer());
  return "z" + b64encode(packed);
}

async function decodeHandoff(payload) {
  const kind = payload[0];
  const bytes = b64decode(payload.slice(1));
  if (kind === "r") return JSON.parse(new TextDecoder().decode(bytes));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

/**
 * 啟動時檢查網址裡有沒有要帶進來的資料。
 * 圖示裡的網址不會變，所以同一份資料只認一次，否則每次打開都會蓋掉。
 */
async function consumeHandoff() {
  const match = /[#&]import=([^&]+)/.exec(location.hash || "");
  if (!match) return false;
  const payload = match[1];

  // 這份 payload 已經帶進來過了就跳過（每次開 App 都重蓋才是災難）
  const stamp = payload.length + ":" + payload.slice(0, 24);
  try {
    if (localStorage.getItem(HANDOFF_KEY) === stamp) return false;
  } catch (e) {}

  try {
    const backup = await decodeHandoff(payload);
    const parsed = parseBackup(backup);
    const hasData = S.students.length || S.lessons.length;
    // 這台已經有資料了就不要默默蓋掉，先問過
    if (hasData && !confirm(
      `這個連結帶著一份資料（${parsed.students.length} 位學生、${parsed.lessons.length} 堂課）。`
      + `要用它取代目前這台裝置上的 ${S.students.length} 位學生嗎？`)) {
      try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
      return false;
    }
    S = parsed;
    save();
    try { localStorage.setItem(HANDOFF_KEY, stamp); } catch (e) {}
    toast(`已帶進 ${S.students.length} 位學生`);
    return true;
  } catch (e) {
    console.warn("網址裡的資料讀不出來", e);
    toast("網址裡的資料讀不出來，請改用「貼上備份文字」");
    return false;
  }
}

/** 「加到主畫面」的引導 */
async function addToHomeSheet() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const hasData = S.students.length > 0 || S.lessons.length > 0;

  let payload = "";
  let tooBig = false;
  if (hasData) {
    try {
      payload = await encodeHandoff();
      tooBig = payload.length > HANDOFF_MAX;
    } catch (e) {
      tooBig = true;
    }
  }

  const steps = ios
    ? `<li>點畫面<strong>下方中間的分享圖示</strong>（往上的箭頭）</li>
       <li>往下捲，選<strong>「加入主畫面」</strong></li>
       <li>右上角按「新增」</li>`
    : `<li>點瀏覽器<strong>右上角的選單</strong></li>
       <li>選<strong>「加到主畫面」</strong>或「安裝應用程式」</li>`;

  openSheet({
    title: "加到主畫面",
    closeLabel: "關閉",
    confirmLabel: hasData && !tooBig ? "好，我要開始加" : "",
    body: `
      <p class="row-sub" style="margin:0 0 12px">
        加到主畫面之後開起來像 App，沒有網址列，系統也比較不會把資料清掉。
      </p>

      ${hasData ? `
        <div class="note-box" style="margin-bottom:12px">
          <strong>重要：主畫面的圖示跟現在這個瀏覽器，資料是分開的。</strong>
          你現在的 ${S.students.length} 位學生<u>不會</u>自動跑過去。
          ${tooBig
            ? `你的資料量比較大，沒辦法用網址帶過去。請改走這條：
               先按「複製備份文字」把資料複製起來 → 加到主畫面 → 打開桌面圖示 →
               設定 → 貼上備份文字 → 取代全部。`
            : `按下面的按鈕，我會把資料放進網址裡，你接著照步驟加到主畫面，
               第一次打開就會自動帶進去。`}
        </div>` : `
        <div class="note-box" style="margin-bottom:12px">
          你現在還沒有資料，<strong>這是最好的時機</strong>——先加到主畫面，
          之後都從桌面圖示開來輸入，就不會有資料分兩邊的問題。
        </div>`}

      <p style="font-weight:650;margin:0 0 6px">加入的步驟</p>
      <ol style="margin:0;padding-left:20px;line-height:2;font-size:14px">${steps}</ol>

      ${hasData && !tooBig ? `
        <p class="hint" style="margin-top:12px">
          按「好，我要開始加」之後，網址會變長（那是你的資料），這是正常的。
          接著再照上面的步驟操作。加完之後打開桌面圖示，資料就在裡面了。
        </p>` : ""}
      ${hasData && tooBig ? `
        <button class="btn btn-sm" type="button" data-action="copy-backup" style="margin-top:12px">
          複製備份文字
        </button>` : ""}`,
    onConfirm: () => {
      if (!hasData || tooBig) return;
      // 只改 hash 不會重新載入頁面，但網址列會更新，
      // 之後「加入主畫面」存下來的就是這一份帶著資料的網址
      location.hash = "import=" + payload;
      // 自己這一份已經有資料了，不用再帶一次
      try {
        localStorage.setItem(HANDOFF_KEY, payload.length + ":" + payload.slice(0, 24));
      } catch (e) {}
      toast("網址已經帶上你的資料，接著按分享 → 加入主畫面");
    },
  });
}

/**
 * 從主畫面圖示打開、但裡面是空的——這幾乎一定是
 * 「在 Safari 裡建了資料，加到主畫面後看不到」那個情況。
 * 直接把原因跟解法講清楚，不要讓人以為資料不見了。
 */
function standaloneEmptyNotice() {
  if (!isStandalone()) return "";
  if (S.students.length || S.lessons.length) return "";
  return `
    <section class="card" style="border:1px solid var(--warn)">
      <div class="sec-head"><h2 class="sec-title">這裡是空的？你的資料還在</h2></div>
      <p class="row-sub" style="margin:0 0 10px">
        主畫面的圖示跟瀏覽器裡的網頁，<strong>資料是分開存的</strong>（這是 iPhone 的規則，
        不是資料不見了）。之前在瀏覽器裡輸入的學生，還好好地留在那邊。
      </p>
      <p class="row-sub" style="margin:0 0 12px">
        搬過來的方法：回到<strong>瀏覽器</strong>打開同一個網址 → 設定 →
        <strong>複製備份文字</strong> → 回到這個圖示 → 下面的<strong>貼上備份文字</strong> → 取代全部。
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" type="button" data-action="paste-backup">貼上備份文字</button>
        <button class="btn btn-sm" type="button" data-action="import">選擇備份檔</button>
      </div>
    </section>`;
}

/* ════════════════════════════════════════════════
   7.6 有新版本的時候

   加到主畫面的圖示沒有網址列，也就沒有重新整理按鈕、沒有下拉更新。
   GitHub Pages 的快取是十分鐘，所以教練「完全關掉 App 再打開」時
   會拿到新版——但只是切出去再切回來並不會，可能一直停在舊版好幾天，
   而且你完全不知道他們看到的是哪一版。

   做法：讀一個很小的 version.json（明確不用快取），跟自己內建的
   BUILD 比對，不一樣就跳一條橫幅讓人按一下更新。

   沒有用 service worker。它能做真正的離線快取，但也是「更新卡住」
   這類 bug 的頭號來源，而這裡要解的是更新通知，不是離線。
   ════════════════════════════════════════════════ */

/** 最近一次檢查的時間，避免切來切去就狂打 */
let lastUpdateCheck = 0;
const UPDATE_CHECK_INTERVAL = 5 * 60 * 1000;   // 5 分鐘
let updateBannerShown = false;

async function checkForUpdate({ force = false } = {}) {
  // 本機用檔案打開時沒有 version.json，不用檢查
  if (location.protocol === "file:") return;
  if (typeof fetch !== "function") return;
  if (navigator.onLine === false) return;
  if (updateBannerShown) return;

  const now = Date.now();
  if (!force && now - lastUpdateCheck < UPDATE_CHECK_INTERVAL) return;
  lastUpdateCheck = now;

  try {
    // cache: no-store 是關鍵：不然連版本檔本身都可能拿到快取的舊值
    const res = await fetch("version.json", { cache: "no-store" });
    if (!res.ok) return;
    const { build } = await res.json();
    if (build && build !== BUILD) showUpdateBanner(build);
  } catch (e) {
    // 沒網路、擋掉了、檔案不在——都靜靜算了，不能影響離線使用
  }
}

function showUpdateBanner(newBuild) {
  if (updateBannerShown) return;
  updateBannerShown = true;

  const bar = document.createElement("div");
  bar.className = "update-bar";
  bar.innerHTML = `
    <span class="update-text">
      <strong>有新版本可以用了</strong>
      <span class="update-sub">目前 ${esc(BUILD)}　→　${esc(newBuild)}</span>
    </span>
    <button type="button" class="btn btn-primary btn-sm" data-update-now>立即更新</button>
    <button type="button" class="btn btn-sm btn-ghost" data-update-later aria-label="稍後再說">✕</button>`;
  document.body.appendChild(bar);

  bar.querySelector("[data-update-now]").addEventListener("click", applyUpdate);
  bar.querySelector("[data-update-later]").addEventListener("click", () => {
    bar.remove();
    // 關掉之後這次開啟就不再吵，下次重開再說
  });
}

async function applyUpdate() {
  // 資料在 localStorage，重載不會弄丟，但還是先確保寫進去了
  try { save(); } catch (e) {}

  // 沒有註冊 service worker，但如果哪天有了，這裡先清掉才不會又載到舊的
  try {
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    }
  } catch (e) {}

  // 帶一個一次性參數繞過 HTTP 快取。單靠 location.reload() 不一定
  // 會重新跟伺服器要檔案。載入後會把這個參數拿掉，網址保持乾淨。
  const url = new URL(location.href);
  url.searchParams.set("_v", Date.now().toString(36));
  location.replace(url.toString());
}

/** 重載完把繞過快取用的參數清掉，不然它會一直留在網址上 */
function stripCacheBuster() {
  // 這是開機路徑上的程式碼，取不到東西就整頁白掉，所以一路防
  if (!(location.search || "").includes("_v=")) return;
  if (typeof URL !== "function" || !history?.replaceState) return;
  const url = new URL(location.href);
  url.searchParams.delete("_v");
  history.replaceState(null, "", url.pathname + url.search + url.hash);
}

/* ════════════════════════════════════════════════
   8. 啟動
   ════════════════════════════════════════════════ */

// 每個人打開都是自己的空白帳本，不預先塞示範資料——
// 這是要給不同教練各自試用的，別人的假學生混在裡面只會擋路。
// 想先看看長什麼樣子，總覽頁與設定頁都有「載入示範資料」。
const loaded = load();
if (loaded) {
  S = loaded;
  autoMarkPastLessons();
  save();
} else {
  S = blankState();
}

render();

// 網址裡如果帶著資料（從瀏覽器加到主畫面時放進去的），把它撈出來。
// 放在 render() 之後：解壓縮是非同步的，不要為了它讓畫面空白著。
function runHandoff() {
  consumeHandoff().then((imported) => {
    if (imported) {
      autoMarkPastLessons();
      save();
      render();
    }
  });
}
runHandoff();

// 頁面已經開著的時候只換 hash 不會重新載入（例如把帶資料的連結
// 貼進網址列）。這時候什麼都不做會看起來像連結壞掉，所以也接一下。
window.addEventListener("hashchange", runHandoff);

// 有沒有新版本。開啟時查一次，之後每次從背景切回來也查
//（教練多半是把 App 留在背景，不會真的關掉再開）。
stripCacheBuster();
checkForUpdate({ force: true });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});
</script>
